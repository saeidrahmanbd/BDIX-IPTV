name: Import Sony 8 logo retry

on:
  push:
    paths:
      - ".github/workflows/import-sony-8-logo-retry.yml"

permissions:
  contents: write

jobs:
  import-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download logo
        run: |
          set -e
          mkdir -p logos
          curl -L --fail --retry 3 --retry-delay 2 "https://xstreamcp-assets-msp.streamready.in/assets/LIVETV/LIVECHANNEL/LIVETV_LIVETVCHANNEL_SONY_8/images/LOGO_HD/image.png" -o logos/sony-8.png
          test -s logos/sony-8.png

      - name: Update only Sony 8
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("IPTV-Playlist.m3u")
          s=p.read_text(encoding="utf-8")
          old='#EXTINF:-1 tvg-id="Sony8.in@SD" tvg-name="Sony 8" tvg-language="ben" tvg-country="IN" channel-id="Sony8.in@SD" group-title="New Channels",Sony 8'
          new='#EXTINF:-1 tvg-id="Sony8.in@SD" tvg-name="Sony 8" tvg-language="ben" tvg-country="IN" channel-id="Sony8.in@SD" group-title="New Channels" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/sony-8.png",Sony 8'
          if old not in s:
              raise SystemExit("Sony 8 target not found")
          if 'tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/sony-8.png"' in s:
              raise SystemExit("Sony 8 logo already present")
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          PY

      - name: Validate structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("IPTV-Playlist.m3u").read_text(encoding="utf-8")
          block='#PLAYLIST-STUDIO-CATEGORIES:["Bangladesh", "Indian Bangla", "Indian Movies", "Indian Music", "Indian Entertainment", "Pakistani", "International", "Documentary & Wildlife", "Kids", "Religious", "Sports", "Backup", "New Channels", "New Backup", "Not Playing"]'
          assert block in s, "Category block changed"
          assert 'group-title="New Channels" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/sony-8.png",Sony 8' in s
          print("Category block preserved.")
          print("Sony 8 logo reference added.")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos/sony-8.png IPTV-Playlist.m3u
          git commit -m "Import Sony 8 logo"
          git push
