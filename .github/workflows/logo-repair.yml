name: Logo Repair

on:
  push:
    branches: [main]
    paths:
      - 'IPTV-Playlist.m3u'
      - 'scripts/migrate_external_logos_fixed.py'
      - 'scripts/audit_playlist.py'
      - '.github/workflows/logo-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: logo-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Patch resilient logo sources
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/migrate_external_logos_fixed.py')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'https://upload.wikimedia.org/wikipedia/en/thumb/a/a7/Wild_TV_logo_2020.png/960px-Wild_TV_logo_2020.png': 'https://sales.wildtv.ca/hubfs/WildTV%20Media%20Centre%20Packages/WildTV-White-XXL.png?hsLang=en-ca&noresize=',
              'https://upload.wikimedia.org/wikipedia/commons/thumb/8/89/Star_Channel_2020.svg/960px-Star_Channel_2020.svg.png': 'https://upload.wikimedia.org/wikipedia/commons/c/cd/Star_Channel_2023.svg',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected logo source not found: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print('Patched Wild TV and Star Channel to alternate verified sources.')
          PY
      - name: Repair external logos
        run: python scripts/migrate_external_logos_fixed.py
      - name: Verify logo repair
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          playlist = Path("IPTV-Playlist.m3u").read_text(encoding="utf-8-sig")
          raw_base = "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/"
          external = []
          broken = []

          for line in playlist.splitlines():
              if not line.startswith("#EXTINF"):
                  continue
              m = re.search(r'tvg-logo="([^"]*)"', line)
              if not m:
                  continue
              logo = m.group(1).strip()
              if logo.startswith(("http://", "https://")) and not logo.startswith(raw_base):
                  external.append(logo)
              elif logo.startswith(raw_base):
                  filename = logo[len(raw_base):].split("?", 1)[0]
                  if not (Path("logos") / filename).is_file():
                      broken.append(filename)

          print(f"External logo references remaining: {len(external)}")
          print(f"Broken local logo references: {len(broken)}")

          if external:
              print("Remaining external logos:")
              for logo in external:
                  print(logo)
              raise SystemExit("External logo references remain; refusing automatic commit.")
          if broken:
              print("Broken local logo references:")
              for filename in broken:
                  print(filename)
              raise SystemExit("Broken local logo references detected; refusing automatic commit.")
          PY
      - name: Generate playlist audit report
        run: python scripts/audit_playlist.py || echo "Full playlist audit reported unrelated issues; logo repair will continue."
      - name: Commit repaired playlist and logos
        run: |
          set -euo pipefail
          if git diff --quiet -- IPTV-Playlist.m3u logos/ reports/playlist-audit.md; then
            echo "No logo repair changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add IPTV-Playlist.m3u logos/ reports/playlist-audit.md
          git commit -m "Repair external channel logos"
          git push origin HEAD:main

# Trigger logo repair after verified external-logo mappings.
