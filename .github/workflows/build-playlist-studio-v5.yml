name: Build Playlist Studio 5.0 Portable Single EXE

on:
  push:
    branches: [playlist-studio-5.0-portable]
    paths:
      - 'Playlist-Studio-Fluent-Dark-v9.zip'
      - 'build/feature_patch_v5.py'
      - 'build/make_brand_assets_v5.py'
      - '.github/workflows/build-playlist-studio-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Extract source
        shell: pwsh
        run: |
          if (Test-Path buildkit) { Remove-Item buildkit -Recurse -Force }
          New-Item -ItemType Directory buildkit | Out-Null
          Expand-Archive -LiteralPath 'Playlist-Studio-Fluent-Dark-v9.zip' -DestinationPath buildkit -Force
          $src = Get-ChildItem buildkit -Recurse -Filter playlist_studio.py -File | Select-Object -First 1
          if (-not $src) { throw 'playlist_studio.py not found' }
          "SOURCE_ROOT=$($src.Directory.Parent.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Apply Version 5.0 patch
        shell: pwsh
        run: |
          python build/feature_patch_v5.py "$env:SOURCE_ROOT\Source"
          python build/make_brand_assets_v5.py "$env:SOURCE_ROOT"
      - name: Install dependencies
        run: python -m pip install --upgrade pip Pillow openpyxl pyinstaller
      - name: Download and verify VLC 3.0.23
        shell: pwsh
        run: |
          $url='https://download.videolan.org/pub/videolan/vlc/3.0.23/win64/vlc-3.0.23-win64.zip'
          $expected='992d19dbd0b8a7cde9167d2f7780b1ef6f92acc8a71acfa736101a21f35181e1'
          $zip=Join-Path $env:RUNNER_TEMP 'vlc.zip'
          $tmp=Join-Path $env:RUNNER_TEMP 'vlc'
          Invoke-WebRequest -UseBasicParsing $url -OutFile $zip
          $actual=(Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if($actual -ne $expected){throw "VLC SHA-256 mismatch: $actual"}
          Expand-Archive $zip -DestinationPath $tmp -Force
          $root=Get-ChildItem $tmp -Directory | Where-Object {Test-Path (Join-Path $_.FullName 'libvlc.dll')} | Select-Object -First 1
          if(-not $root){throw 'VLC root not found'}
          $dest=Join-Path $env:SOURCE_ROOT 'VLC'
          if(Test-Path $dest){Remove-Item $dest -Recurse -Force}
          New-Item -ItemType Directory $dest | Out-Null
          Copy-Item (Join-Path $root.FullName '*') $dest -Recurse -Force
      - name: Validate source and Xtream path
        shell: pwsh
        run: |
          python -m compileall -q "$env:SOURCE_ROOT\Source"
          if($LASTEXITCODE -ne 0){throw 'Source compilation failed'}
          $env:PYTHONPATH=(Join-Path $env:SOURCE_ROOT 'Source')
          python -c "from bdix_integration import normalize_server; assert normalize_server('https://worker.example/bdix/')=='https://worker.example/bdix'; assert normalize_server('https://worker.example/')=='https://worker.example'; print('Xtream /bdix path test: PASS')"
      - name: Build single-click portable EXE
        shell: pwsh
        working-directory: \${{ env.SOURCE_ROOT }}
        run: |
          if(Test-Path build){Remove-Item build -Recurse -Force}
          if(Test-Path dist){Remove-Item dist -Recurse -Force}
          Get-ChildItem -Filter '*.spec' -File | Remove-Item -Force -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name 'Playlist-Studio-5.0-Portable' --icon 'studio.ico' --add-data 'VLC;VLC' --add-data 'bdix_preview.png;assets' Source\playlist_studio.py
          $exe='dist\Playlist-Studio-5.0-Portable.exe'
          if(-not(Test-Path $exe)){throw 'Portable EXE was not produced'}
          $size=(Get-Item $exe).Length
          if($size -lt 50000000){throw "EXE unexpectedly small: $size bytes"}
          $hash=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          "EXE_SHA256=$hash" | Out-File $env:GITHUB_ENV -Append
          "EXE_SIZE=$size" | Out-File $env:GITHUB_ENV -Append
      - name: Package portable ZIP
        shell: pwsh
        working-directory: \${{ env.SOURCE_ROOT }}
        run: |
          if(Test-Path release){Remove-Item release -Recurse -Force}
          New-Item -ItemType Directory release | Out-Null
          Copy-Item 'dist\Playlist-Studio-5.0-Portable.exe' 'release\'
          $readme = @"
Playlist Studio 5.0 — Windows x64 single-click portable EXE

No installer, Python or VLC installation is required. VLC is embedded in the executable.

SHA-256: $env:EXE_SHA256
Size: $env:EXE_SIZE bytes
"@
          $readme | Set-Content 'release\README.txt' -Encoding UTF8
          Compress-Archive -Path 'release\*' -DestinationPath "$env:GITHUB_WORKSPACE\Playlist-Studio-5.0-Portable-Windows-x64.zip" -Force
      - name: Publish v5.0.0 release
        shell: pwsh
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          $tag='v5.0.0'
          $repo='\${{ github.repository }}'
          gh release view $tag --repo $repo > $null 2>&1
          if($LASTEXITCODE -ne 0){
            gh release create $tag --repo $repo --target $env:GITHUB_SHA --title 'Playlist Studio 5.0' --notes 'Playlist Studio 5.0 — single-click portable Windows x64 executable.'
            if($LASTEXITCODE -ne 0){throw 'Unable to create v5.0.0 release'}
          }
          gh release upload $tag "$env:GITHUB_WORKSPACE\Playlist-Studio-5.0-Portable-Windows-x64.zip" --repo $repo --clobber
          gh release upload $tag "$env:SOURCE_ROOT\dist\Playlist-Studio-5.0-Portable.exe" --repo $repo --clobber
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playlist-Studio-5.0-Portable-Windows-x64
          path: |
            \${{ env.SOURCE_ROOT }}/dist/Playlist-Studio-5.0-Portable.exe
            Playlist-Studio-5.0-Portable-Windows-x64.zip
          if-no-files-found: error
