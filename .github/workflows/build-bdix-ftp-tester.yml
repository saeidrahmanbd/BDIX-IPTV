name: Build BDIX FTP Server Tester APK

on:
  workflow_dispatch:
  push:
    paths:
      - "bdix-ftp-tester/**"
      - ".github/workflows/build-bdix-ftp-tester.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bdix-ftp-tester

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.2
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BDIX-FTP-Server-Tester-debug
          path: bdix-ftp-tester/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
