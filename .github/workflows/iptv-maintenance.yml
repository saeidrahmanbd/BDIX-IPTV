name: IPTV Playlist Update
on:
  push:
    branches: [main]
    paths:
      - IPTV-Playlist.m3u
      - BDIX-Playlist.m3u
      - International-Playlist.m3u
      - logos/**
      - .github/workflows/iptv-maintenance.yml
      - scripts/maintenance_helpers.py
      - scripts/reconcile_playlist_consistency.py
      - scripts/classify_international_backups.py
      - scripts/backfill_cross_playlist_metadata.py
      - scripts/repair_logo_asset_technical_quality.py
      - scripts/normalize_metadata.py
      - scripts/sort_playlists.py
      - scripts/final_playlist_hardening.py
      - scripts/country_verification.py
      - tests/test_country_verification.py
      - scripts/migrate_external_logos_fixed.py
      - scripts/restore_protected_review.py
      - scripts/generate_logo_authenticity_manifest.py
      - scripts/generate_logo_repair_summary.py
      - scripts/logo_source_catalog.py
      - reports/logo-source-registry.json
      - scripts/check_epg_config.py
      - scripts/epg_coverage.py
      - scripts/generate_epg.py
      - scripts/discover_international_channels.py
      - requirements.txt
      - scripts/run_generate_epg.py
      - scripts/fetch_iptv_org_epg.py
      - scripts/official_epg_sources.py
      - scripts/epg_publish_gate_v2.py
      - scripts/validate_report_freshness.py
      - scripts/logo_asset_naming.py
      - scripts/generate_logo_provenance_review.py
      - scripts/generate_metadata_normalization_report.py
      - scripts/iptv_metadata_backfill.py
      - tests/test_metadata_backfill.py
      - tests/test_cross_playlist_metadata.py
      - tests/test_logo_asset_technical_quality.py
      - tests/test_report_freshness.py
      - tests/test_authorized_channel_removals.py
      - tests/test_maintenance_report_order.py
      - tests/test_logo_authenticity_manifest.py
      - scripts/sync_epg_worker_map.py
      - scripts/audit_playlist.py
      - scripts/playlist_order_policy.py
      - tests/test_logo_repair_source_hints.py
      - scripts/build_identity_index.py
      - scripts/stream_health.py
      - scripts/stream_risk_review.py
      - scripts/report_iptv_fragile_streams.py
      - scripts/pre_publish_gate.py
      - scripts/record_maintenance_history.py
      - scripts/generate_dashboard.py
      - scripts/enforce_playlist_attribution.py
      - reports/epg-india-channel-mapping.csv
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
# Shared with all main-branch playlist writers so they never modify the repository concurrently.
concurrency:
  group: iptv-playlist-main-writer-v2
  cancel-in-progress: false
  queue: max
jobs:
  maintain:
    if: ${{ !(github.actor == 'github-actions[bot]' && (startsWith(github.event.head_commit.message, 'Run IPTV playlist maintenance') || startsWith(github.event.head_commit.message, 'Add conservative playlist removal guard') || startsWith(github.event.head_commit.message, 'Add hard playlist preservation gates') || startsWith(github.event.head_commit.message, 'Refine preservation guard to protect stream URLs') || startsWith(github.event.head_commit.message, 'Harden protected queue byte-for-byte preservation') || startsWith(github.event.head_commit.message, 'Harden IPTV maintenance safety') || startsWith(github.event.head_commit.message, 'Enforce zero automatic playlist deletion') || startsWith(github.event.head_commit.message, 'Synchronize IPTV generated reports') || startsWith(github.event.head_commit.message, 'Synchronize IPTV generated reports and EPG'))) && !startsWith(github.event.head_commit.message, 'Repair IPTV metadata and local logos only; leave stream URLs unchanged') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M3U4U_XMLTV_URL: ${{ secrets.M3U4U_XMLTV_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '20'}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate maintenance safety helpers
        run: |
          python -m py_compile \
            scripts/maintenance_helpers.py \
            scripts/reconcile_playlist_consistency.py \
            scripts/epg_publish_gate_v2.py \
            scripts/restore_protected_review.py \
            scripts/audit_playlist.py \
            scripts/playlist_order_policy.py \
            scripts/pre_publish_gate.py \
            scripts/sort_playlists.py \
            scripts/final_playlist_hardening.py \
            scripts/country_verification.py \
            scripts/discover_bd_in_new_queues.py \
            scripts/generate_logo_authenticity_manifest.py \
            scripts/generate_logo_repair_summary.py \
            scripts/logo_asset_naming.py \
            scripts/generate_logo_provenance_review.py \
            scripts/generate_metadata_normalization_report.py \
            scripts/report_iptv_fragile_streams.py \
            scripts/stream_risk_review.py \
            scripts/validate_report_freshness.py \
            scripts/iptv_metadata_backfill.py \
            scripts/epg_coverage.py \
            scripts/generate_epg.py \
            scripts/repair_international_playlist.py \
            scripts/discover_international_channels.py \
            scripts/validate_international_playlist.py
      - name: Run playlist metadata and report freshness tests
        run: |
          python -m unittest discover -s tests -p 'test_report_freshness.py'
          python -m unittest discover -s tests -p 'test_authorized_channel_removals.py'
          python -m unittest discover -s tests -p 'test_maintenance_report_order.py'
          python -m unittest discover -s tests -p 'test_metadata_backfill.py'
          python -m unittest discover -s tests -p 'test_logo_authenticity_manifest.py'
          python -m unittest discover -s tests -p 'test_logo_asset_naming.py'
          python -m unittest discover -s tests -p 'test_logo_provenance_review.py'
          python -m unittest discover -s tests -p 'test_logo_repair_source_hints.py'
          python -m unittest discover -s tests -p 'test_iptv_fragile_streams.py'
          python -m unittest discover -s tests -p 'test_language_policy.py'
          python -m unittest discover -s tests -p 'test_epg_config.py'
          python -m unittest discover -s tests -p 'test_country_verification.py'
      - name: Validate EPG configuration
        run: python scripts/check_epg_config.py
      - name: Run maintenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          EVENT_WORKFLOW_BLOB="$(git rev-parse "${GITHUB_SHA}:.github/workflows/iptv-maintenance.yml")"
          CURRENT_WORKFLOW_BLOB="$(git rev-parse "FETCH_HEAD:.github/workflows/iptv-maintenance.yml")"
          if [[ "$EVENT_WORKFLOW_BLOB" != "$CURRENT_WORKFLOW_BLOB" ]]; then
            echo "::notice::Skipping superseded queued IPTV maintenance run; a newer workflow definition is on main. No playlist files were changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            cp BDIX-Playlist.m3u /tmp/bdix-playlist-protected.m3u
            cp epg/epg.xml /tmp/bdix-epg-previous.xml 2>/dev/null || true
            python scripts/maintenance_helpers.py snapshot-playlist
            python scripts/maintenance_helpers.py snapshot
            rm -rf fixed_output
            echo 'Non-destructive maintenance mode: legacy fix_playlist.py removed; using current repair/validation pipeline.'
            python scripts/normalize_metadata.py
            python scripts/sort_playlists.py IPTV-Playlist.m3u
            python scripts/final_playlist_hardening.py IPTV-Playlist.m3u
            if grep -Eiq 'group-title="New"' IPTV-Playlist.m3u; then echo '::error::Forbidden staging playlist category detected after normalization.'; exit 1; fi
            # New Channels/New Backup are active review queues and are allowed only for entries verified as BD/IN.
            python scripts/country_verification.py validate IPTV-Playlist.m3u
            python scripts/maintenance_helpers.py invalidate-bad-logos
            python scripts/migrate_external_logos_fixed.py
            python scripts/repair_logo_asset_technical_quality.py --fix
            python scripts/generate_logo_authenticity_manifest.py
            python scripts/generate_logo_repair_summary.py
            python scripts/restore_protected_review.py
            python scripts/iptv_metadata_backfill.py
            python scripts/maintenance_helpers.py verify-no-unauthorized-removals
            python scripts/stream_health.py
            python scripts/report_iptv_fragile_streams.py
            python scripts/epg_coverage.py
            python scripts/fetch_iptv_org_epg.py
            python scripts/run_generate_epg.py
            test -s epg/epg.xml
            grep -q '<programme ' epg/epg.xml
            cp epg/epg.xml /tmp/bdix-epg-generated.xml
            set +e
            python scripts/epg_publish_gate_v2.py
            EPG_GATE_STATUS=$?
            set -e
            if [ "$EPG_GATE_STATUS" -ne 0 ]; then
              echo '::warning::EPG publish gate blocked this generated guide; retaining the previous known-good epg/epg.xml.'
              if [ -s /tmp/bdix-epg-previous.xml ] && grep -q '<programme ' /tmp/bdix-epg-previous.xml; then cp /tmp/bdix-epg-previous.xml epg/epg.xml; else echo '::error::No valid previous EPG is available after a publish-gate failure.'; exit 1; fi
            else
              echo 'EPG publish gate passed; accepting newly generated guide.'
            fi
            cp epg/epg.xml /tmp/bdix-epg-publish.xml
            python scripts/sync_epg_worker_map.py
            python scripts/epg_coverage.py
            set +e
            python scripts/audit_playlist.py
            AUDIT_STATUS=$?
            python scripts/build_identity_index.py
            python scripts/stream_health.py
            HEALTH_STATUS=$?
            python scripts/stream_risk_review.py
            if [ ! -s reports/stream-health.md ]; then HEALTH_STATUS=2; fi
            python scripts/pre_publish_gate.py
            GATE_STATUS=$?
            set -e
            if [ "$GATE_STATUS" -ne 0 ]; then
              echo '::warning::Pre-publish gate found issues; running automatic correction pass before failing.'
              python scripts/normalize_metadata.py || true
              python scripts/sort_playlists.py IPTV-Playlist.m3u || true
              python scripts/final_playlist_hardening.py IPTV-Playlist.m3u || true
              python scripts/maintenance_helpers.py invalidate-bad-logos-correction
              python scripts/migrate_external_logos_fixed.py || true
              python scripts/repair_logo_asset_technical_quality.py --fix || true
              python scripts/generate_logo_authenticity_manifest.py || true
              python scripts/generate_logo_repair_summary.py || true
              python scripts/restore_protected_review.py
              set +e
              python scripts/audit_playlist.py
              AUDIT_STATUS=$?
              python scripts/pre_publish_gate.py
              GATE_STATUS=$?
              set -e
            fi
            python scripts/maintenance_helpers.py verify-no-unauthorized-removals
            python scripts/iptv_metadata_backfill.py
            python scripts/maintenance_helpers.py verify-no-unauthorized-removals
            set +e
            python scripts/audit_playlist.py
            AUDIT_STATUS=$?
            python scripts/pre_publish_gate.py
            GATE_STATUS=$?
            set -e
            python scripts/record_maintenance_history.py
            python scripts/epg_coverage.py
            python scripts/generate_logo_authenticity_manifest.py
            python scripts/generate_logo_repair_summary.py
            python scripts/generate_logo_provenance_review.py
            python scripts/generate_metadata_normalization_report.py
            python scripts/report_iptv_fragile_streams.py
            python scripts/stream_risk_review.py
            python scripts/stream_health.py
            python scripts/generate_dashboard.py
            if [ "$AUDIT_STATUS" -ne 0 ] || [ "$GATE_STATUS" -ne 0 ]; then
              echo "::error::Audit or pre-publish gate still reports blocking issues after the correction pass."
              echo "Audit status: $AUDIT_STATUS"
              echo "Pre-publish gate status: $GATE_STATUS"
              echo "The strict stream-preservation guard passed, but this playlist will not be published until validation is clean."
              exit 1
            fi
            python scripts/record_maintenance_history.py --refresh
            python scripts/generate_dashboard.py
            cp /tmp/bdix-epg-publish.xml epg/epg.xml
            cp /tmp/bdix-playlist-protected.m3u BDIX-Playlist.m3u
            # Explicitly permitted metadata-only repair for auxiliary playlists.
            # The backfill script verifies stream URL inventories remain unchanged.
            python scripts/backfill_cross_playlist_metadata.py
            python scripts/repair_logo_asset_technical_quality.py --fix
            python scripts/reconcile_playlist_consistency.py
            python scripts/enforce_playlist_attribution.py International-Playlist.m3u
            python scripts/validate_international_playlist.py
            python scripts/audit_playlist.py
            python scripts/pre_publish_gate.py
            python scripts/epg_coverage.py
            python scripts/generate_logo_authenticity_manifest.py
            python scripts/generate_logo_repair_summary.py
            python scripts/generate_logo_provenance_review.py
            python scripts/generate_metadata_normalization_report.py
            python scripts/generate_dashboard.py
            python scripts/validate_report_freshness.py
            test -s epg/epg.xml
            grep -q '<programme ' epg/epg.xml
            echo "Validated EPG working-tree bytes: $(wc -c < epg/epg.xml)"
            echo "Validated EPG working-tree sha256: $(sha256sum epg/epg.xml | awk '{print $1}')"
            python scripts/enforce_playlist_attribution.py IPTV-Playlist.m3u
            git add IPTV-Playlist.m3u BDIX-Playlist.m3u International-Playlist.m3u reports/ logos/ assets/dashboard.svg
            git add -f epg/epg.xml
            STAGED_EPG_BYTES="$(git cat-file -s :epg/epg.xml)"
            echo "Staged EPG bytes: ${STAGED_EPG_BYTES}"
            test "${STAGED_EPG_BYTES}" -gt 0
            git cat-file blob :epg/epg.xml > /tmp/bdix-epg-staged.xml
            grep -q '<programme ' /tmp/bdix-epg-staged.xml
            echo "Staged EPG sha256: $(sha256sum /tmp/bdix-epg-staged.xml | awk '{print $1}')"
            python -c 'from pathlib import Path; from collections import Counter; p=Path("IPTV-Playlist.m3u"); urls=[s.casefold() for s in (x.strip() for x in p.read_text(encoding="utf-8",errors="replace").splitlines()) if s.startswith(("http://","https://"))]; d=[u for u,n in Counter(urls).items() if n>1]; print(f"::error::Duplicate stream URLs remain: {len(d)} unique URLs are repeated.") if d else print(f"URL uniqueness check passed: {len(urls)} stream URLs, 0 duplicates."); raise SystemExit(1 if d else 0)'
            if git diff --cached --quiet; then echo 'No maintenance changes to publish.'; exit 0; fi
            git commit -m 'Run IPTV playlist maintenance'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Upload maintenance safety reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iptv-maintenance-safety-${{ github.run_number }}
          path: |
            reports/proposed-removals.md
            reports/iptv-metadata-backfill.md
            reports/playlist-audit.md
            reports/stream-health.md
            reports/stream-risk-review.md
            reports/fix-report.md
          if-no-files-found: warn
          retention-days: 14
