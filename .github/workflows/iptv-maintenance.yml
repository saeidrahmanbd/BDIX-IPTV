name: IPTV Playlist Update
on:
  push:
    branches: [main]
    paths:
      - IPTV-Playlist.m3u
      - scripts/**
      - .github/workflows/iptv-maintenance.yml
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iptv-maintenance
  cancel-in-progress: false
  queue: single
jobs:
  maintain:
    if: ${{ !(github.actor == 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'Run IPTV playlist maintenance')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Run maintenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            python scripts/normalize_metadata.py
            # TEMPORARILY DISABLED: automatic New Channels/New Backup discovery is paused.
            # Re-enable this line when the review queues should accept new candidates again.
            # python scripts/discover_channels_v3.py
            python scripts/normalize_metadata.py
            python scripts/migrate_external_logos_fixed.py
            python scripts/epg_coverage.py
            python scripts/generate_epg.py
            test -s epg.xml
            grep -q '<programme ' epg.xml
            cp epg.xml /tmp/bdix-epg-generated.xml
            python scripts/sync_epg_worker_map.py
            set +e
            python scripts/audit_playlist.py
            AUDIT_STATUS=$?
            python scripts/build_identity_index.py
            python scripts/stream_health.py
            HEALTH_STATUS=$?
            if [ ! -s reports/stream-health.md ]; then HEALTH_STATUS=2; fi
            python scripts/pre_publish_gate.py
            GATE_STATUS=$?
            set -e
            python - <<'PY'
          import json,re
          from pathlib import Path
          from datetime import datetime,timezone
          p=Path('reports/playlist-audit.md').read_text(encoding='utf-8')
          h=Path('reports/stream-health.md').read_text(encoding='utf-8') if Path('reports/stream-health.md').exists() else ''
          def metric(s,label):
              m=re.search(rf'- {re.escape(label)}: \*\*(\d+)\*\*',s); return int(m.group(1)) if m else None
          rec={'timestamp_utc':datetime.now(timezone.utc).isoformat(),'entries':metric(p,'Playlist entries'),'unique_channel_ids':metric(p,'Unique channel IDs'),'duplicate_ids':metric(p,'IDs with multiple streams'),'duplicate_urls':metric(p,'Duplicate stream URLs'),'metadata_conflicts':metric(p,'Metadata conflicts'),'logo_exceptions':metric(p,'Logo exceptions'),'primary_number_collisions':metric(p,'Primary channel-number collisions'),'protected_primary_changes':metric(p,'Protected primary-entry changes'),'health_tested':metric(h,'Streams tested'),'health_failures':metric(h,'Failed this check'),'health_persistent':metric(h,'Persistent failures (3+ consecutive)')}
          f=Path('reports/maintenance-history.json')
          try: hist=json.loads(f.read_text(encoding='utf-8')) if f.exists() else []
          except Exception: hist=[]
          if not isinstance(hist,list): hist=[]
          hist.append(rec); f.parent.mkdir(parents=True,exist_ok=True); f.write_text(json.dumps(hist[-180:],indent=2)+'\n',encoding='utf-8')
          PY
            python scripts/generate_dashboard.py
            if [ "$AUDIT_STATUS" -ne 0 ] || [ "$GATE_STATUS" -ne 0 ] || [ "$HEALTH_STATUS" -ne 0 ]; then
              git restore -- IPTV-Playlist.m3u logos/ xtream/worker.js || true
            fi
            # The guide is a generated publication artifact. Restore the validated
            # copy immediately before staging so later maintenance tools cannot
            # accidentally publish an empty/stale epg.xml.
            cp /tmp/bdix-epg-generated.xml epg.xml
            test -s epg.xml
            grep -q '<programme ' epg.xml
            echo "Validated EPG working-tree bytes: $(wc -c < epg.xml)"
            echo "Validated EPG working-tree sha256: $(sha256sum epg.xml | awk '{print $1}')"
            git add IPTV-Playlist.m3u logos/ reports/ assets/dashboard.svg xtream/worker.js
            git add -f epg.xml
            STAGED_EPG_BYTES="$(git cat-file -s :epg.xml)"
            echo "Staged EPG bytes: ${STAGED_EPG_BYTES}"
            test "${STAGED_EPG_BYTES}" -gt 0
            # Avoid SIGPIPE under pipefail: materialize the staged blob once,
            # then validate/hash the file without piping git output into grep.
            git cat-file blob :epg.xml > /tmp/bdix-epg-staged.xml
            grep -q '<programme ' /tmp/bdix-epg-staged.xml
            echo "Staged EPG sha256: $(sha256sum /tmp/bdix-epg-staged.xml | awk '{print $1}')"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Run IPTV playlist maintenance'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
