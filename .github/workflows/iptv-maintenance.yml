name: IPTV Playlist Update
on:
  push:
    branches: [main]
    paths:
      - IPTV-Playlist.m3u
      - .github/workflows/iptv-maintenance.yml
      - scripts/fix_playlist.py
      - scripts/repair_iptv_audit_findings.py
      - scripts/repair_playlist_quality.py
      - scripts/repair_playlist_logos.py
      - scripts/normalize_metadata.py
      - scripts/sort_playlists.py
      - scripts/final_playlist_hardening.py
      - scripts/migrate_external_logos_fixed.py
      - scripts/restore_protected_review.py
      - scripts/generate_logo_authenticity_manifest.py
      - scripts/check_epg_config.py
      - scripts/epg_coverage.py
      - scripts/generate_epg.py
      - scripts/run_generate_epg.py
      - scripts/fetch_iptv_org_epg.py
      - scripts/official_epg_sources.py
      - scripts/epg_publish_gate.py
      - scripts/sync_epg_worker_map.py
      - scripts/audit_playlist.py
      - scripts/build_identity_index.py
      - scripts/stream_health.py
      - scripts/stream_risk_review.py
      - scripts/report_iptv_fragile_streams.py
      - scripts/pre_publish_gate.py
      - scripts/record_maintenance_history.py
      - scripts/generate_dashboard.py
      - scripts/enforce_playlist_attribution.py
      - scripts/apply_gemini_playlist_repairs.py
      - reports/epg-india-channel-mapping.csv
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bdix-iptv-main-writer
  cancel-in-progress: false
  queue: max
jobs:
  maintain:
    if: ${{ !startsWith(github.event.head_commit.message, 'Repair IPTV metadata and local logos only; leave stream URLs unchanged') && !(github.actor == 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'Run IPTV playlist maintenance')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M3U4U_XMLTV_URL: ${{ secrets.M3U4U_XMLTV_URL }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Validate EPG configuration
        run: python scripts/check_epg_config.py
      - name: Run maintenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            cp BDIX-Playlist.m3u /tmp/bdix-playlist-protected.m3u
            cp epg/epg.xml /tmp/bdix-epg-previous.xml 2>/dev/null || true

            # Snapshot Backup/Not Playing before ANY maintenance script runs.
            # These are owner-review queues and must survive maintenance byte-for-byte.
            python - <<'PY'
            from pathlib import Path
            import re
            p=Path('IPTV-Playlist.m3u')
            lines=p.read_text(encoding='utf-8-sig').replace('\r','').splitlines()
            protected=[]
            for i,line in enumerate(lines):
                if not line.startswith('#EXTINF:'): continue
                m=re.search(r'group-title="([^"]*)"',line)
                if not m or m.group(1).strip() not in {'Backup','Not Playing'}: continue
                j=i+1
                while j<len(lines) and not lines[j].strip(): j+=1
                if j<len(lines) and lines[j].strip().lower().startswith(('http://','https://')): protected.append(line+'\n'+lines[j].strip())
            Path('/tmp/iptv-protected-review.m3u').write_text('\n'.join(protected)+'\n',encoding='utf-8')
            print(f'Protected review snapshot: {len(protected)} entries')
            PY

            rm -rf fixed_output
            python scripts/fix_playlist.py IPTV-Playlist.m3u --outdir fixed_output
            test -s fixed_output/IPTV-Playlist.fixed.m3u
            cp fixed_output/IPTV-Playlist.fixed.m3u IPTV-Playlist.m3u
            python scripts/repair_iptv_audit_findings.py
            python scripts/repair_playlist_quality.py
            python scripts/normalize_metadata.py
            python scripts/repair_playlist_logos.py
            python scripts/sort_playlists.py IPTV-Playlist.m3u
            python scripts/apply_gemini_playlist_repairs.py
            python scripts/final_playlist_hardening.py IPTV-Playlist.m3u
            if grep -Eiq 'group-title="(New Channels|New Backup|New)"' IPTV-Playlist.m3u; then echo '::error::Forbidden staging playlist category detected after normalization.'; exit 1; fi

            # Force known contaminated/generic local logos back through the resolver.
            # The existing resolver repairs missing references, but previously treated
            # a bad-but-existing local file as healthy. Blank only known-bad references;
            # the resolver then uses its verified ID/name/catalogue sources.
            python - <<'PY'
            from pathlib import Path
            import re
            BAD={'atn-news.png','a-sports-5485adff.png','a-sports-hd.png','bein-sports-3.png','bangla-tv.png','btv-news.png','colors.png','duronto-tv.png','duronto-tv-1ad55c95.png','ekushey-tv.png','global-tv.png','green-tv.png','mohona-tv.png','nagorik-tv.png','nagorik.png','nick-bangla.png','sananda-tv.png','sananda.png','star-gold-select.png','star-gold.png','star-plus.png','zee-tv.png','tom-and-jerry.png','arirang-tv.png'}
            p=Path('IPTV-Playlist.m3u'); lines=p.read_text(encoding='utf-8-sig').replace('\r','').splitlines(); out=[]; changed=0
            for line in lines:
                if line.startswith('#EXTINF:'):
                    m=re.search(r'tvg-logo="([^"]*)"',line)
                    if m and Path(m.group(1).split('?',1)[0].split('#',1)[0]).name.casefold() in BAD:
                        line=line[:m.start(1)]+line[m.end(1):]; changed+=1
                out.append(line)
            p.write_text('\n'.join(out).rstrip()+'\n',encoding='utf-8'); print(f'Known-bad local logo references invalidated: {changed}')
            PY
            python scripts/migrate_external_logos_fixed.py
            python scripts/generate_logo_authenticity_manifest.py
            python scripts/restore_protected_review.py

            # Stream health is advisory only. The playlist owner reviews results manually;
            # failures never trigger automatic channel deletion/reclassification.
            python scripts/stream_health.py
            python scripts/report_iptv_fragile_streams.py

            python scripts/epg_coverage.py
            python scripts/fetch_iptv_org_epg.py
            python scripts/run_generate_epg.py
            test -s epg/epg.xml
            grep -q '<programme ' epg/epg.xml
            cp epg/epg.xml /tmp/bdix-epg-generated.xml
            set +e
            python scripts/epg_publish_gate.py
            EPG_GATE_STATUS=$?
            set -e
            if [ "$EPG_GATE_STATUS" -ne 0 ]; then
              echo '::warning::EPG publish gate blocked this generated guide; retaining the previous known-good epg/epg.xml.'
              if [ -s /tmp/bdix-epg-previous.xml ] && grep -q '<programme ' /tmp/bdix-epg-previous.xml; then cp /tmp/bdix-epg-previous.xml epg/epg.xml; else echo '::error::No valid previous EPG is available after a publish-gate failure.'; exit 1; fi
            else echo 'EPG publish gate passed; accepting newly generated guide.'; fi
            cp epg/epg.xml /tmp/bdix-epg-publish.xml
            python scripts/sync_epg_worker_map.py
            python scripts/epg_coverage.py
            set +e
            python scripts/audit_playlist.py
            AUDIT_STATUS=$?
            python scripts/build_identity_index.py
            python scripts/stream_health.py
            HEALTH_STATUS=$?
            python scripts/stream_risk_review.py
            if [ ! -s reports/stream-health.md ]; then HEALTH_STATUS=2; fi
            python scripts/pre_publish_gate.py
            GATE_STATUS=$?
            set -e

            # The gate is a repair trigger, not a dead end. Repeat deterministic
            # metadata/logo repair, then restore the protected review queues again.
            if [ "$GATE_STATUS" -ne 0 ]; then
              echo '::warning::Pre-publish gate found issues; running automatic correction pass before failing.'
              python scripts/repair_iptv_audit_findings.py || true
              python scripts/repair_playlist_quality.py || true
              python scripts/normalize_metadata.py || true
              python scripts/repair_playlist_logos.py || true
              python scripts/sort_playlists.py IPTV-Playlist.m3u || true
              python scripts/final_playlist_hardening.py IPTV-Playlist.m3u || true
              python - <<'PY'
              from pathlib import Path
              import re
              BAD={'atn-news.png','a-sports-5485adff.png','a-sports-hd.png','bein-sports-3.png','bangla-tv.png','btv-news.png','colors.png','duronto-tv.png','duronto-tv-1ad55c95.png','ekushey-tv.png','global-tv.png','green-tv.png','mohona-tv.png','nagorik-tv.png','nagorik.png','nick-bangla.png','sananda-tv.png','sananda.png','star-gold-select.png','star-gold.png','star-plus.png','zee-tv.png','tom-and-jerry.png','arirang-tv.png'}
              p=Path('IPTV-Playlist.m3u'); lines=p.read_text(encoding='utf-8-sig').replace('\r','').splitlines(); out=[]; changed=0
              for line in lines:
                  if line.startswith('#EXTINF:'):
                      m=re.search(r'tvg-logo="([^"]*)"',line)
                      if m and Path(m.group(1).split('?',1)[0].split('#',1)[0]).name.casefold() in BAD:
                          line=line[:m.start(1)]+line[m.end(1):]; changed+=1
                  out.append(line)
              p.write_text('\n'.join(out).rstrip()+'\n',encoding='utf-8'); print(f'Known-bad references invalidated on correction pass: {changed}')
              PY
              python scripts/migrate_external_logos_fixed.py || true
              python scripts/generate_logo_authenticity_manifest.py || true
              python scripts/restore_protected_review.py
              python scripts/audit_playlist.py || true
              python scripts/pre_publish_gate.py
              GATE_STATUS=$?
            fi

            python scripts/record_maintenance_history.py
            python scripts/generate_dashboard.py
            if [ "$AUDIT_STATUS" -ne 0 ] || [ "$GATE_STATUS" -ne 0 ]; then
              echo '::warning::Audit/pre-publish gate still reports issues after the automatic correction pass. Preserving the deterministic IPTV repair in IPTV-Playlist.m3u; no automatic rollback of the repaired playlist will occur.'
              echo "Audit status: $AUDIT_STATUS"
              echo "Pre-publish gate status: $GATE_STATUS"
              git restore -- logos/ || true
            fi
            python scripts/record_maintenance_history.py --refresh
            python scripts/generate_dashboard.py
            cp /tmp/bdix-epg-publish.xml epg/epg.xml
            cp /tmp/bdix-playlist-protected.m3u BDIX-Playlist.m3u
            test -s epg/epg.xml
            grep -q '<programme ' epg/epg.xml
            echo "Validated EPG working-tree bytes: $(wc -c < epg/epg.xml)"
            echo "Validated EPG working-tree sha256: $(sha256sum epg/epg.xml | awk '{print $1}')"
            python scripts/enforce_playlist_attribution.py IPTV-Playlist.m3u
            git add IPTV-Playlist.m3u reports/ assets/dashboard.svg
            git add -f epg/epg.xml
            STAGED_EPG_BYTES="$(git cat-file -s :epg/epg.xml)"
            echo "Staged EPG bytes: ${STAGED_EPG_BYTES}"
            test "${STAGED_EPG_BYTES}" -gt 0
            git cat-file blob :epg/epg.xml > /tmp/bdix-epg-staged.xml
            grep -q '<programme ' /tmp/bdix-epg-staged.xml
            echo "Staged EPG sha256: $(sha256sum /tmp/bdix-epg-staged.xml | awk '{print $1}')"
            python -c 'from pathlib import Path; from collections import Counter; p=Path("IPTV-Playlist.m3u"); urls=[s.casefold() for s in (x.strip() for x in p.read_text(encoding="utf-8",errors="replace").splitlines()) if s.startswith(("http://","https://"))]; d=[u for u,n in Counter(urls).items() if n>1]; print(f"::error::Duplicate stream URLs remain: {len(d)} unique URLs are repeated.") if d else print(f"URL uniqueness check passed: {len(urls)} stream URLs, 0 duplicates."); raise SystemExit(1 if d else 0)'
            if git diff --cached --quiet; then echo 'No maintenance changes to publish.'; exit 0; fi
            git commit -m 'Run IPTV playlist maintenance'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
