name: IPTV Playlist Update
# Owner-requested one-time cleanup is activated by a durable, explicit request marker.
# A queued run superseded by later commits must be retriggered from the current main revision.
# A superseded run leaves the marker intact; only a published migration report consumes it.
# Rebuild all playlist-owned audit, gate, stream-health, logo and dashboard snapshots.
# Playlist-only maintenance. EPG generation/validation is owned by Refresh IPTV EPG.
# Stream URL identity must use scripts/stream_url_identity.py; never lowercase an entire stream URL.
# Specialized discovery/logo workflows own their generated playlist commits.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/iptv-maintenance.yml
      - scripts/maintenance_helpers.py
      - scripts/reconcile_playlist_consistency.py
      - scripts/classify_international_backups.py
      - scripts/backfill_cross_playlist_metadata.py
      - scripts/repair_logo_asset_technical_quality.py
      - scripts/normalize_metadata.py
      - scripts/sort_playlists.py
      - scripts/renumber_active_channels.py
      - scripts/reconcile_backup_metadata_exact_id.py
      - scripts/permanent_removals.py
      - scripts/enforce_primary_backup_integrity.py
      - scripts/final_playlist_hardening.py
      - scripts/country_verification.py
      - scripts/migrate_external_logos_fixed.py
      - scripts/restore_protected_review.py
      - scripts/generate_logo_authenticity_manifest.py
      - scripts/generate_logo_repair_summary.py
      - docs/requirements.txt
      - scripts/validate_report_freshness.py
      - scripts/logo_asset_naming.py
      - scripts/generate_logo_provenance_review.py
      - scripts/generate_metadata_normalization_report.py
      - scripts/iptv_metadata_backfill.py
      - scripts/audit_playlist.py
      - scripts/playlist_order_policy.py
      - scripts/build_identity_index.py
      - scripts/stream_health.py
      - scripts/stream_risk_review.py
      - scripts/report_iptv_fragile_streams.py
      - scripts/pre_publish_gate.py
      - scripts/record_maintenance_history.py
      - scripts/generate_dashboard.py
      - scripts/refresh_dashboard_diagnostics.py
      - scripts/enforce_playlist_attribution.py
      - scripts/discover_international_channels.py
      - scripts/validate_discovery_run.py
      - scripts/reorganize_international_playlist.py
      - scripts/validate_international_playlist.py
      - scripts/verify_international_protected.py
      - scripts/protect_main_playlist.py
      - scripts/reclassify_main_playlist_groups.py
      - scripts/probe_owner_requested_main_queues.py
      - scripts/migrate_owner_requested_main_queues.py
      - maintenance/owner-requested-iptv-migration.json
  workflow_run:
    workflows: ["IPTV Logo Localization"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 1 * * *' # 07:00 Asia/Dhaka (UTC+6)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maintain:
    if: ${{ !(github.actor == 'github-actions[bot]' && (startsWith(github.event.head_commit.message, 'Run IPTV playlist maintenance') || startsWith(github.event.head_commit.message, 'Synchronize IPTV generated reports') || startsWith(github.event.head_commit.message, 'Synchronize IPTV generated reports and EPG'))) }}
    # Shared main-branch writer queue. Set on the writing job, not the workflow,
    # so runs whose jobs are skipped do not occupy the queue.
    concurrency:
      group: iptv-playlist-main-writer-v5
      # Keep this v5 identifier aligned across every main-branch playlist writer workflow.
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 50
          # Keep recent commit ancestry for report-freshness tests; sparse checkout avoids unrelated application trees.
          sparse-checkout: |
            .
            .github/workflows
            analytics
            assets
            docs
            epg
            logos
            reports
            scripts
            tests
            xtream
            xtream-main
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '20'}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - name: Validate playlist maintenance helpers
        run: |
          python -m py_compile \
            scripts/maintenance_helpers.py \
            scripts/verify_international_protected.py \
            scripts/protect_main_playlist.py \
            scripts/reclassify_main_playlist_groups.py \
            scripts/probe_owner_requested_main_queues.py \
            scripts/migrate_owner_requested_main_queues.py \
            scripts/reconcile_playlist_consistency.py \
            scripts/restore_protected_review.py \
            scripts/audit_playlist.py \
            scripts/playlist_order_policy.py \
            scripts/pre_publish_gate.py \
            scripts/sort_playlists.py \
            scripts/renumber_active_channels.py \
            scripts/reconcile_backup_metadata_exact_id.py \
            scripts/enforce_primary_backup_integrity.py \
            scripts/final_playlist_hardening.py \
            scripts/country_verification.py \
            scripts/generate_logo_authenticity_manifest.py \
            scripts/generate_logo_repair_summary.py \
            scripts/logo_asset_naming.py \
            scripts/generate_logo_provenance_review.py \
            scripts/generate_metadata_normalization_report.py \
            scripts/report_iptv_fragile_streams.py \
            scripts/stream_risk_review.py \
            scripts/validate_report_freshness.py \
            scripts/iptv_metadata_backfill.py \
            scripts/discover_international_channels.py \
            scripts/repair_international_playlist.py \
            scripts/reorganize_international_playlist.py \
            scripts/validate_international_playlist.py \
            scripts/normalize_metadata.py \
            scripts/migrate_external_logos_fixed.py \
            scripts/repair_logo_asset_technical_quality.py \
            scripts/backfill_cross_playlist_metadata.py \
            scripts/build_identity_index.py \
            scripts/stream_health.py \
            scripts/record_maintenance_history.py \
            scripts/generate_dashboard.py \
            scripts/refresh_dashboard_diagnostics.py \
            scripts/enforce_playlist_attribution.py
      - name: Run code-level maintenance and report-freshness tests
        run: |
          python -m unittest discover -s tests -p 'test_stream_url_identity.py'
          python -m unittest discover -s tests -p 'test_main_playlist_protection.py'
          python -m unittest discover -s tests -p 'test_main_playlist_grouping.py'
          python -m unittest discover -s tests -p 'test_owner_requested_main_migrations.py'
           python -m unittest discover -s tests -p 'test_report_freshness.py'
          python -m unittest discover -s tests -p 'test_pre_publish_gate_logo_paths.py'
          python -m unittest discover -s tests -p 'test_maintenance_report_order.py'
          python -m unittest discover -s tests -p 'test_metadata_backfill.py'
          python -m unittest discover -s tests -p 'test_reconcile_playlist_consistency.py'
          python -m unittest discover -s tests -p 'test_logo_authenticity_manifest.py'
          python -m unittest discover -s tests -p 'test_logo_asset_naming.py'
          python -m unittest discover -s tests -p 'test_logo_provenance_review.py'
          python -m unittest discover -s tests -p 'test_logo_repair_source_hints.py'
          python -m unittest discover -s tests -p 'test_iptv_fragile_streams.py'
          python -m unittest discover -s tests -p 'test_language_policy.py'
          python -m unittest discover -s tests -p 'test_country_verification.py'
          python -m unittest discover -s tests -p 'test_migrate_logo_unset.py'
          python -m unittest discover -s tests -p 'test_international_protected_guard.py'
      - name: Run maintenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          # Always reconcile against the latest main after acquiring the shared writer lock.
          # A later report/discovery commit must not silently supersede the durable owner request.
          EVENT_WORKFLOW_BLOB="$(git rev-parse "${GITHUB_SHA}:.github/workflows/iptv-maintenance.yml")"
          CURRENT_WORKFLOW_BLOB="$(git rev-parse "FETCH_HEAD:.github/workflows/iptv-maintenance.yml")"
          if [[ "$EVENT_WORKFLOW_BLOB" != "$CURRENT_WORKFLOW_BLOB" ]]; then
            echo "::notice::Skipping superseded queued IPTV maintenance run; a newer workflow definition is on main. No playlist files were changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Durable one-time owner authorization. The marker survives superseded
          # push/workflow_run events and scheduled retries. It is considered consumed
          # only after the migration report is published to main; a failed or skipped
          # run therefore cannot silently discard the owner's authorization.
          OWNER_MIGRATION_REQUESTED=false
          MIGRATION_REQUEST_FILE="maintenance/owner-requested-iptv-migration.json"
          MIGRATION_COMPLETION_REPORT="reports/owner-requested-main-migrations.md"
          if [[ -s "${MIGRATION_REQUEST_FILE}" && ! -s "${MIGRATION_COMPLETION_REPORT}" ]] \
             && jq -e '.status == "pending"' "${MIGRATION_REQUEST_FILE}" >/dev/null; then
            OWNER_MIGRATION_REQUESTED=true
            echo "Explicitly pending owner-requested IPTV migration is active."
          else
            echo "No active owner-requested migration; existing IPTV rows remain immutable."
          fi
          # ------------------------------------------------------------------
          # Ordering contract (enforced by tests/test_maintenance_report_order.py)
          #   1. snapshots           (once per attempt)
          #   2. run_mutations       (every step that can change a playlist or logo asset)
          #   3. change guard        (after the LAST mutator, before any report)
          #   4. audit + gate        (final bytes; statuses are kept, never discarded)
          #   5. reports             (each written once, from the final bytes)
          #   6. freshness check     (once, after every fingerprinted report)
          #   7. commit
          # Mutators that also write a fingerprinted report (iptv_metadata_backfill,
          # backfill_cross_playlist_metadata, repair_logo_asset_technical_quality)
          # run LAST in the mutation block so their report matches the final bytes.
          # ------------------------------------------------------------------
          run_mutations() {
            python scripts/normalize_metadata.py
            if grep -Eiq 'group-title="New"' IPTV-Playlist.m3u; then echo '::error::Forbidden staging playlist category detected after normalization.'; exit 1; fi
            python scripts/country_verification.py validate IPTV-Playlist.m3u
            python scripts/maintenance_helpers.py invalidate-bad-logos
            python scripts/migrate_external_logos_fixed.py
            # The one-time owner request is scoped strictly to IPTV-Playlist.m3u.
            # Do not let this authorization mutate International-Playlist.m3u or shared
            # logo assets used by it. Routine non-owner maintenance retains the separate
            # International playlist maintenance path.
            if [[ "$OWNER_MIGRATION_REQUESTED" != "true" ]]; then
              # reorganize_international_playlist.py reads tvg-country/tvg-language,
              # so the cross-playlist backfill must run before it.
              python scripts/backfill_cross_playlist_metadata.py
              python scripts/reorganize_international_playlist.py
              python scripts/enforce_playlist_attribution.py International-Playlist.m3u
              python scripts/validate_international_playlist.py
            fi
            python scripts/enforce_playlist_attribution.py IPTV-Playlist.m3u
            # Routine main-playlist maintenance is metadata/logo-only. A separately
            # authorized one-time owner commit enables the exact-URL-approved migration
            # branch below; the protection gate still forbids URL loss or replacement.
            # International-Playlist.m3u is reorganized separately under its own policy.
            # These report-coupled tools are deliberately last. Their playlist changes are
            # idempotent metadata-only repairs; no later step may rewrite either playlist.
            python scripts/iptv_metadata_backfill.py
            if [[ "$OWNER_MIGRATION_REQUESTED" != "true" ]]; then
              python scripts/backfill_cross_playlist_metadata.py
            fi
            if [[ "$OWNER_MIGRATION_REQUESTED" == "true" ]]; then
              # Exact-URL approvals authorize only this requested migration batch.
              python scripts/probe_owner_requested_main_queues.py
              python scripts/migrate_owner_requested_main_queues.py
              python scripts/sort_playlists.py IPTV-Playlist.m3u
              python scripts/renumber_active_channels.py IPTV-Playlist.m3u
              # Complete supported metadata for newly promoted primary rows.
              python scripts/iptv_metadata_backfill.py
            fi
            if [[ "$OWNER_MIGRATION_REQUESTED" != "true" ]]; then
              python scripts/repair_logo_asset_technical_quality.py --fix
            fi
            python scripts/verify_international_protected.py verify
          }
          if [[ "$OWNER_MIGRATION_REQUESTED" == "true" ]]; then
            rm -f /tmp/iptv-owner-requested-probes.json /tmp/iptv-owner-requested-migrations.json /tmp/iptv-owner-migration-authorized
            touch /tmp/iptv-owner-migration-authorized
          fi
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            python scripts/maintenance_helpers.py snapshot-playlist
            python scripts/maintenance_helpers.py snapshot
            python scripts/verify_international_protected.py snapshot
            rm -rf fixed_output
            echo 'Non-destructive maintenance mode: protecting existing IPTV channel rows.'
            python scripts/protect_main_playlist.py snapshot IPTV-Playlist.m3u /tmp/iptv-main-protection.json
            run_mutations
            python scripts/protect_main_playlist.py verify IPTV-Playlist.m3u /tmp/iptv-main-protection.json
            set +e
            python scripts/audit_playlist.py
            AUDIT_STATUS=$?
            python scripts/pre_publish_gate.py
            GATE_STATUS=$?
            set -e
            if [ "$AUDIT_STATUS" -ne 0 ] || [ "$GATE_STATUS" -ne 0 ]; then
              echo '::warning::Audit or pre-publish gate found issues; running one automatic correction pass (same mutation sequence, failures not suppressed).'
              run_mutations
              python scripts/protect_main_playlist.py verify IPTV-Playlist.m3u /tmp/iptv-main-protection.json
              set +e
              python scripts/audit_playlist.py
              AUDIT_STATUS=$?
              python scripts/pre_publish_gate.py
              GATE_STATUS=$?
              set -e
            fi
            # Data-level metadata assertions run against the final playlist bytes.
            python -m unittest discover -s tests -p 'test_playlist_metadata_repairs.py'
          python -m unittest discover -s tests -p 'test_channel_numbering.py'
          python -m unittest discover -s tests -p 'test_sort_playlists.py'
          python -m unittest discover -s tests -p 'test_backup_metadata_reconcile.py'
          python -m unittest discover -s tests -p 'test_primary_backup_integrity.py'

            # Reports: each is written exactly once, from the final playlist bytes.
            python scripts/stream_health.py
            if [ ! -s reports/stream-health.md ]; then echo '::error::reports/stream-health.md is missing or empty.'; exit 1; fi
            python scripts/report_iptv_fragile_streams.py
            python scripts/stream_risk_review.py
            python scripts/build_identity_index.py
            python scripts/generate_logo_authenticity_manifest.py
            python scripts/generate_logo_repair_summary.py
            python scripts/generate_logo_provenance_review.py
            python scripts/generate_metadata_normalization_report.py
            python scripts/record_maintenance_history.py
            python scripts/generate_dashboard.py
            python scripts/validate_report_freshness.py --mode generated
            if [ "$AUDIT_STATUS" -ne 0 ] || [ "$GATE_STATUS" -ne 0 ]; then
              echo "::error::Final audit or pre-publish gate reports blocking issues."
              echo "Audit status: $AUDIT_STATUS"
              echo "Pre-publish gate status: $GATE_STATUS"
              exit 1
            fi
            git add IPTV-Playlist.m3u International-Playlist.m3u reports/ logos/ assets/dashboard.svg
            python -c 'import sys; sys.path.insert(0,"scripts"); from pathlib import Path; from collections import Counter; from stream_url_identity import stream_url_key; p=Path("IPTV-Playlist.m3u"); urls=[stream_url_key(s) for s in (x.strip() for x in p.read_text(encoding="utf-8",errors="replace").splitlines()) if s.startswith(("http://","https://"))]; d=[u for u,n in Counter(urls).items() if n>1]; print(f"::error::Duplicate stream URLs remain: {len(d)} unique URLs are repeated.") if d else print(f"URL uniqueness check passed: {len(urls)} stream URLs, 0 duplicates."); raise SystemExit(1 if d else 0)'
            if git diff --cached --quiet; then echo 'No maintenance changes to publish.'; exit 0; fi
            git commit -m 'Run IPTV playlist maintenance'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Publish fresh dashboard diagnostics after blocked maintenance
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            echo "::notice::Rebuilding dashboard diagnostics from the latest committed two-playlist state (attempt ${attempt})."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            python scripts/refresh_dashboard_diagnostics.py
            git reset
            # Recovery may publish reports/dashboard only; never stage playlist bytes.
            if ! git diff --exit-code -- IPTV-Playlist.m3u International-Playlist.m3u; then
              echo "::error::Dashboard recovery modified a playlist; refusing to publish."
              exit 1
            fi
            git add reports/ assets/dashboard.svg
            if git diff --cached --quiet; then
              echo "Dashboard diagnostics already match current committed playlist inputs."
              exit 0
            fi
            git commit -m 'Refresh IPTV dashboard diagnostics'
            if git push origin HEAD:main; then
              echo "Fresh dashboard diagnostics published; any BLOCK status remains visible."
              exit 0
            fi
            echo "::warning::Dashboard diagnostic push conflicted with a newer main commit; regenerating against latest main."
            sleep 3
          done
          echo "::error::Could not publish fresh dashboard diagnostics after 3 attempts."
          exit 1
      - name: Upload maintenance safety reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: iptv-maintenance-safety-${{ github.run_number }}
          path: |
            reports/proposed-removals.md
            reports/iptv-metadata-backfill.md
            reports/iptv-playlist-audit.md
            reports/stream-health.md
            reports/stream-risk-review.md
            reports/pre-publish-gate.md
            reports/owner-requested-main-migrations.md
          if-no-files-found: warn
          retention-days: 14
