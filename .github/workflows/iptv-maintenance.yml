name: IPTV Playlist Update
on:
  push:
    branches: [main]
    paths:
      - IPTV-Playlist.m3u
      - scripts/**
      - reports/epg-india-channel-mapping.csv
      - .github/workflows/iptv-maintenance.yml
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iptv-maintenance
  cancel-in-progress: false
  queue: single
jobs:
  maintain:
    if: ${{ !(github.actor == 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'Run IPTV playlist maintenance')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Run maintenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            cp epg/epg.xml /tmp/bdix-epg-previous.xml 2>/dev/null || true
            python scripts/normalize_metadata.py
            # Automatic candidate discovery is enabled. New channels go to New Channels,
            # backup candidates go to New Backup, and user-deleted review entries are remembered
            # in reports/discovery-state.json so they do not recur on later runs.
            python scripts/discover_channels_v3.py
            # Discovery appends review candidates; normalize again so their metadata and A-Z order pass audit.
            python scripts/normalize_metadata.py
            python scripts/migrate_external_logos_fixed.py
            python scripts/epg_coverage.py
            python scripts/generate_epg.py
            test -s epg/epg.xml
            grep -q '<programme ' epg/epg.xml
            cp epg/epg.xml /tmp/bdix-epg-generated.xml

            # EPG source coverage can temporarily fluctuate. A regression must
            # never block the rest of playlist maintenance, but a degraded guide
            # must also never replace the last known-good published guide.
            set +e
            python scripts/epg_publish_gate.py
            EPG_GATE_STATUS=$?
            set -e
            if [ "$EPG_GATE_STATUS" -ne 0 ]; then
              echo "::warning::EPG publish gate blocked this generated guide; retaining the previous known-good epg/epg.xml."
              if [ -s /tmp/bdix-epg-previous.xml ] && grep -q '<programme ' /tmp/bdix-epg-previous.xml; then
                cp /tmp/bdix-epg-previous.xml epg/epg.xml
                echo "Retained previous EPG because the new guide regressed."
              else
                echo "::error::No valid previous EPG is available after a publish-gate failure."
                exit 1
              fi
            else
              echo "EPG publish gate passed; accepting newly generated guide."
            fi
            cp epg/epg.xml /tmp/bdix-epg-publish.xml
            # Refresh EPG coverage against the final guide retained by the publish gate.
            python scripts/epg_coverage.py
            python scripts/sync_epg_worker_map.py
            set +e
            python scripts/audit_playlist.py
            AUDIT_STATUS=$?
            python scripts/build_identity_index.py
            python scripts/stream_health.py
            HEALTH_STATUS=$?
            if [ ! -s reports/stream-health.md ]; then HEALTH_STATUS=2; fi
            python scripts/pre_publish_gate.py
            GATE_STATUS=$?
            set -e
            python scripts/record_maintenance_history.py
            python scripts/generate_dashboard.py
            # Stream health is diagnostic only: transient HTTP timeouts and
            # CDN/protection failures must never roll back valid playlist
            # metadata repairs. Only the structural audit and publication gate
            # are allowed to roll back playlist content.
            if [ "$AUDIT_STATUS" -ne 0 ] || [ "$GATE_STATUS" -ne 0 ]; then
              git restore -- IPTV-Playlist.m3u logos/ xtream/worker.js || true
              # Reports must describe the exact playlist state that will be
              # committed. Re-run the audit/gate after any rollback rather than
              # leaving reports generated from a discarded working tree.
              set +e
              python scripts/audit_playlist.py
              FINAL_AUDIT_STATUS=$?
              python scripts/pre_publish_gate.py
              FINAL_GATE_STATUS=$?
              set -e
              echo "Final post-rollback audit: $FINAL_AUDIT_STATUS"
              echo "Final post-rollback gate: $FINAL_GATE_STATUS"
              # The audit may have modified the playlist before rejecting it.
              # After restoring the published playlist, refresh every report
              # whose metrics depend on playlist contents; otherwise dashboards
              # can describe the rejected working-tree candidate.
              python scripts/build_identity_index.py
              python scripts/stream_health.py
              python scripts/generate_dashboard.py
            fi
            # Rewrite the latest history record after any rollback so its
            # metrics describe the final retained playlist, not a rejected candidate.
            python scripts/record_maintenance_history.py --refresh
            python scripts/generate_dashboard.py
            # The guide is a generated publication artifact. Restore the
            # publish-approved copy immediately before staging so later
            # maintenance tools cannot accidentally publish an empty/stale EPG.
            cp /tmp/bdix-epg-publish.xml epg/epg.xml
            test -s epg/epg.xml
            grep -q '<programme ' epg/epg.xml
            echo "Validated EPG working-tree bytes: $(wc -c < epg/epg.xml)"
            echo "Validated EPG working-tree sha256: $(sha256sum epg/epg.xml | awk '{print $1}')"
            git add IPTV-Playlist.m3u logos/ reports/ assets/dashboard.svg xtream/worker.js
            git add -f epg/epg.xml
            STAGED_EPG_BYTES="$(git cat-file -s :epg/epg.xml)"
            echo "Staged EPG bytes: ${STAGED_EPG_BYTES}"
            test "${STAGED_EPG_BYTES}" -gt 0
            # Avoid SIGPIPE under pipefail: materialize the staged blob once,
            # then validate/hash the file without piping git output into grep.
            git cat-file blob :epg/epg.xml > /tmp/bdix-epg-staged.xml
            grep -q '<programme ' /tmp/bdix-epg-staged.xml
            echo "Staged EPG sha256: $(sha256sum /tmp/bdix-epg-staged.xml | awk '{print $1}')"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Run IPTV playlist maintenance'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
