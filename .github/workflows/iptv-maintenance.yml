name: IPTV Playlist Update
on:
  push:
    branches: [main]
    paths:
      - IPTV-Playlist.m3u
      - .github/workflows/iptv-maintenance.yml
      - scripts/fix_playlist.py
      - scripts/repair_iptv_audit_findings.py
      - scripts/repair_playlist_quality.py
      - scripts/repair_playlist_logos.py
      - scripts/normalize_metadata.py
      - scripts/sort_playlists.py
      - scripts/final_playlist_hardening.py
      - scripts/migrate_external_logos_fixed.py
      - scripts/generate_logo_authenticity_manifest.py
      - scripts/check_epg_config.py
      - scripts/epg_coverage.py
      - scripts/generate_epg.py
      - scripts/official_epg_sources.py
      - scripts/epg_publish_gate.py
      - scripts/sync_epg_worker_map.py
      - scripts/audit_playlist.py
      - scripts/build_identity_index.py
      - scripts/stream_health.py
      - scripts/stream_risk_review.py
      - scripts/clean_iptv_persistent_backups.py
      - scripts/report_iptv_fragile_streams.py
      - scripts/pre_publish_gate.py
      - scripts/record_maintenance_history.py
      - scripts/generate_dashboard.py
      - scripts/enforce_playlist_attribution.py
      - scripts/apply_gemini_playlist_repairs.py
      - reports/epg-india-channel-mapping.csv
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bdix-iptv-main-writer
  cancel-in-progress: false
  queue: max
jobs:
  maintain:
    if: ${{ !(github.actor == 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'Run IPTV playlist maintenance')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      M3U4U_XMLTV_URL: ${{ secrets.M3U4U_XMLTV_URL }}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Validate EPG configuration
        run: python scripts/check_epg_config.py
      - name: Run maintenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            cp BDIX-Playlist.m3u /tmp/bdix-playlist-protected.m3u
            cp epg/epg.xml /tmp/bdix-epg-previous.xml 2>/dev/null || true
            rm -rf fixed_output
            python scripts/fix_playlist.py IPTV-Playlist.m3u --outdir fixed_output
            test -s fixed_output/IPTV-Playlist.fixed.m3u
            cp fixed_output/IPTV-Playlist.fixed.m3u IPTV-Playlist.m3u
            python scripts/repair_iptv_audit_findings.py
            python scripts/repair_playlist_quality.py
            python scripts/normalize_metadata.py
            python scripts/repair_playlist_logos.py
            python scripts/sort_playlists.py IPTV-Playlist.m3u
            python scripts/apply_gemini_playlist_repairs.py
            python scripts/final_playlist_hardening.py IPTV-Playlist.m3u
            if grep -Eiq 'group-title="(New Channels|New Backup|New)"' IPTV-Playlist.m3u; then echo '::error::Forbidden staging playlist category detected after normalization.'; exit 1; fi
            python scripts/migrate_external_logos_fixed.py
            python scripts/generate_logo_authenticity_manifest.py

            # First health pass supplies current failure state to the safe
            # persistent-backup cleanup. Only redundant Backup streams are
            # eligible; primary streams are never removed by this cleanup.
            python scripts/stream_health.py
            python scripts/clean_iptv_persistent_backups.py
            python scripts/report_iptv_fragile_streams.py

            # Rebuild EPG after backup/identity cleanup so coverage reflects the
            # actual IPTV-Playlist.m3u that will be published. M3U4U remains an
            # optional private source through the existing Actions secret.
            python scripts/epg_coverage.py
            python scripts/generate_epg.py
            test -s epg/epg.xml
            grep -q '<programme ' epg/epg.xml
            cp epg/epg.xml /tmp/bdix-epg-generated.xml
            set +e
            python scripts/epg_publish_gate.py
            EPG_GATE_STATUS=$?
            set -e
            if [ "$EPG_GATE_STATUS" -ne 0 ]; then
              echo '::warning::EPG publish gate blocked this generated guide; retaining the previous known-good epg/epg.xml.'
              if [ -s /tmp/bdix-epg-previous.xml ] && grep -q '<programme ' /tmp/bdix-epg-previous.xml; then cp /tmp/bdix-epg-previous.xml epg/epg.xml; else echo '::error::No valid previous EPG is available after a publish-gate failure.'; exit 1; fi
            else echo 'EPG publish gate passed; accepting newly generated guide.'; fi
            cp epg/epg.xml /tmp/bdix-epg-publish.xml
            python scripts/sync_epg_worker_map.py
            python scripts/epg_coverage.py
            set +e
            python scripts/audit_playlist.py
            AUDIT_STATUS=$?
            python scripts/build_identity_index.py
            python scripts/stream_health.py
            HEALTH_STATUS=$?
            python scripts/stream_risk_review.py
            if [ ! -s reports/stream-health.md ]; then HEALTH_STATUS=2; fi
            python scripts/pre_publish_gate.py
            GATE_STATUS=$?
            set -e
            python scripts/record_maintenance_history.py
            python scripts/generate_dashboard.py
            if [ "$AUDIT_STATUS" -ne 0 ] || [ "$GATE_STATUS" -ne 0 ]; then
              echo '::warning::Audit/pre-publish gate reported issues. Preserving the deterministic IPTV repair in IPTV-Playlist.m3u; no automatic rollback of the repaired playlist will occur.'
              echo "Audit status: $AUDIT_STATUS"
              echo "Pre-publish gate status: $GATE_STATUS"
              git restore -- logos/ || true
            fi
            python scripts/record_maintenance_history.py --refresh
            python scripts/generate_dashboard.py
            cp /tmp/bdix-epg-publish.xml epg/epg.xml
            cp /tmp/bdix-playlist-protected.m3u BDIX-Playlist.m3u
            test -s epg/epg.xml
            grep -q '<programme ' epg/epg.xml
            echo "Validated EPG working-tree bytes: $(wc -c < epg/epg.xml)"
            echo "Validated EPG working-tree sha256: $(sha256sum epg/epg.xml | awk '{print $1}')"
            python scripts/enforce_playlist_attribution.py IPTV-Playlist.m3u
            git add IPTV-Playlist.m3u reports/ assets/dashboard.svg
            git add -f epg/epg.xml
            STAGED_EPG_BYTES="$(git cat-file -s :epg/epg.xml)"
            echo "Staged EPG bytes: ${STAGED_EPG_BYTES}"
            test "${STAGED_EPG_BYTES}" -gt 0
            git cat-file blob :epg/epg.xml > /tmp/bdix-epg-staged.xml
            grep -q '<programme ' /tmp/bdix-epg-staged.xml
            echo "Staged EPG sha256: $(sha256sum /tmp/bdix-epg-staged.xml | awk '{print $1}')"
            python -c 'from pathlib import Path; from collections import Counter; p=Path("IPTV-Playlist.m3u"); urls=[s.casefold() for s in (x.strip() for x in p.read_text(encoding="utf-8",errors="replace").splitlines()) if s.startswith(("http://","https://"))]; d=[u for u,n in Counter(urls).items() if n>1]; print(f"::error::Duplicate stream URLs remain: {len(d)} unique URLs are repeated.") if d else print(f"URL uniqueness check passed: {len(urls)} stream URLs, 0 duplicates."); raise SystemExit(1) if d else None'
            if git diff --cached --quiet; then echo 'No maintenance changes to publish.'; exit 0; fi
            git commit -m 'Run IPTV playlist maintenance'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
