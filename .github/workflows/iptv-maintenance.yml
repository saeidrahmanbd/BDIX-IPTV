name: IPTV Playlist Maintenance

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Dhaka'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'IPTV-Playlist.m3u'
      - 'scripts/normalize_metadata.py'
      - 'scripts/migrate_external_logos_fixed.py'
      - 'scripts/epg_coverage.py'
      - 'scripts/sync_epg_worker_map.py'
      - 'scripts/audit_playlist.py'
      - 'scripts/generate_dashboard.py'
      - 'reports/maintenance-history.json'
      - 'scripts/audit_playlist.py'
      - '.github/workflows/iptv-maintenance.yml'

permissions:
  contents: write

concurrency:
  group: iptv-repository-writes
  cancel-in-progress: false

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install logo dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg

      - name: Normalize channel metadata and numbering
        run: python scripts/normalize_metadata.py

      - name: Audit and repair channel logos
        run: python scripts/migrate_external_logos_fixed.py

      - name: Build and expand EPG mappings
        run: python scripts/epg_coverage.py

      - name: Sync EPG mappings to Xtream worker
        run: python scripts/sync_epg_worker_map.py

      - name: Run playlist audit
        run: python scripts/audit_playlist.py

      - name: Record maintenance history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          from datetime import datetime, timezone
          report = Path('reports/playlist-audit.md').read_text(encoding='utf-8')
          dashboard = Path('reports/dashboard.md').read_text(encoding='utf-8') if Path('reports/dashboard.md').exists() else ''
          def metric(text, label):
              m = re.search(rf'- {re.escape(label)}: \\*\\*(\\d+)\\*\\*', text)
              return int(m.group(1)) if m else None
          record = {
              'timestamp_utc': datetime.now(timezone.utc).isoformat(),
              'entries': metric(report, 'Playlist entries'),
              'unique_channel_ids': metric(report, 'Unique channel IDs'),
              'duplicate_ids': metric(report, 'IDs with multiple streams'),
              'duplicate_urls': metric(report, 'Duplicate stream URLs'),
              'metadata_conflicts': metric(report, 'Metadata conflicts'),
              'logo_exceptions': metric(report, 'Logo exceptions'),
              'primary_number_collisions': metric(report, 'Primary channel-number collisions'),
              'protected_primary_changes': metric(report, 'Protected primary-entry changes'),
          }
          path = Path('reports/maintenance-history.json')
          try:
              history = json.loads(path.read_text(encoding='utf-8')) if path.exists() else []
              if not isinstance(history, list): history = []
          except Exception:
              history = []
          history.append(record)
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(history[-180:], indent=2) + '\\n', encoding='utf-8')
          print('Recorded maintenance history:', record)
          PY

      - name: Generate project dashboard
        run: python scripts/generate_dashboard.py

      - name: Commit maintenance changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPTV-Playlist.m3u logos/ reports/ assets/dashboard.svg xtream/worker.js
          if git diff --cached --quiet; then
            echo 'No maintenance changes.'
            exit 0
          fi
          git commit -m 'Run IPTV playlist maintenance'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              python scripts/normalize_metadata.py
              python scripts/migrate_external_logos_fixed.py
              python scripts/epg_coverage.py
              python scripts/sync_epg_worker_map.py
              python scripts/audit_playlist.py
              python scripts/generate_dashboard.py
              git add IPTV-Playlist.m3u logos/ reports/ assets/dashboard.svg xtream/worker.js
              git diff --cached --quiet || git commit --amend --no-edit
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort
            fi
            sleep 3
          done
          exit 1
