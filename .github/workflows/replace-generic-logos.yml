name: Replace Generic Channel Logos

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/replace_generic_logos.py"
      - ".github/workflows/replace-generic-logos.yml"

permissions:
  contents: write

concurrency:
  group: replace-generic-channel-logos
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate replacement script
        run: python -m py_compile scripts/replace_generic_logos.py

      - name: Find and replace verified generic logos
        run: python scripts/replace_generic_logos.py

      - name: Commit verified replacements and reports
        run: |
          if git diff --quiet; then
            echo "No repository changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NVisionBD-Playlist.m3u logos reports/generic-logo-replacement-results.md reports/generic-logo-audit.md
          git commit -m "Replace verified generic channel logos"
          git push
