name: Replace Generic Channel Logos

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/replace_generic_logos.py"
      - ".github/workflows/replace-generic-logos.yml"

permissions:
  contents: write

concurrency:
  group: bdix-iptv-main-writer
  cancel-in-progress: false
  queue: max

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate replacement script
        run: python -m py_compile scripts/replace_generic_logos.py

      - name: Find and replace verified generic logos
        run: python scripts/replace_generic_logos.py

      - name: Commit verified replacements and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NVisionBD-Playlist.m3u logos reports/generic-logo-replacement-results.md reports/generic-logo-audit.md
          if git diff --cached --quiet; then
            echo "No repository changes were produced."
            exit 0
          fi
          git commit -m "Replace verified generic channel logos"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo "Rebase conflict; regenerate from current main before retrying."
              git reset --hard origin/main
              python -m py_compile scripts/replace_generic_logos.py
              python scripts/replace_generic_logos.py
              git add NVisionBD-Playlist.m3u logos reports/generic-logo-replacement-results.md reports/generic-logo-audit.md
              git diff --cached --quiet && exit 0
              git commit -m "Replace verified generic channel logos"
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to push after three up-to-date retries."
          exit 1
