name: Build Playlist Studio 5.0 Portable
# BDIX-IPTV feature build v5.0.3 - consolidated Windows build and runtime validation

on:
  workflow_dispatch:
  push:
    branches:
      - playlist-studio-5.0-portable
    paths:
      - 'Playlist-Studio-Fluent-Dark-v9.zip'
      - '.github/workflows/build-playlist-studio.yml'
      - 'build/feature_patch_v5.py'
      - 'build/make_brand_assets_v5.py'
      - 'build/bdix_preview.png'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Extract Playlist Studio source
        shell: pwsh
        run: |
          if (-not (Test-Path 'Playlist-Studio-Fluent-Dark-v9.zip')) {
            throw 'Playlist-Studio-Fluent-Dark-v9.zip was not found in the repository root.'
          }
          if (Test-Path 'buildkit') {
            Remove-Item 'buildkit' -Recurse -Force
          }
          New-Item -ItemType Directory -Path 'buildkit' | Out-Null
          Expand-Archive -LiteralPath 'Playlist-Studio-Fluent-Dark-v9.zip' -DestinationPath 'buildkit' -Force
          $src = Get-ChildItem -Path 'buildkit' -Recurse -Filter 'playlist_studio.py' -File | Select-Object -First 1
          if (-not $src) {
            throw 'playlist_studio.py was not found inside the uploaded source ZIP.'
          }
          "SOURCE_ROOT=$($src.Directory.Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Source root: $($src.Directory.Parent.FullName)"

      - name: Patch Xtream base-path handling
        shell: pwsh
        run: |
          $target = Join-Path $env:SOURCE_ROOT 'Source\bdix_integration.py'
          if (-not (Test-Path $target)) {
            throw "bdix_integration.py was not found at $target"
          }

          $text = Get-Content -LiteralPath $target -Raw
          $pattern = '(?ms)^def normalize_server\(server\):\r?\n.*?^def xtream_login\(cfg:XtreamConfig\):'
          $replacement = @"
          def normalize_server(server):
              server=server.strip()
              if not server: raise PlaylistError('Xtream server URL is required.')
              p=urllib.parse.urlsplit(server if '://' in server else 'http://' + server)
              if p.scheme not in ('http','https') or not p.hostname: raise PlaylistError('Enter a valid Xtream server URL.')
              if p.query or p.fragment: raise PlaylistError('Xtream server URL must not contain a query string or fragment.')
              path=(p.path or '').rstrip('/')
              return f'{p.scheme}://{p.netloc}{path}'

          def xtream_login(cfg:XtreamConfig):
          "@

          $patched = [regex]::Replace($text, $pattern, $replacement, 1)
          if ($patched -eq $text) {
            throw 'Xtream normalize_server() patch did not match the expected source. Build stopped to prevent an unverified binary.'
          }

          Set-Content -LiteralPath $target -Value $patched -Encoding UTF8
          $verify = Get-Content -LiteralPath $target -Raw
          if ($verify -notmatch 'path=\(p\.path or .*?\)\.rstrip\(') {
            throw 'Xtream path-preserving normalization was not found after patch.'
          }

          Write-Host 'Xtream server-path fix applied.'
          Write-Host 'Examples:'
          Write-Host '  https://worker.example/        -> https://worker.example/player_api.php'
          Write-Host '  https://worker.example/bdix    -> https://worker.example/bdix/player_api.php'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow openpyxl pyinstaller

      - name: Validate build scripts
        shell: pwsh
        run: |
          python -m py_compile "$env:GITHUB_WORKSPACE\build\feature_patch_v5.py" "$env:GITHUB_WORKSPACE\build\make_brand_assets_v5.py"
          if ($LASTEXITCODE -ne 0) { throw 'Build script compilation failed.' }

      - name: Apply Playlist Studio feature and branding patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE 'build\bdix_preview.png'))) { throw 'Bundled BDIX-IPTV preview creative is missing from the repository.' }
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'build\bdix_preview.png') -Destination (Join-Path $env:SOURCE_ROOT 'bdix_preview.png') -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'build\bdix_preview.png') -Destination (Join-Path $env:SOURCE_ROOT 'Source\bdix_preview.png') -Force
          python "$env:GITHUB_WORKSPACE\build\feature_patch_v5.py" "$env:SOURCE_ROOT\Source"
          if ($LASTEXITCODE -ne 0) { throw 'Playlist Studio feature patch failed.' }
          python "$env:GITHUB_WORKSPACE\build\make_brand_assets_v5.py" "$env:SOURCE_ROOT"
          if ($LASTEXITCODE -ne 0) { throw 'Playlist Studio branding asset generation failed.' }
          if (-not (Test-Path (Join-Path $env:SOURCE_ROOT 'studio.ico'))) { throw 'BDIX-IPTV application icon was not generated.' }
          if (-not (Test-Path (Join-Path $env:SOURCE_ROOT 'Source\bdix_preview.png'))) { throw 'BDIX-IPTV preview image was not copied into the Python source.' }

      - name: Validate patched source structure
        shell: pwsh
        run: |
          $main = Get-Content -LiteralPath (Join-Path $env:SOURCE_ROOT 'Source\playlist_studio.py') -Raw
          $extras = Get-Content -LiteralPath (Join-Path $env:SOURCE_ROOT 'Source\studio_extras.py') -Raw
          $ui = Get-Content -LiteralPath (Join-Path $env:SOURCE_ROOT 'Source\hybrid_ui.py') -Raw
          if (($main -split '_ps5_vlc_candidates').Count -ne 2) { throw 'Unexpected duplicate VLC bootstrap markers.' }
          if ($main -notmatch '_ps5_vlc_candidates') { throw 'VLC bootstrap was not injected.' }
          if ($main -notmatch '_ps5_Path\(__file__\)\.resolve\(\)\.parent\.parent.*/VLC') { throw 'Source-root VLC fallback was not injected.' }
          if ($main -notmatch 'VLC_PLUGIN_PATH') { throw 'VLC plugin path bootstrap was not injected.' }
          if ($main -match '_finish_startup') { throw 'Unverified startup deferral code is present.' }
          if ($main -notmatch "active_groups=\[\]") { throw 'Multi-category state was not injected.' }
          if ($extras -notmatch 'bdix_preview\.png') { throw 'BDIX-IPTV preview integration was not injected.' }
          if ($extras -notmatch 'ImageTk\.PhotoImage') { throw 'BDIX-IPTV preview image rendering was not injected.' }
          if ($ui -notmatch "selectmode='extended'") { throw 'Ctrl+Mouse category selection was not enabled.' }
          if ($ui -notmatch "Stream URL',430,180") { throw 'Stream URL column sizing was not applied.' }
          if ($ui -notmatch "width=500,style='Card.TFrame'") { throw 'Inspector sizing was not applied.' }
          if ($ui -notmatch 'BDIX-IPTV.*Playlist Studio 5\.0') { throw 'BDIX-IPTV 5.0 branding was not applied.' }
          if ($main -match '_finish_startup') { throw 'Startup deferral must not be present.' }
          Write-Host 'Patched-source structural checks: PASS'

      - name: Validate Python source
        shell: pwsh
        run: |
          python -m compileall -q "$env:SOURCE_ROOT\Source"
          if ($LASTEXITCODE -ne 0) {
            throw 'Python source compilation failed.'
          }
          $required = @(
            "$env:SOURCE_ROOT\Source\playlist_studio.py",
            "$env:SOURCE_ROOT\Source\studio_extras.py",
            "$env:SOURCE_ROOT\Source\hybrid_ui.py"
          )
          foreach($file in $required){
            if(-not(Test-Path $file)){throw "Required patched source file missing: $file"}
          }
          Write-Host 'Required patched source files: PASS'

      - name: Raw Python startup smoke test
        shell: pwsh
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          # Raw Tk/VLC can occasionally hit a hosted-runner native access violation.
          # Retry it; the packaged PyInstaller smoke test is checked separately.
          $maxAttempts = 3
          $passed = $false
          $rawVlcRoot = Join-Path $env:SOURCE_ROOT 'VLC'
          if (Test-Path $rawVlcRoot) {
            $env:VLC_PLUGIN_PATH = Join-Path $rawVlcRoot 'plugins'
            $env:PATH = $rawVlcRoot + [IO.Path]::PathSeparator + $env:PATH
          }
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            $stdout = Join-Path $env:RUNNER_TEMP "playlist-studio-raw-$attempt.stdout.log"
            $stderr = Join-Path $env:RUNNER_TEMP "playlist-studio-raw-$attempt.stderr.log"
            Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue
            $proc = Start-Process -FilePath 'python.exe' -ArgumentList 'Source\playlist_studio.py' -WorkingDirectory $env:SOURCE_ROOT -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Start-Sleep -Seconds 12
            if (-not $proc.HasExited) {
              $p = Get-Process -Id $proc.Id
              $handle = $p.MainWindowHandle
              if ($handle -ne 0) {
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                Write-Host "Raw Python startup smoke test: PASS (attempt $attempt)"
                Write-Host "Main window handle: $handle"
                $passed = $true
                break
              }
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Write-Warning "Raw Python stayed alive without a main window (attempt $attempt)."
            } else {
              $code = $proc.ExitCode
              $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
              $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
              Write-Host "--- Raw Python attempt $attempt exit code: $code ---"
              Write-Host $out
              Write-Host $err
              if ($code -ne -1073741819) {
                throw "Raw Python source exited during startup with unexpected code $code."
              }
              Write-Warning 'Raw Python hit Windows native access violation 0xC0000005; retrying.'
            }
          }
          if (-not $passed) {
            Write-Warning 'Raw Python startup smoke test did not pass after 3 attempts. Continuing to the packaged GUI smoke test.'
          }
      - name: Verify Xtream path behavior
        shell: pwsh
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          $env:PYTHONPATH = (Join-Path $env:SOURCE_ROOT 'Source')
          python -c "from bdix_integration import XtreamConfig, normalize_server, xtream_m3u_url; assert normalize_server('https://worker.example/bdix/') == 'https://worker.example/bdix'; assert normalize_server('https://worker.example/') == 'https://worker.example'; print(xtream_m3u_url(XtreamConfig(server='https://worker.example/bdix', username='u', password='p'))); print('Xtream path test: PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Xtream path behavior test failed.' }
      - name: Download and verify VLC 3.0.23 x64
        shell: pwsh
        run: |
          $url = 'https://download.videolan.org/pub/videolan/vlc/3.0.23/win64/vlc-3.0.23-win64.zip'
          $expected = '992d19dbd0b8a7cde9167d2f7780b1ef6f92acc8a71acfa736101a21f35181e1'
          $zip = Join-Path $env:RUNNER_TEMP 'vlc-3.0.23-win64.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'vlc-extract'
          $dest = Join-Path $env:SOURCE_ROOT 'VLC'

          if (Test-Path $zip) { Remove-Item $zip -Force }
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }

          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip

          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "VLC SHA-256 mismatch. Expected $expected but got $actual"
          }

          Expand-Archive -LiteralPath $zip -DestinationPath $tmp -Force
          $vlcRoot = Get-ChildItem -Path $tmp -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'libvlc.dll') } |
            Select-Object -First 1

          if (-not $vlcRoot) {
            throw 'The VLC archive did not contain libvlc.dll.'
          }

          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item -Path (Join-Path $vlcRoot.FullName '*') -Destination $dest -Recurse -Force

          if (-not (Test-Path (Join-Path $dest 'libvlc.dll'))) {
            throw 'Bundled VLC is missing libvlc.dll.'
          }
          if (-not (Test-Path (Join-Path $dest 'libvlccore.dll'))) {
            throw 'Bundled VLC is missing libvlccore.dll.'
          }
          if (-not (Test-Path (Join-Path $dest 'plugins'))) {
            throw 'Bundled VLC is missing its plugins directory.'
          }

      - name: Build and test PyInstaller setup payload
        shell: pwsh
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }
          if (Test-Path 'dist') { Remove-Item 'dist' -Recurse -Force }
          Get-ChildItem -Filter '*.spec' -File | Remove-Item -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $env:SOURCE_ROOT 'studio.ico'))) { throw 'Generated BDIX-IPTV application icon is missing before PyInstaller.' }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name 'Playlist-Studio-5.0' --icon 'studio.ico' --add-data 'VLC;VLC' --add-data 'Source\bdix_preview.png;.' Source\playlist_studio.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller setup payload build failed.' }
          $exe = Join-Path $env:SOURCE_ROOT 'dist\Playlist-Studio-5.0\Playlist-Studio-5.0.exe'
          if (-not (Test-Path $exe)) { throw 'PyInstaller setup payload executable was not produced.' }
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 15
          if ($proc.HasExited) { throw "Setup payload exited during startup with code $($proc.ExitCode)." }
          $p = Get-Process -Id $proc.Id
          $handle = $p.MainWindowHandle
          if ($handle -eq 0) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; throw 'Setup payload created no main window.' }
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class WindowHealth {
            [DllImport("user32.dll", SetLastError=true)]
            public static extern IntPtr SendMessageTimeout(IntPtr hWnd, uint Msg, IntPtr wParam, IntPtr lParam, uint fuFlags, uint uTimeout, out IntPtr lpdwResult);
          }
          '@
          $result=[IntPtr]::Zero
          $response=[WindowHealth]::SendMessageTimeout($handle,0x0000,[IntPtr]::Zero,[IntPtr]::Zero,0x0002,3000,[ref]$result)
          if ($response -eq [IntPtr]::Zero) {
            $trace=Join-Path $env:TEMP 'PlaylistStudio-stacktrace.log'
            if(Test-Path $trace){Write-Host '--- startup stack trace ---';Get-Content $trace -Raw|Write-Host}
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw 'PyInstaller payload window is not responsive after 15 seconds.'
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host 'PyInstaller setup payload startup test: PASS (responsive main window)'

      - name: Build Windows setup installer
        shell: pwsh
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          $iss = Join-Path $env:SOURCE_ROOT 'Playlist-Studio-5.0.iss'
          @"
          [Setup]
          AppName=Playlist Studio 5.0
          AppVersion=5.0.3
          AppPublisher=BDIX-IPTV
          DefaultDirName={autopf}\Playlist Studio 5.0
          DefaultGroupName=Playlist Studio 5.0
          OutputDir=$env:GITHUB_WORKSPACE
          OutputBaseFilename=Playlist-Studio-5.0-Setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64compatible
          SetupIconFile=$env:SOURCE_ROOT\studio.ico
          UninstallDisplayIcon={app}\Playlist-Studio-5.0.exe
          [Files]
          Source: "$env:SOURCE_ROOT\dist\Playlist-Studio-5.0\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion
          [Icons]
          Name: "{group}\Playlist Studio 5.0"; Filename: "{app}\Playlist-Studio-5.0.exe"
          Name: "{commondesktop}\Playlist Studio 5.0"; Filename: "{app}\Playlist-Studio-5.0.exe"
          [Run]
          Filename: "{app}\Playlist-Studio-5.0.exe"; Description: "Launch Playlist Studio 5.0"; Flags: nowait postinstall skipifsilent
          "@ | Set-Content -Path $iss -Encoding UTF8
          $iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if(-not (Test-Path $iscc)){throw 'Inno Setup 6 was not found on the Windows runner.'}
          & $iscc $iss
          if($LASTEXITCODE -ne 0){throw 'Inno Setup compilation failed.'}
          $setup=Join-Path $env:GITHUB_WORKSPACE 'Playlist-Studio-5.0-Setup.exe'
          if(-not(Test-Path $setup)){throw 'Setup executable was not produced.'}
          $size=(Get-Item $setup).Length
          $hash=(Get-FileHash -Algorithm SHA256 $setup).Hash.ToLower()
          "SETUP_SIZE=$size"|Out-File $env:GITHUB_ENV -Append
          "SETUP_SHA256=$hash"|Out-File $env:GITHUB_ENV -Append
          Write-Host "Setup: $size bytes"
          Write-Host "SHA-256: $hash"

      - name: Package setup download
        shell: pwsh
        run: |
          # The download ZIP must contain exactly one item: the final installer EXE.
          # No duplicate setup payload, folder, or checksum file is included.
          $zip = Join-Path $env:GITHUB_WORKSPACE 'Playlist-Studio-5.0-Setup.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'Playlist-Studio-5.0-Setup.exe') -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path $zip)) { throw 'Setup ZIP was not created.' }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @($archive.Entries | Where-Object { -not [string]::IsNullOrEmpty($_.Name) })
            if ($entries.Count -ne 1 -or $entries[0].Name -ne 'Playlist-Studio-5.0-Setup.exe') {
              throw "Setup ZIP must contain exactly Playlist-Studio-5.0-Setup.exe; found: $($entries.Name -join ', ')"
            }
            Write-Host "Setup ZIP verified: exactly one entry ($($entries[0].Name))."
          }
          finally {
            $archive.Dispose()
          }

      - name: Create or update v5.0.3 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v5.0.3'
          $repo='${{ github.repository }}'
          gh release view $tag --repo $repo > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --target $env:GITHUB_SHA --title "Playlist Studio 5.0" --notes "Playlist Studio 5.0.3 — BDIX-IPTV Windows installer built with PyInstaller and packaged as a single-file download ZIP."
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create Playlist Studio v5.0.3 release.' }
          }
          gh release upload $tag 'Playlist-Studio-5.0-Setup.exe' --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload Playlist Studio v5.0.3 installer EXE.' }
          gh release upload $tag 'Playlist-Studio-5.0-Setup.zip' --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload Playlist Studio v5.0.3 setup ZIP.' }

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playlist-Studio-5.0-Setup
          path: |
            Playlist-Studio-5.0-Setup.exe
            Playlist-Studio-5.0-Setup.zip
          if-no-files-found: error
          retention-days: 30
