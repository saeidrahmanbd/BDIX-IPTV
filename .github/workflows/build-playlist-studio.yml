name: Build Playlist Studio 4.0 Portable
# BDIX-IPTV feature build v4.0

on:
  workflow_dispatch:
  push:
    branches:
      - playlist-studio-3.0-portable-build
    paths:
      - 'Playlist-Studio-Fluent-Dark-v9.zip'
      - '.github/workflows/build-playlist-studio.yml'
      - 'build/feature_patch.py'
      - 'build/make_brand_assets.py'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Extract Playlist Studio source
        shell: pwsh
        run: |
          if (-not (Test-Path 'Playlist-Studio-Fluent-Dark-v9.zip')) {
            throw 'Playlist-Studio-Fluent-Dark-v9.zip was not found in the repository root.'
          }
          if (Test-Path 'buildkit') {
            Remove-Item 'buildkit' -Recurse -Force
          }
          New-Item -ItemType Directory -Path 'buildkit' | Out-Null
          Expand-Archive -LiteralPath 'Playlist-Studio-Fluent-Dark-v9.zip' -DestinationPath 'buildkit' -Force
          $src = Get-ChildItem -Path 'buildkit' -Recurse -Filter 'playlist_studio.py' -File | Select-Object -First 1
          if (-not $src) {
            throw 'playlist_studio.py was not found inside the uploaded source ZIP.'
          }
          "SOURCE_ROOT=$($src.Directory.Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Source root: $($src.Directory.Parent.FullName)"

      - name: Patch Xtream base-path handling
        shell: pwsh
        run: |
          $target = Join-Path $env:SOURCE_ROOT 'Source\bdix_integration.py'
          if (-not (Test-Path $target)) {
            throw "bdix_integration.py was not found at $target"
          }

          $text = Get-Content -LiteralPath $target -Raw
          $pattern = '(?ms)^def normalize_server\(server\):\r?\n.*?^def xtream_login\(cfg:XtreamConfig\):'
          $replacement = @"
          def normalize_server(server):
              server=server.strip()
              if not server: raise PlaylistError('Xtream server URL is required.')
              p=urllib.parse.urlsplit(server if '://' in server else 'http://' + server)
              if p.scheme not in ('http','https') or not p.hostname: raise PlaylistError('Enter a valid Xtream server URL.')
              if p.query or p.fragment: raise PlaylistError('Xtream server URL must not contain a query string or fragment.')
              path=(p.path or '').rstrip('/')
              return f'{p.scheme}://{p.netloc}{path}'

          def xtream_login(cfg:XtreamConfig):
          "@

          $patched = [regex]::Replace($text, $pattern, $replacement, 1)
          if ($patched -eq $text) {
            throw 'Xtream normalize_server() patch did not match the expected source. Build stopped to prevent an unverified binary.'
          }

          Set-Content -LiteralPath $target -Value $patched -Encoding UTF8
          $verify = Get-Content -LiteralPath $target -Raw
          if ($verify -notmatch 'path=\(p\.path or .*?\)\.rstrip\(') {
            throw 'Xtream path-preserving normalization was not found after patch.'
          }

          Write-Host 'Xtream server-path fix applied.'
          Write-Host 'Examples:'
          Write-Host '  https://worker.example/        -> https://worker.example/player_api.php'
          Write-Host '  https://worker.example/bdix    -> https://worker.example/bdix/player_api.php'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow openpyxl pyinstaller

      - name: Apply Playlist Studio feature and branding patch
        shell: pwsh
        run: |
          python "$env:GITHUB_WORKSPACE\build\feature_patch.py" "$env:SOURCE_ROOT\Source"
          python "$env:GITHUB_WORKSPACE\build\make_brand_assets.py" "$env:SOURCE_ROOT"
          $preview = Join-Path $env:SOURCE_ROOT 'bdix_preview.png'
          $icon = Join-Path $env:SOURCE_ROOT 'studio.ico'
          if (-not (Test-Path $preview)) { throw 'BDIX-IPTV preview asset was not generated.' }
          if (-not (Test-Path $icon)) { throw 'BDIX-IPTV application icon was not generated.' }
          python -c "from PIL import Image; Image.open(r'$preview').load(); Image.open(r'$icon').load(); print('Brand assets: PASS')"

      - name: Validate Python source
        shell: pwsh
        run: |
          python -m compileall -q "$env:SOURCE_ROOT\Source"
          if ($LASTEXITCODE -ne 0) {
            throw 'Python source compilation failed.'
          }

      - name: Verify Xtream path behavior
        shell: pwsh
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          $env:PYTHONPATH = (Join-Path $env:SOURCE_ROOT 'Source')
          python -c "from bdix_integration import XtreamConfig, normalize_server, xtream_m3u_url; assert normalize_server('https://worker.example/bdix/') == 'https://worker.example/bdix'; assert normalize_server('https://worker.example/') == 'https://worker.example'; print(xtream_m3u_url(XtreamConfig(server='https://worker.example/bdix', username='u', password='p'))); print('Xtream path test: PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Xtream path behavior test failed.' }
      - name: Download and verify VLC 3.0.23 x64
        shell: pwsh
        run: |
          $url = 'https://download.videolan.org/pub/videolan/vlc/3.0.23/win64/vlc-3.0.23-win64.zip'
          $expected = '992d19dbd0b8a7cde9167d2f7780b1ef6f92acc8a71acfa736101a21f35181e1'
          $zip = Join-Path $env:RUNNER_TEMP 'vlc-3.0.23-win64.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'vlc-extract'
          $dest = Join-Path $env:SOURCE_ROOT 'VLC'

          if (Test-Path $zip) { Remove-Item $zip -Force }
          if (Test-Path $tmp) { Remove-Item $tmp -Recurse -Force }
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }

          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $zip

          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "VLC SHA-256 mismatch. Expected $expected but got $actual"
          }

          Expand-Archive -LiteralPath $zip -DestinationPath $tmp -Force
          $vlcRoot = Get-ChildItem -Path $tmp -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'libvlc.dll') } |
            Select-Object -First 1

          if (-not $vlcRoot) {
            throw 'The VLC archive did not contain libvlc.dll.'
          }

          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item -Path (Join-Path $vlcRoot.FullName '*') -Destination $dest -Recurse -Force

          if (-not (Test-Path (Join-Path $dest 'libvlc.dll'))) {
            throw 'Bundled VLC is missing libvlc.dll.'
          }
          if (-not (Test-Path (Join-Path $dest 'libvlccore.dll'))) {
            throw 'Bundled VLC is missing libvlccore.dll.'
          }

      - name: Build standard Windows application
        shell: pwsh
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }
          if (Test-Path 'dist') { Remove-Item 'dist' -Recurse -Force }
          Get-ChildItem -Filter '*.spec' -File | Remove-Item -Force -ErrorAction SilentlyContinue

          python -m PyInstaller --noconfirm --clean --onedir --windowed --name 'Playlist-Studio-4.0-Fluent-Dark' --icon 'studio.ico' --add-data 'VLC;VLC' Source\playlist_studio.py

          $app = Join-Path $env:SOURCE_ROOT 'dist\Playlist-Studio-4.0-Fluent-Dark'
          $exe = Join-Path $app 'Playlist-Studio-4.0-Fluent-Dark.exe'
          if (-not (Test-Path $exe)) { throw 'PyInstaller did not produce the standard application.' }
          $size = (Get-ChildItem $app -Recurse -File | Measure-Object Length -Sum).Sum
          if ($size -lt 10000000) { throw "Application output is unexpectedly small: $size bytes" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          "EXE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows installer
        shell: pwsh
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          $iss = Join-Path $env:RUNNER_TEMP 'Playlist-Studio-4.0.iss'
          $source = Join-Path $env:SOURCE_ROOT 'dist\Playlist-Studio-4.0-Fluent-Dark'
          $output = Join-Path $env:GITHUB_WORKSPACE 'installer-output'
          if (Test-Path $output) { Remove-Item $output -Recurse -Force }
          New-Item -ItemType Directory -Path $output | Out-Null
          @'
          #define MyAppName "BDIX-IPTV Playlist Studio"
          #define MyAppVersion "4.0.0"
          #define MyAppPublisher "BDIX-IPTV"
          #define MyAppExeName "Playlist-Studio-4.0-Fluent-Dark.exe"
          [Setup]
          AppId={{B1D1X-IPTV-PS4-2026}}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={autopf}\BDIX-IPTV\Playlist Studio
          DefaultGroupName=BDIX-IPTV\Playlist Studio
          OutputDir=__OUTPUT__
          OutputBaseFilename=BDIX-IPTV-Playlist-Studio-4.0-Setup
          SetupIconFile=__ICON__
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=admin
          UninstallDisplayIcon={app}\{#MyAppExeName}
          [Files]
          Source: "__SOURCE__\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{group}\BDIX-IPTV Playlist Studio"; Filename: "{app}\{#MyAppExeName}"
          Name: "{commondesktop}\BDIX-IPTV Playlist Studio"; Filename: "{app}\{#MyAppExeName}"
          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Launch BDIX-IPTV Playlist Studio"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path $iss -Encoding UTF8
          $text = Get-Content $iss -Raw
          $text = $text.Replace('__OUTPUT__',$output).Replace('__ICON__',(Join-Path $env:SOURCE_ROOT 'studio.ico')).Replace('__SOURCE__',$source)
          Set-Content $iss $text -Encoding UTF8
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler is not available on the GitHub runner.' }
          & $iscc $iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          $setup = Join-Path $output 'BDIX-IPTV-Playlist-Studio-4.0-Setup.exe'
          if (-not (Test-Path $setup)) { throw 'Installer was not produced.' }
          $setupHash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLower()
          "BDIX-IPTV Playlist Studio 4.0`nStandard Windows installer.`nSHA-256:`n$setupHash" | Set-Content (Join-Path $output 'SHA256.txt') -Encoding UTF8

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BDIX-IPTV-Playlist-Studio-4.0-Setup
          path: ${{ github.workspace }}\installer-output\*
          if-no-files-found: error
          retention-days: 30

      - name: Create or update v4.0.0 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v4.0.0'
          $repo='${{ github.repository }}'
          gh release view $tag --repo $repo > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --target $env:GITHUB_SHA --title 'Playlist Studio v4.0' --notes 'BDIX-IPTV Playlist Studio 4.0 — standard Windows installer.'
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create Playlist Studio v4.0 release.' }
          }
          gh release upload $tag "$env:GITHUB_WORKSPACE\installer-output\BDIX-IPTV-Playlist-Studio-4.0-Setup.exe" --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload Playlist Studio 4.0 installer.' }
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playlist-Studio-4.0-Portable
          path: Playlist-Studio-4.0-Portable.zip
          if-no-files-found: error
          retention-days: 30
