name: IPTV Logo Publication Guard
on:
  workflow_run:
    workflows: ["IPTV Playlist Update"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bdix-iptv-logo-publication
  cancel-in-progress: false
jobs:
  logos:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Repair and stage local logos
        run: python scripts/repair_playlist_logos.py
      - name: Validate local logo references
        run: python scripts/validate_local_logos.py
      - name: Publish logo-only correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPTV-Playlist.m3u logos/ reports/playlist-logo-repair-results.md reports/logo-source-registry.json
          if git diff --cached --quiet; then echo 'No logo changes to publish.'; exit 0; fi
          git commit -m 'Repair IPTV metadata and local logos only; leave stream URLs unchanged'
          git push origin HEAD:main
