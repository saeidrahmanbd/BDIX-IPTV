name: Restore normalize_metadata safely
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-normalize-metadata.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full normalizer and clean legacy custom IDs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          # Restore the complete pre-edit normalizer, then make only the
          # intentional canonical-ID substitution.
          git checkout 676aff2adff507e75a3e5f5029e0d16007b6729f -- scripts/normalize_metadata.py
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/normalize_metadata.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('"Channel S UK": "custom.channel.s.uk"', '"Channel S UK": "ChannelS.uk@679aa9"')
          p.write_text(s, encoding='utf-8')
          PY

          # Remove obsolete custom.* aliases from the active EPG alias table
          # and move the Channel S UK lock to its canonical identity.
          python - <<'PY'
          from pathlib import Path
          import ast
          p=Path('scripts/epg_coverage.py')
          text=p.read_text(encoding='utf-8')
          tree=ast.parse(text)
          aliases_node=next(n for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='EPG_ALIASES' for t in n.targets))
          locks_node=next(n for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='EPG_LOCKS' for t in n.targets))
          aliases=ast.literal_eval(aliases_node.value)
          locks=ast.literal_eval(locks_node.value)
          aliases={k:v for k,v in aliases.items() if not k.lower().startswith('custom.')}
          if 'custom.channel.s.uk' in locks:
              locks['ChannelS.uk@679aa9']=locks.pop('custom.channel.s.uk')
          lines=text.splitlines(True)
          def replace_node(src, node, name, value):
              lines=src.splitlines(True)
              start=node.lineno-1; end=node.end_lineno
              lines[start:end]=[name+' = '+repr(value)+'\n']
              return ''.join(lines)
          text=replace_node(text, aliases_node, 'EPG_ALIASES', aliases)
          tree=ast.parse(text)
          locks_node=next(n for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='EPG_LOCKS' for t in n.targets))
          text=replace_node(text, locks_node, 'EPG_LOCKS', locks)
          p.write_text(text,encoding='utf-8')
          PY

          python -m py_compile scripts/normalize_metadata.py scripts/epg_coverage.py

          rm .github/workflows/restore-normalize-metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/normalize_metadata.py scripts/epg_coverage.py .github/workflows/restore-normalize-metadata.yml
          git commit -m 'Restore metadata normalizer and remove legacy custom EPG IDs'
          git push origin main
