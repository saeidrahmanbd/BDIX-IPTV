name: Automation V2 Candidate Bundle

on:
  push:
    branches:
      - main
    paths:
      - 'automation/core/**'
      - 'automation/engines/**'
      - 'scripts/run_automation_v2_candidate_bundle.py'
      - '.github/workflows/automation-v2-candidate-bundle.yml'
  schedule:
    # 09:30 Asia/Dhaka, after the legacy 09:00 EPG refresh; shadow only.
    - cron: '30 3 * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Automation V2 Stale Bundle Lock Recovery
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: automation-v2-state-store
  cancel-in-progress: false

jobs:
  candidate-bundle:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require the protected main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "The V2 shadow runner only executes from main."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Build and stage the three-engine candidate bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTOMATION_V2_STATE_BRANCH: automation-v2-state
          AUTOMATION_V2_REQUIRE_REMOTE_HEAD_CHECK: "1"
        run: >-
          python scripts/run_automation_v2_candidate_bundle.py
          --baseline-commit "${{ github.sha }}"
          --epg-timeout-seconds 2400
          --probe-timeout-seconds 8
      - name: Audit logo references without modifying assets
        if: always()
        run: |
          python scripts/audit_logo_references.py --output reports/automation-v2/candidate-logo-reference-audit.json
      - name: Build conservative logo repair proposals
        if: always()
        run: |
          python scripts/build_automation_v2_logo_repair_candidates.py
      - name: Build explicitly approved logo-repair playlist candidates
        if: always()
        run: |
          python scripts/apply_automation_v2_approved_logo_candidates.py
      - name: Build read-only candidate diagnostics snapshot
        if: always()
        run: |
          python scripts/build_automation_v2_diagnostics_snapshot.py
      - name: Render read-only candidate dashboard
        if: always()
        run: |
          if [ -f reports/automation-v2/candidate-diagnostics-snapshot.json ]; then
            python scripts/render_automation_v2_candidate_dashboard.py
          fi
      - name: Upload candidate bundle and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automation-v2-candidate-bundle
          path: |
            reports/automation-v2/candidate-run.json
            reports/automation-v2/candidate-logo-reference-audit.json
            reports/automation-v2/logo-repair-candidates.json
            reports/automation-v2/candidate-diagnostics-snapshot.json
            reports/automation-v2/candidate-dashboard.md
            reports/automation-v2/candidates/transactions/
          if-no-files-found: warn
          retention-days: 14
