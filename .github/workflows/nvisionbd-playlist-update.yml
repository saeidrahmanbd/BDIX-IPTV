name: NVisionBD Playlist Update

on:
  push:
    branches: [main]
    paths:
      - NVisionBD-Playlist.m3u
  schedule:
    - cron: '32 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bdix-iptv-nvision-reports
  cancel-in-progress: true

jobs:
  maintain:
    if: ${{ !(github.actor == 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'Run NVisionBD playlist maintenance')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Audit playlist and check stream health
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures
          import json
          import re
          import time
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          playlist = Path("NVisionBD-Playlist.m3u")
          audit_path = Path("reports/nvisionbd-playlist-audit.md")
          health_path = Path("reports/nvisionbd-stream-health.md")
          history_path = Path("reports/nvisionbd-maintenance-history.json")
          if not playlist.is_file():
              raise SystemExit("NVisionBD-Playlist.m3u not found")
          lines = playlist.read_text(encoding="utf-8-sig").replace("\r", "").splitlines()
          attr_re = re.compile(r'([A-Za-z0-9_-]+)="([^"]*)"')
          rows = []
          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF:"):
                  continue
              attrs = dict(attr_re.findall(line))
              name = line.rsplit(",", 1)[-1].strip() if "," in line else "(unnamed)"
              url = ""
              for nxt in lines[i + 1:]:
                  if nxt.strip():
                      if nxt.strip().lower().startswith(("http://", "https://")):
                          url = nxt.strip()
                      break
              rows.append({"line": i + 1, "name": name, "attrs": attrs, "url": url, "raw": line})

          groups = Counter(r["attrs"].get("group-title", "").strip() or "(no group)" for r in rows)
          urls = defaultdict(list)
          ids = defaultdict(list)
          missing_id, missing_logo, missing_number, malformed = [], [], [], []
          for r in rows:
              if r["url"]:
                  urls[r["url"]].append(r)
              a = r["attrs"]
              identity = (a.get("tvg-id") or a.get("channel-id") or "").strip().lower()
              if identity:
                  ids[identity].append(r)
              if not identity:
                  missing_id.append(r["name"])
              if not a.get("tvg-logo", "").strip():
                  missing_logo.append(r["name"])
              if not a.get("tvg-chno", "").strip():
                  missing_number.append(r["name"])
              if not r["url"]:
                  malformed.append(f"Line {r['line']}: missing HTTP(S) stream URL")
              if r["raw"].count('"') % 2:
                  malformed.append(f"Line {r['line']}: unbalanced quotes")
          duplicate_urls = {u: rr for u, rr in urls.items() if len(rr) > 1}
          duplicate_ids = {k: rr for k, rr in ids.items() if len(rr) > 1}

          def redact(url):
              return re.sub(r'([?&](?:token|sig|signature|jwt|session|key|authorization|hdnts)=[^&\\s]+)',
                            lambda m: m.group(1).split("=", 1)[0] + "=[REDACTED]", url, flags=re.I)

          def probe(url):
              start = time.monotonic()
              try:
                  req = Request(url, headers={"User-Agent": "BDIX-IPTV-NVisionBD-Health/1.0",
                                              "Range": "bytes=0-2047", "Accept": "*/*"})
                  with urlopen(req, timeout=8) as response:
                      response.read(2048)
                      code = getattr(response, "status", 200)
                  return {"url": url, "status": "Responsive", "http": code,
                          "ms": round((time.monotonic()-start)*1000), "detail": ""}
              except HTTPError as e:
                  code = e.code
                  status = "Restricted" if code in (401, 403, 407, 429) else ("Dead" if code in (404, 410) else "Unverified")
                  return {"url": url, "status": status, "http": code,
                          "ms": round((time.monotonic()-start)*1000), "detail": f"HTTP {code}"}
              except (URLError, TimeoutError, OSError) as e:
                  return {"url": url, "status": "Unverified", "http": 0,
                          "ms": round((time.monotonic()-start)*1000), "detail": type(e).__name__}
              except Exception as e:
                  return {"url": url, "status": "Unverified", "http": 0,
                          "ms": round((time.monotonic()-start)*1000), "detail": type(e).__name__}

          unique_urls = list(urls)
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as pool:
              health = list(pool.map(probe, unique_urls))
          counts = Counter(x["status"] for x in health)
          now = datetime.now(timezone.utc).isoformat(timespec="seconds")
          audit = [
              "# NVisionBD Playlist Audit", "", f"Generated (UTC): **{now}**", "",
              "## Summary", "",
              f"- Playlist entries: **{len(rows)}**",
              f"- Unique stream URLs: **{len(unique_urls)}**",
              f"- Duplicate stream URLs: **{len(duplicate_urls)}**",
              f"- Duplicate channel identities: **{len(duplicate_ids)}**",
              f"- Missing channel IDs: **{len(missing_id)}**",
              f"- Missing logos: **{len(missing_logo)}**",
              f"- Missing channel numbers: **{len(missing_number)}**",
              f"- Malformed entries: **{len(malformed)}**", "",
              "## Group Counts", ""
          ]
          audit += [f"- {group}: **{count}**" for group, count in sorted(groups.items(), key=lambda x: x[0].casefold())]
          audit += ["", "## Stream Probe Summary", ""]
          audit += [f"- {label}: **{counts.get(label, 0)}**" for label in ("Responsive", "Restricted", "Dead", "Unverified")]
          audit += ["", "## Duplicate Stream URLs", ""]
          audit += [f"- {', '.join(sorted({r['name'] for r in rr})[:8])}: {redact(url)}"
                    for url, rr in sorted(duplicate_urls.items())] or ["None."]
          audit += ["", "## Duplicate Channel Identities", ""]
          audit += [f"- {identity}: {', '.join(sorted({r['name'] for r in rr})[:8])}"
                    for identity, rr in sorted(duplicate_ids.items())] or ["None."]
          audit += ["", "## Missing Metadata", "",
                    f"- Missing ID: {', '.join(missing_id[:50]) or 'None'}",
                    f"- Missing logo: {', '.join(missing_logo[:50]) or 'None'}",
                    f"- Missing channel number: {', '.join(missing_number[:50]) or 'None'}",
                    "", "## Malformed Entries", ""] + (["- " + x for x in malformed[:100]] or ["None."])
          health_lines = [
              "# NVisionBD Stream Health", "", f"Generated (UTC): **{now}**", "",
              "Connectivity probes are diagnostic only. A failed request does not prove a stream is permanently dead; provider restrictions, network routing, and transient timeouts can cause false negatives.",
              "", f"- Unique URLs tested: **{len(health)}**", ""
          ]
          for label in ("Responsive", "Restricted", "Dead", "Unverified"):
              health_lines.append(f"- {label}: **{counts.get(label, 0)}**")
          health_lines += ["", "## Results", ""]
          health_lines += [f"- **{x['status']}** — {', '.join(sorted({r['name'] for r in urls[x['url']]})[:5])} — {x['detail'] or ('HTTP ' + str(x['http']))} — {x['ms']} ms — {redact(x['url'])}"
                           for x in sorted(health, key=lambda item: (item["status"], item["url"]))]
          audit_path.parent.mkdir(parents=True, exist_ok=True)
          audit_path.write_text("\n".join(audit) + "\n", encoding="utf-8")
          health_path.write_text("\n".join(health_lines) + "\n", encoding="utf-8")
          history = []
          if history_path.exists():
              try:
                  history = json.loads(history_path.read_text(encoding="utf-8"))
              except Exception:
                  history = []
          if not isinstance(history, list):
              history = []
          history.append({"timestamp_utc": now, "entries": len(rows), "unique_urls": len(unique_urls),
                          "status_counts": dict(counts), "duplicate_urls": len(duplicate_urls),
                          "duplicate_ids": len(duplicate_ids), "missing_ids": len(missing_id),
                          "missing_logos": len(missing_logo), "missing_numbers": len(missing_number),
                          "malformed": len(malformed)})
          history_path.write_text(json.dumps(history[-180:], indent=2) + "\n", encoding="utf-8")
          print(f"NVisionBD Playlist Update: entries={len(rows)} unique_urls={len(unique_urls)} "
                f"responsive={counts.get('Responsive',0)} restricted={counts.get('Restricted',0)} "
                f"dead_http={counts.get('Dead',0)} unverified={counts.get('Unverified',0)}")
          PY

      - name: Commit NVisionBD audit reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/nvisionbd-playlist-audit.md reports/nvisionbd-stream-health.md reports/nvisionbd-maintenance-history.json
          if git diff --cached --quiet; then
            echo "No NVisionBD report changes."
            exit 0
          fi
          git commit -m 'Run NVisionBD playlist maintenance'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
