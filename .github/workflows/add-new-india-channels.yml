name: Add New India Channels
on:
  push:
    paths:
      - ".github/workflows/add-new-india-channels.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download missing repository logos
        run: |
          set -e
          curl -L --fail --retry 3 -o logos/b4u-bhojpuri.png "https://i.imgur.com/NwOQUDp.png"
          curl -L --fail --retry 3 -o logos/dd-madhya-pradesh.png "https://dtil.tmsimg.com/assets/s142790_ld_h15_aa.png?lock=720x540"
          curl -L --fail --retry 3 -o logos/etv-plus.png "https://xstreamcp-assets-msp.streamready.in/assets/LIVETV/LIVECHANNEL/LIVETV_LIVETVCHANNEL_ETV_PLUS/images/LOGO_HD/image.png"
          curl -L --fail --retry 3 -o logos/etv-telugu.png "https://xstreamcp-assets-msp.streamready.in/assets/LIVETV/LIVECHANNEL/LIVETV_LIVETVCHANNEL_ETV_TELUGU/images/LOGO_HD/image.png"
      - name: Add New Channels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("IPTV-Playlist.m3u")
          text = path.read_text(encoding="utf-8-sig")
          entries = [
            ("B4UBhojpuri.in@SD","B4U Bhojpuri","hin;bho","b4u-bhojpuri.png","Indian Movies","https://cdnb4u.wiseplayout.com/B4U_Bhojpuri/master.m3u8"),
            ("AnjanTV.in@SD","Anjan TV","hin","anjan-tv-1080p-4cbe8bff61.png","Indian Entertainment","https://anjan.vstream.online/anjanorg/ngrp:anjan_hdall/playlist.m3u8"),
            ("AsianetMovies.in@HD","Asianet Movies HD","mal","asianet-movies.png","Indian Movies","https://da86m1sqpm3o0.cloudfront.net/28072023/smil:asianetmovies1.smil/playlist.m3u8"),
            ("ColorsGujarati.in@SD","Colors Gujarati","guj","colors-gujarati-360p-c82f072793.png","Indian Entertainment","https://raw.githubusercontent.com/amazeyourself/adaptive-streams/refs/heads/main/streams/in/YuppTV/ColorsGujarati.m3u8"),
            ("ColorsKannada.in@HD","Colors Kannada HD","kan","colors-kannada.png","Indian Entertainment","https://da86m1sqpm3o0.cloudfront.net/28072023/smil:colorskannadahd1.smil/playlist.m3u8"),
            ("ColorsMarathi.in@HD","Colors Marathi HD","mar","colors-marathi.png","Indian Entertainment","https://da86m1sqpm3o0.cloudfront.net/28072023/smil:colorsmarathihd.smil/playlist.m3u8"),
            ("ColorsTamil.in@HD","Colors Tamil HD","tam","colors-tamil.png","Indian Entertainment","https://da86m1sqpm3o0.cloudfront.net/28072023/smil:colorstamilhd11.smil/playlist.m3u8"),
            ("DangalTV.in@SD","Dangal TV","hin","dangal-tv.png","Indian Entertainment","https://live-dangal.akamaized.net/liveabr/playlist.m3u8"),
            ("DDMadhyaPradesh.in@SD","DD Madhya Pradesh","hin","dd-madhya-pradesh.png","Indian Entertainment","https://mumbai-edge.smartplaytv.in/ddmadhyapradesh/index.m3u8"),
            ("DDTamil.in@HD","DD Tamil HD","tam","dd-tamil.png","Indian Entertainment","https://d2lk5u59tns74c.cloudfront.net/out/v1/abf46b14847e45499f4a47f3a9afe93d/index.m3u8"),
            ("DhoomMusic.in@SD","Dhoom Music","hin","dhoom-music-576p-ba62bd030a.png","Indian Music","https://cdn.pishow.tv/ott/live/1456/master.m3u8"),
            ("ETVBeats.in@HD","ETV Beats","tel","etv-beats-1080p-aa1d38c3fd.png","Indian Music","https://jmp2.uk/stvp-IN4900002RV"),
            ("ETVCinema.in@HD","ETV Cinema HD","tel","etv-cinema.png","Indian Movies","https://d27zlkxhgwrfgo.cloudfront.net/v1/master/9d43eacaed199f8d5883927e7aef514a8a08e108/ETV_CINEMA_H264_cloud_in/index.m3u8"),
            ("ETVPlus.in@HD","ETV Plus HD","tel","etv-plus.png","Indian Entertainment","https://d12ee3o8yfkkhd.cloudfront.net/c6a4b411295f47f48c908d2ac0605bad/index.m3u8"),
            ("ETVTelugu.in@HD","ETV Telugu HD","tel","etv-telugu.png","Indian Entertainment","https://d27zlkxhgwrfgo.cloudfront.net/v1/master/9d43eacaed199f8d5883927e7aef514a8a08e108/ETV_HD_H264_cloud_in/index.m3u8"),
            ("MahaMovie.in@SD","Maha Movie","hin","maha-movie-576p-f2d5f48b5c.png","Indian Movies","https://cdn.pishow.tv/ott/live/10007/master.m3u8"),
            ("MazhavilManorama.in@HD","Mazhavil Manorama HD","mal","mazhavil-manorama.png","Indian Entertainment","https://mmtv-vglivessai.akamaized.net/v1/master/673630b269b766886555eebfddd4f27f3de3ab50/f8a0827f-030f-4a0d-b7e5-338996c09a5b/index.m3u8"),
            ("PTCPunjabi.in@HD","PTC Punjabi HD","pan","ptc-punjabi.png","Indian Entertainment","https://d3qs3d2rkhfqrt.cloudfront.net/out/v1/3e22a9c278db4e3eb779afd42e41b0a6/index.m3u8"),
            ("RajMusixTelugu.in@SD","Raj Musix Telugu","tel","raj-musix-telugu-720p-e8fd0fb178.png","Indian Music","https://cdn.pishow.tv/ott/live/1213/master.m3u8"),
            ("SonyMarathi.in@SD","Sony Marathi","mar","sony-marathi-1080p-b7d60749ce.png","Indian Entertainment","https://cloudplay-sonyliv.pages.dev/marathi.m3u8"),
            ("SonyPal.in@SD","Sony Pal","hin","sony-pal-1080p-f991ee016e.png","Indian Entertainment","https://cloudplay-sonyliv.pages.dev/pal.m3u8"),
            ("SonyPix.in@HD","Sony Pix HD","eng;hin","sony-pix-hd.png","Indian Movies","https://cloudplay-sonyliv.pages.dev/pixhd.m3u8"),
            ("SonyWah.in@SD","Sony Wah","hin","sony-wah-1080p-f9b1aee1df.png","Indian Movies","https://cloudplay-sonyliv.pages.dev/wah.m3u8"),
            ("StarMaa.in@HD","Star Maa HD","tel","star-maa.png","Indian Entertainment","https://da86m1sqpm3o0.cloudfront.net/28072023/smil:starmaa1.smil/chunklist_b2628000.m3u8"),
            ("StarMaaMovies.in@HD","Star Maa Movies HD","tel","star-maa-movies.png","Indian Movies","https://da86m1sqpm3o0.cloudfront.net/28072023/smil:maamovies.smil/chunklist_b2628000.m3u8"),
            ("StarPravah.in@HD","Star Pravah HD","mar","star-pravah.png","Indian Entertainment","https://da86m1sqpm3o0.cloudfront.net/28072023/smil:starpravah.smil/chunklist_b1928000.m3u8"),
            ("ZeeTamil.in@HD","Zee Tamil HD","tam","zee-tamil.png","Indian Entertainment","https://da86m1sqpm3o0.cloudfront.net/28072023/smil:zeetamil1.smil/playlist.m3u8"),
          ]
          ids = {re.search(r'tvg-id="([^"]+)"', line).group(1) for line in text.splitlines() if line.startswith("#EXTINF") and re.search(r'tvg-id="([^"]+)"', line)}
          entries = [e for e in entries if e[0] not in ids]
          cats = re.search(r'(#PLAYLIST-STUDIO-CATEGORIES:\[)([^\]]*)(\])', text)
          if cats and '"New Channels"' not in cats.group(0):
              text = text[:cats.start()] + cats.group(1) + cats.group(2) + ', "New Channels"' + cats.group(3) + text[cats.end():]
          maxch = max([int(x) for x in re.findall(r'tvg-chno="(\d+)"', text)] or [1000])
          start = max(maxch + 1, 1001)
          blocks=[]
          for n,(cid,name,lang,logo,group,url) in enumerate(entries,start):
              logo_url=f"https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/{logo}"
              blocks.append(f'#EXTINF:-1 tvg-id="{cid}" tvg-name="{name}" tvg-logo="{logo_url}" tvg-chno="{n}" channel-id="{cid}" tvg-language="{lang}" tvg-country="IN" group-title="New Channels",{name}\n{url}')
          if blocks:
              text=text.rstrip()+"\n\n"+"\n".join(blocks)+"\n"
              path.write_text(text,encoding="utf-8")
          print(f"Added {len(entries)} new channels; skipped {len(ids)} existing IDs; channel numbers {start}-{start+len(entries)-1 if entries else start-1}")
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path("IPTV-Playlist.m3u").read_text(encoding="utf-8")
          lines=t.splitlines()
          new=[l for l in lines if l.startswith("#EXTINF") and 'group-title="New Channels"' in l]
          print("New Channels:",len(new))
          ids=[re.search(r'tvg-id="([^"]+)"',l).group(1) for l in new]
          nums=[re.search(r'tvg-chno="([^"]+)"',l).group(1) for l in new]
          print("Unique IDs:",len(set(ids)),"Unique chno:",len(set(nums)))
          assert len(new)==27 and len(set(ids))==27 and len(set(nums))==27
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPTV-Playlist.m3u logos/b4u-bhojpuri.png logos/dd-madhya-pradesh.png logos/etv-plus.png logos/etv-telugu.png
          git diff --cached --quiet && exit 0
          git commit -m "Add 27 vetted India channels [skip ci]"
          git push
