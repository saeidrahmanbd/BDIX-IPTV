name: One-off Complete Cleanup of Removed Channels

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bdix-iptv-one-off-remove
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove exact channel blocks and stale fallback artifacts
        shell: python
        run: |
          from pathlib import Path
          import json, re

          names = {
              'bollywood 4u', 'aap ki adalat', 'cmac tv', 'fox 5',
              'icon film channel', 'pix11', 'popflix', '60 days in',
              'deadly women', 'highway thru hell', 'mini', 'tvc arabic kids',
              'mundial'
          }

          def norm(s):
              return re.sub(r'\s+', ' ', s.strip().casefold())

          playlist = Path('IPTV-Playlist.m3u')
          text = playlist.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          out = []
          removed = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.startswith('#EXTINF:'):
                  block = [line]
                  j = i + 1
                  while j < len(lines) and not lines[j].startswith('#EXTINF:'):
                      block.append(lines[j])
                      j += 1
                  m = re.search(r'tvg-name="([^"]*)"', line)
                  channel = norm(m.group(1) if m else line.split(',', 1)[-1])
                  if channel in names:
                      removed.append(channel)
                  else:
                      out.extend(block)
                  i = j
              else:
                  out.append(line)
                  i += 1
          playlist.write_text(''.join(out), encoding='utf-8')

          # Remove repository-local generated fallback assets for the removed identities.
          safe_names = {
              'bollywood 4u':'bollywood-4u', 'aap ki adalat':'aap-ki-adalat',
              'cmac tv':'cmac-tv', 'fox 5':'fox-5', 'icon film channel':'icon-film-channel',
              'pix11':'pix-11', 'popflix':'popflix', '60 days in':'60-days-in',
              'deadly women':'deadly-women', 'highway thru hell':'highway-thru-hell',
              'mini':'mini', 'tvc arabic kids':'tvc-arabic-kids', 'mundial':'mundial'
          }
          for channel, safe in safe_names.items():
              for p in Path('logos').glob(f'generated-fallback-{safe}.*'):
                  p.unlink()

          # Remove their provenance entries from the JSON registry.
          reg = Path('reports/logo-source-registry.json')
          if reg.exists():
              data = json.loads(reg.read_text(encoding='utf-8'))
              clean = {}
              for key, value in data.items():
                  if any(f'|{name}|' in key.casefold() for name in names):
                      continue
                  clean[key] = value
              reg.write_text(json.dumps(clean, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Remove the deleted identities from the identity index when present.
          ident = Path('reports/channel-identity-index.json')
          if ident.exists():
              data = json.loads(ident.read_text(encoding='utf-8'))
              clean = {}
              for key, value in data.items():
                  names_in = [norm(x) for x in value.get('names', [])] if isinstance(value, dict) else []
                  if norm(key) in names or any(x in names for x in names_in):
                      continue
                  clean[key] = value
              ident.write_text(json.dumps(clean, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Remove these identities from the India EPG mapping/report where they occur.
          epg = Path('reports/epg-india-channel-mapping.csv')
          if epg.exists():
              rows = epg.read_text(encoding='utf-8').splitlines(keepends=True)
              epg.write_text(''.join(r for r in rows if not any(norm(name) in norm(r) for name in names)), encoding='utf-8')

          # Remove the deleted identities from the maintenance removal set so the repository
          # no longer treats them as channels requiring future repair.
          fix = Path('scripts/final_iptv_playlist_fixes.py')
          if fix.exists():
              s = fix.read_text(encoding='utf-8')
              for name in sorted(names):
                  s = re.sub(rf'^\s*"{re.escape(name)}",\s*\n', '', s, flags=re.I | re.M)
              fix.write_text(s, encoding='utf-8')

          print('Removed active entries:', sorted(set(removed)))
          print('Requested identities absent from active playlist:', not any(norm(x) in {norm(re.search(r'tvg-name="([^"]*)"', b).group(1)) for b in re.findall(r'#EXTINF:[^\n]*\n(?:[^#\n].*\n?)*', playlist.read_text(encoding='utf-8')) if re.search(r'tvg-name="([^"]*)"', b)} for x in names))

      - name: Verify requested identities are absent from active playlist
        shell: python
        run: |
          import re
          from pathlib import Path
          names = {'bollywood 4u','aap ki adalat','cmac tv','fox 5','icon film channel','pix11','popflix','60 days in','deadly women','highway thru hell','mini','tvc arabic kids','mundial'}
          text = Path('IPTV-Playlist.m3u').read_text(encoding='utf-8')
          active = set()
          for line in text.splitlines():
              if line.startswith('#EXTINF:'):
                  m = re.search(r'tvg-name="([^"]*)"', line)
                  active.add((m.group(1) if m else line.split(',',1)[-1]).strip().casefold())
          remain = sorted(names & active)
          if remain:
              raise SystemExit(f'Cleanup failed; active targets remain: {remain}')
          print('Verified all 13 requested identities are absent from IPTV-Playlist.m3u.')

      - name: Validate M3U structure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('IPTV-Playlist.m3u')
          t=p.read_text(encoding='utf-8')
          if not t.startswith('#EXTM3U'):
              raise SystemExit('Missing #EXTM3U header')
          entries=t.count('#EXTINF:')
          urls=sum(1 for line in t.splitlines() if line.startswith(('http://','https://')))
          if entries != urls:
              raise SystemExit(f'Entry/URL mismatch: entries={entries}, urls={urls}')
          print(f'Validated M3U structure: entries={entries}, urls={urls}')
          PY

      - name: Verify no removed fallback assets remain
        run: |
          ! find logos -maxdepth 1 -type f \( -iname 'generated-fallback-bollywood-4u.*' -o -iname 'generated-fallback-aap-ki-adalat.*' -o -iname 'generated-fallback-cmac-tv.*' -o -iname 'generated-fallback-fox-5.*' -o -iname 'generated-fallback-icon-film-channel.*' -o -iname 'generated-fallback-pix-11.*' -o -iname 'generated-fallback-popflix.*' -o -iname 'generated-fallback-60-days-in.*' -o -iname 'generated-fallback-deadly-women.*' -o -iname 'generated-fallback-highway-thru-hell.*' -o -iname 'generated-fallback-mini.*' -o -iname 'generated-fallback-tvc-arabic-kids.*' -o -iname 'generated-fallback-mundial.*' \) | grep .

      - name: Commit cleanup and remove one-off workflow
        run: |
          rm -f .github/workflows/one-off-remove-fallback-channels.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A IPTV-Playlist.m3u logos reports scripts .github/workflows/one-off-remove-fallback-channels.yml
          git diff --cached --quiet && { echo 'No cleanup change produced.'; exit 1; }
          git commit -m 'Complete cleanup of removed fallback channels'
          git push origin HEAD:main
