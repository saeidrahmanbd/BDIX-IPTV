name: International Playlist Audit

on:
  push:
    branches: [main]
    paths:
      - International-Playlist.m3u
      - scripts/repair_international_playlist.py
      - scripts/classify_international_backups.py
      - logos/international/**
      - .github/workflows/international-playlist-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: international-playlist-writer
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Audit and repair International playlist
        run: python scripts/repair_international_playlist.py

      - name: Classify remaining orphan backups
        run: python scripts/classify_international_backups.py

      - name: Validate playlist integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s International-Playlist.m3u
          grep -q '^#EXTM3U' International-Playlist.m3u
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          p=Path('International-Playlist.m3u')
          lines=p.read_text(encoding='utf-8-sig').splitlines()
          urls=[x.strip().casefold() for x in lines if x.strip().startswith(('http://','https://'))]
          dup=[u for u,n in Counter(urls).items() if n>1]
          forbidden=[]
          backups=[]
          backup_re=re.compile(r'group-title\s*=\s*(?:"Backup"|\'Backup\'|Backup)(?=\s|,|$)',re.I)
          staging_re=re.compile(r'group-title\s*=\s*(?:"(?:New Channels|New Backup|New)"|\'(?:New Channels|New Backup|New)\'|(?:New Channels|New Backup|New))(?=\s|,|$)',re.I)
          for line in lines:
              if not line.startswith('#EXTINF:'):
                  continue
              if staging_re.search(line):
                  forbidden.append(line)
              if backup_re.search(line):
                  backups.append(line)
          if dup:
              raise SystemExit(f'Duplicate stream URLs remain: {len(dup)}')
          if forbidden:
              raise SystemExit(f'Forbidden staging categories remain: {len(forbidden)}')
          if backups:
              print('Unclassified Backup records:')
              for line in backups:
                  print(line)
              raise SystemExit(f'Unclassified Backup entries remain: {len(backups)}')
          print(f'Integrity OK: {len(urls)} stream URLs, 0 duplicate URLs, 0 forbidden staging categories, 0 Backup entries')
          PY

      - name: Publish repaired International playlist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add International-Playlist.m3u reports/international-playlist-audit.md
          if compgen -G 'logos/international-*' > /dev/null; then
            git add logos/international-*
          fi
          if git diff --cached --quiet; then
            echo 'No International playlist changes to publish.'
            exit 0
          fi
          git commit -m 'Classify and rearrange International orphan backups'
          git push origin HEAD:main
