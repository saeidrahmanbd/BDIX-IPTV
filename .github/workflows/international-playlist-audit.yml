name: International Playlist Audit

on:
  push:
    branches: [main]
    paths:
      - International-Playlist.m3u
      - scripts/repair_international_playlist.py
      - scripts/validate_international_playlist.py
      - scripts/enforce_playlist_attribution.py
      - .github/workflows/international-playlist-audit.yml
      - logos/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-playlist-main-writer
  cancel-in-progress: false
  queue: max

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Repair International metadata and local logos
        run: python scripts/repair_international_playlist.py

      - name: Enforce attribution
        run: python scripts/enforce_playlist_attribution.py International-Playlist.m3u

      - name: Validate International playlist
        run: python scripts/validate_international_playlist.py

      - name: Publish audit results and localized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add International-Playlist.m3u reports/international-playlist-audit.md logos/
          if git diff --cached --quiet; then
            echo 'International playlist and asset metadata are already consistent.'
            exit 0
          fi
          git commit -m 'Audit International playlist metadata and logos'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
              echo '::error::Rebase conflict; refusing to force-push.'
              exit 1
            fi
            sleep 3
          done
          exit 1
