name: International Playlist Audit

on:
  push:
    branches: [main]
    paths:
      - International-Playlist.m3u
      - scripts/repair_international_playlist.py
      - scripts/classify_international_backups.py
      - logos/international/**
      - .github/workflows/international-playlist-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: international-playlist-writer
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Audit and repair International playlist
        run: python scripts/repair_international_playlist.py

      - name: Reconcile primary and Backup entries
        run: python scripts/classify_international_backups.py

      - name: Enforce final category order and requested removals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, unicodedata

          p = Path('International-Playlist.m3u')
          lines = p.read_text(encoding='utf-8-sig').splitlines()

          category_order = [
              'Bangladesh',
              'Indian Bangla',
              'Indian Movies',
              'Indian Music',
              'Indian Entertainment',
              'Pakistani',
              'International',
              'Documentary & Wildlife',
              'Kids',
              'Religious',
              'Adult',
              'Sports',
              'Backup',
              'New Channels',
              'New Backup',
              'Not Playing',
          ]
          order = {name.casefold(): i for i, name in enumerate(category_order)}
          header = '#PLAYLIST-STUDIO-CATEGORIES:' + str(category_order).replace("'", '"')

          attr_re = re.compile(r'([A-Za-z0-9_-]+)=(?:"([^"]*)"|\'([^\']*)\'|([^\s,]+))')

          def attrs(s):
              out = {}
              for m in attr_re.finditer(s):
                  out[m.group(1)] = next(v for v in m.groups()[1:] if v is not None)
              return out

          def norm(s):
              s = unicodedata.normalize('NFKD', str(s or '')).casefold()
              s = ''.join(c for c in s if not unicodedata.combining(c))
              s = re.sub(r'\s+', ' ', s).strip()
              return re.sub(r'[^a-z0-9]+', '', s)

          # Preserve playlist-level header lines while rebuilding all channel blocks.
          prefix = []
          blocks = []
          cur = None
          for line in lines:
              if line.startswith('#PLAYLIST-STUDIO-CATEGORIES:'):
                  continue
              if line.startswith('#EXTINF:'):
                  if cur is not None:
                      blocks.append(cur)
                  cur = [line]
              elif cur is not None:
                  cur.append(line)
              else:
                  prefix.append(line)
          if cur is not None:
              blocks.append(cur)

          kept = []
          removed = 0
          for b in blocks:
              a = attrs(b[0])
              name = (a.get('tvg-name') or b[0].rsplit(',', 1)[-1]).strip()
              # ATN Bangla USA duplicates the ATN Bangla UK programming and is explicitly removed.
              if norm(name) == norm('ATN Bangla USA'):
                  removed += 1
                  continue
              group = (a.get('group-title') or '').strip()
              if group.casefold() not in order:
                  # Keep unknown groups at the end rather than silently deleting channels.
                  group_key = len(category_order)
              else:
                  group_key = order[group.casefold()]
              kept.append((group_key, norm(name), name.casefold(), b))

          kept.sort(key=lambda x: (x[0], x[1], x[2]))

          out = []
          # Keep the standard playlist header and studio metadata.
          out.append('#EXTM3U url-tvg="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/epg/epg.xml" x-tvg-url="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/epg/epg.xml"')
          out.append(header)
          for line in prefix:
              if line.strip() and not line.strip().startswith('#EXTM3U'):
                  out.append(line)
          for _, _, _, b in kept:
              out.extend(b)

          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          print(f'Final category order enforced: {" > ".join(category_order)}')
          print(f'ATN Bangla USA removed: {removed}')
          print(f'Channels retained: {len(kept)}')
          PY

      - name: Validate playlist integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s International-Playlist.m3u
          grep -q '^#EXTM3U' International-Playlist.m3u
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re, unicodedata
          p=Path('International-Playlist.m3u')
          lines=p.read_text(encoding='utf-8-sig').splitlines()
          urls=[x.strip().casefold() for x in lines if x.strip().startswith(('http://','https://'))]
          dup=[u for u,n in Counter(urls).items() if n>1]
          staging_re=re.compile(r'group-title\s*=\s*(?:"(?:New Channels|New Backup|New)"|\'(?:New Channels|New Backup|New)\'|(?:New Channels|New Backup|New))(?=\s|,|$)',re.I)
          info_re=re.compile(r'([A-Za-z0-9_-]+)=(?:"([^"]*)"|\'([^\']*)\'|([^\s,]+))')
          def attrs(s):
              out={}
              for m in info_re.finditer(s): out[m.group(1)]=next(v for v in m.groups()[1:] if v is not None)
              return out
          def norm(s):
              s=unicodedata.normalize('NFKD',str(s or '')).casefold(); s=''.join(c for c in s if not unicodedata.combining(c))
              s=re.sub(r'\b(?:backup|hd|fhd|uhd|sd|4k|1080p|720p|576p|480p)\b',' ',s)
              return re.sub(r'[^a-z0-9]+','',s)
          blocks=[]; cur=None
          for line in lines:
              if line.startswith('#EXTINF:'):
                  if cur is not None: blocks.append(cur)
                  cur=[line]
              elif cur is not None: cur.append(line)
          if cur is not None: blocks.append(cur)
          primary_keys={}
          duplicate_primaries=[]
          backup_count=0
          for b in blocks:
              a=attrs(b[0]); group=a.get('group-title','').strip().casefold()
              if group=='backup': backup_count+=1; continue
              if staging_re.search(b[0]):
                  raise SystemExit('Forbidden staging category remains: '+b[0])
              if group=='adult':
                  # Adult providers can expose multiple distinct URLs for the same title; retain these for manual review.
                  continue
              name=norm(a.get('tvg-name') or b[0].rsplit(',',1)[-1])
              key=('name',name) if name else ('id',(a.get('tvg-id') or a.get('channel-id') or '').strip().casefold())
              if key in primary_keys:
                  duplicate_primaries.append((key,b[0]))
              else:
                  primary_keys[key]=b[0]
          if dup:
              raise SystemExit(f'Duplicate stream URLs remain: {len(dup)}')
          if duplicate_primaries:
              print('Duplicate primary records:')
              for key,line in duplicate_primaries: print(key,line)
              raise SystemExit(f'Duplicate primary channels remain: {len(duplicate_primaries)}')
          if any('ATN Bangla USA' in b for b in blocks):
              raise SystemExit('ATN Bangla USA remains in playlist')
          expected=['Bangladesh','Indian Bangla','Indian Movies','Indian Music','Indian Entertainment','Pakistani','International','Documentary & Wildlife','Kids','Religious','Adult','Sports','Backup','New Channels','New Backup','Not Playing']
          actual=[]
          for b in blocks:
              g=attrs(b[0]).get('group-title','').strip()
              if g and g not in actual: actual.append(g)
          positions={g:i for i,g in enumerate(expected)}
          if any(positions.get(actual[i], 999) > positions.get(actual[i+1], 999) for i in range(len(actual)-1)):
              raise SystemExit('Playlist categories are not in the required order: '+str(actual))
          print(f'Integrity OK: {len(urls)} stream URLs, 0 duplicate URLs, 0 duplicate primaries outside Adult, Adult same-title streams retained for manual review, {backup_count} Backup entries, 0 forbidden staging categories')
          PY

      - name: Publish repaired International playlist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add International-Playlist.m3u reports/international-playlist-audit.md
          if compgen -G 'logos/international-*' > /dev/null; then
            git add logos/international-*
          fi
          if git diff --cached --quiet; then
            echo 'No International playlist changes to publish.'
            exit 0
          fi
          git commit -m 'Enforce International category order and remove duplicate ATN Bangla USA'
          git push origin HEAD:main
