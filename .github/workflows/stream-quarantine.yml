name: Stream Quarantine

on:
  workflow_run:
    workflows: ["Stream Health"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-repository-writes
  cancel-in-progress: false

jobs:
  quarantine:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check pillow
      - name: Quarantine streams
        run: python scripts/quarantine_streams.py
      - name: Audit playlist
        run: python scripts/audit_playlist.py
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "IPTV-Playlist.m3u"
            "reports/not-playing-quarantine.md"
            "reports/playlist-audit.md"
          )

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Quarantine commit attempt ${attempt}/3"

            # Always start from the latest main. Repository-writing workflows
            # are serialized, but main may have advanced since workflow_run
            # was queued. Re-running quarantine against the latest playlist is
            # safer than rebasing a stale generated commit onto it.
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            python scripts/quarantine_streams.py
            python scripts/audit_playlist.py

            if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
              echo "No quarantine changes."
              exit 0
            fi

            git add "${files[@]}"
            git commit -m "Quarantine non-standard and failed streams"

            if git push origin HEAD:main; then
              echo "Quarantine changes pushed successfully."
              exit 0
            fi

            echo "Push failed because main advanced; retrying from latest main."
            sleep 3
          done

          echo "Unable to push quarantine changes after 3 attempts."
          exit 1
