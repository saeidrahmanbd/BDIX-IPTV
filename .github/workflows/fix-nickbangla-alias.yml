name: Fix unverified Nick Bangla EPG alias

on:
  push:
    branches:
      - fix/nickbangla-epg-alias-2026-10-22

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'saeidrahmanbd' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove unverified Nick Bangla alias
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/epg_coverage.py')
          text = p.read_text(encoding='utf-8')
          old = '    "NickBangla.bd": ["jtv1341"],\n'
          if old in text:
              text = text.replace(old, '', 1)
              p.write_text(text, encoding='utf-8')
          else:
              raise SystemExit('NickBangla.bd -> jtv1341 alias was not found; refusing to modify anything.')
          PY
          rm -f tmp/pr19-nickbangla-fix.txt

      - name: Run EPG configuration tests
        run: |
          python -m pytest -q tests/test_epg_config.py

      - name: Commit exact fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/epg_coverage.py tmp/pr19-nickbangla-fix.txt
          git commit -m 'Fix unverified Nick Bangla EPG alias'
          git push
