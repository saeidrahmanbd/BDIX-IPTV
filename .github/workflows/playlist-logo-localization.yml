name: Playlist Logo Repair and Localization
# Fresh current-main retry to replace cancelled logo localization after the shared writer-queue fix (2026-10-26).

on:
  push:
    branches: [main]
    paths:
      - IPTV-Playlist.m3u
      - BDIX-Playlist.m3u
      - International-Playlist.m3u
      - scripts/repair_playlist_logos.py
      - scripts/logo_source_catalog.py
  workflow_dispatch:

permissions:
  contents: write

# Versioned writer queue isolates new runs from stale v2 runs already queued.
concurrency:
  group: iptv-playlist-main-writer-v3
  cancel-in-progress: false
  queue: max

jobs:
  localize:
    # Playlist edits trigger localization. Skip only the workflow's own bot commit to prevent a loop.
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'Repair playlist logos only; leave stream URLs unchanged')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Skip superseded queued logo localization run
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          EVENT_WORKFLOW_BLOB="$(git rev-parse "${GITHUB_SHA}:.github/workflows/playlist-logo-localization.yml")"
          CURRENT_WORKFLOW_BLOB="$(git rev-parse "FETCH_HEAD:.github/workflows/playlist-logo-localization.yml")"
          if [[ "$EVENT_WORKFLOW_BLOB" != "$CURRENT_WORKFLOW_BLOB" ]]; then
            echo "::notice::Skipping superseded queued logo localization run; a newer workflow definition is on main. No playlist files were changed."
            exit 0
          fi
          CURRENT_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_SHA}" != "$CURRENT_MAIN_SHA" ]]; then
            echo "::notice::Skipping superseded queued logo localization run; a newer commit on main contains the current playlist inventory. No playlist files were changed."
            exit 0
          fi
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install image validation tools
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Capture protected playlist metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          names = ["IPTV-Playlist.m3u", "BDIX-Playlist.m3u", "International-Playlist.m3u"]
          for name in names:
              text = Path(name).read_text(encoding="utf-8-sig").replace("\r\n", "\n").replace("\r", "\n")
              text = re.sub(r'\s+tvg-logo="[^"]*"', "", text)
              Path("/tmp/" + name + ".nonlogo").write_text(text, encoding="utf-8")
          PY
      - name: Localize and commit logos
        shell: bash
        run: |
          set -euo pipefail
          python scripts/repair_playlist_logos.py
          python scripts/generate_logo_authenticity_manifest.py
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          registry_path = Path("reports/logo-source-registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8")) if registry_path.is_file() else {}
          base = "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/"
          names = ["IPTV-Playlist.m3u", "BDIX-Playlist.m3u", "International-Playlist.m3u"]
          blocked = {
              "atn-news.png", "a-sports-5485adff.png", "a-sports-hd.png", "bein-sports-3.png",
              "bangla-tv.png", "btv-news.png", "colors.png", "duronto-tv.png",
              "duronto-tv-1ad55c95.png", "ekushey-tv.png", "global-tv.png", "green-tv.png",
              "mohona-tv.png", "nagorik-tv.png", "nagorik.png", "nick-bangla.png",
              "sananda-tv.png", "sananda.png", "star-gold-select.png", "star-gold.png",
              "star-plus.png", "zee-tv.png", "tom-and-jerry.png", "arirang-tv.png",
          }
          summaries = {}
          for name in names:
              current = Path(name).read_text(encoding="utf-8-sig").replace("\r\n", "\n").replace("\r", "\n")
              normalized = re.sub(r'\s+tvg-logo="[^"]*"', "", current)
              baseline = Path("/tmp/" + name + ".nonlogo").read_text(encoding="utf-8")
              if normalized != baseline:
                  raise SystemExit("Non-logo playlist content changed: " + name)
              entries = [line for line in current.splitlines() if line.startswith("#EXTINF:")]
              missing = external = nvision = broken = adult_ignored = 0
              for line in entries:
                  meta = dict(re.findall(r'([\w-]+)="([^"]*)"', line))
                  group = (meta.get("group-title") or "").strip().casefold()
                  channel_id = (meta.get("tvg-id") or meta.get("channel-id") or "").strip().casefold()
                  if name == "International-Playlist.m3u" and (group == "adult" or ".xxx" in channel_id):
                      adult_ignored += 1
                      continue
                  m = re.search(r'tvg-logo="([^"]*)"', line)
                  logo = m.group(1).strip() if m else ""
                  if not logo:
                      missing += 1
                      continue
                  if not logo.startswith(base):
                      external += 1
                      continue
                  rel = unquote(urlparse(logo).path.split("/logos/", 1)[-1]).lstrip("/")
                  asset = Path("logos") / rel
                  filename = asset.name.casefold()
                  if filename.startswith("nvisionbd-"):
                      nvision += 1
                  channel_id_original = (meta.get("tvg-id") or meta.get("channel-id") or "").strip()
                  channel_name = (meta.get("tvg-name") or line.rsplit(",", 1)[-1]).strip()
                  registry_key = f"{name}|{channel_id_original}|{channel_name}|{logo}"
                  provenance = registry.get(registry_key, {})
                  is_generated_fallback = filename.startswith("generated-fallback-")
                  fallback_is_disclosed = (
                      is_generated_fallback
                      and provenance.get("status") == "generated_fallback"
                      and "unofficial fallback" in provenance.get("notes", "").casefold()
                      and "not an official broadcaster logo" in provenance.get("notes", "").casefold()
                  )
                  if (
                      not asset.is_file()
                      or filename in blocked
                      or filename.startswith(("placeholder-", "generic-", "unknown-", "unidentified-"))
                      or (is_generated_fallback and not fallback_is_disclosed)
                      or re.search(r"(?:placeholder|generic-logo)", filename, re.I)
                  ):
                      broken += 1
              summaries[name] = {
                  "entries": len(entries), "missing_logo_metadata": missing,
                  "adult_entries_ignored": adult_ignored,
                  "nonrepository_logo_refs": external, "nvision_refs": nvision,
                  "invalid_or_blocked_refs": broken,
              }
              if external or nvision or broken:
                  raise SystemExit("Logo validation failed: " + name + " " + json.dumps(summaries[name]))
          print(json.dumps(summaries, indent=2))
          PY
          git add IPTV-Playlist.m3u BDIX-Playlist.m3u International-Playlist.m3u logos/ reports/playlist-logo-repair-results.md reports/logo-source-registry.json reports/logo-authenticity-manifest.json
          if git diff --cached --quiet; then
            echo "No additional local logo changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Repair playlist logos only; leave stream URLs unchanged"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::Could not rebase logo localization commit."
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "::error::Could not push localized logo assets after three attempts."
          exit 1
