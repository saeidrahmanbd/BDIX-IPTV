name: Changelog

on:
  workflow_run:
    workflows: ["IPTV Playlist Update"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bdix-iptv-changelog
  cancel-in-progress: true

jobs:
  changelog:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate changelog
        run: python scripts/generate_changelog.py
      - name: Commit changelog
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- docs/CHANGELOG.md reports/changelog-state.json)" ]; then
            echo "No changelog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add docs/CHANGELOG.md reports/changelog-state.json
            if git diff --cached --quiet; then
              echo "No changelog changes remain."
              exit 0
            fi
            git commit -m "Update automated changelog"
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              # A queued/stale changelog can conflict with a newer generated
              # entry. Rebuild from the latest main rather than failing or
              # attempting to force a stale changelog commit into the branch.
              git rebase --abort || true
            fi
            git reset --hard origin/main
            python scripts/generate_changelog.py
            if [ -z "$(git status --porcelain -- docs/CHANGELOG.md reports/changelog-state.json)" ]; then
              echo "No changelog changes remain against latest main."
              exit 0
            fi
            sleep 3
          done
          exit 1
