name: Changelog

on:
  workflow_run:
    workflows: ["IPTV Playlist Update"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-changelog
  cancel-in-progress: false
  queue: single

jobs:
  changelog:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate changelog
        run: python scripts/generate_changelog.py
      - name: Commit changelog
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- docs/CHANGELOG.md reports/changelog-state.json)" ]; then
            echo "No changelog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/CHANGELOG.md reports/changelog-state.json
          git commit -m "Update automated changelog"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
