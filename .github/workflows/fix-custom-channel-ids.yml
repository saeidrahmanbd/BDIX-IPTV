name: Fix custom channel IDs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-custom-channel-ids.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply canonical channel IDs') && !startsWith(github.event.head_commit.message, 'Remove one-time custom ID fixer') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace custom channel IDs
        shell: python
        run: |
          from pathlib import Path
          import re
          import unicodedata
          import hashlib

          playlist = Path('IPTV-Playlist.m3u')
          lines = playlist.read_text(encoding='utf-8-sig').replace('\r', '').splitlines()
          attr_re = re.compile(r'([A-Za-z0-9_-]+)="([^"]*)"')

          def attrs(line):
              return dict(attr_re.findall(line))

          def set_attr(line, key, value):
              pat = re.compile(rf'{re.escape(key)}="[^"]*"')
              replacement = f'{key}="{value}"'
              if pat.search(line):
                  return pat.sub(replacement, line, count=1)
              return line.replace('#EXTINF:-1 ', f'#EXTINF:-1 {replacement} ', 1)

          def split_display(line):
              in_quote = False
              escaped = False
              for i, ch in enumerate(line):
                  if ch == '"' and not escaped:
                      in_quote = not in_quote
                  elif ch == ',' and not in_quote:
                      return line[:i], line[i + 1:]
                  escaped = (ch == '\\') and not escaped
                  if ch != '\\':
                      escaped = False
              return line, ''

          # Stable, deterministic ID form: <normalized channel name>.<country>.
          # The same old custom ID always receives the same new ID, including
          # its Backup/alternate occurrences, so channel identity is preserved.
          country_alias = {
              'GB': 'uk', 'UK': 'uk', 'US': 'us', 'CA': 'ca', 'IN': 'in',
              'BD': 'bd', 'PK': 'pk', 'AU': 'au', 'NZ': 'nz', 'AE': 'ae',
              'SA': 'sa', 'QA': 'qa', 'BH': 'bh', 'SG': 'sg', 'MY': 'my', 'AT': 'at',
              'DE': 'de', 'FR': 'fr', 'IT': 'it', 'ES': 'es', 'PT': 'pt',
              'NL': 'nl', 'BE': 'be', 'CH': 'ch', 'SE': 'se', 'NO': 'no',
              'DK': 'dk', 'FI': 'fi', 'IE': 'ie', 'TR': 'tr', 'JP': 'jp',
              'KR': 'kr', 'TH': 'th', 'ID': 'id', 'PH': 'ph', 'BR': 'br',
              'ZA': 'za', 'NG': 'ng', 'GH': 'gh', 'KE': 'ke', 'LK': 'lk',
              'NP': 'np', 'BT': 'bt', 'MV': 'mv', 'IL': 'il', 'RU': 'ru',
          }

          def slug(name):
              s = unicodedata.normalize('NFKD', name or '').encode('ascii', 'ignore').decode().strip()
              s = re.sub(r'\[[^]]*\]|\([^)]*\)', ' ', s)
              s = re.sub(r'\b(?:HD\+?|SD|FHD|UHD|4K|1080p|720p|576p|480p|360p)\b', ' ', s, flags=re.I)
              s = re.sub(r'\b(?:UK|USA|US|INDIA|BANGLADESH|PAKISTAN|CANADA)\b\s*$', ' ', s, flags=re.I)
              s = re.sub(r'[^A-Za-z0-9]+', ' ', s).strip()
              words = s.split()
              if not words:
                  return ''
              return ''.join(w[:1].upper() + w[1:] for w in words)

          records = []
          current = None
          for line in lines:
              if line.startswith('#EXTINF:'):
                  if current:
                      records.append(current)
                  current = [line]
              elif current is not None:
                  current.append(line)
          if current:
              records.append(current)

          # Reserve every established non-custom identity.
          reserved = set()
          for rec in records:
              a = attrs(rec[0])
              cid = a.get('tvg-id', '').strip()
              if cid and not cid.lower().startswith('custom.'):
                  reserved.add(cid.casefold())

          # Collect one representative per old custom ID. This prevents the
          # same channel from receiving @ALT1, @ALT1@ALT1, etc. across duplicates.
          representatives = {}
          for rec in records:
              a = attrs(rec[0])
              old = a.get('tvg-id', '').strip()
              if not old.lower().startswith('custom.') or old in representatives:
                  continue
              _, display = split_display(rec[0])
              name = (a.get('tvg-name') or display).strip()
              country = country_alias.get((a.get('tvg-country') or '').strip().upper())
              if country in {'zz', 'und'}:
                  country = None
              representatives[old] = (name, country)

          aliases = {}
          used_new = set(reserved)
          unresolved = []

          for old, (name, country) in representatives.items():
              base = slug(name)
              if not base or not country:
                  unresolved.append(old)
                  continue
              candidate = f'{base}.{country}'
              key = candidate.casefold()
              if key in used_new:
                  # Stable suffix based on the old ID; never mutate repeatedly.
                  suffix = hashlib.sha1(old.encode('utf-8')).hexdigest()[:6]
                  candidate = f'{base}.{country}@{suffix}'
                  key = candidate.casefold()
                  n = 1
                  while key in used_new:
                      candidate = f'{base}.{country}@{suffix}{n}'
                      key = candidate.casefold()
                      n += 1
              used_new.add(key)
              aliases[old] = candidate

          changed = []
          for rec in records:
              a = attrs(rec[0])
              old = a.get('tvg-id', '').strip()
              new = aliases.get(old)
              if not new:
                  continue
              _, display = split_display(rec[0])
              rec[0] = set_attr(rec[0], 'tvg-id', new)
              rec[0] = set_attr(rec[0], 'channel-id', new)
              changed.append((a.get('tvg-name') or display, old, new))

          if unresolved:
              raise SystemExit('Unresolved custom IDs: ' + ', '.join(sorted(unresolved)))

          if not changed:
              print('No custom IDs required conversion.')
          else:
              out = [line for rec in records for line in rec]
              first_ext = next((i for i, x in enumerate(lines) if x.startswith('#EXTINF:')), len(lines))
              playlist.write_text('\n'.join(lines[:first_ext] + out) + '\n', encoding='utf-8')

              # Keep exact-ID EPG mappings compatible with renamed playlist IDs.
              for path in [Path('scripts/epg_coverage.py'), Path('scripts/generate_epg.py'), Path('scripts/run_epg_coverage.py')]:
                  if not path.exists():
                      continue
                  text = path.read_text(encoding='utf-8')
                  original = text
                  for old, new in sorted(aliases.items(), key=lambda x: len(x[0]), reverse=True):
                      text = text.replace(f'"{old}"', f'"{new}"').replace(f"'{old}'", f"'{new}'")
                  if text != original:
                      path.write_text(text, encoding='utf-8')

              print(f'Converted {len(aliases)} unique custom IDs across {len(changed)} playlist entries.')
              for old, new in sorted(aliases.items()):
                  print(f'  {old} -> {new}')

      - name: Validate playlist and IDs
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('IPTV-Playlist.m3u')
          text = p.read_text(encoding='utf-8')
          custom = re.findall(r'tvg-id="(custom\.[^"]+)"', text, flags=re.I)
          print(f'Remaining custom tvg-id values: {len(custom)}')
          if custom:
              print('\n'.join(sorted(set(custom))))
              raise SystemExit(1)
          print('Custom-ID check passed.')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPTV-Playlist.m3u scripts/epg_coverage.py scripts/generate_epg.py scripts/run_epg_coverage.py
          if git diff --cached --quiet; then
            echo 'No custom-ID changes to commit.'
            exit 0
          fi
          git commit -m 'Apply canonical channel IDs'
          git push origin HEAD:main

      - name: Remove one-time fixer
        if: success()
        shell: bash
        run: |
          git fetch origin main
          git checkout -- .
          git reset --hard origin/main
          rm -f .github/workflows/fix-custom-channel-ids.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/fix-custom-channel-ids.yml
          git commit -m 'Remove one-time custom ID fixer'
          git push origin HEAD:main
