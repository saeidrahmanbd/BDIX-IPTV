name: Fix custom channel IDs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-custom-channel-ids.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply canonical channel IDs') && !startsWith(github.event.head_commit.message, 'Remove one-time custom ID fixer') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace custom channel IDs
        shell: python
        run: |
          from pathlib import Path
          import re
          import unicodedata

          playlist = Path('IPTV-Playlist.m3u')
          lines = playlist.read_text(encoding='utf-8-sig').replace('\r', '').splitlines()
          attr_re = re.compile(r'([A-Za-z0-9_-]+)="([^"]*)"')

          def attrs(line):
              return dict(attr_re.findall(line))

          def set_attr(line, key, value):
              pat = re.compile(rf'{re.escape(key)}="[^"]*"')
              replacement = f'{key}="{value}"'
              if pat.search(line):
                  return pat.sub(replacement, line, count=1)
              return line.replace('#EXTINF:-1 ', f'#EXTINF:-1 {replacement} ', 1)

          def split_display(line):
              in_quote = False
              escaped = False
              for i, ch in enumerate(line):
                  if ch == '"' and not escaped:
                      in_quote = not in_quote
                  elif ch == ',' and not in_quote:
                      return line[:i], line[i + 1:]
                  escaped = (ch == '\\') and not escaped
                  if ch != '\\':
                      escaped = False
              return line, ''

          # Stable, deterministic ID form: <normalized channel name>.<ISO country>
          # Examples: Channel S UK -> ChannelS.uk, Channel 52 -> Channel52.bd,
          # Rajdhani TV -> RajdhaniTV.bd, Love Nature -> LoveNature.ca.
          country_alias = {
              'GB': 'uk', 'UK': 'uk', 'US': 'us', 'CA': 'ca', 'IN': 'in',
              'BD': 'bd', 'PK': 'pk', 'AU': 'au', 'NZ': 'nz', 'AE': 'ae',
              'SA': 'sa', 'QA': 'qa', 'SG': 'sg', 'MY': 'my', 'AT': 'at',
              'DE': 'de', 'FR': 'fr', 'IT': 'it', 'ES': 'es', 'PT': 'pt',
              'NL': 'nl', 'BE': 'be', 'CH': 'ch', 'SE': 'se', 'NO': 'no',
              'DK': 'dk', 'FI': 'fi', 'IE': 'ie', 'TR': 'tr', 'JP': 'jp',
              'KR': 'kr', 'TH': 'th', 'ID': 'id', 'PH': 'ph', 'BR': 'br',
              'ZA': 'za', 'NG': 'ng', 'GH': 'gh', 'KE': 'ke', 'LK': 'lk',
              'NP': 'np', 'BT': 'bt', 'MV': 'mv', 'IL': 'il', 'RU': 'ru',
          }

          quality_words = {'hd', 'sd', 'fhd', 'uhd', '4k', '1080p', '720p', '576p', '480p', '360p'}
          country_words = {'uk', 'usa', 'us', 'india', 'bd', 'bangladesh', 'pakistan', 'pk', 'canada', 'ca'}

          def slug(name):
              s = unicodedata.normalize('NFKD', name or '').encode('ascii', 'ignore').decode().strip()
              s = re.sub(r'\[[^]]*\]|\([^)]*\)', ' ', s)
              s = re.sub(r'\b(?:HD\+?|SD|FHD|UHD|4K|1080p|720p|576p|480p|360p)\b', ' ', s, flags=re.I)
              s = re.sub(r'\b(?:UK|USA|US|INDIA|BANGLADESH|PAKISTAN|CANADA)\b\s*$', ' ', s, flags=re.I)
              s = re.sub(r'[^A-Za-z0-9]+', ' ', s).strip()
              words = s.split()
              if not words:
                  return ''
              return ''.join(w[:1].upper() + w[1:] for w in words)

          records = []
          current = None
          for line in lines:
              if line.startswith('#EXTINF:'):
                  if current:
                      records.append(current)
                  current = [line]
              elif current is not None:
                  current.append(line)
          if current:
              records.append(current)

          # Existing non-custom IDs are reserved so a generated ID cannot collide
          # with an established primary identity.
          reserved = set()
          for rec in records:
              a = attrs(rec[0])
              if not a.get('tvg-id', '').strip().lower().startswith('custom.'):
                  cid = a.get('tvg-id', '').strip()
                  if cid:
                      reserved.add(cid.casefold())

          aliases = {}
          generated = {}
          changed = []
          for rec in records:
              a = attrs(rec[0])
              old = a.get('tvg-id', '').strip()
              if not old.lower().startswith('custom.'):
                  continue
              _, display = split_display(rec[0])
              name = (a.get('tvg-name') or display).strip()
              country = country_alias.get((a.get('tvg-country') or '').strip().upper())
              if not country or country in {'zz', 'und'}:
                  continue
              base = slug(name)
              if not base:
                  continue
              new = f'{base}.{country}'
              # Preserve distinct HD variants when the base identity already exists.
              if new.casefold() in reserved:
                  if re.search(r'\bHD\b', name, re.I):
                      new = f'{base}.{country}@HD'
                  elif re.search(r'\b(?:UK|USA|US|CANADA)\b', name, re.I):
                      new = f'{base}.{country}'
                  else:
                      new = f'{base}.{country}@ALT1'
              while new.casefold() in reserved and new.casefold() != old.casefold():
                  new += '@ALT1'
              reserved.add(new.casefold())
              generated[old] = new
              rec[0] = set_attr(rec[0], 'tvg-id', new)
              rec[0] = set_attr(rec[0], 'channel-id', new)
              aliases[old] = new
              changed.append((name, old, new))

          if not changed:
              print('No custom IDs required conversion.')
          else:
              out = []
              for rec in records:
                  out.extend(rec)
              # Reconstruct the playlist while preserving all preamble comments.
              preamble = []
              first_ext = next((i for i, x in enumerate(lines) if x.startswith('#EXTINF:')), len(lines))
              preamble = lines[:first_ext]
              playlist.write_text('\n'.join(preamble + out) + '\n', encoding='utf-8')

              # Keep exact-ID EPG mappings compatible with the renamed playlist IDs.
              for path in [Path('scripts/epg_coverage.py'), Path('scripts/generate_epg.py'), Path('scripts/run_epg_coverage.py')]:
                  if not path.exists():
                      continue
                  text = path.read_text(encoding='utf-8')
                  original = text
                  for old, new in sorted(aliases.items(), key=lambda x: len(x[0]), reverse=True):
                      text = text.replace(f'"{old}"', f'"{new}"').replace(f"'{old}'", f"'{new}'")
                  if text != original:
                      path.write_text(text, encoding='utf-8')

              print(f'Converted {len(changed)} custom IDs:')
              for name, old, new in changed:
                  print(f'  {name}: {old} -> {new}')

      - name: Validate playlist and IDs
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('IPTV-Playlist.m3u')
          text = p.read_text(encoding='utf-8')
          custom = re.findall(r'tvg-id="(custom\.[^"]+)"', text, flags=re.I)
          print(f'Remaining custom tvg-id values: {len(custom)}')
          if custom:
              print('\n'.join(sorted(set(custom))))
              raise SystemExit(1)
          print('Custom-ID check passed.')
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPTV-Playlist.m3u scripts/epg_coverage.py scripts/generate_epg.py scripts/run_epg_coverage.py
          if git diff --cached --quiet; then
            echo 'No custom-ID changes to commit.'
            exit 0
          fi
          git commit -m 'Apply canonical channel IDs'
          git push origin HEAD:main

      - name: Remove one-time fixer
        if: success()
        shell: bash
        run: |
          git fetch origin main
          git checkout -- .
          git reset --hard origin/main
          rm -f .github/workflows/fix-custom-channel-ids.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/fix-custom-channel-ids.yml
          git commit -m 'Remove one-time custom ID fixer'
          git push origin HEAD:main
