name: Sync IPTV Reports

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - IPTV-Playlist.m3u
      - BDIX-Playlist.m3u
      - epg/epg.xml
      - logos/**
      - reports/logo-source-registry.json
      - .github/workflows/sync-iptv-reports.yml
      - scripts/audit_playlist.py
      - scripts/pre_publish_gate.py
      - scripts/epg_coverage.py
      - scripts/generate_logo_authenticity_manifest.py
      - scripts/generate_dashboard.py
      - scripts/generate_metadata_backfill_report.py
      - scripts/validate_report_freshness.py
      - scripts/logo_asset_naming.py
      - scripts/generate_logo_provenance_review.py
      - scripts/generate_metadata_normalization_report.py
      - scripts/report_iptv_fragile_streams.py
      - scripts/stream_risk_review.py
      - scripts/generate_epg.py
      - scripts/run_generate_epg.py
      - scripts/fetch_iptv_org_epg.py
      - scripts/augment_epg_mapping_from_iptv_org.py
      - scripts/official_epg_sources.py
      - scripts/sync_epg_worker_map.py
      - tests/test_logo_asset_naming.py
      - tests/test_logo_provenance_review.py
      - tests/test_iptv_fragile_streams.py
      - tests/test_report_freshness.py

permissions:
  contents: write

concurrency:
  group: bdix-iptv-main-writer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install logo validation dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Generate and publish synchronized reports
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "=== Synchronization attempt ${attempt}/5 ==="

            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd

            run_reporter() {
              local label="$1"
              shift
              echo "--- ${label} ---"
              set +e
              "$@"
              local rc=$?
              set -e
              if [[ $rc -ne 0 ]]; then
                echo "${label} returned ${rc}; keeping its generated report and continuing."
              fi
              return 0
            }

            run_reporter "Metadata backfill report" python scripts/generate_metadata_backfill_report.py
            run_reporter "Playlist audit" python scripts/audit_playlist.py
            run_reporter "Pre-publish gate" python scripts/pre_publish_gate.py
            run_reporter "EPG coverage" python scripts/epg_coverage.py
            run_reporter "Logo authenticity manifest" python scripts/generate_logo_authenticity_manifest.py
            run_reporter "Logo provenance review" python scripts/generate_logo_provenance_review.py
            run_reporter "Metadata normalization status" python scripts/generate_metadata_normalization_report.py
            run_reporter "Fragile stream review (secrets redacted)" python scripts/report_iptv_fragile_streams.py
            run_reporter "Stream risk review" python scripts/stream_risk_review.py
            run_reporter "Dashboard" python scripts/generate_dashboard.py

            # Audit/gate BLOCK results are still reportable; missing/stale reports are not.
            python scripts/validate_report_freshness.py --mode generated

            git add reports/ assets/dashboard.svg
            if git diff --cached --quiet; then
              echo 'Reports are already synchronized with the current playlist.'
              exit 0
            fi

            git commit -m 'Synchronize IPTV generated reports'
            base_sha="$(git rev-parse HEAD^1)"

            if git push --force-with-lease="refs/heads/main:${base_sha}" origin HEAD:main; then
              echo 'Synchronized reports published successfully.'
              exit 0
            fi

            echo 'main changed before publication; discarding generated commit and regenerating.'
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd
            sleep 2
          done

          echo '::error::Unable to publish synchronized reports after 5 clean regeneration attempts.'
          exit 1
