name: Sync IPTV Reports

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - IPTV-Playlist.m3u
      - .github/workflows/sync-iptv-reports.yml
      - scripts/audit_playlist.py
      - scripts/pre_publish_gate.py
      - scripts/epg_coverage.py
      - scripts/generate_logo_authenticity_manifest.py
      - scripts/generate_dashboard.py
      - scripts/generate_metadata_backfill_report.py
      - scripts/validate_report_freshness.py

permissions:
  contents: write

concurrency:
  group: bdix-iptv-report-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Generate and publish synchronized reports
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "=== Synchronization attempt ${attempt}/5 ==="

            # Always regenerate from a complete, current main. Never rebase
            # generated report commits and never merge report files.
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd

            # This generator is deliberately read-only: it never edits the playlist.
            python scripts/generate_metadata_backfill_report.py
            python scripts/audit_playlist.py
            python scripts/pre_publish_gate.py
            python scripts/epg_coverage.py
            python scripts/generate_logo_authenticity_manifest.py
            python scripts/generate_dashboard.py
            python scripts/validate_report_freshness.py

            git add reports/ assets/dashboard.svg
            if git diff --cached --quiet; then
              echo 'Reports are already synchronized with the current playlist.'
              exit 0
            fi

            # Create the generated commit locally. Its parent is the exact main
            # snapshot used to generate every report.
            git commit -m 'Synchronize IPTV generated reports'
            base_sha="$(git rev-parse HEAD^1)"

            # Compare-and-swap push: if main moved, this push MUST fail rather
            # than merging/rebasing generated reports. We then discard the local
            # commit and regenerate from the new main.
            if git push --force-with-lease="refs/heads/main:${base_sha}" origin HEAD:main; then
              echo 'Synchronized reports published successfully.'
              exit 0
            fi

            echo 'main changed before publication; discarding generated commit and regenerating.'
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd
            sleep 2
          done

          echo '::error::Unable to publish synchronized reports after 5 clean regeneration attempts.'
          exit 1
