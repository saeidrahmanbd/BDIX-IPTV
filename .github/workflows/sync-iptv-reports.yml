name: Sync IPTV Reports

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - IPTV-Playlist.m3u
      - BDIX-Playlist.m3u
      - logos/**
      - reports/logo-source-registry.json
      - .github/workflows/sync-iptv-reports.yml
      - scripts/audit_playlist.py
      - scripts/pre_publish_gate.py
      - scripts/epg_coverage.py
      - scripts/generate_logo_authenticity_manifest.py
      - scripts/generate_dashboard.py
      - scripts/generate_metadata_backfill_report.py
      - scripts/validate_report_freshness.py
      - scripts/logo_asset_naming.py
      - scripts/generate_logo_provenance_review.py
      - scripts/generate_metadata_normalization_report.py
      - scripts/report_iptv_fragile_streams.py
      - scripts/stream_risk_review.py
      - scripts/stream_health.py
      - scripts/generate_epg.py
      - scripts/run_generate_epg.py
      - scripts/fetch_iptv_org_epg.py
      - scripts/augment_epg_mapping_from_iptv_org.py
      - scripts/official_epg_sources.py
      - scripts/sync_epg_worker_map.py
      - scripts/epg_publish_gate.py
      - tests/test_logo_asset_naming.py
      - tests/test_logo_provenance_review.py
      - tests/test_iptv_fragile_streams.py
      - tests/test_report_freshness.py

permissions:
  contents: write

concurrency:
  group: bdix-iptv-main-writer
  cancel-in-progress: false
  queue: max

env:
  M3U4U_XMLTV_URL: ${{ secrets.M3U4U_XMLTV_URL }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install logo and EPG validation dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Generate and publish synchronized reports
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "=== Synchronization attempt ${attempt}/5 ==="

            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd
            cp epg/epg.xml /tmp/previous-epg.xml 2>/dev/null || true

            # Report generators are strict: a generator failure stops publication.
            # Only audit/gate commands are allowed to return a blocking status because
            # their reports are deliberately published for diagnosis.
            python scripts/generate_metadata_backfill_report.py
            python scripts/audit_playlist.py || true
            python scripts/pre_publish_gate.py || true
            python scripts/epg_coverage.py
            python scripts/generate_logo_authenticity_manifest.py
            python scripts/generate_logo_provenance_review.py
            python scripts/generate_metadata_normalization_report.py
            python scripts/report_iptv_fragile_streams.py
            python scripts/stream_risk_review.py
            python scripts/stream_health.py

            # Refresh the published XMLTV guide from the same playlist/report-sync
            # snapshot. Never replace a known-good guide when the publication gate fails.
            python scripts/check_epg_config.py
            python scripts/fetch_iptv_org_epg.py
            python scripts/run_generate_epg.py
            test -s epg/epg.xml
            grep -q '<programme ' epg/epg.xml
            python scripts/epg_publish_gate.py
            if [ $? -ne 0 ]; then
              echo '::warning::EPG publish gate blocked the new guide; restoring the previous known-good guide.'
              if [ -s /tmp/previous-epg.xml ] && grep -q '<programme ' /tmp/previous-epg.xml; then
                cp /tmp/previous-epg.xml epg/epg.xml
              else
                echo '::error::No valid previous EPG is available after a publish-gate failure.'
                exit 1
              fi
            else
              echo 'EPG publish gate passed; accepting the regenerated guide.'
            fi

            python scripts/sync_epg_worker_map.py
            python scripts/epg_coverage.py
            python scripts/generate_dashboard.py

            # Generated reports must be fresh and fingerprinted against the exact
            # playlist that is about to be published. This is a hard gate.
            python scripts/validate_report_freshness.py --mode generated

            git add reports/ assets/dashboard.svg epg/epg.xml
            if git diff --cached --quiet; then
              echo 'Reports and EPG are already synchronized with the current playlist.'
              exit 0
            fi

            git commit -m 'Synchronize IPTV generated reports and EPG'
            base_sha="$(git rev-parse HEAD^1)"

            if git push --force-with-lease="refs/heads/main:${base_sha}" origin HEAD:main; then
              echo 'Synchronized reports and EPG published successfully.'
              exit 0
            fi

            echo 'main changed before publication; discarding generated commit and regenerating.'
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd
            sleep 2
          done

          echo '::error::Unable to publish synchronized reports and EPG after 5 clean regeneration attempts.'
          exit 1
