name: One-time BDIX last four logos
on:
  push:
    paths:
      - .github/workflows/import-bdix-last-four.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check pillow cairosvg
      - run: |
          python - <<'PY'
          import io,re,ssl,urllib.request
          from pathlib import Path
          from PIL import Image
          import cairosvg
          P=Path("BDIX-Playlist.m3u");L=Path("logos");R="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/";C=ssl._create_unverified_context()
          S={
          "ISHAARA TV":["https://ishara.tv/wp-content/uploads/2023/01/Ishara-TV-logo.png","https://www.ishara.tv/wp-content/uploads/2023/01/Ishara-TV-logo.png"],
          "NDTV":["https://www.ndtv.com/static/images/ndtvlogo.png","https://www.ndtv.com/favicon.ico"],
          "IN: SONY SPORTS TEN 2 HD":["https://www.sonypicturesnetworks.com/images/logos/SONY_SportsTen2_HD_Logo_CLR.png","https://raw.githubusercontent.com/subirkumarpaul/Logo/56e54462053b1b278b80b532c89c01f17e360fd5/Sony%20Sports%20Ten%202.png"],
          "PK: GEO SUPER":["https://www.geo.tv/assets/images/geo-super.png","https://www.geo.tv/assets/images/geo-super-logo.png"]
          }
          def get(u):
            q=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(q,timeout=12,context=C) as r:return r.read(),r.headers.get("Content-Type","")
          def slug(s):return re.sub(r"[^a-z0-9]+","-",s.lower()).strip("-")
          ls=P.read_text(encoding="utf-8-sig").replace("\r","").splitlines()
          for name,urls in S.items():
            for u in urls:
              try:
                d,ct=get(u)
                try: im=Image.open(io.BytesIO(d)).convert("RGBA")
                except: im=Image.open(io.BytesIO(cairosvg.svg2png(bytestring=d,output_width=1000))).convert("RGBA")
                fn=slug(name)+".png";im.save(L/fn,"PNG",optimize=True);ref=R+fn
                for i,l in enumerate(ls):
                  if l.startswith("#EXTINF") and name.lower() in l.lower():
                    c=l.find(",");ls[i]=l[:c]+' tvg-logo="'+ref+'"'+l[c:];break
                print("OK",name);break
              except Exception as e:print("MISS",name,u,e)
          P.write_text("\n".join(ls).rstrip()+"\n",encoding="utf-8")
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/import-bdix-last-four.yml .github/workflows/import-bdix-final-logo-cleanup.yml .github/workflows/import-bdix-logo-catalogue.yml .github/workflows/import-bdix-missing-logos-v2.yml .github/workflows/import-bdix-missing-logos.yml
          git add BDIX-Playlist.m3u logos/ .github/workflows/
          git commit -m "Add final BDIX channel logos"
          git push origin HEAD:main
