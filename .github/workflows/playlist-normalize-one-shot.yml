name: One-time IPTV Playlist Logo Conversion and Orphan Recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/playlist-normalize-one-shot.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SVG converter
        run: python -m pip install --disable-pip-version-check cairosvg

      - name: Convert referenced SVGs and normalize playlist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import re
          import cairosvg

          playlist = Path("IPTV-Playlist.m3u")
          raw = playlist.read_text(encoding="utf-8")
          lines = raw.splitlines()
          first = next((i for i, line in enumerate(lines) if line.startswith("#EXTINF:")), None)
          if first is None:
              raise SystemExit("No EXTINF records found")

          prefix = lines[:first]
          records = []
          current = []
          for line in lines[first:]:
              if line.startswith("#EXTINF:") and current:
                  records.append(current)
                  current = [line]
              else:
                  current.append(line)
          if current:
              records.append(current)

          def attr(meta, key):
              match = re.search(r'\b' + re.escape(key) + r'="([^"]*)"', meta)
              return match.group(1) if match else None

          def set_attr(meta, key, value):
              pattern = r'\b' + re.escape(key) + r'="[^"]*"'
              if re.search(pattern, meta):
                  return re.sub(pattern, f'{key}="{value}"', meta, count=1)
              name_match = re.search(r'\btvg-name="[^"]*"', meta)
              if name_match:
                  pos = name_match.end()
                  return meta[:pos] + f' {key}="{value}"' + meta[pos:]
              return meta.replace("#EXTINF:-1", f'#EXTINF:-1 {key}="{value}"', 1)

          def group(rec):
              return attr(rec[0], "group-title")

          def name(rec):
              return rec[0].split(",", 1)[1].strip() if "," in rec[0] else ""

          def stream_url(rec):
              return next((line.strip() for line in rec[1:] if line.strip() and not line.lstrip().startswith("#")), "")

          def sort_key(value):
              return re.sub(r'[^a-z0-9]', '', value.casefold())

          # Convert every SVG logo referenced by this playlist; keep the SVG originals in place.
          logo_map = {
              "ja-tv.svg": "ja-tv.png",
              "mh-one-movies.svg": "mh-one-movies.png",
              "mh-one-dil-se.svg": "mh-one-dil-se.png",
              "ntv-malayalam.svg": "ntv-malayalam.png",
              "nvisionbd-verified-zee-tv-2fb6673cf7.svg": "nvisionbd-verified-zee-tv-2fb6673cf7.png",
              "radio-norba-tv.svg": "radio-norba-tv.png",
          }
          for source_name, target_name in logo_map.items():
              source = Path("logos") / source_name
              target = Path("logos") / target_name
              if not source.is_file():
                  raise SystemExit(f"Missing source SVG: {source}")
              cairosvg.svg2png(url=str(source), write_to=str(target))
              if not target.is_file() or target.stat().st_size < 100:
                  raise SystemExit(f"PNG conversion failed or produced an empty file: {target}")

          # Rewrite playlist logo references to the new local PNG assets.
          for rec in records:
              for old, new in logo_map.items():
                  rec[0] = rec[0].replace(f"/logos/{old}", f"/logos/{new}")

          # Promote one canonical feed per orphan channel. Keep alternate feeds in Backup
          # and leave the known failed candidates in Review.
          promotions = [
              {
                  "id": "DurontoTV.bd",
                  "url": "https://tvsen6.aynaott.com/6xyZ3N4oHv2KBJdB6W4p/index.m3u8",
                  "target": "Kids",
                  "chno": "492",
              },
              {
                  "id": "KhushbooBangla.in@SD",
                  "url": "https://mumt01.tangotv.in/O5aw8Zn3KHUSHBOOTVBANGLA/index.m3u8",
                  "target": "Indian Bangla",
                  "chno": "60",
              },
          ]
          moved = []
          for rule in promotions:
              candidates = [
                  rec for rec in records
                  if attr(rec[0], "tvg-id") == rule["id"]
                  and group(rec) == "Backup"
                  and stream_url(rec) == rule["url"]
              ]
              if len(candidates) != 1:
                  raise SystemExit(
                      f"Expected exactly one Backup candidate for {rule['id']}, found {len(candidates)}"
                  )
              rec = candidates[0]
              rec[0] = set_attr(rec[0], "group-title", rule["target"])
              rec[0] = set_attr(rec[0], "tvg-chno", rule["chno"])
              moved.append((rec, rule))

              # The same channel number was retained on its failed Review feed.
              # Move the channel number to the promoted working candidate, not the Review copy.
              for review in records:
                  if attr(review[0], "tvg-id") == rule["id"] and group(review) == "Review":
                      if attr(review[0], "tvg-chno") == rule["chno"]:
                          review[0] = re.sub(
                              r'\s+tvg-chno="' + re.escape(rule["chno"]) + r'"',
                              "",
                              review[0],
                              count=1,
                          )

          # Remove the promoted blocks from their old positions and insert them in A-Z order
          # within the destination groups, leaving every other channel block unchanged.
          for rec, rule in moved:
              records.remove(rec)
              eligible = [i for i, other in enumerate(records) if group(other) == rule["target"]]
              insert_at = next(
                  (i for i in eligible if sort_key(name(records[i])) > sort_key(name(rec))),
                  (eligible[-1] + 1) if eligible else len(records),
              )
              records.insert(insert_at, rec)

          final_lines = prefix + [line for rec in records for line in rec]
          playlist.write_text("\n".join(final_lines) + "\n", encoding="utf-8")

          # Validate essential metadata and every referenced local logo before committing.
          required = ("tvg-id", "tvg-name", "tvg-logo", "channel-id", "tvg-country", "tvg-language", "group-title")
          errors = []
          for rec in records:
              meta = rec[0]
              for key in required:
                  if not attr(meta, key):
                      errors.append(f"{name(rec)} missing {key}")
              logo_url = attr(meta, "tvg-logo") or ""
              logo_path = urlparse(logo_url).path
              if "/logos/" not in logo_path:
                  errors.append(f"{name(rec)} has non-local logo URL: {logo_url}")
              else:
                  local = Path("logos") / logo_path.split("/logos/", 1)[1]
                  if not local.is_file():
                      errors.append(f"{name(rec)} references missing logo: {local}")
              if logo_url.lower().endswith(".svg"):
                  errors.append(f"{name(rec)} still references SVG logo: {logo_url}")

          if errors:
              raise SystemExit("Playlist validation failed:\n" + "\n".join(errors[:50]))

          for rule in promotions:
              active = [
                  rec for rec in records
                  if attr(rec[0], "tvg-id") == rule["id"] and group(rec) == rule["target"]
              ]
              if len(active) != 1:
                  raise SystemExit(f"Expected one active {rule['id']} in {rule['target']}, found {len(active)}")

          print(f"Validated {len(records)} channel entries")
          print(f"Converted {len(logo_map)} referenced SVG assets to PNG")
          for rec, rule in moved:
              print(f"Promoted {rule['id']} -> {rule['target']} (tvg-chno {rule['chno']})")
          print("All required metadata and local logo paths validated; no playlist SVG references remain.")
          PY

      - name: Commit normalized playlist and PNG assets
        shell: bash
        run: |
          rm .github/workflows/playlist-normalize-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPTV-Playlist.m3u logos/*.png .github/workflows/playlist-normalize-one-shot.yml
          git commit -m "Audit IPTV metadata and normalize local channel logos"
          git pull --rebase origin main
          git push origin HEAD:main
