name: Import selected source channels

on:
  push:
    paths:
      - '.github/workflows/import-source-channels.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and normalize logos
        env:
          LOGOS: |
            orange-bangla-tv|https://static.wikia.nocookie.net/etv-gspn-bangla/images/e/e5/Orange_Bangla_logo_%282018%29.png
            b4u-movies-india|https://static.wikia.nocookie.net/logopedia/images/1/1b/B4U_MOVIES_2014.png
            shemaroo-bollywood-2|https://a.jsrdn.com/hls/23141/shemaroo-bollywood/logo_20240206_185308_68.png
            b4u-music-india|https://static.wikia.nocookie.net/logopedia/images/d/dc/B4U_Music_logo_2014.png
            music-india-hd|https://static.wikia.nocookie.net/logopedia/images/2/2f/Music_India.jpeg
            california-music-channel|https://static.wikia.nocookie.net/logopedia/images/3/3a/CMC_logo.png
            intravel|https://s3.aynaott.com/storage/b35e9c1bcde3e6876892a22f91a9c4b5
            travel-xp-english-eu|https://raw.githubusercontent.com/subirkumarpaul/Logo/main/Travel%20XP.png
            pitaara-tv|https://a.jsrdn.com/hls/23049/pitaara-tv/logo_20231219_220959_63.png
            filamchi-bhojpuri|https://static.wikia.nocookie.net/logopedia/images/5/58/Filamchi_Bhojpuri_new.png
            dd-urdu|https://prodcdn1.wavespb.com/shows/poster_url/1423354137DD_URDU______720x960.webp
            epic-tv|https://static.wikia.nocookie.net/logopedia/images/4/41/Epic_TV_%282021%29.jpg
            gangaur|https://prodcdn1.wavespb.com/shows/poster_url/1615915601Gangaur_TV____720x960.webp
            nazara|https://www.epicon.in/img/nazara-logo.png
            ptc-punjabi-gold|https://prodcdn1.wavespb.com/shows/poster_url/1276523660PTCPUNJABIGOLD_TVSETS_TVW_720x960.webp
        run: |
          python - <<'PY'
          import os, io, requests
          from PIL import Image
          os.makedirs("logos", exist_ok=True)
          for row in os.environ["LOGOS"].splitlines():
              if not row.strip(): continue
              name, url = row.split("|", 1)
              r = requests.get(url, headers={"User-Agent":"Mozilla/5.0"}, timeout=30)
              r.raise_for_status()
              im = Image.open(io.BytesIO(r.content)).convert("RGBA")
              im.save(f"logos/{name}.png", "PNG", optimize=True)
          PY

      - name: Add channels and backups
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path("IPTV-Playlist.m3u")
          s=p.read_text(encoding="utf-8")

          new = [
          '#EXTINF:-1 tvg-id="OrangeBanglaTV.in@SD" tvg-name="Orange Bangla TV" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/orange-bangla-tv.png" tvg-chno="1028" channel-id="OrangeBanglaTV.in@SD" tvg-language="ben" tvg-country="IN" group-title="New Channels",Orange Bangla TV\nhttps://cdn.pishow.tv/ott/live/1499/master.m3u8',
          '#EXTINF:-1 tvg-id="B4UMovies.in@HD" tvg-name="B4U Movies India" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/b4u-movies-india.png" tvg-chno="1029" channel-id="B4UMovies.in@HD" tvg-language="hin" tvg-country="IN" group-title="New Channels",B4U Movies India\nhttps://amg00877-b4unew-amg00877c2-xiaomi-in-5489.playouts.now.amagi.tv/playlist.m3u8',
          '#EXTINF:-1 tvg-id="ShemarooBollywood.in@HD" tvg-name="Shemaroo Bollywood 2" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/shemaroo-bollywood-2.png" tvg-chno="1030" channel-id="ShemarooBollywood.in@HD" tvg-language="hin" tvg-country="IN" group-title="New Channels",Shemaroo Bollywood 2\nhttps://cdn-uw2-prod.tsv2.amagi.tv/linear/amg00864-shemarooenterta-shemabollywood-ono/playlist.m3u8',
          '#EXTINF:-1 tvg-id="B4UMusic.in@HD" tvg-name="B4U Music India" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/b4u-music-india.png" tvg-chno="1031" channel-id="B4UMusic.in@HD" tvg-language="hin" tvg-country="IN" group-title="New Channels",B4U Music India\nhttps://cdn.pishow.tv/ott/live/415/master.m3u8',
          '#EXTINF:-1 tvg-id="MUSICINDIA.in@HD" tvg-name="Music India HD" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/music-india-hd.png" tvg-chno="1032" channel-id="MUSICINDIA.in@HD" tvg-language="hin" tvg-country="IN" group-title="New Channels",Music India HD\nhttps://cdn.pishow.tv/ott/live/226/master.m3u8',
          '#EXTINF:-1 tvg-id="CaliforniaMusicChannel.us@HD" tvg-name="California Music Channel" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/california-music-channel.png" tvg-chno="1033" channel-id="CaliforniaMusicChannel.us@HD" tvg-language="eng" tvg-country="US" group-title="New Channels",California Music Channel\nhttps://cmc-ono.amagi.tv/playlist.m3u8',
          '#EXTINF:-1 tvg-id="InTravel.in@HD" tvg-name="InTravel" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/intravel.png" tvg-chno="1034" channel-id="InTravel.in@HD" tvg-language="eng" tvg-country="IN" group-title="New Channels",InTravel\nhttps://amg00861-amg00861c10-rakuten-uk-3152.playouts.now.amagi.tv/playlist.m3u8',
          '#EXTINF:-1 tvg-id="TravelXPEnglish.eu@HD" tvg-name="Travel XP English EU" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/travel-xp-english-eu.png" tvg-chno="1035" channel-id="TravelXPEnglish.eu@HD" tvg-language="eng" tvg-country="EU" group-title="New Channels",Travel XP English EU\nhttps://travelxp-travelxp-1-eu.rakuten.wurl.tv/3000.m3u8',
          '#EXTINF:-1 tvg-id="PitaaraTV.in@HD" tvg-name="Pitaara TV" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/pitaara-tv.png" tvg-chno="1036" channel-id="PitaaraTV.in@HD" tvg-language="pan" tvg-country="IN" group-title="New Channels",Pitaara TV\nhttps://vg-pitaaratvlive.akamaized.net/v1/master/611d79b11b77e2f571934fd80ca1413453772ac7/vglive-sk-583798/playlist.m3u8',
          '#EXTINF:-1 tvg-id="FilamchiBhojpuri.in@SD" tvg-name="Filamchi Bhojpuri" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/filamchi-bhojpuri.png" tvg-chno="1037" channel-id="FilamchiBhojpuri.in@SD" tvg-language="bho;hin" tvg-country="IN" group-title="New Channels",Filamchi Bhojpuri\nhttps://epiconvh.akamaized.net/live/filamchi/master.m3u8',
          '#EXTINF:-1 tvg-id="DDUrdu.in@SD" tvg-name="DD Urdu" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/dd-urdu.png" tvg-chno="1038" channel-id="DDUrdu.in@SD" tvg-language="urd" tvg-country="IN" group-title="New Channels",DD Urdu\nhttps://d3qs3d2rkhfqrt.cloudfront.net/out/v1/9b91e9007e754db39a8b32c6bfc5b24a/index.m3u8',
          '#EXTINF:-1 tvg-id="EpicTV.in@SD" tvg-name="Epic TV" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/epic-tv.png" tvg-chno="1039" channel-id="EpicTV.in@SD" tvg-language="hin" tvg-country="IN" group-title="New Channels",Epic TV\nhttps://epiconvh.akamaized.net/live/epic/master.m3u8',
          '#EXTINF:-1 tvg-id="Gangaur.in@SD" tvg-name="Gangaur" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/gangaur.png" tvg-chno="1040" channel-id="Gangaur.in@SD" tvg-language="hin" tvg-country="IN" group-title="New Channels",Gangaur\nhttps://pbgangaur.wiseplayout.com/Gangaur/master.m3u8',
          '#EXTINF:-1 tvg-id="Nazara.in@HD" tvg-name="Nazara" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/nazara.png" tvg-chno="1041" channel-id="Nazara.in@HD" tvg-language="hin" tvg-country="IN" group-title="New Channels",Nazara\nhttps://cc-p1izg43bk7sj5.akamaized.net/v1/master/3722c60a815c199d9c0ef36c5b73da68a62b09d1/cc-p1izg43bk7sj5/DIYC/PMSL/IN10/Nazara_IN_B/Nazara_IN_B.m3u8',
          '#EXTINF:-1 tvg-id="PTCPunjabiGold.in@HD" tvg-name="PTC Punjabi Gold" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/ptc-punjabi-gold.png" tvg-chno="1042" channel-id="PTCPunjabiGold.in@HD" tvg-language="pan" tvg-country="IN" group-title="New Channels",PTC Punjabi Gold\nhttps://d3qs3d2rkhfqrt.cloudfront.net/out/v1/6e14bac6d0384e129521a4d005188bfb/index.m3u8',
          ]

          backups = [
          '#EXTINF:-1 tvg-id="9XJhakaas.in" tvg-name="9X Jhakaas" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/9x-jhakaas.png" channel-id="9XJhakaas.in" group-title="Backup",9X Jhakaas [Backup 2]\nhttps://amg01281-9xmediapvtltd-9xjhakaas-samsungin-ci2cs.amagi.tv/playlist/amg01281-9xmediapvtltd-9xjhakaas-samsungin/playlist.m3u8',
          '#EXTINF:-1 tvg-id="9XTashan.in" tvg-name="9X Tashan" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/9x-tashan.png" channel-id="9XTashan.in" group-title="Backup",9X Tashan [Backup 2]\nhttps://amg01281-9xmediapvtltd-9xtashan-samsungin-xz1sd.amagi.tv/playlist/amg01281-9xmediapvtltd-9xtashan-samsungin/playlist.m3u8',
          '#EXTINF:-1 tvg-id="Dangal2.in" tvg-name="Dangal 2" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/dangal-2.png" channel-id="Dangal2.in" group-title="Backup",Dangal 2 [Backup 3]\nhttps://streams.tangotv.in/DANGAL2/ORIGIN/index.m3u8',
          '#EXTINF:-1 tvg-id="SonyAath.in" tvg-name="Sony Aath" tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/sony-aath.png" channel-id="SonyAath.in" group-title="Backup",Sony Aath [Backup 3]\nhttps://cloudplay-sonyliv.pages.dev/aath.m3u8',
          ]

          # Append fresh channels to the existing New Channels block.
          s=s.rstrip()+"\n\n"+"\n".join(new)+"\n"

          # Insert backups into the existing Backup block, immediately before Not Playing.
          marker=re.search(r'(?m)^#EXTINF:.*group-title="Not Playing"',s)
          if not marker:
              raise SystemExit("Existing Not Playing section not found; refusing to place backups.")
          pos=marker.start()
          s=s[:pos].rstrip()+"\n\n"+"\n".join(backups)+"\n"+s[pos:]

          # Prevent duplicate stream URLs and validate new IDs/chno.
          lines=s.splitlines()
          urls=[]; chnos=[]; ids=[]
          for i,line in enumerate(lines):
              if line.startswith("#EXTINF:"):
                  m=re.search(r'tvg-id="([^"]+)"',line); 
                  if m: ids.append(m.group(1))
                  m=re.search(r'tvg-chno="([^"]+)"',line)
                  if m: chnos.append(m.group(1))
                  if i+1<len(lines) and lines[i+1].startswith(("http://","https://")): urls.append(lines[i+1])
          if len(urls)!=len(set(urls)): raise SystemExit("Duplicate stream URL detected.")
          if len(chnos)!=len(set(chnos)): raise SystemExit("Duplicate tvg-chno detected.")
          if len(ids)!=len(set(ids)): raise SystemExit("Duplicate tvg-id detected.")
          if any("group-title=\"New Channels\"" in line and "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/" not in line for line in lines if line.startswith("#EXTINF:")):
              raise SystemExit("External logo detected in New Channels.")
          p.write_text(s,encoding="utf-8")
          print("Imported 15 new channels and 4 backups.")
          PY

      - name: Validate imported entries
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("IPTV-Playlist.m3u").read_text(encoding="utf-8")
          assert s.count('group-title="New Channels"') >= 42
          assert s.count('group-title="Backup"') >= 1
          for n in range(1028,1043):
              assert f'tvg-chno="{n}"' in s, n
          for f in [
            "orange-bangla-tv.png","b4u-movies-india.png","shemaroo-bollywood-2.png",
            "b4u-music-india.png","music-india-hd.png","california-music-channel.png",
            "intravel.png","travel-xp-english-eu.png","pitaara-tv.png","filamchi-bhojpuri.png",
            "dd-urdu.png","epic-tv.png","gangaur.png","nazara.png","ptc-punjabi-gold.png"
          ]:
              assert Path("logos",f).exists(), f
          print("Validation passed.")
          PY

      - name: Commit playlist and logos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPTV-Playlist.m3u logos/
          git commit -m "Add selected channels and backup streams from six sources"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/import-source-channels.yml
          git commit -m "Remove temporary source import workflow"
          git push
