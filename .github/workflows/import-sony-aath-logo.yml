name: Import Sony AATH logo

on:
  push:
    paths:
      - ".github/workflows/import-sony-aath-logo.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Sony AATH logo
        run: |
          set -e
          curl -L --fail --retry 3 --max-time 30 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Sony_Aath_new.png" \
            -o logos/sony-aath.png
          file logos/sony-aath.png
          test -s logos/sony-aath.png

      - name: Update only Sony 8 logo reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("IPTV-Playlist.m3u")
          lines = p.read_text(encoding="utf-8").splitlines()
          changed = 0
          out = []
          for line in lines:
              if 'tvg-id="Sony8.in@SD"' in line and 'group-title="New Channels"' in line:
                  if 'tvg-logo=' not in line:
                      line = line.replace(' channel-id="Sony8.in@SD"', ' tvg-logo="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/sony-aath.png" channel-id="Sony8.in@SD"', 1)
                      changed += 1
              out.append(line)
          if changed != 1:
              raise SystemExit(f"Expected exactly 1 Sony 8 metadata line to change; changed={changed}")
          p.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit
        run: |
          set -e
          rm -f .github/workflows/import-sony-aath-logo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos/sony-aath.png IPTV-Playlist.m3u .github/workflows/import-sony-aath-logo.yml
          git commit -m "Import Sony AATH logo for Sony 8"
          git push
