name: Live Dashboard

on:
  schedule:
    - cron: '45 */6 * * *'
      timezone: 'Asia/Dhaka'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'IPTV-Playlist.m3u'
      - 'reports/playlist-audit.md'
      - 'reports/stream-health.md'
      - 'reports/epg-coverage.md'
      - 'scripts/generate_dashboard.py'
      - '.github/workflows/live-dashboard.yml'

permissions:
  contents: write

concurrency:
  group: live-dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate dashboard
        run: python scripts/generate_dashboard.py
      - name: Commit dashboard
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- reports/dashboard.md assets/dashboard.svg; then
            echo "Dashboard is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/dashboard.md assets/dashboard.svg
          git commit -m "Update live project dashboard"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            python scripts/generate_dashboard.py
            git add reports/dashboard.md assets/dashboard.svg
            git diff --cached --quiet || git commit --amend --no-edit
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
