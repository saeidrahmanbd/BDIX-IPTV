name: EPG Coverage

on:
  schedule:
    - cron: '30 */12 * * *'
      timezone: 'Asia/Dhaka'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/epg_coverage.py'
      - '.github/workflows/epg-coverage.yml'
      - 'IPTV-Playlist.m3u'
      - 'xtream/worker.js'

permissions:
  contents: write

# Coverage verification pass after playlist updates.
concurrency:
  group: epg-coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build EPG coverage report
        run: python scripts/epg_coverage.py
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            # Rebuild from the latest main so concurrent playlist/workflow
            # commits cannot make the generated report conflict during rebase.
            git fetch origin main
            git reset --hard origin/main
            python scripts/epg_coverage.py
            if [ -z "$(git status --porcelain -- reports/epg-coverage.md)" ]; then
              echo 'No EPG coverage changes.'
              exit 0
            fi
            git add reports/epg-coverage.md
            git commit -m 'Update EPG coverage report'
            if git push origin HEAD:main; then
              exit 0
            fi
            git reset --hard origin/main
            sleep 3
          done
          exit 1