name: Deploy BDIX-IPTV Website and EPG to GitHub Pages

on:
  workflow_run:
    workflows: ["Refresh IPTV EPG"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bdix-iptv-pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Assemble the existing website and current EPG
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/index.html
          test -s epg/epg.xml
          grep -q '<programme ' epg/epg.xml

          rm -rf _site
          mkdir -p _site
          cp -a docs/. _site/
          install -m 0644 epg/epg.xml _site/epg.xml

          test -s _site/index.html
          test -s _site/epg.xml
          echo "Website files: $(find _site -type f | wc -l)"
          echo "EPG size: $(wc -c < _site/epg.xml) bytes"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site/
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
