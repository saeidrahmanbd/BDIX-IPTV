name: Discovery Schedule Watchdog
# GitHub schedule events are best-effort. Staggered checkpoints independently
# recover missed discovery AND stream-health runs throughout the Bangladesh morning.
# The guard inspects each workflow's real writer/check job, not wrapper conclusions.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discovery-schedule-watchdog.yml'
      - 'scripts/discovery_schedule_guard.py'
  schedule:
    - cron: '15 1 * * *'  # 07:15 Asia/Dhaka: discovery recovery
    - cron: '45 1 * * *'  # 07:45 Asia/Dhaka: discovery recovery
    - cron: '15 2 * * *'  # 08:15 Asia/Dhaka: final discovery recovery
    - cron: '15 3 * * *'  # 09:15 Asia/Dhaka: stream-health recovery
    - cron: '15 4 * * *'  # 10:15 Asia/Dhaka: final stream-health recovery

permissions:
  actions: write
  contents: read

# Serialize checks; official discovery workflows also have a per-day guard.
concurrency:
  group: discovery-schedule-watchdog
  cancel-in-progress: false
  queue: max

jobs:
  recover_missing_discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Dispatch only workflows with no run for today's Bangladesh date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/discovery_schedule_guard.py watchdog \
            new-channel-discovery.yml \
            international-channel-discovery.yml \
            international-stream-health.yml
