name: Discovery Schedule Watchdog
# GitHub schedule events are best-effort. Staggered checkpoints recover missed
# discovery, logo, stream-health and EPG jobs before the 07:00 BDT cutoff.
# The guard inspects each workflow's real writer/check job, not wrapper conclusions.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discovery-schedule-watchdog.yml'
      - 'scripts/discovery_schedule_guard.py'
  schedule:
    - cron: '25 23 * * *'  # 05:25 early checkpoint
    - cron: '40 23 * * *'  # 05:40 maintenance/discovery recovery
    - cron: '55 23 * * *'  # 05:55 logo/stream-health recovery
    - cron: '10 0 * * *'   # 06:10 final stream-health checkpoint
    - cron: '15 0 * * *'   # 06:15 EPG recovery
    - cron: '30 0 * * *'   # 06:30 post-EPG checkpoint
    - cron: '45 0 * * *'   # 06:45 final recovery checkpoint
    - cron: '55 0 * * *'   # 06:55 last checkpoint

permissions:
  actions: write
  contents: read

# Serialize checks; official discovery workflows also have a per-day guard.
concurrency:
  group: discovery-schedule-watchdog
  cancel-in-progress: false
  queue: max

jobs:
  recover_missing_discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Dispatch only workflows with no run for today's Bangladesh date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/discovery_schedule_guard.py watchdog \
            iptv-maintenance.yml \
            new-channel-discovery.yml \
            international-channel-discovery.yml \
            playlist-logo-localization.yml \
            international-stream-health.yml \
            epg-refresh.yml
