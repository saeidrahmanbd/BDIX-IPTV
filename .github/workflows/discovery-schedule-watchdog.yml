name: Discovery Schedule Watchdog
# GitHub schedule events are best-effort and may be delayed or dropped.
# Independent checkpoints plus workflow-completion callbacks recover missed
# production jobs throughout the Bangladesh morning. A push to this file also
# provides an immediate recovery trigger when GitHub drops every scheduled
# event for a date. The guard checks each
# workflow's actual writer/probe job, not wrapper conclusions.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discovery-schedule-watchdog.yml'
      - 'scripts/discovery_schedule_guard.py'
      # Daily report commits are independent evidence that the primary
      # schedules may have been missed. Use them to wake the recovery watchdog.
      - 'reports/iptv-channel-discovery.md'
      - 'reports/international-channel-discovery.md'
  # A completed production writer is a second recovery signal. The watchdog
  # rechecks all due jobs and dispatches only missing/failed work for today's
  # Bangladesh date; per-workflow guards and writer locks prevent duplicates.
  workflow_run:
    workflows:
      - IPTV Playlist Update
      - IPTV New Channel Discovery
      - International Channel Discovery
      - Playlist Logo Repair and Localization
      - International Stream Health
      - Refresh IPTV EPG
      - Daily Xtream Health Check
    types: [completed]
    branches: [main]
  # On-demand recovery check. Every schedule checkpoint below shares GitHub's
  # scheduled-event delay/drop failure mode, so the owner (or an external
  # scheduler) needs a way to run the same idempotent check without a code push.
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * *'  # 05:15 early discovery checkpoint
    - cron: '30 23 * * *'  # 05:30 discovery recovery
    - cron: '45 23 * * *'  # 05:45 logo recovery
    - cron: '0 0 * * *'    # 06:00 International health recovery
    - cron: '15 0 * * *'   # 06:15 maintenance recovery
    - cron: '30 0 * * *'   # 06:30 EPG recovery
    - cron: '45 0 * * *'   # 06:45 final recovery checkpoint
    - cron: '55 0 * * *'   # 06:55 last early checkpoint
    - cron: '15 1 * * *'   # 07:15 independent morning recovery
    - cron: '15 2 * * *'   # 08:15 independent morning recovery
    - cron: '15 3 * * *'   # 09:15 independent morning recovery
    - cron: '15 4 * * *'   # 10:15 final recovery checkpoint

permissions:
  actions: write
  contents: read

# Serialize checks; official workflows also have a per-day guard and writer lock.
concurrency:
  group: discovery-schedule-watchdog
  cancel-in-progress: false
  queue: max

jobs:
  recover_missing_discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Dispatch only workflows with no successful required job for today's Bangladesh date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/discovery_schedule_guard.py watchdog \
            iptv-maintenance.yml \
            new-channel-discovery.yml \
            international-channel-discovery.yml \
            playlist-logo-localization.yml \
            international-stream-health.yml \
            epg-refresh.yml \
            check-xtream.yml
