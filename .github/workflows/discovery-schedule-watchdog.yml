name: Discovery Schedule Watchdog
# GitHub's schedule trigger is best-effort, especially at minute 00.
# The official discovery workflows run at 07:00 BDT; these two spaced
# recovery checkpoints dispatch only workflows with no successful/active run today.
on:
  schedule:
    - cron: '15 1 * * *'  # 07:15 Asia/Dhaka: first recovery checkpoint
    - cron: '15 2 * * *'  # 08:15 Asia/Dhaka: final recovery checkpoint

permissions:
  actions: write
  contents: read

# Serialize checks; official discovery workflows also have a per-day guard.
concurrency:
  group: discovery-schedule-watchdog
  cancel-in-progress: false
  queue: max

jobs:
  recover_missing_discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Dispatch only workflows with no run for today's Bangladesh date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/discovery_schedule_guard.py watchdog \
            new-channel-discovery.yml \
            international-channel-discovery.yml
