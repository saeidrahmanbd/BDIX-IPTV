name: Discovery Schedule Watchdog
# GitHub schedule events are best-effort. Staggered checkpoints independently
# recover missed discovery AND stream-health runs throughout the Bangladesh morning.
# The guard inspects each workflow's real writer/check job, not wrapper conclusions.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discovery-schedule-watchdog.yml'
      - 'scripts/discovery_schedule_guard.py'
  schedule:
    - cron: '15 1 * * *'  # 07:15 early checkpoint
    - cron: '30 1 * * *'  # 07:30 maintenance/discovery recovery
    - cron: '45 1 * * *'  # 07:45 second discovery checkpoint
    - cron: '15 2 * * *'  # 08:15 final discovery checkpoint
    - cron: '30 2 * * *'  # 08:30 full logo recovery
    - cron: '15 3 * * *'  # 09:15 stream-health recovery
    - cron: '30 3 * * *'  # 09:30 EPG recovery
    - cron: '15 4 * * *'  # 10:15 final checkpoint
    - cron: '15 5 * * *'  # 11:15 last checkpoint

permissions:
  actions: write
  contents: read

# Serialize checks; official discovery workflows also have a per-day guard.
concurrency:
  group: discovery-schedule-watchdog
  cancel-in-progress: false
  queue: max

jobs:
  recover_missing_discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Dispatch only workflows with no run for today's Bangladesh date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/discovery_schedule_guard.py watchdog \
            iptv-maintenance.yml \
            new-channel-discovery.yml \
            international-channel-discovery.yml \
            playlist-logo-localization.yml \
            international-stream-health.yml \
            epg-refresh.yml
