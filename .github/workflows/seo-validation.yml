name: Validate Website SEO

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/validate_site_seo.py"
      - ".github/workflows/seo-validation.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/validate_site_seo.py"
      - ".github/workflows/seo-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-validation-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Validate public website SEO basics
        run: python scripts/validate_site_seo.py
