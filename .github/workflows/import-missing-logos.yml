name: One-time logo import
on:
  push:
    paths:
      - ".github/workflows/import-missing-logos.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download missing logos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logos
          download() {
            name="$1"; url="$2"
            echo "Downloading $name"
            curl -L --fail --retry 3 --connect-timeout 20 -A "Mozilla/5.0" "$url" -o "logos/$name"
            test -s "logos/$name"
          }

          download "and-pictures.png" "https://www.tvlogo.org/india/and-pictures-in.png"
          download "and-xplor-hd.png" "https://www.tvlogo.org/india/and-xplor-hd-in.png"
          download "and-prive-hd.png" "https://www.tvlogo.org/india/and-prive-hd-in.png"
          download "zing.png" "https://www.tvlogo.org/india/zing-in.png"
          download "star-bharat.png" "https://www.tvlogo.org/india/star-bharat-in.png"
          download "etv-bal-bharat.png" "https://www.tvlogo.org/india/etv-bal-bharat-in.png"
          download "hungama.png" "https://www.tvlogo.org/india/hungama-in.png"
          download "nick.png" "https://www.tvlogo.org/india/nick-in.png"
          download "super-hungama.png" "https://www.tvlogo.org/india/super-hungama-in.png"
          download "sony-sports-ten-4.png" "https://www.tvlogo.org/india/sony-ten-4-in.png"
          download "sony-sports-ten-5.png" "https://www.tvlogo.org/india/sony-ten-5-in.png"
          download "star-sports-1.png" "https://www.tvlogo.org/india/star-sports-1-in.png"
          download "star-sports-3.png" "https://www.tvlogo.org/india/star-sports-3-in.png"
          download "star-sports-select-1.png" "https://www.tvlogo.org/india/star-sports-select-1-in.png"
          download "star-sports-select-2.png" "https://www.tvlogo.org/india/star-sports-select-2-in.png"
          download "zee-bangla-cinema.png" "https://www.tvlogo.org/india/zee-bangla-cinema-in.png"
          download "zoom-music.png" "https://www.tvlogo.org/india/zoom-in.png"

          download "axn.svg" "https://upload.wikimedia.org/wikipedia/commons/a/a0/AXN_logo.svg"
          download "al-jazeera.svg" "https://upload.wikimedia.org/wikipedia/en/thumb/f/f2/Aljazeera_eng.svg/512px-Aljazeera_eng.svg.png"
          download "dw-news.jpg" "https://deultimominuto.net/wp-content/uploads/2022/03/DW-LOGO.jpg"
          download "bbc-news.png" "https://xstreamcp-assets-msp.streamready.in/assets/LIVETV/LIVECHANNEL/LIVETV_LIVETVCHANNEL_BBC_NEWS/images/LOGO_HD/image.png"
          download "geo-news.png" "http://103.176.90.118/picons/logos/logos/geonews.png"
          download "lotus-tv.png" "https://m3u-editor.com/storage/channel-logos/18176dc0-be36-11ed-9759-a96115e43b58/4824764/861295811.png"
          download "mn-plus.jpeg" "https://d229kpbsb5jevy.cloudfront.net/timesplay/content/common/logos/channel/logos/leazcc.jpeg"
          download "romedy-now.jpeg" "https://d229kpbsb5jevy.cloudfront.net/timesplay/content/common/logos/channel/logos/nchght.jpeg"
          download "ptv-sports.png" "https://upload.wikimedia.org/wikipedia/en/e/e4/PTV_Sports.png"
          download "stingray-music.svg" "https://upload.wikimedia.org/wikipedia/commons/7/79/Stingray_Music_logo.svg"
          download "pishow.svg" "https://cdn-4.pishow.tv/live/1143/master.m3u8"

          # Raj Music Telugu: use the existing Raj Music family mark already maintained in this project
          # and copy it under a dedicated filename.
          cp logos/raj-digital-plus.png logos/raj-music-telugu.png

          # Generic stream identifiers are not channel names; use the platform/family mark rather than inventing a channel logo.
          cp logos/stingray-music.svg logos/stingray-stream-101.svg
          cp logos/stingray-music.svg logos/stingray-stream-137.svg
          cp logos/pishow.svg logos/pishow-stream-10007.svg

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos
          git commit -m "Import missing channel logos" || exit 0
          git push
