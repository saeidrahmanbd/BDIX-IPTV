name: International Channel Discovery
# Fresh discovery trigger: 2026-10-30 01:05 UTC

# Fresh discovery run requested: 2026-10-29 01:16 UTC
# Force fresh discovery run: 2026-10-24 19:00 Asia/Dhaka
# Fresh current-main retry after shared playlist-writer queue fix (2026-10-26).
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/international-channel-discovery.yml'
      - 'scripts/discover_international_channels.py'
      - 'scripts/validate_international_playlist.py'
      - 'scripts/validate_discovery_run.py'
      - 'tests/test_international_discovery_policy.py'
      - 'tests/test_discovery_run_validation.py'
  schedule:
    - cron: '23 3 * * *' # 09:23 Asia/Dhaka (UTC+6)
  workflow_dispatch:

permissions:
  contents: write

# All playlist writers share one queue to protect main-branch playlist updates.
# Versioned writer queue isolates new runs from stale v2 runs already queued.
concurrency:
  group: iptv-playlist-main-writer-v4
  cancel-in-progress: false
  queue: max

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Snapshot playlist before discovery
        run: cp International-Playlist.m3u /tmp/International-Playlist.before.m3u
      - name: Test strict International movie/music policy
        run: python -m unittest discover -s tests -p 'test_international_discovery_policy.py'
      - name: Test discovery stream validator
        run: python -m unittest discover -s tests -p 'test_discovery_run_validation.py'
      - name: Compile discovery and validation scripts
        run: python -m py_compile scripts/discover_international_channels.py scripts/validate_international_playlist.py scripts/validate_discovery_run.py
      - name: Discover only Movies/Music channels and eligible backup streams
        run: python scripts/discover_international_channels.py
      - name: Enforce required playlist attribution
        run: python scripts/enforce_playlist_attribution.py International-Playlist.m3u
      - name: Verify newly discovered streams and local logos
        run: python scripts/validate_discovery_run.py probe International-Playlist.m3u reports/international-channel-discovery.md /tmp/International-Playlist.before.m3u international
      - name: Validate International playlist and discovery queues
        id: validate_international_playlist
        run: python scripts/validate_international_playlist.py
      - name: Record final discovery validation results
        if: always()
        env:
          OFFICIAL_VALIDATOR_OUTCOME: ${{ steps.validate_international_playlist.outcome }}
        run: python scripts/validate_discovery_run.py finalize International-Playlist.m3u reports/international-channel-discovery.md /tmp/International-Playlist.before.m3u international
      - name: Commit discovery changes
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'Validation status: PASS' reports/international-channel-discovery.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/international-channel-discovery.md
            if ! git diff --cached --quiet; then
              git commit -m 'Record International discovery validation blocker'
              git reset --hard HEAD
              git clean -fd
              for attempt in 1 2 3; do
                git fetch origin main
                git pull --rebase origin main || { git rebase --abort || true; exit 1; }
                if git push origin HEAD:main; then break; fi
              done
            fi
            echo '::error::International discovery validation failed; playlist/logo changes were not committed.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add International-Playlist.m3u reports/international-channel-discovery.md logos/ scripts/validate_discovery_run.py tests/test_discovery_run_validation.py
          if git diff --cached --quiet; then
            echo "No International discovery changes to publish."
            exit 0
          fi
          git commit -m 'Discover and add international channels'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::Rebase failed; International discovery changes were not pushed."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Push attempt \${attempt} failed; retrying after rebase."
            sleep 3
          done
          echo "::error::Unable to publish International discovery after three attempts."
          exit 1
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: international-channel-discovery
          path: reports/international-channel-discovery.md
          if-no-files-found: warn
          retention-days: 14
