name: Automation V2 Branch CI

on:
  push:
    branches:
      - main
      - automation-v2/**
    paths:
      - 'automation/**'
      - 'IPTV-Playlist.m3u'
      - 'International-Playlist.m3u'
      - 'epg/epg.xml'
      - 'logos/**'
      - 'tests/test_automation_v2_*.py'
      - 'scripts/audit_logo_references.py'
      - 'scripts/run_automation_v2_dry_run.py'
      - 'scripts/prepare_automation_v2_rollback_pr.py'
      - 'scripts/run_automation_v2_candidate_bundle.py'
      - 'scripts/build_automation_v2_diagnostics_snapshot.py'
      - 'scripts/build_automation_v2_logo_repair_candidates.py'
      - 'scripts/apply_automation_v2_approved_logo_candidates.py'
      - 'config/automation-v2/approved-logo-repairs.json'
      - 'scripts/render_automation_v2_candidate_dashboard.py'
      - 'scripts/recover_automation_v2_candidate_run.py'
      - 'scripts/reconcile_automation_v2_stale_bundle_lock.py'
      - '.github/workflows/automation-v2-stale-lock-recovery.yml'
      - 'scripts/prepare_automation_v2_rollback_pr.py'
      - '.github/workflows/automation-v2-candidate-bundle.yml'
      - '.github/workflows/automation-v2-ci.yml'
      - '.github/workflows/automation-v2-prepare-rollback-pr.yml'
      - '.github/workflows/automation-v2-missed-run-recovery.yml'
  pull_request:
    branches:
      - main
      - automation-v2/**
    paths:
      - 'automation/**'
      - 'tests/test_automation_v2_*.py'
      - 'scripts/audit_logo_references.py'
      - 'scripts/run_automation_v2_dry_run.py'
      - 'scripts/recover_automation_v2_candidate_run.py'
      - 'scripts/build_automation_v2_diagnostics_snapshot.py'
      - 'scripts/build_automation_v2_logo_repair_candidates.py'
      - 'scripts/apply_automation_v2_approved_logo_candidates.py'
      - 'config/automation-v2/approved-logo-repairs.json'
      - '.github/workflows/automation-v2-candidate-bundle.yml'
      - '.github/workflows/automation-v2-ci.yml'
      - '.github/workflows/automation-v2-prepare-rollback-pr.yml'
      - '.github/workflows/automation-v2-missed-run-recovery.yml'
      - 'IPTV-Playlist.m3u'
      - 'International-Playlist.m3u'
      - 'epg/epg.xml'
      - 'logos/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Validate policy JSON and schema JSON syntax
        run: |
          python -m json.tool automation/policy/policy.json > /dev/null
          python -m json.tool automation/policy/schema.json > /dev/null
      - name: Run policy conformance gate
        run: python automation/validators/policy_conformance.py
      - name: Run V2 contract tests
        run: python -m unittest discover -s tests -p 'test_automation_v2_*.py' -v
      - name: Check out immutable production baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: aec37357dfbb47f0792682af744ccaf111416d7a
          path: automation-v2-production-baseline
          persist-credentials: false
      - name: Run immutable production baseline dry run
        run: |
          python scripts/run_automation_v2_dry_run.py --root "${{ github.workspace }}/automation-v2-production-baseline" --output reports/automation-v2/baseline-dry-run.json
      - name: Upload baseline dry-run report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automation-v2-baseline-dry-run
          path: reports/automation-v2/baseline-dry-run.json
          if-no-files-found: error
          retention-days: 14
      - name: Run conservative logo reference audit
        run: python scripts/audit_logo_references.py --output reports/automation-v2/logo-reference-audit.json
      - name: Upload logo audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: automation-v2-logo-reference-audit
          path: reports/automation-v2/logo-reference-audit.json
          if-no-files-found: error
          retention-days: 14
  production-pr-regression:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install repository-declared test dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - name: Run full production regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
