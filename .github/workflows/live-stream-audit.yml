name: Live Stream Availability Audit

on:
  push:
    paths:
      - '.github/workflows/live-stream-audit.yml'
      - 'scripts/live_stream_audit.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-stream-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 37
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run live audit against every playlist URL
        run: python scripts/live_stream_audit.py
      - name: Commit audit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports/live-stream-audit.md
          git commit -m 'Add live stream availability audit report' || exit 0
          git push origin HEAD:main
