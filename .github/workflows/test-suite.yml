name: Test Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "xtream-main/**"
      - "xtream-bdix/**"
      - "docs/requirements.txt"
      - ".github/workflows/test-suite.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Run the complete test suite
        run: python -m unittest discover -s tests -v
