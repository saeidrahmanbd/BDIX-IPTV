# TEMPORARY verification workflow. Never merge. Writes ONLY the throwaway results branch, no commit/push, runs on the
# verify/hosted-dryrun branch only. Generated from iptv-maintenance.yml by dropping git publish steps.
name: Hosted dry run (no publish)
on:
  push:
    branches:
    - verify/hosted-dryrun
permissions:
  contents: write
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '20'
    - name: Install dependencies
      run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
    - name: Validate playlist maintenance helpers
      run: "python -m py_compile \\\n  scripts/maintenance_helpers.py \\\n  scripts/verify_international_protected.py \\\n  scripts/reconcile_playlist_consistency.py \\\n  scripts/restore_protected_review.py \\\n  scripts/audit_playlist.py \\\n  scripts/playlist_order_policy.py \\\n  scripts/pre_publish_gate.py \\\n  scripts/sort_playlists.py \\\n  scripts/final_playlist_hardening.py \\\n  scripts/country_verification.py \\\n  scripts/generate_logo_authenticity_manifest.py \\\n  scripts/generate_logo_repair_summary.py \\\n  scripts/logo_asset_naming.py \\\n  scripts/generate_logo_provenance_review.py \\\n  scripts/generate_metadata_normalization_report.py \\\n  scripts/report_iptv_fragile_streams.py \\\n  scripts/stream_risk_review.py \\\n  scripts/validate_report_freshness.py \\\n  scripts/iptv_metadata_backfill.py \\\n  scripts/discover_international_channels.py \\\n  scripts/repair_international_playlist.py \\\n  scripts/reorganize_international_playlist.py \\\n  scripts/validate_international_playlist.py\
        \ \\\n  scripts/normalize_metadata.py \\\n  scripts/migrate_external_logos_fixed.py \\\n  scripts/repair_logo_asset_technical_quality.py \\\n  scripts/backfill_cross_playlist_metadata.py \\\n  scripts/build_identity_index.py \\\n  scripts/stream_health.py \\\n  scripts/record_maintenance_history.py \\\n  scripts/generate_dashboard.py \\\n  scripts/enforce_playlist_attribution.py\n"
    - name: Run code-level maintenance and report-freshness tests
      run: 'python -m unittest discover -s tests -p ''test_report_freshness.py''

        python -m unittest discover -s tests -p ''test_pre_publish_gate_logo_paths.py''

        python -m unittest discover -s tests -p ''test_authorized_channel_removals.py''

        python -m unittest discover -s tests -p ''test_maintenance_report_order.py''

        python -m unittest discover -s tests -p ''test_metadata_backfill.py''

        python -m unittest discover -s tests -p ''test_reconcile_playlist_consistency.py''

        python -m unittest discover -s tests -p ''test_logo_authenticity_manifest.py''

        python -m unittest discover -s tests -p ''test_logo_asset_naming.py''

        python -m unittest discover -s tests -p ''test_logo_provenance_review.py''

        python -m unittest discover -s tests -p ''test_logo_repair_source_hints.py''

        python -m unittest discover -s tests -p ''test_iptv_fragile_streams.py''

        python -m unittest discover -s tests -p ''test_language_policy.py''

        python -m unittest discover -s tests -p ''test_country_verification.py''

        python -m unittest discover -s tests -p ''test_migrate_logo_unset.py''

        python -m unittest discover -s tests -p ''test_international_protected_guard.py''

        '
    - name: Snapshot committed playlists (before)
      run: 'mkdir -p dryrun/before dryrun/after

        cp IPTV-Playlist.m3u BDIX-Playlist.m3u International-Playlist.m3u dryrun/before/

        git rev-parse HEAD > dryrun/head.txt

        git rev-parse origin/main > dryrun/origin-main.txt 2>/dev/null || true

        '
    - name: 'Run maintenance (DRY RUN: same body, no commit, no push)'
      shell: bash
      run: |
          set -euo pipefail
          exec > >(tee -a dryrun/run.log) 2>&1
          # ------------------------------------------------------------------
          # Ordering contract (enforced by tests/test_maintenance_report_order.py)
          #   1. snapshots           (once per attempt)
          #   2. run_mutations       (every step that can change a playlist or logo asset)
          #   3. change guard        (after the LAST mutator, before any report)
          #   4. audit + gate        (final bytes; statuses are kept, never discarded)
          #   5. reports             (each written once, from the final bytes)
          #   6. freshness check     (once, after every fingerprinted report)
          #   7. commit
          # Mutators that also write a fingerprinted report (iptv_metadata_backfill,
          # backfill_cross_playlist_metadata, repair_logo_asset_technical_quality)
          # run LAST in the mutation block so their report matches the final bytes.
          # ------------------------------------------------------------------
          run_mutations() {
            python scripts/normalize_metadata.py
            python scripts/sort_playlists.py IPTV-Playlist.m3u
            python scripts/final_playlist_hardening.py IPTV-Playlist.m3u
            if grep -Eiq 'group-title="New"' IPTV-Playlist.m3u; then echo '::error::Forbidden staging playlist category detected after normalization.'; exit 1; fi
            python scripts/country_verification.py validate IPTV-Playlist.m3u
            python scripts/maintenance_helpers.py invalidate-bad-logos
            python scripts/migrate_external_logos_fixed.py
            # Restore protected Backup/Not Playing records and apply authorized removals before any
            # step reads the IPTV playlist as a metadata source (backfill_cross, reorganize).
            python scripts/restore_protected_review.py
            # reorganize_international_playlist.py reads tvg-country/tvg-language, so the
            # cross-playlist backfill must run before it (data dependency, not a report).
            python scripts/backfill_cross_playlist_metadata.py
            python scripts/reconcile_playlist_consistency.py
            python scripts/reorganize_international_playlist.py
            python scripts/enforce_playlist_attribution.py International-Playlist.m3u
            python scripts/validate_international_playlist.py
            python scripts/enforce_playlist_attribution.py IPTV-Playlist.m3u
            # Protected Backup/Not Playing records are restored after every step that may rewrite them.
            python scripts/restore_protected_review.py
            cp /tmp/bdix-playlist-protected.m3u BDIX-Playlist.m3u
            # Report-coupled mutators run LAST so their fingerprinted reports match the final bytes.
            python scripts/iptv_metadata_backfill.py
            python scripts/backfill_cross_playlist_metadata.py
            python scripts/repair_logo_asset_technical_quality.py --fix
            python scripts/maintenance_helpers.py verify-no-unauthorized-removals
            python scripts/verify_international_protected.py verify
          }
          for attempt in 1; do
            cp BDIX-Playlist.m3u /tmp/bdix-playlist-protected.m3u
            python scripts/maintenance_helpers.py snapshot-playlist
            python scripts/maintenance_helpers.py snapshot
            python scripts/verify_international_protected.py snapshot
            rm -rf fixed_output
            echo 'Non-destructive maintenance mode: using current repair/validation pipeline.'
            run_mutations
            set +e
            python scripts/audit_playlist.py
            AUDIT_STATUS=$?
            python scripts/pre_publish_gate.py
            GATE_STATUS=$?
            set -e
            if [ "$AUDIT_STATUS" -ne 0 ] || [ "$GATE_STATUS" -ne 0 ]; then
              echo '::warning::Audit or pre-publish gate found issues; running one automatic correction pass (same mutation sequence, failures not suppressed).'
              run_mutations
              set +e
              python scripts/audit_playlist.py
              AUDIT_STATUS=$?
              python scripts/pre_publish_gate.py
              GATE_STATUS=$?
              set -e
            fi
            # Data-level metadata assertions run against the final playlist bytes.
            python -m unittest discover -s tests -p 'test_playlist_metadata_repairs.py'

            # Reports: each is written exactly once, from the final playlist bytes.
            python scripts/stream_health.py
            if [ ! -s reports/stream-health.md ]; then echo '::error::reports/stream-health.md is missing or empty.'; exit 1; fi
            python scripts/report_iptv_fragile_streams.py
            python scripts/stream_risk_review.py
            python scripts/build_identity_index.py
            python scripts/generate_logo_authenticity_manifest.py
            python scripts/generate_logo_repair_summary.py
            python scripts/generate_logo_provenance_review.py
            python scripts/generate_metadata_normalization_report.py
            python scripts/record_maintenance_history.py
            python scripts/generate_dashboard.py
            python scripts/validate_report_freshness.py --mode generated
            if [ "$AUDIT_STATUS" -ne 0 ] || [ "$GATE_STATUS" -ne 0 ]; then
              echo "::error::Final audit or pre-publish gate reports blocking issues."
              echo "Audit status: $AUDIT_STATUS"
              echo "Pre-publish gate status: $GATE_STATUS"
              exit 1
            fi
            python -c 'from pathlib import Path; from collections import Counter; p=Path("IPTV-Playlist.m3u"); urls=[s.casefold() for s in (x.strip() for x in p.read_text(encoding="utf-8",errors="replace").splitlines()) if s.startswith(("http://","https://"))]; d=[u for u,n in Counter(urls).items() if n>1]; print(f"::error::Duplicate stream URLs remain: {len(d)} unique URLs are repeated.") if d else print(f"URL uniqueness check passed: {len(urls)} stream URLs, 0 duplicates."); raise SystemExit(1 if d else 0)'
            echo DRYRUN_BODY_COMPLETED
            exit 0
          done
          exit 1
    - name: Collect results
      if: always()
      run: 'mkdir -p dryrun/after dryrun/reports

        cp IPTV-Playlist.m3u BDIX-Playlist.m3u International-Playlist.m3u dryrun/after/ || true

        cp -r reports dryrun/reports-all || true

        git status --porcelain > dryrun/git-status.txt || true

        git diff --stat > dryrun/git-diff-stat.txt || true

        '
    - name: EPG freshness validator on committed guide (read-only, informational)
      if: always()
      continue-on-error: true
      run: 'python scripts/validate_epg_freshness.py epg/epg.xml --report dryrun/epg-publish-freshness.md 2>&1 | tee dryrun/epg-freshness.log

        '
    - name: Publish results to throwaway branch verify/hosted-dryrun-results (never main)
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'cd dryrun

        git init -q -b results

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add -A

        git commit -q -m "dry-run results for ${GITHUB_SHA}"

        git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" results:refs/heads/verify/hosted-dryrun-results

        '
    - name: Upload dry-run results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: hosted-dryrun-${{ github.run_id }}
        path: 'dryrun/

          '
        if-no-files-found: warn
        retention-days: 14
