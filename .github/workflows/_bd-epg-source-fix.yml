name: One-time Bangladesh EPG Source Fix

on:
  push:
    paths:
      - '.github/workflows/_bd-epg-source-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add FreeEPG Bangladesh feed to the EPG pipeline
        shell: python
        run: |
          from pathlib import Path

          source = 'https://free-epg.de/api/epg/bd.xml.gz'
          targets = [
              Path('scripts/epg_coverage.py'),
              Path('scripts/generate_epg.py'),
          ]
          anchor = 'https://iptv-epg.org/files/epg-in.xml.gz'
          for path in targets:
              text = path.read_text(encoding='utf-8')
              if source not in text:
                  needle = f'    "{anchor}",'
                  replacement = needle + f'\n    "{source}",'
                  if needle not in text:
                      raise SystemExit(f'Anchor not found in {path}')
                  text = text.replace(needle, replacement, 1)
                  path.write_text(text, encoding='utf-8')

          path = Path('scripts/run_epg_coverage.py')
          text = path.read_text(encoding='utf-8')
          needle = '    "https://www.free-epg.de/api/epg/us.xml.gz",'
          if source not in text:
              replacement = needle + f'\n    "{source}",'
              if needle not in text:
                  raise SystemExit(f'Anchor not found in {path}')
              path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

      - name: Rebuild EPG coverage and guide
        shell: bash
        run: |
          python scripts/run_epg_coverage.py
          python scripts/generate_epg.py

      - name: Validate generated guide
        shell: bash
        run: |
          test -s epg/epg.xml
          grep -q '<channel id="AnandaTV.bd">' epg/epg.xml || true

      - name: Remove one-time fixer
        shell: bash
        run: rm -f .github/workflows/_bd-epg-source-fix.yml

      - name: Commit EPG source and generated-guide changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/epg_coverage.py scripts/generate_epg.py scripts/run_epg_coverage.py reports/epg-coverage.md reports/epg-unmapped-audit.md reports/epg-india-channel-mapping.csv reports/epg-three-playlist-audit.md epg/epg.xml .github/workflows/_bd-epg-source-fix.yml
          if git diff --cached --quiet; then
            echo 'No EPG changes to commit.'
            exit 0
          fi
          git commit -m 'Improve Bangladesh EPG source coverage'
          git push
