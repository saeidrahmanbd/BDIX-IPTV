name: One-time Bangladesh EPG Source Fix

on:
  push:
    paths:
      - '.github/workflows/_bd-epg-source-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add FreeEPG Bangladesh feed to the EPG pipeline
        shell: python
        run: |
          from pathlib import Path

          source = 'https://free-epg.de/api/epg/bd.xml.gz'
          targets = [
              Path('scripts/epg_coverage.py'),
              Path('scripts/generate_epg.py'),
          ]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              if source not in text:
                  marker = 'SOURCES = ['
                  if marker not in text:
                      raise SystemExit(f'SOURCES list not found in {path}')
                  text = text.replace(marker, marker + f'\n    "{source}",', 1)
                  path.write_text(text, encoding='utf-8')

          # run_epg_coverage.py has a separate additional-source list.
          path = Path('scripts/run_epg_coverage.py')
          text = path.read_text(encoding='utf-8')
          if source not in text:
              marker = 'ADDITIONAL_SOURCES = ['
              if marker not in text:
                  raise SystemExit(f'ADDITIONAL_SOURCES list not found in {path}')
              text = text.replace(marker, marker + f'\n    "{source}",', 1)
              path.write_text(text, encoding='utf-8')

      - name: Rebuild EPG coverage and guide
        shell: bash
        run: |
          python scripts/run_epg_coverage.py
          python scripts/generate_epg.py

      - name: Validate generated guide
        shell: bash
        run: |
          test -s epg/epg.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('epg/epg.xml').getroot()
          channels = {c.get('id') for c in root.findall('channel')}
          print(f'Published XMLTV channels: {len(channels)}')
          PY

      - name: Commit EPG source and generated-guide changes
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/epg_coverage.py scripts/generate_epg.py scripts/run_epg_coverage.py reports/epg-coverage.md reports/epg-unmapped-audit.md reports/epg-india-channel-mapping.csv reports/epg-three-playlist-audit.md epg/epg.xml
          if git diff --cached --quiet; then
            echo 'No EPG changes to commit.'
            exit 0
          fi
          git commit -m 'Improve Bangladesh EPG source coverage'

          # Rebase onto the latest main so concurrent audit/report workflows do
          # not make an otherwise valid EPG commit fail with a non-fast-forward push.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 5
          done
          echo 'Unable to push the EPG changes after 3 attempts.'
          exit 1
