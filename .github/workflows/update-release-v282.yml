name: Update v2.8.2 Release

on:
  push:
    branches: [main]
    paths:
      - '.release-notes-v282.md'
      - '.github/workflows/update-release-v282.yml'

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v.2.8.2 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Playlist Studio v2.8.2" \
            --notes-file .release-notes-v282.md

      - name: Remove one-time updater
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .release-notes-v282.md .github/workflows/update-release-v282.yml
          git commit -m "Remove one-time v2.8.2 release updater"
          git push origin HEAD:main
