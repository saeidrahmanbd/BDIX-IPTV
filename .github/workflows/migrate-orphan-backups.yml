name: Migrate Confirmed Orphan Backups

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate_orphan_backups.py'

permissions:
  contents: write

concurrency:
  group: bdix-iptv-main-writer
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.event.head_commit.message == 'Add confirmed orphan-backup migration script' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Migrate confirmed orphan backups
        run: python scripts/migrate_orphan_backups.py
      - name: Commit migrated playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPTV-Playlist.m3u
          if git diff --cached --quiet; then
            echo 'No orphan backup migrations required.'
            exit 0
          fi
          git commit -m 'Migrate confirmed orphan backups to primary groups'
          git push origin HEAD:main
