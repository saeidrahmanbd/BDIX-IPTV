name: Remove Retired Playlist Categories

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-retired-categories.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove retired categories
        shell: python
        run: |
          from pathlib import Path
          import json, re
          p = Path('International-Playlist.m3u')
          lines = p.read_text(encoding='utf-8').splitlines()
          retired = {'Sports', 'New Channels', 'New Backup', 'Not Playing'}
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.startswith('#PLAYLIST-STUDIO-CATEGORIES:'):
                  prefix = '#PLAYLIST-STUDIO-CATEGORIES:'
                  cats = json.loads(line[len(prefix):])
                  out.append(prefix + json.dumps([c for c in cats if c not in retired], ensure_ascii=False))
                  i += 1
                  continue
              if line.startswith('#EXTINF:'):
                  m = re.search(r'group-title="([^"]*)"', line)
                  if m and m.group(1) in retired:
                      i += 1
                      while i < len(lines) and not lines[i].startswith('#EXTINF:'):
                          i += 1
                      continue
              out.append(line)
              i += 1
          p.write_text('\n'.join(out).rstrip() + '\n', encoding='utf-8')

      - name: Validate and publish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('International-Playlist.m3u').read_text(encoding='utf-8')
          for c in ['Sports', 'New Channels', 'New Backup', 'Not Playing']:
              assert f'group-title="{c}"' not in s
              assert c not in s.splitlines()[1]
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add International-Playlist.m3u
          git rm .github/workflows/remove-retired-categories.yml
          git commit -m 'Remove retired playlist categories'
          git push
