name: IPTV Logo Localization
# Isolated, non-destructive logo-only pass. It never changes stream URLs,
# channel IDs, group assignments, channel numbers, or playlist row order.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/logo-localization.yml
      - scripts/migrate_external_logos_fixed.py
      - scripts/verify_logo_only_migration.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    concurrency:
      group: iptv-playlist-main-writer-v4
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt

      - name: Validate logo migration tooling
        run: python -m py_compile scripts/migrate_external_logos_fixed.py scripts/verify_logo_only_migration.py

      - name: Commit only verified logo assets and logo attributes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Each retry starts from the latest main snapshot and regenerates both
          # the playlist logo attributes and unresolved CSV from that same state.
          # This avoids stale CSV merge conflicts during concurrent main updates.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp IPTV-Playlist.m3u /tmp/IPTV-Playlist.before-logo-migration.m3u
            python scripts/migrate_external_logos_fixed.py
            python scripts/verify_logo_only_migration.py /tmp/IPTV-Playlist.before-logo-migration.m3u
            test -s reports/logo-migration-unresolved.csv

            git add IPTV-Playlist.m3u logos/ reports/logo-migration-unresolved.csv
            changed="$(git diff --cached --name-only)"
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                IPTV-Playlist.m3u|logos/*|reports/logo-migration-unresolved.csv) ;;
                *) echo "::error::Unexpected staged path: $path"; exit 1 ;;
              esac
            done <<< "$changed"

            if git diff --cached --quiet; then
              echo "No logo assets or references needed updating."
              exit 0
            fi

            git commit -m 'Localize verified IPTV channel logos'
            if git push origin HEAD:main; then
              unresolved="$(($(wc -l < reports/logo-migration-unresolved.csv) - 1))"
              echo "Committed logo localization. Unresolved identities remaining: $unresolved"
              exit 0
            fi
            echo "::warning::Logo-only push attempt ${attempt} lost a race; retrying from latest main."
          done
          echo "::error::Could not publish the validated logo-only commit after 3 fresh snapshots."
          exit 1
