name: Conservative International Restore

on:
  workflow_run:
    workflows: [International Playlist Audit]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: international-conservative-restore
  cancel-in-progress: false

jobs:
  restore:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_commit.message != 'Conservative International restore and normalize Adult names'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Decide whether this is the requested rebuild trigger
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          SHA='${{ github.event.workflow_run.head_sha }}'
          if git diff-tree --no-commit-id --name-only -r "$SHA" | grep -qx 'scripts/conservative_international_restore.py'; then
            echo 'run=yes' >> "$GITHUB_OUTPUT"
          elif git diff-tree --no-commit-id --name-only -r "$SHA" | grep -qx 'logos/international/conservative-restore-trigger.txt'; then
            echo 'run=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'run=no' >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild conservatively
        if: steps.gate.outputs.run == 'yes'
        run: python3 scripts/conservative_international_restore.py

      - name: Validate playlist
        if: steps.gate.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          test -s International-Playlist.m3u
          grep -q '^#EXTM3U' International-Playlist.m3u
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          p=Path('International-Playlist.m3u')
          lines=p.read_text(encoding='utf-8-sig').splitlines()
          urls=[x.strip().casefold() for x in lines if x.strip().startswith(('http://','https://'))]
          dup=[u for u,n in Counter(urls).items() if n>1]
          if dup: raise SystemExit(f'Duplicate stream URLs remain: {len(dup)}')
          print(f'Validated: {len(lines)} lines, {len(urls)} stream URLs, 0 duplicate URLs')
          PY

      - name: Publish conservative rebuild
        if: steps.gate.outputs.run == 'yes'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add International-Playlist.m3u
          if git diff --cached --quiet; then
            echo 'No playlist changes to publish.'
            exit 0
          fi
          git commit -m 'Conservative International restore and normalize Adult names'
          git push origin HEAD:main
