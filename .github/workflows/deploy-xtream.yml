name: Deploy Xtream Gateways

on:
  push:
    branches: [main]
    paths:
      - "xtream-main/**"
      - "xtream-bdix/**"
      - ".github/workflows/deploy-xtream.yml"
  workflow_dispatch:

jobs:
  deploy-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Deploy main IPTV Xtream gateway
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: xtream-main
          command: deploy
          secrets: |
            XTREAM_USERNAME
            XTREAM_PASSWORD
        env:
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

      - name: Verify main IPTV Xtream login and API response
        env:
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          host = "bdix-iptv-main.saeidrahman.workers.dev"
          q = urllib.parse.urlencode({
              "username": os.environ["XTREAM_USERNAME"],
              "password": os.environ["XTREAM_PASSWORD"]
          })
          url = f"https://{host}/player_api.php?{q}"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=20) as r:
              status = r.status
              data = json.loads(r.read().decode("utf-8", "replace"))
          user = data.get("user_info", {})
          server = data.get("server_info", {})
          print(f"Main IPTV: HTTP {status}; auth={user.get('auth')}; status={user.get('status')}; protocol={server.get('server_protocol')}; host={server.get('url')}")
          if status != 200 or user.get("auth") != 1 or user.get("status") != "Active":
              raise SystemExit("Main IPTV Xtream authentication failed")
          if server.get("server_protocol") != "https" or server.get("url") != host or server.get("https_port") != "443":
              raise SystemExit("Main IPTV Xtream server_info is not compatible")
          PY

  deploy-bdix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Deploy BDIX Xtream gateway
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: xtream-bdix
          command: deploy
          secrets: |
            XTREAM_USERNAME
            XTREAM_PASSWORD
        env:
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

      - name: Verify BDIX Xtream login and API response
        env:
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          host = "bdix-iptv-bdix.saeidrahman.workers.dev"
          q = urllib.parse.urlencode({
              "username": os.environ["XTREAM_USERNAME"],
              "password": os.environ["XTREAM_PASSWORD"]
          })
          url = f"https://{host}/player_api.php?{q}"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=20) as r:
              status = r.status
              data = json.loads(r.read().decode("utf-8", "replace"))
          user = data.get("user_info", {})
          server = data.get("server_info", {})
          print(f"BDIX: HTTP {status}; auth={user.get('auth')}; status={user.get('status')}; protocol={server.get('server_protocol')}; host={server.get('url')}")
          if status != 200 or user.get("auth") != 1 or user.get("status") != "Active":
              raise SystemExit("BDIX Xtream authentication failed")
          if server.get("server_protocol") != "https" or server.get("url") != host or server.get("https_port") != "443":
              raise SystemExit("BDIX Xtream server_info is not compatible")
          PY
