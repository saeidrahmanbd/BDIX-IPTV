name: Deploy Xtream Gateways

on:
  push:
    branches: [main]
    paths:
      - "xtream-main/**"
      - "xtream-bdix/**"
      - ".github/workflows/deploy-xtream.yml"
  workflow_dispatch:

jobs:
  deploy-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Deploy main IPTV Xtream gateway
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: xtream-main
          command: deploy

      - name: Verify main IPTV Xtream login, API response and live-stream listing
        env:
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          host = "bdix-iptv-main.saeidrahman.workers.dev"
          base = f"https://{host}/player_api.php"
          def get(params):
              q = urllib.parse.urlencode(params)
              req = urllib.request.Request(f"{base}?{q}", headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, json.loads(r.read().decode("utf-8", "replace"))
          creds = {"username": os.environ["XTREAM_USERNAME"], "password": os.environ["XTREAM_PASSWORD"]}
          status, data = get(creds)
          user = data.get("user_info", {})
          server = data.get("server_info", {})
          print(f"Main IPTV login: HTTP {status}; auth={user.get('auth')}; status={user.get('status')}; protocol={server.get('server_protocol')}; host={server.get('url')}")
          if status != 200 or user.get("auth") != 1 or user.get("status") != "Active":
              raise SystemExit("Main IPTV Xtream authentication failed")
          if server.get("server_protocol") != "https" or server.get("url") != host or server.get("https_port") != "443":
              raise SystemExit("Main IPTV Xtream server_info is not compatible")
          status, cats = get({**creds, "action": "get_live_categories"})
          print(f"Main IPTV categories: HTTP {status}; count={len(cats) if isinstance(cats, list) else 0}")
          if status != 200 or not isinstance(cats, list) or not cats:
              raise SystemExit("Main IPTV returned no live categories")
          status, streams = get({**creds, "action": "get_live_streams", "category_id": "0"})
          print(f"Main IPTV streams: HTTP {status}; count={len(streams) if isinstance(streams, list) else 0}")
          if status != 200 or not isinstance(streams, list) or not streams:
              raise SystemExit("Main IPTV returned no live streams for category_id=0")
          PY

  deploy-bdix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Deploy BDIX Xtream gateway
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: xtream-bdix
          command: deploy

      - name: Verify BDIX Xtream login, API response and live-stream listing
        env:
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          host = "bdix-iptv-bdix.saeidrahman.workers.dev"
          base = f"https://{host}/player_api.php"
          def get(params):
              q = urllib.parse.urlencode(params)
              req = urllib.request.Request(f"{base}?{q}", headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, json.loads(r.read().decode("utf-8", "replace"))
          creds = {"username": os.environ["XTREAM_USERNAME"], "password": os.environ["XTREAM_PASSWORD"]}
          status, data = get(creds)
          user = data.get("user_info", {})
          server = data.get("server_info", {})
          print(f"BDIX login: HTTP {status}; auth={user.get('auth')}; status={user.get('status')}; protocol={server.get('server_protocol')}; host={server.get('url')}")
          if status != 200 or user.get("auth") != 1 or user.get("status") != "Active":
              raise SystemExit("BDIX Xtream authentication failed")
          if server.get("server_protocol") != "https" or server.get("url") != host or server.get("https_port") != "443":
              raise SystemExit("BDIX Xtream server_info is not compatible")
          status, cats = get({**creds, "action": "get_live_categories"})
          print(f"BDIX categories: HTTP {status}; count={len(cats) if isinstance(cats, list) else 0}")
          if status != 200 or not isinstance(cats, list) or not cats:
              raise SystemExit("BDIX returned no live categories")
          status, streams = get({**creds, "action": "get_live_streams", "category_id": "0"})
          print(f"BDIX streams: HTTP {status}; count={len(streams) if isinstance(streams, list) else 0}")
          if status != 200 or not isinstance(streams, list) or not streams:
              raise SystemExit("BDIX returned no live streams for category_id=0")
          # Verify real playback routing without downloading the video body.
          import urllib.error
          stream_id = streams[0].get("stream_id")
          expected_source = streams[0].get("direct_source")
          if not stream_id or not expected_source:
              raise SystemExit("BDIX stream payload lacks stream_id or direct_source")
          playback_url = f"https://{host}/live/{urllib.parse.quote(creds['username'], safe='')}/{urllib.parse.quote(creds['password'], safe='')}/{stream_id}.ts"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          req = urllib.request.Request(playback_url, headers={"User-Agent": "Mozilla/5.0"})
          try:
              with opener.open(req, timeout=30) as response:
                  playback_status = response.status
                  location = response.headers.get("Location", "")
          except urllib.error.HTTPError as error:
              playback_status = error.code
              location = error.headers.get("Location", "")
          actual_parts = urllib.parse.urlsplit(location)
          expected_parts = urllib.parse.urlsplit(expected_source)
          def effective_port(parts):
              return parts.port or (80 if parts.scheme.lower() == "http" else 443 if parts.scheme.lower() == "https" else None)
          redirect_matches = (
              actual_parts.scheme.lower() == expected_parts.scheme.lower()
              and (actual_parts.hostname or "").lower() == (expected_parts.hostname or "").lower()
              and effective_port(actual_parts) == effective_port(expected_parts)
              and actual_parts.path == expected_parts.path
              and actual_parts.query == expected_parts.query
          )
          target_host = actual_parts.hostname
          print(f"BDIX playback route: HTTP {playback_status}; destination_matches_source={redirect_matches}; upstream_host={target_host or 'none'}")
          if playback_status != 302 or not redirect_matches:
              raise SystemExit("BDIX playback endpoint did not redirect to the original direct source")
          PY
