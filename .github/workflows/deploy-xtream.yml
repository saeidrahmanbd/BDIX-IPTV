name: Deploy Xtream Gateways

on:
  push:
    branches: [main]
    paths:
      - "xtream-main/**"
      - "xtream-bdix/**"
      - ".github/workflows/deploy-xtream.yml"
  workflow_dispatch:

jobs:
  deploy-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Prepare secrets
        env:
          U: ${{ secrets.XTREAM_USERNAME }}
          P: ${{ secrets.XTREAM_PASSWORD }}
        run: python3 -c 'import json,os; json.dump({"XTREAM_USERNAME":os.environ["U"],"XTREAM_PASSWORD":os.environ["P"]},open("$RUNNER_TEMP/xtream.json","w"))'
      - name: Deploy main gateway
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: xtream-main
          command: deploy --secrets-file "${{ runner.temp }}/xtream.json"
      - name: Verify main gateway
        env:
          U: ${{ secrets.XTREAM_USERNAME }}
          P: ${{ secrets.XTREAM_PASSWORD }}
        run: python3 -c 'import json,os,urllib.parse,urllib.request; u="https://bdix-iptv-main.saeidrahman.workers.dev/player_api.php?"+urllib.parse.urlencode({"username":os.environ["U"],"password":os.environ["P"]}); d=json.load(urllib.request.urlopen(u,timeout=20)); assert d.get("user_info",{}).get("auth")==1, d; print("MAIN XTREAM LOGIN OK")'

  deploy-bdix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Prepare secrets
        env:
          U: ${{ secrets.XTREAM_USERNAME }}
          P: ${{ secrets.XTREAM_PASSWORD }}
        run: python3 -c 'import json,os; json.dump({"XTREAM_USERNAME":os.environ["U"],"XTREAM_PASSWORD":os.environ["P"]},open("$RUNNER_TEMP/xtream.json","w"))'
      - name: Deploy BDIX gateway
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: xtream-bdix
          command: deploy --secrets-file "${{ runner.temp }}/xtream.json"
      - name: Verify BDIX gateway
        env:
          U: ${{ secrets.XTREAM_USERNAME }}
          P: ${{ secrets.XTREAM_PASSWORD }}
        run: python3 -c 'import json,os,urllib.parse,urllib.request; u="https://bdix-iptv-bdix.saeidrahman.workers.dev/player_api.php?"+urllib.parse.urlencode({"username":os.environ["U"],"password":os.environ["P"]}); d=json.load(urllib.request.urlopen(u,timeout=20)); assert d.get("user_info",{}).get("auth")==1, d; print("BDIX XTREAM LOGIN OK")'
