name: Deploy Xtream Gateways

on:
  push:
    branches: [main]
    paths:
      - "xtream-main/**"
      - "xtream-bdix/**"
      - ".github/workflows/deploy-xtream.yml"
  workflow_dispatch:

jobs:
  deploy-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Deploy main IPTV Xtream gateway
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: xtream-main
          command: deploy
          secrets: |
            XTREAM_USERNAME
            XTREAM_PASSWORD
        env:
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

      - name: Verify main IPTV Xtream login
        env:
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          q = urllib.parse.urlencode({"username": os.environ["XTREAM_USERNAME"], "password": os.environ["XTREAM_PASSWORD"]})
          url = "https://bdix-iptv-main.saeidrahman.workers.dev/player_api.php?" + q
          with urllib.request.urlopen(url, timeout=30) as r:
              body = r.read().decode("utf-8", "replace")
              data = json.loads(body)
          info = data.get("user_info", {})
          print(f"Main IPTV: HTTP 200 auth={info.get('auth')} status={info.get('status')}")
          if info.get("auth") != 1 or info.get("status") != "Active":
              raise SystemExit("Main IPTV Xtream authentication failed")
          PY

  deploy-bdix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Deploy BDIX Xtream gateway
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: xtream-bdix
          command: deploy
          secrets: |
            XTREAM_USERNAME
            XTREAM_PASSWORD
        env:
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

      - name: Verify BDIX Xtream login
        env:
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          q = urllib.parse.urlencode({"username": os.environ["XTREAM_USERNAME"], "password": os.environ["XTREAM_PASSWORD"]})
          url = "https://bdix-iptv-bdix.saeidrahman.workers.dev/player_api.php?" + q
          with urllib.request.urlopen(url, timeout=30) as r:
              body = r.read().decode("utf-8", "replace")
              data = json.loads(body)
          info = data.get("user_info", {})
          print(f"BDIX: HTTP 200 auth={info.get('auth')} status={info.get('status')}")
          if info.get("auth") != 1 or info.get("status") != "Active":
              raise SystemExit("BDIX Xtream authentication failed")
          PY
