name: Deploy BDIX-IPTV Xtream Gateway

on:
  push:
    branches: [main]
    paths:
      - "xtream/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: xtream
          command: deploy
          secrets: |
            XTREAM_USERNAME
            XTREAM_PASSWORD
        env:
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}

      - name: Report Wrangler result
        if: always()
        run: |
          echo "=== Wrangler stdout ==="
          echo '${{ steps.deploy.outputs.command-output }}'
          echo "=== Wrangler stderr ==="
          echo '${{ steps.deploy.outputs.command-stderr }}'
