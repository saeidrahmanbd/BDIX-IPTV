name: Normalize Playlist Metadata

on:
  push:
    branches: [main]
    paths:
      - "scripts/normalize_metadata.py"
      - "IPTV-Playlist.m3u"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playlist-metadata-normalization
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Normalize metadata
        run: python scripts/normalize_metadata.py

      - name: Validate M3U structure
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("IPTV-Playlist.m3u")
          lines = p.read_text(encoding="utf-8").splitlines()
          assert lines and lines[0].startswith("#EXTM3U"), "Missing M3U header"
          assert sum(x.startswith("#EXTINF:") for x in lines) > 0, "No EXTINF entries"
          assert all(not ("token=test" in x or "auth=testpub" in x) for x in lines), "Test credential URL found"
          assert all('tvg-chno="' not in x or 'group-title="Backup"' not in x for x in lines if x.startswith("#EXTINF:")), "Backup channel number found"
          assert all('tvg-name="' in x for x in lines if x.startswith("#EXTINF:")), "Missing tvg-name"
          assert all('channel-id="' in x for x in lines if x.startswith("#EXTINF:")), "Missing channel-id"
          assert all(not any(ch in x for ch in "ⓎⓈᴴᴰ🇹🇷") for x in lines if x.startswith("#EXTINF:")), "Stray Unicode marker found"
          PY

      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPTV-Playlist.m3u reports/metadata-normalization.md
          if git diff --cached --quiet; then
            echo "No metadata changes."
          else
            git commit -m "Normalize playlist channel metadata"
            git push
          fi
