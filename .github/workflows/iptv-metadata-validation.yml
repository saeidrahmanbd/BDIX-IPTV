name: IPTV Metadata and EPG Validation

on:
  pull_request:
    paths:
      - scripts/validate_workflow_references.py
      - docs/requirements.txt
      - scripts/iptv_metadata_backfill.py
      - scripts/discover_bd_in_new_queues.py
      - scripts/discover_international_channels.py
      - scripts/reorganize_international_playlist.py
      - tests/test_channel_discovery_policy.py
      - scripts/backfill_cross_playlist_metadata.py
      - scripts/repair_logo_asset_technical_quality.py
      - scripts/fetch_iptv_org_epg.py
      - scripts/validate_report_freshness.py
      - IPTV-Playlist.m3u
      - BDIX-Playlist.m3u
      - International-Playlist.m3u
      - scripts/audit_playlist.py
      - scripts/playlist_order_policy.py
      - scripts/pre_publish_gate.py
      - scripts/generate_dashboard.py
      - scripts/epg_coverage.py
      - scripts/generate_epg.py
      - scripts/epg_publish_gate_v2.py
      - scripts/logo_asset_naming.py
      - scripts/generate_logo_provenance_review.py
      - scripts/generate_logo_repair_summary.py
      - scripts/generate_metadata_normalization_report.py
      - scripts/report_iptv_fragile_streams.py
      - scripts/stream_risk_review.py
      - tests/test_logo_asset_naming.py
      - tests/test_logo_provenance_review.py
      - tests/test_iptv_fragile_streams.py
      - tests/test_metadata_backfill.py
      - tests/test_cross_playlist_metadata.py
      - tests/test_epg_parallel_fetch.py
      - tests/test_logo_asset_technical_quality.py
      - tests/test_international_identity_backfill.py
      - tests/test_iptv_org_epg_targeting.py
      - tests/test_report_freshness.py
      - tests/test_maintenance_report_order.py
      - tests/test_logo_repair_source_hints.py
      - tests/test_language_policy.py
      - .github/workflows/iptv-maintenance.yml
      - .github/workflows/iptv-metadata-validation.yml
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt pytest
      - name: Validate workflow script references
        run: python scripts/validate_workflow_references.py
      - name: Compile changed Python tools
        run: |
          python -m py_compile \
            scripts/validate_workflow_references.py \
            scripts/reconcile_playlist_consistency.py \
            scripts/validate_international_playlist.py \
            scripts/discover_international_channels.py \
            scripts/reorganize_international_playlist.py \
            scripts/iptv_metadata_backfill.py \
            scripts/backfill_cross_playlist_metadata.py \
            scripts/repair_logo_asset_technical_quality.py \
            scripts/fetch_iptv_org_epg.py \
            scripts/validate_report_freshness.py \
            scripts/audit_playlist.py \
            scripts/pre_publish_gate.py \
            scripts/generate_dashboard.py \
            scripts/epg_coverage.py \
            scripts/generate_epg.py \
            scripts/epg_publish_gate_v2.py \
            scripts/logo_asset_naming.py \
            scripts/generate_logo_provenance_review.py \
            scripts/generate_logo_repair_summary.py \
            scripts/generate_metadata_normalization_report.py \
            scripts/report_iptv_fragile_streams.py \
            scripts/stream_risk_review.py
      - name: Test exact-ID metadata backfill
        run: python -m unittest discover -s tests -p "test_metadata_backfill.py"
      - name: Test report freshness and fingerprints
        run: python -m unittest discover -s tests -p "test_report_freshness.py"
      - name: Test English/Bengali EPG text policy
        run: python -m unittest discover -s tests -p "test_language_policy.py"
      - name: Test logo asset safety and provenance queue
        run: |
          python -m unittest discover -s tests -p "test_logo_asset_naming.py"
          python -m unittest discover -s tests -p "test_logo_provenance_review.py"
      - name: Test sensitive URL redaction
        run: python -m unittest discover -s tests -p "test_iptv_fragile_streams.py"

      - name: Run full pytest suite
        run: python -m pytest -q tests
