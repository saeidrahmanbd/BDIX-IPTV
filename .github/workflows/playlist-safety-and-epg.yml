name: IPTV Safety and EPG Enhancement
on:
  workflow_run:
    workflows: ["IPTV Playlist Update"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bdix-iptv-safety-epg
  cancel-in-progress: false
jobs:
  repair:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Protect review queues and normalize numbering
        run: python scripts/playlist_safety_repair.py
      - name: Validate local logos
        run: python scripts/validate_local_logos.py
      - name: Merge verified Bangladesh EPG sources
        run: python scripts/merge_manual_epg_sources.py
      - name: Validate report freshness
        run: python scripts/validate_report_freshness.py
      - name: Run strict publication gate
        run: python scripts/pre_publish_gate_v2.py
      - name: Publish deterministic safety/EPG corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPTV-Playlist.m3u epg/epg.xml reports/pre-publish-gate.md
          if git diff --cached --quiet; then echo 'No safety/EPG changes to publish.'; exit 0; fi
          git commit -m 'Apply IPTV safety and verified EPG enhancements'
          git push origin HEAD:main
