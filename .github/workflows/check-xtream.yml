name: Daily Xtream Health Check

on:
  schedule:
    - cron: "0 1 * * *" # 07:00 Asia/Dhaka (UTC+6)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check both Xtream gateways
        env:
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          USER = os.environ["XTREAM_USERNAME"]
          PASS = os.environ["XTREAM_PASSWORD"]
          CREDS = {"username": USER, "password": PASS}
          GATEWAYS = {
              "Main IPTV": ("bdix-iptv-main.saeidrahman.workers.dev", True),
              "BDIX": ("bdix-iptv-bdix.saeidrahman.workers.dev", False),
          }

          def api(host, params):
              url = f"https://{host}/player_api.php?{urllib.parse.urlencode(params)}"
              req = urllib.request.Request(url, headers={"User-Agent": "BDIX-IPTV-Daily-Xtream-Check/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, json.loads(r.read().decode("utf-8", "replace"))

          def check(name, host, main_proxy):
              status, data = api(host, CREDS)
              user = data.get("user_info", {})
              server = data.get("server_info", {})
              print(f"{name} login: HTTP={status} auth={user.get('auth')} status={user.get('status')} protocol={server.get('server_protocol')} host={server.get('url')}")
              if status != 200 or user.get("auth") != 1 or user.get("status") != "Active":
                  raise SystemExit(f"{name}: authentication failed")
              if server.get("server_protocol") != "https" or server.get("url") != host or str(server.get("https_port")) != "443":
                  raise SystemExit(f"{name}: incompatible server_info")

              status, cats = api(host, {**CREDS, "action": "get_live_categories"})
              print(f"{name} categories: HTTP={status} count={len(cats) if isinstance(cats, list) else 0}")
              if status != 200 or not isinstance(cats, list) or not cats:
                  raise SystemExit(f"{name}: no live categories")

              status, streams = api(host, {**CREDS, "action": "get_live_streams", "category_id": "0"})
              print(f"{name} streams: HTTP={status} count={len(streams) if isinstance(streams, list) else 0}")
              if status != 200 or not isinstance(streams, list) or not streams:
                  raise SystemExit(f"{name}: no live streams")

              first = streams[0]
              stream_id = first.get("stream_id")
              source = first.get("direct_source")
              if not stream_id or not source:
                  raise SystemExit(f"{name}: first stream lacks stream_id/direct_source")

              playback = f"https://{host}/live/{urllib.parse.quote(USER, safe='')}/{urllib.parse.quote(PASS, safe='')}/{stream_id}.ts"
              req = urllib.request.Request(playback, headers={"User-Agent": "BDIX-IPTV-Daily-Xtream-Check/1.0", "Range": "bytes=0-0"})
              if main_proxy:
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          playback_status = r.status
                          location = r.headers.get("Location", "")
                  except urllib.error.HTTPError as e:
                      playback_status = e.code
                      location = e.headers.get("Location", "")
                  print(f"{name} playback: HTTP={playback_status} proxied=true")
                  if playback_status not in (200, 206):
                      raise SystemExit(f"{name}: playback endpoint failed")
              else:
                  opener = urllib.request.build_opener(urllib.request.HTTPRedirectHandler())
                  try:
                      with opener.open(req, timeout=30) as r:
                          playback_status = r.status
                          final_url = r.geturl()
                  except urllib.error.HTTPError as e:
                      playback_status = e.code
                      final_url = e.geturl()
                  expected = urllib.parse.urlsplit(source)
                  actual = urllib.parse.urlsplit(final_url)
                  matches = (actual.scheme.lower() == expected.scheme.lower() and (actual.hostname or '').lower() == (expected.hostname or '').lower() and actual.path == expected.path and actual.query == expected.query)
                  print(f"{name} playback: HTTP={playback_status} redirected_to_source={matches} upstream_host={actual.hostname or 'none'}")
                  if playback_status not in (200, 206) or not matches:
                      raise SystemExit(f"{name}: playback endpoint did not reach direct source")

          for name, (host, main_proxy) in GATEWAYS.items():
              check(name, host, main_proxy)
          print("All Xtream health checks passed.")
          PY
