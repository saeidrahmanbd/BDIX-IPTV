name: Daily Xtream Health Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-xtream.yml"
      - "xtream-main/**"
      - "IPTV-Playlist.m3u"
      - "epg/epg.xml"
  schedule:
    - cron: "0 0 * * *" # 06:00 Asia/Dhaka (UTC+6); allow a 60-minute buffer before the 07:00 report
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Deploy Xtream Gateways"
      - "IPTV New Channel Discovery"
      - "IPTV Playlist Update"
      - "Refresh IPTV EPG"
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check main IPTV Xtream gateway
        env:
          XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
          XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.parse, urllib.request
          from collections import Counter

          USER = os.environ["XTREAM_USERNAME"]
          PASS = os.environ["XTREAM_PASSWORD"]
          if not USER or not PASS:
              raise SystemExit("Xtream credentials are missing from GitHub Actions secrets")
          CREDS = {"username": USER, "password": PASS}
          HEADERS = {"User-Agent": "BDIX-IPTV-Daily-Xtream-Check/2.0"}
          GATEWAYS = {
              "Main IPTV": "bdix-iptv-main.saeidrahman.workers.dev",
          }

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          NO_REDIRECT = urllib.request.build_opener(NoRedirect)

          def open_retry(req, timeout=20, opener=None, attempts=2):
              last_error = None
              client = opener.open if opener else urllib.request.urlopen
              transient_http = {408, 425, 429, 500, 502, 503, 504}
              for attempt in range(attempts):
                  try:
                      return client(req, timeout=timeout)
                  except urllib.error.HTTPError as error:
                      if error.code not in transient_http or attempt + 1 >= attempts:
                          raise
                      last_error = error
                      error.close()
                      time.sleep(2)
                  except (urllib.error.URLError, TimeoutError, OSError) as error:
                      last_error = error
                      if attempt + 1 < attempts:
                          time.sleep(2)
              raise last_error

          def api(host, params):
              url = f"https://{host}/player_api.php?{urllib.parse.urlencode(params)}"
              req = urllib.request.Request(url, headers=HEADERS)
              with open_retry(req) as response:
                  return response.status, json.loads(response.read().decode("utf-8", "replace"))

          def check_auxiliary_endpoints(host, expected_streams):
              health_req = urllib.request.Request(f"https://{host}/health", headers=HEADERS)
              with open_retry(health_req) as response:
                  health = json.loads(response.read().decode("utf-8", "replace"))
                  if response.status != 200 or health.get("ok") is not True:
                      raise SystemExit(f"{host}: /health did not return ok=true")
                  if int(health.get("streams", -1)) != expected_streams:
                      raise SystemExit(f"{host}: /health stream count differs from player_api.php")
              print(f"{host} health: HTTP=200 streams={expected_streams}")

              m3u_url = f"https://{host}/get.php?{urllib.parse.urlencode(CREDS)}"
              m3u_req = urllib.request.Request(m3u_url, headers=HEADERS)
              with open_retry(m3u_req) as response:
                  body = response.read()
                  content_type = response.headers.get("Content-Type", "").lower()
                  if response.status != 200 or not body.startswith(b"#EXTM3U"):
                      raise SystemExit(f"{host}: get.php did not return a valid M3U")
                  entries = body.count(b"#EXTINF:")
                  if entries != expected_streams:
                      raise SystemExit(f"{host}: get.php entries={entries}, API streams={expected_streams}")
              print(f"{host} get.php: HTTP=200 M3U entries={entries}")

              xml_url = f"https://{host}/xmltv.php?{urllib.parse.urlencode(CREDS)}"
              xml_req = urllib.request.Request(xml_url, headers=HEADERS)
              with open_retry(xml_req) as response:
                  sample = response.read(512).lstrip()
                  content_type = response.headers.get("Content-Type", "").lower()
                  if response.status != 200 or "xml" not in content_type or not (sample.startswith(b"<?xml") or sample.startswith(b"<tv")):
                      raise SystemExit(f"{host}: xmltv.php did not return XMLTV content")
              print(f"{host} xmltv.php: HTTP=200 content-type=XML")

          def playback_probe(host, stream):
              stream_id = stream.get("stream_id")
              source = stream.get("direct_source")
              if not stream_id or not source:
                  return False, "missing stream_id/direct_source"
              playback = f"https://{host}/live/{urllib.parse.quote(USER, safe='')}/{urllib.parse.quote(PASS, safe='')}/{stream_id}.ts"
              req = urllib.request.Request(playback, headers={**HEADERS, "Range": "bytes=0-0"})

              # Both Workers should route the Xtream stream ID to exactly its declared source.
              try:
                  with open_retry(req, opener=NO_REDIRECT) as response:
                      route_status = response.status
                      location = response.headers.get("Location", "")
              except urllib.error.HTTPError as error:
                  route_status = error.code
                  location = error.headers.get("Location", "")
              except (urllib.error.URLError, TimeoutError, OSError) as error:
                  return False, f"gateway route {type(error).__name__}"

              expected = urllib.parse.urlsplit(source)
              actual = urllib.parse.urlsplit(location)
              def effective_port(parts):
                  return parts.port or (80 if parts.scheme.lower() == "http" else 443 if parts.scheme.lower() == "https" else None)
              matches = (
                  actual.scheme.lower() == expected.scheme.lower()
                  and (actual.hostname or "").lower() == (expected.hostname or "").lower()
                  and effective_port(actual) == effective_port(expected)
                  and actual.path == expected.path
                  and actual.query == expected.query
              )
              if route_status != 302 or not matches:
                  return False, f"route HTTP={route_status} source_match={matches}"

              source_req = urllib.request.Request(source, headers={**HEADERS, "Range": "bytes=0-0"})
              try:
                  with open_retry(source_req, timeout=20) as response:
                      source_status = response.status
                      first_byte = response.read(1)
                      final_host = urllib.parse.urlsplit(response.geturl()).hostname or "none"
              except urllib.error.HTTPError as error:
                  return False, f"direct source HTTP={error.code}"
              except (urllib.error.URLError, TimeoutError, OSError) as error:
                  return False, f"direct source {type(error).__name__}"
              if source_status not in (200, 206) or not first_byte:
                  return False, f"direct source HTTP={source_status} empty_body={not bool(first_byte)}"
              return True, f"route=302 source=HTTP {source_status} final_host={final_host}"

          def source_playlist_snapshot():
              url = "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/IPTV-Playlist.m3u"
              req = urllib.request.Request(url, headers=HEADERS)
              with open_retry(req) as response:
                  raw = response.read().decode("utf-8", "replace")

              inactive = {"Test", "Not Playing", "New Backup", "New Channels"}
              attr_re = re.compile(r'([A-Za-z0-9_-]+)="([^"]*)"')
              records = []
              current = None
              for raw_line in raw.splitlines():
                  line = raw_line.strip()
                  if line.startswith("#EXTINF:"):
                      if current is not None:
                          raise SystemExit("IPTV-Playlist.m3u contains an entry without a stream URL")
                      attrs = dict(attr_re.findall(line))
                      comma = line.find(",")
                      name = (attrs.get("tvg-name") or (line[comma + 1:] if comma >= 0 else "")).strip()
                      group = (attrs.get("group-title") or "Uncategorized").strip()
                      tvg_id = (attrs.get("tvg-id") or "").strip()
                      logo = (attrs.get("tvg-logo") or "").strip()
                      chno = (attrs.get("tvg-chno") or "").strip()
                      current = {"name": name, "group": group, "tvg_id": tvg_id, "logo": logo, "chno": chno}
                  elif current and line.lower().startswith(("http://", "https://")):
                      if current["group"] not in inactive:
                          if not current["name"]:
                              raise SystemExit("IPTV-Playlist.m3u contains an active entry without a channel name")
                          records.append({**current, "url": line})
                      current = None

              if current is not None:
                  raise SystemExit("IPTV-Playlist.m3u ends with an entry without a stream URL")
              if not records:
                  raise SystemExit("IPTV-Playlist.m3u contains no active HTTP(S) streams")
              return records

          def stable_stream_id(tvg_id, url):
              value = 2166136261
              for character in f"{tvg_id}|{url}":
                  code_unit = ord(character)
                  if code_unit > 0xffff:
                      code_unit = 0xd800 + ((code_unit - 0x10000) >> 10)
                  value ^= code_unit
                  value = (value * 16777619) & 0xffffffff
              return (value % 899999999) + 100000000

          def check(name, host):
              status, data = api(host, CREDS)
              user = data.get("user_info", {})
              server = data.get("server_info", {})
              print(f"{name} login: HTTP={status} auth={user.get('auth')} status={user.get('status')} protocol={server.get('server_protocol')} host={server.get('url')}")
              if status != 200 or user.get("auth") != 1 or user.get("status") != "Active":
                  raise SystemExit(f"{name}: authentication failed")
              if server.get("server_protocol") != "https" or server.get("url") != host or str(server.get("https_port")) != "443":
                  raise SystemExit(f"{name}: incompatible server_info")

              source_streams = source_playlist_snapshot()
              expected_by_id = {
                  str(stable_stream_id(stream["tvg_id"], stream["url"])): stream
                  for stream in source_streams
              }
              if len(expected_by_id) != len(source_streams):
                  raise SystemExit(f"{name}: source playlist contains colliding Worker stream IDs")
              source_counts = Counter(stream["group"] for stream in source_streams)

              # The Worker can briefly serve the previous category assignment after a
              # GitHub playlist commit. Retry inventory consistency before reporting a
              # real failure; stream IDs and category counts must both converge.
              sync_attempts = 6
              last_sync_detail = "no inventory response"
              for sync_attempt in range(1, sync_attempts + 1):
                  status, categories = api(host, {**CREDS, "action": "get_live_categories"})
                  if status != 200 or not isinstance(categories, list) or not categories:
                      last_sync_detail = f"categories HTTP={status}"
                  else:
                      status, streams = api(host, {**CREDS, "action": "get_live_streams", "category_id": "0"})
                      if status != 200 or not isinstance(streams, list) or not streams:
                          last_sync_detail = f"streams HTTP={status}"
                      else:
                          api_by_id = {str(stream.get("stream_id")): stream for stream in streams}
                          category_names = {str(category.get("category_id")): category.get("category_name") for category in categories}
                          api_counts = Counter(category_names.get(str(stream.get("category_id")), "<unknown>") for stream in streams)
                          missing_ids = sorted(set(expected_by_id) - set(api_by_id))
                          extra_ids = sorted(set(api_by_id) - set(expected_by_id))
                          count_diff = {
                              group: {"source": source_counts.get(group, 0), "api": api_counts.get(group, 0)}
                              for group in sorted(set(source_counts) | set(api_counts))
                              if source_counts.get(group, 0) != api_counts.get(group, 0)
                          }
                          if not missing_ids and not extra_ids and not count_diff:
                              last_sync_detail = ""
                              break
                          last_sync_detail = (
                              f"missing_stream_ids={len(missing_ids)} "
                              f"extra_stream_ids={len(extra_ids)} category_differences={count_diff}"
                          )
                  print(f"{name}: Worker inventory sync attempt {sync_attempt}/{sync_attempts}: {last_sync_detail}")
                  if sync_attempt < sync_attempts:
                      time.sleep(10)
              else:
                  raise SystemExit(f"{name}: Worker inventory did not synchronize with IPTV-Playlist.m3u: {last_sync_detail}")

              print(f"{name} categories: HTTP=200 count={len(categories)}")
              print(f"{name} streams: HTTP=200 count={len(streams)}")
              for stream_id, expected in expected_by_id.items():
                  actual = api_by_id[stream_id]
                  try:
                      expected_num = float(expected["chno"]) if expected["chno"] else 0
                  except ValueError:
                      expected_num = 0
                  parity_fields = {
                      "direct_source": (actual.get("direct_source"), expected["url"]),
                      "name": (actual.get("name"), expected["name"]),
                      "tvg_name": (actual.get("tvg_name"), expected["name"]),
                      "stream_icon": (actual.get("stream_icon"), expected["logo"]),
                      "tvg_id": (actual.get("tvg_id"), expected["tvg_id"]),
                      "epg_channel_id": (actual.get("epg_channel_id"), expected["tvg_id"]),
                      "num": (actual.get("num"), expected_num),
                      "group": (category_names.get(str(actual.get("category_id"))), expected["group"]),
                  }
                  mismatches = [field for field, (actual_value, expected_value) in parity_fields.items()
                                if actual_value != expected_value]
                  if mismatches:
                      print(f"{name}: stream_id={stream_id} parity fields differ: {', '.join(mismatches)}")
                      raise SystemExit(f"{name}: stream metadata/source mismatch for stream_id={stream_id}")
              print(
                  f"{name} source parity: entries={len(source_streams)} "
                  f"categories={len(source_counts)} IDs, names, groups and source URLs matched"
              )

              category_ids = {str(category.get("category_id")) for category in categories}
              stream_ids = [str(stream.get("stream_id")) for stream in streams]
              if len(stream_ids) != len(set(stream_ids)):
                  raise SystemExit(f"{name}: duplicate stream IDs detected")
              if any(not stream.get("name") or not stream.get("direct_source") for stream in streams):
                  raise SystemExit(f"{name}: stream metadata/source missing")
              if any(str(stream.get("category_id")) not in category_ids for stream in streams):
                  raise SystemExit(f"{name}: one or more streams reference an unknown category")

              check_auxiliary_endpoints(host, len(streams))

              checked = 0
              for category in categories:
                  category_id = str(category.get("category_id"))
                  candidates = [stream for stream in streams if str(stream.get("category_id")) == category_id]
                  if not candidates:
                      raise SystemExit(f"{name}: category has no streams: {category.get('category_name')}")
                  success = False
                  failures = []
                  # Probe several entries in each category. A single dead or
                  # geo-blocked URL must not fail the whole gateway when another
                  # stream in the same category is playable. Never remove failed
                  # Backup/New Backups records automatically.
                  sample_limit = min(10, len(candidates))
                  for candidate in candidates[:sample_limit]:
                      ok, detail = playback_probe(host, candidate)
                      if ok:
                          success = True
                          print(f"{name} sample: category={category.get('category_name')} available=true {detail}")
                          break
                      failures.append(detail)
                  if not success:
                      raise SystemExit(f"{name}: no playable sample in category {category.get('category_name')}: {'; '.join(failures)}")
                  checked += 1
              print(f"{name}: playable category samples={checked}/{len(categories)}")
              print(f"{name}: all endpoint and representative playback checks passed")

          for name, host in GATEWAYS.items():
              check(name, host)
          print("All Xtream health checks passed.")
          PY
