name: IPTV New Channel Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/new-channel-discovery.yml'
      - 'scripts/discover_bd_in_new_queues.py'
      - 'scripts/run_bd_discovery_with_policy.py'
      - 'scripts/validate_discovery_run.py'
      - 'scripts/discovery_schedule_guard.py'
      - 'scripts/country_verification.py'
      - 'tests/test_channel_discovery_policy.py'
      - 'tests/test_country_verification.py'
      - 'tests/test_discovery_run_validation.py'
  schedule:
    - cron: '0 1 * * *' # 07:00 Asia/Dhaka (UTC+6)
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  daily_guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: \${{ steps.guard.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Enforce one discovery run per Bangladesh calendar date
        id: guard
        env:
          GH_TOKEN: \${{ github.token }}
          GH_WORKFLOW_FILE: new-channel-discovery.yml
        run: python scripts/discovery_schedule_guard.py guard "$GH_WORKFLOW_FILE"

  discover:
    needs: daily_guard
    if: needs.daily_guard.outputs.should_run == 'true'
    concurrency:
      group: iptv-playlist-main-writer-v4
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Snapshot playlist before discovery
        run: cp IPTV-Playlist.m3u /tmp/IPTV-Playlist.before.m3u
      - name: Test channel discovery policy
        run: python -m unittest discover -s tests -p 'test_channel_discovery_policy.py'
      - name: Test country metadata is advisory
        run: python -m unittest discover -s tests -p 'test_country_verification.py'
      - name: Test discovery stream validator
        run: python -m unittest discover -s tests -p 'test_discovery_run_validation.py'
      - name: Test discovery daily guard
        run: python -m unittest discover -s tests -p 'test_discovery_schedule_guard.py'
      - name: Discover Bangladesh and India candidates into manual-review queues
        run: python scripts/run_bd_discovery_with_policy.py
      - name: Probe only newly discovered streams; retain uncertain or incomplete candidates
        run: python scripts/validate_discovery_run.py probe IPTV-Playlist.m3u reports/iptv-channel-discovery.md /tmp/IPTV-Playlist.before.m3u iptv
      - name: Report country metadata warnings without blocking discovery
        id: validate_review_queues
        run: python scripts/country_verification.py validate IPTV-Playlist.m3u
      - name: Record final discovery validation
        if: always()
        env:
          OFFICIAL_VALIDATOR_OUTCOME: \${{ steps.validate_review_queues.outcome }}
        run: python scripts/validate_discovery_run.py finalize IPTV-Playlist.m3u reports/iptv-channel-discovery.md /tmp/IPTV-Playlist.before.m3u iptv
      - name: Commit discovery queue additions only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! grep -q 'Validation status: PASS' reports/iptv-channel-discovery.md; then
            git add reports/iptv-channel-discovery.md
            if ! git diff --cached --quiet; then
              git commit -m 'Record IPTV discovery validation blocker'
              for attempt in 1 2 3; do
                git fetch origin main
                git pull --rebase origin main || { git rebase --abort || true; exit 1; }
                if git push origin HEAD:main; then break; fi
              done
            fi
            echo '::error::New discovery candidate validation failed; existing playlist rows were not rewritten.'
            exit 1
          fi
          git add IPTV-Playlist.m3u reports/iptv-channel-discovery.md
          if git diff --cached --quiet; then
            echo 'No new Bangladesh/India candidates to publish.'
            exit 0
          fi
          git commit -m 'Add IPTV candidates to manual review queues'
          for attempt in 1 2 3; do
            git fetch origin main
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
          done
          echo '::error::Push failed after three attempts.'
          exit 1
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iptv-channel-discovery
          path: reports/iptv-channel-discovery.md
          if-no-files-found: warn
          retention-days: 14
