name: IPTV New Channel Discovery

on:
  schedule:
    - cron: '47 2 * * *'
  workflow_run:
    workflows: ["IPTV Playlist Update"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: new-channel-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install logo tools
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Discover Bangladesh and India candidates
        run: python scripts/discover_bd_in_new_queues.py
      - name: Normalize discovered metadata and localize logos
        run: |
          python scripts/normalize_metadata.py
          python scripts/repair_playlist_logos.py
      - name: Validate review queues
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('IPTV-Playlist.m3u')
          text=p.read_text(encoding='utf-8', errors='replace')
          allowed={'Bangladesh','India'}
          blocked={'New Channels','New Backup'}
          rows=[]
          current=None
          for line in text.splitlines():
              if line.startswith('#EXTINF:'):
                  current=line
              elif current and line.strip().startswith(('http://','https://')):
                  a=dict(re.findall(r'([A-Za-z0-9_-]+)="([^"]*)"',current))
                  g=a.get('group-title','')
                  if g in blocked:
                      country=a.get('tvg-country','').upper()
                      if country not in {'BD','IN'}:
                          raise SystemExit(f'Queue entry is not Bangladesh/India: {current}')
                      if not line.strip().lower().startswith(('http://','https://')):
                          raise SystemExit('Invalid queue URL')
                  current=None
          print('New Channels/New Backup country gate passed.')
          PY
      - name: Commit discovered candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPTV-Playlist.m3u reports/channel-discovery.md logos/ reports/metadata-normalization.md reports/playlist-logo-repair-results.md
          if git diff --cached --quiet; then
            echo 'No new Bangladesh/India candidates found.'
            exit 0
          fi
          git commit -m 'Run IPTV playlist maintenance: import new BD/India review candidates'
          git push origin HEAD:main
