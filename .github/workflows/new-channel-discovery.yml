name: IPTV New Channel Discovery

on:
  schedule:
    - cron: '47 2 * * *'
  workflow_run:
    workflows: ["IPTV Playlist Update"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Same group as IPTV Playlist Update (maintenance): only one main-branch writer at a time.
concurrency:
  group: iptv-playlist-main-writer
  cancel-in-progress: false
  queue: max

jobs:
  discover:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install logo tools
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Enforce queue exclusions and discover approved Bangladesh/India candidates
        run: python scripts/discover_bd_in_new_queues.py
      - name: Normalize discovered metadata and localize logos
        run: |
          python scripts/normalize_metadata.py
          python scripts/repair_playlist_logos.py
          python scripts/final_playlist_hardening.py IPTV-Playlist.m3u
      - name: Enable review-queue audit policy
        run: python scripts/enable_review_queue_audit.py
      - name: Validate review queues
        run: python scripts/country_verification.py validate IPTV-Playlist.m3u
      - name: Commit discovered candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPTV-Playlist.m3u reports/channel-discovery.md logos/ reports/metadata-normalization.md reports/playlist-logo-repair-results.md scripts/audit_playlist.py scripts/enable_review_queue_audit.py scripts/discover_bd_in_new_queues.py
          if git diff --cached --quiet; then
            echo 'No new Bangladesh/India candidates found.'
            exit 0
          fi
          git commit -m 'Maintain IPTV queues: enforce exclusions and import approved candidates'
          # Generated-but-uncommitted files (other reports, logo scratch) would make
          # `git pull --rebase` refuse to run; they are not part of this commit.
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git pull --rebase origin main; then
              git status --short | head -20
              git rebase --abort || true
              echo '::error::Rebase failed; candidates not pushed.'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            echo "::warning::Push attempt ${attempt} failed; retrying after rebase."
            sleep 3
          done
          echo '::error::Push failed after 3 attempts.'
          exit 1
