name: Add Comet and normalize MyTime Movie Network

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-comet-channel.yml"

permissions:
  contents: write

concurrency:
  group: add-comet-mytimenetwork-once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Localize Comet logo and update playlist metadata
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image
          import io, re

          repo = Path(".")
          logo_url = "https://pub-dbd59bcc344f405ab5a1f9697b81831f.r2.dev/comet.webp"
          request = Request(logo_url, headers={"User-Agent": "BDIX-IPTV-Logo-Localizer/1.0"})
          with urlopen(request, timeout=30) as response:
              raw = response.read()
          image = Image.open(io.BytesIO(raw))
          image.load()
          if image.width < 40 or image.height < 30:
              raise SystemExit(f"Comet logo dimensions too small: {image.size}")
          out = repo / "logos" / "comet.png"
          out.parent.mkdir(parents=True, exist_ok=True)
          image.convert("RGBA").save(out, format="PNG", optimize=True)
          if out.read_bytes()[:8] != b"\\x89PNG\\r\\n\\x1a\\n":
              raise SystemExit("Comet logo failed PNG validation")

          playlist_path = repo / "IPTV-Playlist.m3u"
          source = playlist_path.read_text(encoding="utf-8")
          lines = source.splitlines()
          prefix, entries, current = [], [], []
          for line in lines:
              if line.startswith("#EXTINF:"):
                  if current:
                      entries.append("\\n".join(current).strip("\\n"))
                  current = [line]
              elif current:
                  current.append(line)
              else:
                  prefix.append(line)
          if current:
              entries.append("\\n".join(current).strip("\\n"))

          def get_name(entry):
              info = next((x for x in entry.splitlines() if x.startswith("#EXTINF:")), "")
              return info.rsplit(",", 1)[-1].strip() if "," in info else ""

          def get_url(entry):
              return next((x.strip() for x in entry.splitlines() if x.strip() and not x.lstrip().startswith("#")), "")

          def set_attr(info, key, value):
              pattern = rf'(?<![\\w-]){re.escape(key)}="[^"]*"'
              replacement = f'{key}="{value}"'
              if re.search(pattern, info):
                  return re.sub(pattern, lambda _: replacement, info, count=1)
              marker = ' group-title="'
              if marker in info:
                  return info.replace(marker, f' {replacement}{marker}', 1)
              return info + " " + replacement

          mytime_primary_url = "https://mytime-tcl.amagi.tv/1080p-en-cc/index.m3u8"
          mytime_other_url = "https://mytime-tcl.amagi.tv/playlist.m3u8"
          comet_url = "https://fast-channels.sinclairstoryline.com/COMET/index.m3u8"
          mytime_id = "MyTimeMovieNetwork.us@SD"
          mytime_logo = "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/mytime-movie-network.png"
          comet_logo = "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/comet.png"

          comet_exists = False
          updated = []
          for entry in entries:
              url = get_url(entry)
              if url == comet_url or get_name(entry).casefold() == "comet":
                  comet_exists = True
              if url in (mytime_primary_url, mytime_other_url):
                  info_lines = entry.splitlines()
                  info_index = next(i for i, x in enumerate(info_lines) if x.startswith("#EXTINF:"))
                  info = info_lines[info_index]
                  info = set_attr(info, "tvg-id", mytime_id)
                  info = set_attr(info, "tvg-name", "MyTime Movie Network")
                  info = set_attr(info, "tvg-logo", mytime_logo)
                  info = set_attr(info, "channel-id", mytime_id)
                  info = set_attr(info, "tvg-country", "US")
                  info = set_attr(info, "tvg-language", "eng")
                  if url == mytime_other_url:
                      info = set_attr(info, "group-title", "Backup")
                      info = re.sub(r'\\s+tvg-chno="[^"]*"', "", info)
                  else:
                      info = set_attr(info, "group-title", "International")
                  info_lines[info_index] = info
                  entry = "\\n".join(info_lines)
              updated.append(entry)

          if not comet_exists:
              comet_entry = (
                  f'#EXTINF:-1 tvg-id="Comet.us" tvg-name="Comet" tvg-logo="{comet_logo}" '
                  f'channel-id="Comet.us" tvg-country="US" tvg-language="eng" '
                  f'group-title="International",Comet\\n{comet_url}'
              )
              insert_at = None
              for i, entry in enumerate(updated):
                  info = next((x for x in entry.splitlines() if x.startswith("#EXTINF:")), "")
                  if 'group-title="International"' in info and get_name(entry).casefold() > "comet":
                      insert_at = i
                      break
              if insert_at is None:
                  intl_indices = [i for i, entry in enumerate(updated) if 'group-title="International"' in entry]
                  insert_at = (intl_indices[-1] + 1) if intl_indices else len(updated)
              updated.insert(insert_at, comet_entry)

          # The MyTime TCL master URL and its 1080p path are the same service.
          # Keep one primary and classify the second URL as its Backup.
          # Rebuild active tvg-chno values continuously; queue/backup groups are unnumbered.
          inactive = {"Backup", "Review", "New Channels", "New Backups", "New Backup", "Not Playing"}
          channel_number = 0
          normalized = []
          for entry in updated:
              info_lines = entry.splitlines()
              info_index = next((i for i, x in enumerate(info_lines) if x.startswith("#EXTINF:")), None)
              if info_index is not None:
                  info = info_lines[info_index]
                  match = re.search(r'group-title="([^"]+)"', info)
                  group = match.group(1) if match else ""
                  if group in inactive:
                      info = re.sub(r'\\s+tvg-chno="[^"]*"', "", info)
                  else:
                      channel_number += 1
                      info = set_attr(info, "tvg-chno", str(channel_number))
                  info_lines[info_index] = info
                  entry = "\\n".join(info_lines)
              normalized.append(entry)

          result = "\\n\\n".join([x for x in prefix if x is not None] + normalized).rstrip() + "\\n"
          playlist_path.write_text(result, encoding="utf-8")

          # Add the verified Plex XMLTV identity for the US MyTime Movie Network feed.
          epg_path = repo / "scripts" / "epg_coverage.py"
          epg = epg_path.read_text(encoding="utf-8")
          alias = '"MyTimeMovieNetwork.us@SD": ["plex.tv.MyTime.Movie.Network.plex"],'
          if alias not in epg:
              anchor = '    "MyTimeMovieNetworkEast.us": ["USBC3900018K6"],'
              if anchor not in epg:
                  raise SystemExit("Could not find EPG alias insertion anchor")
              epg = epg.replace(anchor, alias + "\\n" + anchor, 1)
              epg_path.write_text(epg, encoding="utf-8")

          # Basic invariants before committing.
          final = playlist_path.read_text(encoding="utf-8")
          if final.count(comet_url) != 1:
              raise SystemExit("Comet stream URL is not unique")
          if final.count(mytime_primary_url) != 1 or final.count(mytime_other_url) != 1:
              raise SystemExit("MyTime primary/backup streams are not both present exactly once")
          if "group-title=\"International\",Comet" not in final:
              raise SystemExit("Comet was not placed in International")
          if "group-title=\"Backup\",MyTime Movie Network" not in final:
              raise SystemExit("MyTime alternate feed was not classified as Backup")
          if re.search(r'(?m)^#EXTINF:[^\\n]*group-title="(?:Backup|Review|New Channels|New Backups|New Backup)"[^\\n]*tvg-chno=', final):
              raise SystemExit("Inactive entry still has tvg-chno")
          numbers = [int(x) for x in re.findall(r'tvg-chno="(\\d+)"', final)]
          if numbers != list(range(1, len(numbers) + 1)):
              raise SystemExit("Primary tvg-chno sequence is not continuous")
          print(f"Comet localized; MyTime normalized; {channel_number} active channels numbered.")
          PY
      - name: Validate and publish
        run: |
          set -euo pipefail
          python -m py_compile scripts/epg_coverage.py
          git diff --check
          rm .github/workflows/add-comet-channel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPTV-Playlist.m3u scripts/epg_coverage.py logos/comet.png .github/workflows/add-comet-channel.yml
          git commit -m "Add Comet and normalize MyTime Movie Network"
          git push origin main
