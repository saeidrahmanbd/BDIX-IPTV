name: One-time BDIX logo catalogue import
on:
  push:
    paths:
      - .github/workflows/import-bdix-logo-catalogue.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Import exact external logos
        run: |
          python - <<'PY'
          import io,json,re,ssl,urllib.request
          from pathlib import Path
          from PIL import Image
          import cairosvg
          P=Path("BDIX-Playlist.m3u"); L=Path("logos"); L.mkdir(exist_ok=True)
          RAW="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/"
          CTX=ssl._create_unverified_context()
          def get(u):
            q=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(q,timeout=20,context=CTX) as r:return r.read(),r.headers.get("Content-Type","")
          def clean(s):
            s=re.sub(r"\[[^]]*\]|\([^)]*\)"," ",s)
            s=re.sub(r"\b(?:hd|fhd|uhd|sd|4k|1080p|720p|576p|480p)\b"," ",s,flags=re.I)
            return re.sub(r"[^a-z0-9]+","",s.lower())
          def slug(s): return re.sub(r"[^a-z0-9]+","-",s.lower()).strip("-")
          channels=json.loads(get("https://iptv-org.github.io/api/channels.json")[0])
          logos=json.loads(get("https://iptv-org.github.io/api/logos.json")[0])
          byid={str(x.get("id","")).lower():x for x in channels if x.get("id")}
          byname={}
          for x in channels:
            for n in [x.get("name","")]+list(x.get("alt_names") or []):
              k=clean(str(n))
              if k: byname.setdefault(k,[]).append(x)
          logoby={}
          for x in logos:
            cid=str(x.get("channel","")).lower()
            if cid and x.get("url") and cid not in logoby: logoby[cid]=x["url"]
          fallback={
            "ANONDO TV":"https://images.seeklogo.com/logo-png/40/1/anondo-tv-logo-png_seeklogo-407012.png",
            "ABP ANANDA":"https://storage.googleapis.com/e4m-news-photo/news-photo/105752-image49.jpg",
            "NEWS 18 BANGLA":"https://upload.wikimedia.org/wikipedia/commons/6/67/News18_Bangla_logo.jpeg",
            "TV 9 BANGLA":"https://xstreamcp-assets-msp.streamready.in/assets/LIVETV/LIVECHANNEL/LIVETV_LIVETVCHANNEL_TV9_BANGLA/images/LOGO_HD/image.png",
            "CANADA ONE":"https://i.imgur.com/zr6KoiS.jpg",
            "AAJ TAK HD":"https://xstreamcp-assets-msp.streamready.in/assets/LIVETV/LIVECHANNEL/LIVETV_LIVETVCHANNEL_AAJ_TAK/images/LOGO_HD/image.png",
            "ABC NEWS":"https://raw.githubusercontent.com/LITUATUI/M3UPT/main/logos/ABC-News.png",
            "GOOD NEWS TODAY":"https://i.imgur.com/vbSR4cA.png",
            "HOLLYWOOD HD":"https://ip-tv.dev/epg/icon/hollywood-hd.png",
            "IND: WION":"https://xstreamcp-assets-msp.streamready.in/assets/ZEEDIGITAL/LIVECHANNEL/67ed357bd88a5f7a856b6fbb/images/LOGO/LOGO_14l9kmNae_WION-(2).png",
            "TRACE LATINA":"https://i.imgur.com/GHbz8wd.png",
            "TRACE SPORT STARS HD":"https://i.imgur.com/FabFP5A.png",
            "US: WILLOW SPORTS HD":"https://provider-static.plex.tv/epg/cms/production/acf3d1d8-c53e-49ca-86e9-0d9410b106b4/Willow_Sports_dark_Background_1500_1000_color.png",
            "DISCOVERY BANGLA":"https://raw.githubusercontent.com/subirkumarpaul/Logo/main/Discovery%20.png",
            "DMAX":"https://i.ibb.co/5LsVLz9/ccdmax.png",
            "SPOCETOON":"https://upload.wikimedia.org/wikipedia/en/2/2b/Spacetoon_logo.png",
            "PK: GEO SUPER":"https://iptv-org.github.io/iptv/logos/GeoSuper.pk.png",
            "IN: SONY SPORTS TEN 2 HD":"https://iptv-org.github.io/iptv/logos/SonySportsTen2.in.png",
            "PEACE TV BENGALI":RAW+"peace-tv-bangla.png",
            "IN: -HINDI- STAR SPORTS 1 HD":RAW+"star-sports-1.png",
            "SONY TV HD":RAW+"sony-entertainment-tv.png"
          }
          lines=P.read_text(encoding="utf-8-sig").replace("\r","").splitlines()
          done=[]; unresolved=[]
          for i,line in enumerate(lines):
            if not line.startswith("#EXTINF"): continue
            if re.search(r'tvg-logo="[^"]+"',line): continue
            m=re.search(r'tvg-name="([^"]*)"',line); name=m.group(1) if m else line.rsplit(",",1)[-1].strip()
            meta=dict(re.findall(r'([\w-]+)="([^"]*)"',line)); cid=meta.get("tvg-id","").lower()
            url=logoby.get(cid) or logoby.get(cid.split("@",1)[0])
            if not url:
              cand=byname.get(clean(name),[])
              ids={str(x.get("id","")).lower():x for x in cand if x.get("id")}
              if len(ids)==1:url=logoby.get(next(iter(ids)))
            if not url:url=fallback.get(name.upper())
            if not url:
              unresolved.append(name); continue
            try:
              data,ct=get(url)
              try: im=Image.open(io.BytesIO(data)).convert("RGBA")
              except Exception:
                im=Image.open(io.BytesIO(cairosvg.svg2png(bytestring=data,output_width=1000))).convert("RGBA")
              fn=slug(name)+".png"; im.save(L/fn,"PNG",optimize=True)
              ref=RAW+fn
              comma=line.find(",")
              lines[i]=line[:comma]+' tvg-logo="'+ref+'"'+line[comma:]
              done.append(name)
            except Exception as e:
              unresolved.append(name+" ["+str(e)+"]")
          P.write_text("\n".join(lines).rstrip()+"\n",encoding="utf-8")
          print("Imported:",len(done),"of",len(done)+len(unresolved))
          print("UNRESOLVED:",len(unresolved))
          for x in unresolved: print(" -",x)
          PY
      - name: Commit and remove one-time importer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/import-bdix-logo-catalogue.yml .github/workflows/import-bdix-missing-logos-v2.yml .github/workflows/import-bdix-missing-logos.yml
          git add BDIX-Playlist.m3u logos/ .github/workflows/
          git commit -m "Import missing BDIX channel logos"
          git push origin HEAD:main
