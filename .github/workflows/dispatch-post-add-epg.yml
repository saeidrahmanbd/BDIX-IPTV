name: Dispatch EPG refresh after Comet and MyTime update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-post-add-epg.yml"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Dispatch current EPG refresh against latest main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Refresh IPTV EPG" --ref main
      - name: Remove one-time dispatcher
        run: |
          set -euo pipefail
          rm .github/workflows/dispatch-post-add-epg.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/dispatch-post-add-epg.yml
          git commit -m "Remove one-time EPG dispatcher"
          git push origin main
