name: One-Time Conservative Playlist Repair

on:
  push:
    paths:
      - .github/workflows/one-time-conservative-playlist-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Snapshot playlist before repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('IPTV-Playlist.m3u')
          lines=p.read_text(encoding='utf-8-sig').replace('\r','').splitlines()
          urls=[x.strip() for x in lines if x.strip().startswith(('http://','https://'))]
          Path('/tmp/before_urls.txt').write_text('\n'.join(urls)+'\n',encoding='utf-8')
          Path('/tmp/before_entry_count').write_text(str(sum(x.startswith('#EXTINF:') for x in lines)),encoding='utf-8')
          print('Entries:', sum(x.startswith('#EXTINF:') for x in lines))
          print('Stream URL lines:', len(urls))
          PY

      - name: Apply existing conservative metadata normalization
        run: |
          python scripts/normalize_metadata.py

      - name: Validate and enforce stream preservation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('IPTV-Playlist.m3u')
          lines=p.read_text(encoding='utf-8-sig').replace('\r','').splitlines()
          after_urls=[x.strip() for x in lines if x.strip().startswith(('http://','https://'))]
          before_urls=Path('/tmp/before_urls.txt').read_text(encoding='utf-8').splitlines()
          before_count=int(Path('/tmp/before_entry_count').read_text())
          after_count=sum(x.startswith('#EXTINF:') for x in lines)
          if after_count != before_count:
              raise SystemExit(f'SAFETY FAILURE: entry count changed {before_count} -> {after_count}')
          if after_urls != before_urls:
              raise SystemExit('SAFETY FAILURE: stream URL order/content changed')
          if not lines or not lines[0].startswith('#EXTM3U'):
              raise SystemExit('SAFETY FAILURE: missing #EXTM3U header')
          for i,line in enumerate(lines):
              if line.startswith('#EXTINF:'):
                  j=i+1
                  while j<len(lines) and not lines[j].strip(): j+=1
                  if j>=len(lines) or not lines[j].strip().startswith(('http://','https://')):
                      raise SystemExit(f'SAFETY FAILURE: EXTINF at line {i+1} has no stream URL')
          print('Entries:', after_count)
          print('Stream URL count/order/content: PRESERVED')
          PY

      - name: Commit playlist repair and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- reports 2>/dev/null || true
          git add IPTV-Playlist.m3u
          if ! git diff --cached --quiet; then
            git commit -m 'Apply conservative IPTV playlist corrections'
          fi
          git rm -f .github/workflows/one-time-conservative-playlist-repair.yml
          git commit -m 'Remove one-time playlist repair workflow'
          git push origin HEAD:main
