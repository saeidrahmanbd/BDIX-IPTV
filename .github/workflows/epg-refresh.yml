
name: Refresh IPTV EPG

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/epg-refresh.yml
      - IPTV-Playlist.m3u
      - BDIX-Playlist.m3u
      - International-Playlist.m3u
      - scripts/epg_coverage.py
      - scripts/generate_epg.py
      - scripts/run_generate_epg.py
      - scripts/fetch_iptv_org_epg.py
      - scripts/augment_epg_mapping_from_additional_sources.py
      - scripts/augment_epg_mapping_from_iptv_org.py
      - scripts/epg_publish_gate_v2.py
      - scripts/official_epg_sources.py
      - scripts/check_epg_config.py
      - scripts/validate_epg_freshness.py
      - reports/epg-india-channel-mapping.csv
      - docs/requirements.txt
  schedule:
    - cron: '47 23 * * *' # 05:47 Asia/Dhaka
  workflow_dispatch:

permissions:
  contents: write

# Serialize EPG publication with every other main-branch playlist writer.
concurrency:
  group: iptv-playlist-main-writer-v2
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    if: ${{ !(github.actor == 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'Refresh IPTV EPG')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M3U4U_XMLTV_URL: ${{ secrets.M3U4U_XMLTV_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - name: Validate EPG configuration and policy
        run: |
          set -euo pipefail
          python -m py_compile scripts/epg_coverage.py scripts/generate_epg.py scripts/run_generate_epg.py scripts/fetch_iptv_org_epg.py scripts/epg_publish_gate_v2.py scripts/validate_epg_freshness.py
          python -m unittest discover -s tests -p 'test_epg_config.py'
          python -m unittest discover -s tests -p 'test_language_policy.py'
          python scripts/check_epg_config.py
      - name: Regenerate, freshness-check and publish XMLTV
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p reports
          if [ -s epg/epg.xml ]; then cp epg/epg.xml /tmp/bdix-epg-previous.xml; fi

          # Refresh source-to-playlist mappings, then build a targeted iptv-org guide.
          python scripts/epg_coverage.py
          python scripts/fetch_iptv_org_epg.py
          python scripts/run_generate_epg.py
          test -s epg/epg.xml
          grep -q '<programme ' epg/epg.xml

          # Do not publish a guide that contains mostly expired programme rows.
          python scripts/validate_epg_freshness.py epg/epg.xml --report reports/epg-publish-freshness.md
          python scripts/epg_publish_gate_v2.py

          # Recompute published-guide coverage against the new XMLTV, then check freshness again.
          python scripts/epg_coverage.py
          python scripts/validate_epg_freshness.py epg/epg.xml --report reports/epg-publish-freshness.md

          git add -f epg/epg.xml
          git add reports/epg-india-channel-mapping.csv reports/epg-coverage.md reports/epg-three-playlist-audit.md reports/epg-unmapped-audit.md reports/epg-publish-freshness.md
          if git diff --cached --quiet; then
            echo 'EPG output and coverage reports are unchanged.'
            exit 0
          fi
          git commit -m 'Refresh IPTV EPG and coverage reports'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Upload EPG freshness diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epg-freshness-${{ github.run_number }}
          path: reports/epg-publish-freshness.md
          if-no-files-found: warn
          retention-days: 7
