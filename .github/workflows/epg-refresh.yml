name: Refresh IPTV EPG

on:
  push:
    branches: [main]
    paths:
      - 'IPTV-Playlist.m3u'
      - 'BDIX-Playlist.m3u'
      - 'International-Playlist.m3u'
      - '.github/workflows/epg-refresh.yml'
      - 'reports/epg-channel-mapping.csv'
      - 'epg/source-rights-register.csv'
      - 'scripts/*epg*.py'
      - 'scripts/official_epg_sources.py'
      - 'docs/requirements.txt'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-epg-writer-v5
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ !(github.actor == 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'Refresh IPTV EPG')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EPG_ALLOW_UNVERIFIED_SOURCES: 'true'
      NODE_VERSION: '22'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Skip superseded queued EPG refresh
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_SHA}" != "$CURRENT_MAIN_SHA" ]]; then
            echo "::notice::Skipping superseded queued EPG refresh; a newer main-branch commit contains the latest playlist inventory."
            exit 0
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - name: Validate EPG configuration and policy
        run: |
          set -euo pipefail
          python -m py_compile scripts/epg_coverage.py scripts/generate_epg.py scripts/run_generate_epg.py scripts/fetch_iptv_org_epg.py scripts/augment_epg_mapping_from_iptv_org.py scripts/epg_publish_gate_v2.py scripts/validate_epg_freshness.py scripts/epg_refresh_needed.py scripts/check_epg_source_rights.py
          python -m unittest discover -s tests -p 'test_epg_refresh_needed.py'
          python -m unittest discover -s tests -p 'test_epg_config.py'
          python -m unittest discover -s tests -p 'test_language_policy.py'
          python -m unittest discover -s tests -p 'test_iptv_org_epg_targeting.py'
          python scripts/check_epg_config.py
          python -m unittest discover -s tests -p 'test_epg_source_rights.py'
          python -m unittest discover -s tests -p 'test_epg_publication_safety.py'
          python scripts/check_epg_source_rights.py
      - name: Regenerate, validate and publish XMLTV
        shell: bash
        run: |
          set -euo pipefail
          if python scripts/epg_refresh_needed.py --max-age-hours 8; then
            echo '::notice::The daily maintenance job already published a fresh EPG for the current playlists; skipping duplicate generation.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p reports epg

          # Keep a fallback only if the current branch already has a published guide.
          # Do not restore pre-removal snapshots: they may contain schedules from feeds
          # that have since been explicitly excluded from the active source pipeline.
          HAVE_PUBLISHED_FALLBACK=false
          if [ -s epg/epg.xml ]; then
            cp epg/epg.xml /tmp/bdix-epg-previous.xml
            cp /tmp/bdix-epg-previous.xml /tmp/bdix-epg-published-fallback.xml
            HAVE_PUBLISHED_FALLBACK=true
          fi

          # Build the new candidate. Source pruning in generate_epg.py restricts
          # parsing to feeds with current mapped IDs plus local/official adapters.
          # The candidate is never allowed to destroy an existing published guide
          # merely because an upstream feed is broken.
          python scripts/epg_coverage.py
          # The iptv-org scraper is supplemental; do not let its npm install or
          # catalogue scraping block the main XMLTV feeds indefinitely.
          if ! timeout 180s python scripts/fetch_iptv_org_epg.py; then
            echo "::warning::Optional iptv-org guide timed out or failed; proceeding with the configured XMLTV feeds."
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<tv generator-info-name="BDIX-IPTV optional iptv-org guide unavailable"></tv>' > /tmp/iptv-org-guide.xml
          fi
          test -s /tmp/iptv-org-guide.xml
          python scripts/run_generate_epg.py
          test -s epg/epg.xml
          grep -q '<programme ' epg/epg.xml

          CANDIDATE_OK=true
          if ! python scripts/validate_epg_freshness.py epg/epg.xml --report reports/epg-publish-freshness.md; then
            CANDIDATE_OK=false
            echo '::warning::New EPG candidate failed freshness validation; retaining the last known-good public guide.'
          elif ! python scripts/epg_publish_gate_v2.py; then
            CANDIDATE_OK=false
            echo '::warning::New EPG candidate failed publication gates; retaining the last known-good public guide.'
          fi

          if [ "$CANDIDATE_OK" != true ]; then
            if [ "$HAVE_PUBLISHED_FALLBACK" = true ]; then
              cp /tmp/bdix-epg-published-fallback.xml epg/epg.xml
              python scripts/validate_epg_freshness.py epg/epg.xml --report reports/epg-publish-freshness.md || true
            else
              echo "::error::No previously published guide exists and the candidate failed quality gates; refusing to publish an invalid guide."
              exit 1
            fi
          fi

          # Coverage is always computed against the guide that will actually be published.
          python scripts/epg_coverage.py
          python scripts/validate_epg_freshness.py epg/epg.xml --report reports/epg-publish-freshness.md || true

          git add -f epg/epg.xml
          git add reports/epg-channel-mapping.csv reports/epg-coverage.md reports/epg-three-playlist-audit.md reports/epg-unmapped-audit.md reports/epg-publish-freshness.md reports/epg-timing-audit.md
          git add -u -- reports

          if ! git diff --quiet; then
            echo 'ERROR: unstaged tracked changes remain after staging EPG outputs:'
            git status --short
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'EPG output and coverage reports are unchanged.'
            exit 0
          fi

          if [ "$CANDIDATE_OK" = true ]; then
            COMMIT_MESSAGE='Refresh IPTV EPG and coverage reports'
          else
            COMMIT_MESSAGE='Restore last known-good IPTV EPG and refresh diagnostics'
          fi
          git commit -m "$COMMIT_MESSAGE"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::EPG outputs conflicted with newer main content; no force-push attempted."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::EPG push attempt ${attempt} failed; retrying after refreshing main."
            sleep 3
          done
          echo '::error::Could not publish EPG after 3 attempts.'
          exit 1
      - name: Upload EPG freshness diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: epg-freshness-${{ github.run_number }}
          path: reports/epg-publish-freshness.md
          if-no-files-found: warn
          retention-days: 7
