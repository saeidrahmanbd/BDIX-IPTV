name: Refresh IPTV EPG
# Re-run after the two-playlist inventory migration to rebuild validated coverage and dashboard metrics.
# Rebuild requested after IPTV-Playlist.m3u metadata, numbering and EPG inventory corrections.

# Serialize the full run, including the daily guard, so simultaneous manual
# refreshes cannot mutually skip before reaching the shared playlist writer queue.
concurrency:
  group: epg-refresh-run-v1
  cancel-in-progress: false
  queue: max

on:
  push:
    branches: [main]
    paths:
      - 'IPTV-Playlist.m3u'
      - 'International-Playlist.m3u'
      - '.github/workflows/epg-refresh.yml'
      - 'reports/epg-channel-mapping.csv'
      - 'scripts/*epg*.py'
      - 'scripts/official_epg_sources.py'
      - 'scripts/validate_report_freshness.py'
      - 'tests/test_epg_source_rights.py'
      - 'tests/test_epg_config.py'
      - 'tests/test_epg_mapping_regions.py'
      - 'tests/test_epg_timing_offsets.py'
      - 'tests/test_iptv_org_epg_targeting.py'
      - 'tests/test_epg_refresh_needed.py'
      - 'tests/test_report_freshness.py'
      - 'tests/test_dashboard_freshness.py'
      - 'scripts/generate_dashboard.py'
      - 'tests/test_epg_publication_safety.py'
      - 'docs/requirements.txt'
  # GITHUB_TOKEN playlist commits do not reliably start a second workflow via push.
  # Refresh EPG after any completed workflow that may write a maintained playlist; use latest committed main inputs.
  workflow_run:
    workflows: ["IPTV Playlist Update", "IPTV New Channel Discovery", "International Channel Discovery", "Playlist Logo Repair and Localization"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # 09:00 Asia/Dhaka (UTC+6), after 07:00 discovery and 08:17 maintenance
  # Keep manual dispatch available for post-change EPG quality verification.
  workflow_dispatch:

# EPG generation is a main-branch writer. Keep it in the shared writer queue so it
# cannot publish concurrently with playlist, logo, discovery or dashboard commits.
permissions:
  contents: write

jobs:
  daily_guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Deduplicate daily EPG refresh events
        id: guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discovery_schedule_guard.py guard epg-refresh.yml
  refresh:
    needs: daily_guard
    # Refresh against the latest committed playlists even when a playlist-maintenance
    # workflow is blocked, but run at most once per Bangladesh calendar date.
    if: ${{ needs.daily_guard.outputs.should_run == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled') && (github.event_name != 'push' || !(github.actor == 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'Refresh IPTV EPG'))) }}
    concurrency:
      group: iptv-playlist-main-writer-v5
      queue: max
      cancel-in-progress: false
    # EPG publishes with an input-SHA guard and a rebase loop below. The shared
    # job-level writer lock serializes this publication with all other main writers.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_VERSION: '22'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 20
          sparse-checkout: |
            .
            .github/workflows
            assets
            docs
            epg
            reports
            scripts
            tests
          sparse-checkout-cone-mode: true
      - name: Skip superseded queued EPG refresh
        id: superseded_guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          if [[ "${GITHUB_SHA}" != "$CURRENT_MAIN_SHA" ]]; then
              CHANGED_INPUTS="$(git diff --name-only "${GITHUB_SHA}..${CURRENT_MAIN_SHA}" | grep -E '^(IPTV-Playlist\.m3u|International-Playlist\.m3u|\.github/workflows/epg-refresh\.yml|reports/epg-channel-mapping\.csv|scripts/([^/]*epg[^/]*\.py|official_epg_sources\.py|validate_report_freshness\.py|generate_dashboard\.py)|tests/test_(epg_[^/]*|[^/]*epg[^/]*|iptv_org_epg_targeting|report_freshness|dashboard_freshness)\.py|docs/requirements\.txt)$' || true)"
            if [[ -n "$CHANGED_INPUTS" ]]; then
              echo 'skip=true' >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping superseded EPG refresh because newer commits changed EPG inputs or code."
              printf '%s\n' "$CHANGED_INPUTS"
              exit 0
            fi
            echo "::notice::Continuing despite newer generated-output commits; this run still needs to apply the latest EPG code."
          fi
          echo 'skip=false' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: steps.superseded_guard.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: steps.superseded_guard.outputs.skip != 'true'
        with:
          node-version: '22'
      - name: Install Python dependencies
        if: steps.superseded_guard.outputs.skip != 'true'
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - name: Validate EPG configuration and quality rules
        if: steps.superseded_guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python -m py_compile scripts/epg_coverage.py scripts/epg_source_cache.py scripts/generate_epg.py scripts/run_generate_epg.py scripts/fetch_iptv_org_epg.py scripts/augment_epg_mapping_from_additional_sources.py scripts/augment_epg_mapping_from_iptv_org.py scripts/update_epg_published_coverage.py scripts/epg_publish_gate_v2.py scripts/validate_epg_freshness.py scripts/validate_report_freshness.py scripts/epg_refresh_needed.py scripts/check_epg_source_rights.py scripts/generate_dashboard.py
          python -m unittest discover -s tests -p 'test_epg_refresh_needed.py'
          python -m unittest discover -s tests -p 'test_epg_config.py'
          python -m unittest discover -s tests -p 'test_epg_mapping_regions.py'
          python -m unittest discover -s tests -p 'test_language_policy.py'
          python -m unittest discover -s tests -p 'test_iptv_org_epg_targeting.py'
          python scripts/check_epg_config.py
          python -m unittest discover -s tests -p 'test_epg_publication_safety.py'
          python -m unittest discover -s tests -p 'test_epg_source_rights.py'
          python -m unittest discover -s tests -p 'test_epg_timing_offsets.py'
          python -m unittest discover -s tests -p 'test_report_freshness.py'
          python -m unittest discover -s tests -p 'test_dashboard_freshness.py'
      - name: Regenerate, validate and publish XMLTV
        if: steps.superseded_guard.outputs.skip != 'true'
        shell: bash
        env:
          M3U4U_XMLTV_URL: ${{ secrets.M3U4U_XMLTV_URL }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p reports epg

          # Scheduled and workflow_run events may reuse a fresh guide when it
          # already matches the current playlists. Pushes and manual dispatches
          # still exercise the updated mapping/generator/validation pipeline.
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || "${GITHUB_EVENT_NAME}" == "workflow_run" ]] && python scripts/epg_refresh_needed.py --max-age-hours 8; then
            echo '::notice::A fresh EPG already exists for the current playlists; refreshing dashboard and maintenance snapshots without rebuilding XMLTV.'
            python scripts/generate_dashboard.py
            python scripts/validate_report_freshness.py --mode epg
            git add assets/dashboard.svg 'reports/Update Report.md' reports/maintenance-report.md
            if git diff --cached --quiet; then
              echo 'EPG and dashboard snapshots are already current.'
              exit 0
            fi
            git commit -m 'Refresh EPG dashboard snapshots'
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo '::error::Dashboard snapshot conflicted with newer main content; no force-push attempted.'
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "::warning::Dashboard push attempt ${attempt} failed; retrying after refreshing main."
              sleep 3
            done
            echo '::error::Could not publish dashboard snapshots after 3 attempts.'
            exit 1
          fi

          HAVE_PUBLISHED_FALLBACK=false
          if [ -s epg/epg.xml ]; then
            cp epg/epg.xml /tmp/iptv-epg-previous.xml
            cp /tmp/iptv-epg-previous.xml /tmp/iptv-epg-published-fallback.xml
            HAVE_PUBLISHED_FALLBACK=true
          fi

          python scripts/epg_coverage.py
          if ! timeout 180s python scripts/fetch_iptv_org_epg.py; then
            echo '::warning::Optional iptv-org guide timed out or failed; proceeding with the configured XMLTV feeds.'
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<tv generator-info-name="BDIX-IPTV optional iptv-org guide unavailable"></tv>' > /tmp/iptv-org-guide.xml
          fi
          test -s /tmp/iptv-org-guide.xml
          python scripts/run_generate_epg.py
          test -s epg/epg.xml
          grep -q '<programme ' epg/epg.xml

          CANDIDATE_OK=true
          if ! python scripts/validate_epg_freshness.py epg/epg.xml --report reports/epg-publish-freshness.md; then
            CANDIDATE_OK=false
            echo '::warning::New EPG candidate failed freshness validation; retaining the last known-good public guide.'
          elif ! python scripts/epg_publish_gate_v2.py; then
            CANDIDATE_OK=false
            echo '::warning::New EPG candidate failed publication gates; retaining the last known-good public guide.'
          fi

          if [ "$CANDIDATE_OK" != true ]; then
            if [ "$HAVE_PUBLISHED_FALLBACK" = true ]; then
              cp /tmp/iptv-epg-published-fallback.xml epg/epg.xml
              if ! python scripts/validate_epg_freshness.py epg/epg.xml --report reports/epg-publish-freshness.md; then
                echo '::error::The last-known-good guide is no longer fresh; refusing to publish a stale fallback.'
                exit 1
              fi
            else
              echo '::error::No previously published guide exists and the candidate failed quality gates; refusing to publish an invalid guide.'
              exit 1
            fi
          fi

          python scripts/epg_coverage.py
          for report in \
            reports/epg-coverage.md \
            reports/epg-playlist-audit.md \
            reports/epg-source-audit.md \
            reports/bangladesh-epg-source-audit.md \
            reports/epg-unmapped-audit.md \
            reports/epg-publish-freshness.md \
            reports/epg-channel-mapping.csv; do
            if [[ ! -s "$report" ]]; then
              echo "::error::Required EPG report is missing or empty: $report"
              exit 1
            fi
          done
          python scripts/validate_epg_freshness.py epg/epg.xml --report reports/epg-publish-freshness.md
          python scripts/validate_report_freshness.py --mode epg

          # Defer dashboard snapshots until after the EPG commit is rebased onto the latest main.
          # This avoids conflicts with concurrent playlist-maintenance dashboard updates.
          git add -f epg/epg.xml reports/epg-channel-mapping.csv reports/epg-coverage.md reports/epg-playlist-audit.md reports/epg-source-audit.md reports/bangladesh-epg-source-audit.md reports/epg-unmapped-audit.md reports/epg-publish-freshness.md reports/epg-timing-audit.md
          git add -u -- reports

          if ! git diff --quiet; then
            echo 'ERROR: unstaged tracked changes remain after staging EPG outputs:'
            git status --short
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'EPG output, dashboard and coverage reports are unchanged.'
            exit 0
          fi

          if [ "$CANDIDATE_OK" = true ]; then
            COMMIT_MESSAGE='Refresh IPTV EPG, coverage reports and dashboard'
          else
            COMMIT_MESSAGE='Restore last known-good IPTV EPG and refresh dashboard diagnostics'
          fi
          git commit -m "$COMMIT_MESSAGE"

          for attempt in 1 2 3; do
            git fetch origin main
            CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
            if [[ "${GITHUB_SHA}" != "$CURRENT_MAIN_SHA" ]]; then
              CHANGED_INPUTS="$(git diff --name-only "${GITHUB_SHA}..${CURRENT_MAIN_SHA}" | grep -E '^(IPTV-Playlist\.m3u|International-Playlist\.m3u|\.github/workflows/epg-refresh\.yml|reports/epg-channel-mapping\.csv|scripts/([^/]*epg[^/]*\.py|official_epg_sources\.py|validate_report_freshness\.py|generate_dashboard\.py)|tests/test_(epg_[^/]*|[^/]*epg[^/]*|iptv_org_epg_targeting|report_freshness|dashboard_freshness)\.py|docs/requirements\.txt)$' || true)"
              if [[ -n "$CHANGED_INPUTS" ]]; then
                echo '::error::EPG input code/config changed while this candidate was being built; refusing to publish stale output. The newest queued refresh must rebuild it.'
                printf '%s\n' "$CHANGED_INPUTS"
                exit 1
              fi
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::EPG outputs conflicted with newer main content; no force-push attempted.'
              exit 1
            fi
            # A playlist/mapping commit may have landed while the guide was building.
            # Revalidate fingerprints after rebasing so stale reports are never published.
            if ! python scripts/validate_report_freshness.py --mode epg; then
              echo '::error::EPG inputs changed during generation; the newest queued refresh must publish instead.'
              exit 1
            fi
            # Generate dashboard snapshots from the rebased reports and playlists,
            # then amend them into this commit. This keeps dashboard files out of
            # the rebase conflict window with concurrent maintenance workflows.
            python scripts/generate_dashboard.py
            python scripts/validate_report_freshness.py --mode epg
            git add assets/dashboard.svg 'reports/Update Report.md' reports/maintenance-report.md
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::EPG push attempt ${attempt} failed; retrying after refreshing main."
            sleep 3
          done
          echo '::error::Could not publish EPG after 3 attempts.'
          exit 1
      - name: Upload EPG freshness diagnostic
        if: always() && steps.superseded_guard.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: epg-freshness-${{ github.run_number }}
          path: reports/epg-publish-freshness.md
          if-no-files-found: warn
          retention-days: 7
