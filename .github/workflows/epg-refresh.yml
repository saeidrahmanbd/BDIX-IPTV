name: Refresh IPTV EPG

on:
  # Refresh the EPG workflow when maintained playlist inventories or EPG inputs change.
  # The job-level redistribution-rights gate below remains mandatory.
  push:
    branches:
      - main
    paths:
      - 'IPTV-Playlist.m3u'
      - 'BDIX-Playlist.m3u'
      - 'International-Playlist.m3u'
      - 'reports/epg-channel-mapping.csv'
      - 'scripts/*epg*.py'
      - 'scripts/official_epg_sources.py'
      - 'docs/requirements.txt'
  # Run after daily maintenance; the freshness guard skips duplicate work if maintenance succeeded.
  schedule:
    - cron: '17 4 * * *' # 10:17 Asia/Dhaka, two hours after scheduled maintenance
  workflow_dispatch:

permissions:
  contents: write

# Serialize EPG publication with other main-branch playlist writers.
# Versioned writer queue isolates new runs from stale v2 runs already queued.
concurrency:
  group: iptv-playlist-main-writer-v3
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    # Fail closed: no EPG source retrieval/publication until source redistribution rights are documented.
    if: ${{ vars.EPG_REDISTRIBUTION_APPROVED == 'true' && !(github.actor == 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'Refresh IPTV EPG')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M3U4U_XMLTV_URL: ${{ secrets.M3U4U_XMLTV_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - name: Validate EPG configuration and policy
        run: |
          set -euo pipefail
          python -m py_compile scripts/epg_coverage.py scripts/generate_epg.py scripts/run_generate_epg.py scripts/fetch_iptv_org_epg.py scripts/augment_epg_mapping_from_iptv_org.py scripts/epg_publish_gate_v2.py scripts/validate_epg_freshness.py scripts/epg_refresh_needed.py
          python -m unittest discover -s tests -p 'test_epg_refresh_needed.py'
          python -m unittest discover -s tests -p 'test_epg_config.py'
          python -m unittest discover -s tests -p 'test_language_policy.py'
          python -m unittest discover -s tests -p 'test_iptv_org_epg_targeting.py'
          python scripts/check_epg_config.py
      - name: Regenerate, freshness-check and publish XMLTV
        shell: bash
        run: |
          set -euo pipefail
          if python scripts/epg_refresh_needed.py --max-age-hours 8; then
            echo '::notice::The daily maintenance job already published a fresh EPG for the current playlists; skipping duplicate generation.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p reports
          if [ -s epg/epg.xml ]; then cp epg/epg.xml /tmp/bdix-epg-previous.xml; fi

          # Refresh source-to-playlist mappings, then build a targeted iptv-org guide.
          python scripts/epg_coverage.py
          python scripts/fetch_iptv_org_epg.py
          python scripts/run_generate_epg.py
          test -s epg/epg.xml
          grep -q '<programme ' epg/epg.xml

          # Do not publish a guide that contains mostly expired programme rows.
          python scripts/validate_epg_freshness.py epg/epg.xml --report reports/epg-publish-freshness.md
          python scripts/epg_publish_gate_v2.py

          # Recompute published-guide coverage against the new XMLTV, then check freshness again.
          python scripts/epg_coverage.py
          python scripts/validate_epg_freshness.py epg/epg.xml --report reports/epg-publish-freshness.md

          git add -f epg/epg.xml
          git add reports/epg-channel-mapping.csv reports/epg-coverage.md reports/epg-three-playlist-audit.md reports/epg-unmapped-audit.md reports/epg-publish-freshness.md reports/epg-timing-audit.md
          # EPG generation also updates tracked diagnostic reports. Stage any such
          # updates so rebase never starts with a dirty tracked worktree.
          git add -u -- reports
          if ! git diff --quiet; then
            echo 'ERROR: unstaged tracked changes remain after staging EPG outputs:'
            git status --short
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'EPG output and coverage reports are unchanged.'
            exit 0
          fi
          git commit -m 'Refresh IPTV EPG and coverage reports'
          # Another workflow may advance main after this run starts. Re-fetch,
          # rebase, and retry the push rather than failing on a transient race.
          # If generated reports conflict with newer outputs, stop safely rather
          # than force-pushing stale EPG data over the newer main branch.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::EPG outputs conflicted with newer main content; no force-push attempted."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::EPG push attempt ${attempt} failed; retrying after refreshing main."
            sleep 3
          done
          echo "::error::Could not publish EPG after 3 attempts."
          exit 1
      - name: Upload EPG freshness diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epg-freshness-${{ github.run_number }}
          path: reports/epg-publish-freshness.md
          if-no-files-found: warn
          retention-days: 7
