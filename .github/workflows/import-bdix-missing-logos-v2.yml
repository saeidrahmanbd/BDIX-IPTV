name: One-time BDIX missing logo import
on:
  push:
    paths:
      - .github/workflows/import-bdix-missing-logos-v2.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Download and install missing BDIX logos
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, re, urllib.request
          from pathlib import Path
          from PIL import Image
          import cairosvg

          repo = Path(".")
          logos = repo / "logos"
          playlist = repo / "BDIX-Playlist.m3u"
          raw = "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/"
          logos.mkdir(exist_ok=True)

          sources = {
            "Anondo TV": ["https://images.seeklogo.com/logo-png/40/1/anondo-tv-logo-png_seeklogo-407012.png"],
            "ABP ANANDA": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/ABP_Ananda_logo.svg"],
            "BANGLA JAGO": ["https://graph.facebook.com/BanglaJagoNews/picture?width=800&height=800"],
            "NEWS 18 BANGLA": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/News18_Bangla_logo.jpeg"],
            "REPUBLIC BANGLA": ["https://ltsk-cdn.s3.eu-west-1.amazonaws.com/jumpstart/Temp_Live/cdn/HLS/Channel/transparentImages/REPUBLIC-BANGLA-LOGO_RGB_Transparent.png"],
            "TV 9 BANGLA": ["https://xstreamcp-assets-msp.streamready.in/assets/LIVETV/LIVECHANNEL/LIVETV_LIVETVCHANNEL_TV9_BANGLA/images/LOGO_HD/image.png"],
            "BOLLYWOOD CLASSIC HD": ["https://raw.githubusercontent.com/subirkumarpaul/Logo/main/Bollywood%20Classic.jpeg"],
            "CANADA ONE": ["https://i.imgur.com/zr6KoiS.jpg"],
            "DABANGG": ["https://a.jsrdn.com/hls/23199/dabangg/poster_20250324_190158.jpg"],
            "ISHAARA TV": ["https://dreamdth.com/wp-content/uploads/2021/02/Ishara-TV-1536x864.jpg"],
            "SONY TV HD": ["https://xstreamcp-assets-msp.streamready.in/assets/LIVETV/LIVECHANNEL/LIVETV_LIVETVCHANNEL_SONY_ENTERTAINMENT_TELEVISION_ASIA/images/LOGO_HD/image.png"],
            "AAJ TAK HD": ["https://xstreamcp-assets-msp.streamready.in/assets/LIVETV/LIVECHANNEL/LIVETV_LIVETVCHANNEL_AAJ_TAK/images/LOGO_HD/image.png"],
            "ABC NEWS": ["https://raw.githubusercontent.com/LITUATUI/M3UPT/main/logos/ABC-News.png"],
            "ARIRANG TV": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/Arirang_logo.png"],
            "CBS NEWS": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/CBS_News_logo.png"],
            "CNN INTERNATIONLA": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/CNNinternational-logo.png"],
            "DD NEWS": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/Dd-news_logo.png"],
            "FRANCE 24": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/France24.png"],
            "GOOD NEWS TODAY": ["https://i.imgur.com/vbSR4cA.png"],
            "HOLLYWOOD HD": ["https://ip-tv.dev/epg/icon/hollywood-hd.png"],
            "IND: WION": ["https://xstreamcp-assets-msp.streamready.in/assets/ZEEDIGITAL/LIVECHANNEL/67ed357bd88a5f7a856b6fbb/images/LOGO/LOGO_14l9kmNae_WION-(2).png"],
            "IND: ZEE BUSINESS": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/Zee_Business_2025.svg"],
            "IND: ZEE NEWS": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/Zee_News_Logo_2025.svg"],
            "NDTV": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/NDTV_247.svg"],
            "NDTV 24x7": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/NDTV_247.svg"],
            "NHK WORLD (JAPAN)": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/NHK_World.svg"],
            "SyFy": ["https://raw.githubusercontent.com/tv-logo/tv-logos/refs/heads/main/countries/united-states/syfy-us.png"],
            "TRACE LATINA": ["https://i.imgur.com/GHbz8wd.png"],
            "TRT WORLD": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/TRT_World.svg"],
            "US: FOX NEWS": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/Fox_news_channel_logo.png"],
            "US: SKY NEWS": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/Sky_News_2026.svg"],
            "ADVENTURE 4K": ["https://raw.githubusercontent.com/tv-logo/tv-logos/refs/heads/main/countries/international/adventure-4k.png"],
            "DISCOVERY BANGLA": ["https://bdiptv.stream/uploads/tv_image/discovery.png"],
            "DMAX": ["https://s3.i3ns.net/portal/picon/2022-01/079947b821323ccbffaab6acfb053eae.png"],
            "NASA TV": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/NASA_TV.png"],
            "VIASAT NATURE": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/Viasat_Nature_2026.svg"],
            "SPOCETOON": ["https://commons.wikimedia.org/wiki/Special:Redirect/file/Spacetoon.png"],
            "PEACE TV BENGALI": ["http://www.peacetv.tv/templates/images/english-logo.png"],
            "IN: -HINDI- STAR SPORTS 1 HD": ["https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/star-sports-1.png"],
            "IN: SONY SPORTS TEN 2 HD": ["https://jiotvimages.cdn.jio.com/dare_images/images/Sony_Sports_Ten_2.png"],
            "PK: GEO SUPER": ["http://103.176.90.118/picons/logos/logos/GEO-SUPER.png"],
            "TRACE Sport Stars HD": ["https://i.imgur.com/FabFP5A.png"],
            "US: WILLOW SPORTS HD": ["https://provider-static.plex.tv/epg/cms/production/acf3d1d8-c53e-49ca-86e9-0d9410b106b4/Willow_Sports_dark_Background_1500_1000_color.png"],
          }

          def slug(s):
              return re.sub(r"[^a-z0-9]+","-",s.lower()).strip("-")

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read(), r.headers.get("Content-Type","")

          playlist_text = playlist.read_text(encoding="utf-8-sig").replace("\r","")
          lines = playlist_text.splitlines()
          failed = []
          changed = 0

          for name, urls in sources.items():
              target = logos / (slug(name) + ".png")
              data = None
              content_type = ""
              last_error = None
              for url in urls:
                  try:
                      data, content_type = fetch(url)
                      if data:
                          break
                  except Exception as e:
                      last_error = e
              if not data:
                  failed.append(f"{name}: {last_error}")
                  continue

              try:
                  try:
                      im = Image.open(io.BytesIO(data)).convert("RGBA")
                  except Exception:
                      if data.lstrip().startswith(b"<svg") or "svg" in content_type.lower() or ".svg" in urls[0].lower():
                          png = cairosvg.svg2png(bytestring=data, output_width=1000)
                          im = Image.open(io.BytesIO(png)).convert("RGBA")
                      else:
                          raise
                  im.save(target, "PNG", optimize=True)
              except Exception as e:
                  failed.append(f"{name}: image conversion failed: {e}")
                  continue

              replacement = raw + target.name
              pat = re.compile(r'(tvg-name="' + re.escape(name) + r'"[^\n]*?tvg-logo=")[^"]*(")')
              found = False
              for i, line in enumerate(lines):
                  if line.startswith("#EXTINF") and name.lower() in line.lower():
                      if 'tvg-logo="' in line:
                          lines[i] = re.sub(r'(tvg-logo=")[^"]*(")', r'\1' + replacement + r'\2', line, count=1)
                          found = True
                          changed += 1
                          break
              if not found:
                  failed.append(f"{name}: playlist entry not found")

          playlist.write_text("\n".join(lines).rstrip()+"\n", encoding="utf-8", newline="\n")
          print(f"Installed logo files: {len(list(logos.glob('*.png')))} total")
          print(f"Updated BDIX playlist entries: {changed}")
          if failed:
              print("FAILED LOGOS:")
              for x in failed:
                  print(" -", x)
              if len(failed) > 0:
                  raise SystemExit(f"{len(failed)} logo imports failed")
          PY

      - name: Verify and self-remove importer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path("BDIX-Playlist.m3u").read_text(encoding="utf-8")
          names=["Anondo TV","ABP ANANDA","BANGLA JAGO","NEWS 18 BANGLA","REPUBLIC BANGLA","TV 9 BANGLA","BOLLYWOOD CLASSIC HD","CANADA ONE","DABANGG","ISHAARA TV","SONY TV HD","AAJ TAK HD","ABC NEWS","ARIRANG TV","CBS NEWS","CNN INTERNATIONLA","DD NEWS","FRANCE 24","GOOD NEWS TODAY","HOLLYWOOD HD","IND: WION","IND: ZEE BUSINESS","IND: ZEE NEWS","NDTV","NDTV 24x7","NHK WORLD (JAPAN)","SyFy","TRACE LATINA","TRT WORLD","US: FOX NEWS","US: SKY NEWS","ADVENTURE 4K","DISCOVERY BANGLA","DMAX","NASA TV","VIASAT NATURE","SPOCETOON","PEACE TV BENGALI","IN: -HINDI- STAR SPORTS 1 HD","IN: SONY SPORTS TEN 2 HD","PK: GEO SUPER","TRACE Sport Stars HD","US: WILLOW SPORTS HD"]
          missing=[n for n in names if not any(line.startswith("#EXTINF") and n.lower() in line.lower() and 'tvg-logo="' in line for line in p.splitlines())]
          if missing: raise SystemExit("Missing playlist logo refs: "+", ".join(missing))
          PY
          rm -f .github/workflows/import-bdix-missing-logos-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BDIX-Playlist.m3u logos/ .github/workflows/import-bdix-missing-logos-v2.yml
          git commit -m "Add missing BDIX playlist logos"
          git push origin HEAD:main
