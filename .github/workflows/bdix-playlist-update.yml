name: BDIX Playlist Update

on:
  push:
    branches: [main]
    paths:
      - BDIX-Playlist.m3u
      - scripts/bdix_playlist_update.py
      - scripts/sort_playlists.py
      - scripts/enforce_playlist_attribution.py
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# All workflows that can write a playlist or shared generated reports use the same queue.
concurrency:
  group: iptv-playlist-main-writer
  cancel-in-progress: false
  queue: max

jobs:
  maintain:
    if: ${{ !(github.actor == 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'Run BDIX playlist maintenance')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run BDIX Playlist Update
        run: python3 scripts/bdix_playlist_update.py

      - name: Sort maintained playlist
        run: python3 scripts/sort_playlists.py BDIX-Playlist.m3u

      - name: Enforce protected playlist attribution
        run: python3 scripts/enforce_playlist_attribution.py BDIX-Playlist.m3u

      - name: Commit BDIX maintenance results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp IPTV-Playlist.m3u /tmp/iptv-playlist-protected.m3u
          cp /tmp/iptv-playlist-protected.m3u IPTV-Playlist.m3u
          git add BDIX-Playlist.m3u reports/bdix-playlist-audit.md reports/bdix-stream-health.md reports/bdix-maintenance-history.json
          if git diff --cached --quiet; then
            echo "No BDIX maintenance changes."
            exit 0
          fi
          git commit -m 'Run BDIX playlist maintenance'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::warning::Concurrent maintenance changed shared reports; regenerating BDIX results from latest main."
              git rebase --abort || true
              git reset --hard origin/main
              cp IPTV-Playlist.m3u /tmp/iptv-playlist-protected.m3u
              python3 scripts/bdix_playlist_update.py
              python3 scripts/sort_playlists.py BDIX-Playlist.m3u
              python3 scripts/enforce_playlist_attribution.py BDIX-Playlist.m3u
              cp /tmp/iptv-playlist-protected.m3u IPTV-Playlist.m3u
              git add BDIX-Playlist.m3u reports/bdix-playlist-audit.md reports/bdix-stream-health.md reports/bdix-maintenance-history.json
              if git diff --cached --quiet; then
                echo "Latest main already contains all BDIX maintenance results."
                exit 0
              fi
              git commit -m 'Run BDIX playlist maintenance'
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
