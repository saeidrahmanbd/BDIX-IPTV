name: Repository Consistency Repair

on:
  push:
    branches: [main]
    paths:
      - IPTV-Playlist.m3u
      - scripts/reconcile_playlist_consistency.py
      - scripts/reconcile_generated_reports.py
      - scripts/audit_playlist.py
      - scripts/stream_health.py
      - scripts/generate_dashboard.py
      - reports/Update Report.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-playlist-main-writer
  cancel-in-progress: false
  queue: max

jobs:
  repair:
    if: ${{ !(github.actor == 'github-actions[bot]' && startsWith(github.event.head_commit.message, 'Run repository consistency repair')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Repair metadata and review-queue consistency
        run: python scripts/reconcile_playlist_consistency.py
      - name: Audit playlist
        run: python scripts/audit_playlist.py
      - name: Check stream health
        run: python scripts/stream_health.py
      - name: Reconcile generated report metrics
        run: python scripts/reconcile_generated_reports.py
      - name: Generate dashboard
        run: python scripts/generate_dashboard.py
      - name: Publish consistency repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IPTV-Playlist.m3u reports/playlist-audit.md reports/stream-health.md reports/Update\ Report.md reports/maintenance-report.md assets/dashboard.svg reports/channel-identity-index.json
          if git diff --cached --quiet; then
            echo 'Repository consistency is already clean.'
            exit 0
          fi
          git commit -m 'Run repository consistency repair'
          git push origin HEAD:main
