name: Automation V2 Stale Bundle Lock Recovery

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: automation-v2-state-store
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Reconcile stale bundle reservations only when Actions is idle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTOMATION_V2_STATE_BRANCH: automation-v2-state
        run: python scripts/reconcile_automation_v2_stale_bundle_lock.py
