name: Export Playlists for Local Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-playlists-for-local-reconciliation.yml'

permissions:
  contents: read
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Package current production playlists
        run: |
          test -s IPTV-Playlist.m3u
          test -f International-Playlist.m3u
          mkdir -p /tmp/playlist-export
          cp IPTV-Playlist.m3u International-Playlist.m3u /tmp/playlist-export/
          sha256sum /tmp/playlist-export/*.m3u > /tmp/playlist-export/SHA256SUMS.txt
      - name: Upload source playlists for local reconciliation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: production-playlists-for-local-reconciliation
          path: /tmp/playlist-export/
          retention-days: 3
