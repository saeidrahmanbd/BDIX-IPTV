name: Export Playlists for Local Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-playlists-for-local-reconciliation.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Package playlists, organizer scripts, and referenced local logos
        run: |
          set -euo pipefail
          test -s IPTV-Playlist.m3u
          test -f International-Playlist.m3u
          mkdir -p /tmp/playlist-export/scripts /tmp/playlist-export/logos
          cp IPTV-Playlist.m3u International-Playlist.m3u /tmp/playlist-export/
          cp scripts/*.py /tmp/playlist-export/scripts/
          python - <<'PY'
          import re, shutil
          from pathlib import Path
          root=Path.cwd()
          out=Path('/tmp/playlist-export/logos')
          names=set()
          for playlist in (root/'IPTV-Playlist.m3u',root/'International-Playlist.m3u'):
              for line in playlist.read_text(encoding='utf-8-sig').splitlines():
                  m=re.search(r'tvg-logo="([^"]*)"',line)
                  if m:
                      value=m.group(1).split('?',1)[0].split('#',1)[0]
                      if value and not value.startswith(('http://','https://','data:')):
                          names.add(Path(value).name)
                      elif '/logos/' in value:
                          names.add(Path(value).name)
          copied=0
          for name in names:
              src=root/'logos'/name
              if src.is_file():
                  shutil.copy2(src,out/name); copied+=1
          print(f'Collected {copied} referenced local logo assets from {len(names)} logo references.')
          PY
          sha256sum /tmp/playlist-export/*.m3u > /tmp/playlist-export/SHA256SUMS.txt
      - name: Upload files for local reconciliation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: production-playlists-and-organizer
          path: /tmp/playlist-export/
          retention-days: 3
