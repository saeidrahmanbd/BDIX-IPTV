name: Repair three approved channel logos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-approved-channel-logos.yml"

permissions:
  contents: write

jobs:
  repair-approved-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image processors
        run: python -m pip install --disable-pip-version-check Pillow CairoSVG

      - name: Download and normalize the three sourced logos
        run: python scripts/repair_approved_logos_20261107.py

      - name: Commit repaired local assets and provenance record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logos/animal-planet.png logos/b4u-music.png logos/sangeet-bangla.png reports/logo-repair-2026-11-07.md
          if git diff --cached --quiet; then
            echo "No logo changes to commit."
          else
            git commit -m "Fix Animal Planet, B4U Music and Sangeet Bangla logos"
            git push origin HEAD:main
          fi
