name: Binary Logo Audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/logo_binary_audit.py"
      - ".github/workflows/logo-binary-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binary-logo-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit both playlists and every logo asset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Run read-only binary audit
        run: python scripts/logo_binary_audit.py
      - name: Upload audit reports
        uses: actions/upload-artifact@v7
        with:
          name: binary-logo-audit
          path: |
            reports/logo-binary-audit.json
            reports/logo-binary-audit.md
          if-no-files-found: error
          retention-days: 30
