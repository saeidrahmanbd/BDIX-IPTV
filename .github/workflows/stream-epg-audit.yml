name: Stream + EPG Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        run: python3 scripts/stream_epg_audit.py
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: stream-epg-audit
          path: audit/
