name: Probe EPG sources for Bangladesh

# Read-only diagnostic. It never touches epg/epg.xml, playlists or mappings.
# Runs on demand, or when the dedicated probe branch is pushed, and commits its
# report to that same branch (never to main).
on:
  workflow_dispatch:
  push:
    branches: [epg-source-probe, epg/bangladesh-official-schedule-probe-20261109]
    paths:
      - 'scripts/probe_bangladesh_official_schedule_pages.py'
      - '.github/workflows/epg-bangladesh-source-probe.yml'

permissions:
  contents: write

concurrency:
  group: epg-bangladesh-official-pages-probe
  cancel-in-progress: true

jobs:
  probe:
    if: ${{ github.ref_name != 'main' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Probe official Bangladesh schedule pages
        run: python scripts/probe_bangladesh_official_schedule_pages.py reports/bangladesh-official-schedule-source-probe.md
      - name: Upload Bangladesh source reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: epg-bangladesh-source-probes
          path: |
            reports/bangladesh-official-schedule-source-probe.md
      - name: Commit report to the probe branch
        if: ${{ github.ref_name != 'main' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/bangladesh-official-schedule-source-probe.md
          git diff --cached --quiet || git commit -m 'Add Bangladesh EPG source probe report'
          git push origin HEAD:${{ github.ref_name }}
