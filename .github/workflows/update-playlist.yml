name: Playlist Update

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Dhaka'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/update_playlist.py'
      - 'scripts/strict_update.py'
      - 'scripts/migrate_external_logos_fixed.py'
      - 'scripts/generate_detailed_report_fixed.py'
      - 'scripts/generate_detailed_report.py'
      - 'scripts/audit_playlist.py'
      - '.github/workflows/update-playlist.yml'
      - 'IPTV-Playlist.m3u'

permissions:
  contents: write

concurrency:
  group: iptv-repository-writes
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install logo conversion dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg

      - name: Snapshot locked categories before automatic update
        env:
          LOCKED_CATEGORIES: 'Bangladesh|Indian Bangla|Indian Movies|Indian Music|Indian Entertainment|International|Documentary & Wildlife|Kids|Religious|Sports|Backup|Not Playing'
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          lines = Path("IPTV-Playlist.m3u").read_text(encoding="utf-8-sig").replace("\r","").splitlines()
          locked = set(os.environ["LOCKED_CATEGORIES"].split("|"))
          attr_re = re.compile(r'([\\w-]+)="([^"]*)"')
          rows = []
          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF"):
                  continue
              a = dict(attr_re.findall(line))
              if a.get("group-title","").strip() in locked:
                  url = next((x.strip() for x in lines[i+1:] if x.strip().startswith(("http://","https://"))), "")
                  rows.append((a.get("group-title","").strip(), a.get("tvg-id",""), a.get("channel-id",""), a.get("tvg-name",""), url))
          Path("/tmp/locked-categories-before.json").write_text(json.dumps(sorted(rows), ensure_ascii=False), encoding="utf-8")
          print("Locked-category entries snapshotted:", len(rows))
          PY

      - name: Update playlist — backup and new channels
        env:
          IPTV_UPDATE_MODE: backup_only
          LOCKED_CATEGORIES: 'Bangladesh|Indian Bangla|Indian Movies|Indian Entertainment|Indian Movies|Indian Music|International|Documentary & Wildlife|Kids|Religious|Sports|Backup|Not Playing'
        run: python scripts/update_playlist.py

      - name: Verify locked categories and New Channels placement
        env:
          LOCKED_CATEGORIES: 'Bangladesh|Indian Bangla|Indian Movies|Indian Music|Indian Entertainment|International|Documentary & Wildlife|Kids|Religious|Sports|Backup|Not Playing'
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          lines = Path("IPTV-Playlist.m3u").read_text(encoding="utf-8-sig").replace("\r","").splitlines()
          locked = set(os.environ["LOCKED_CATEGORIES"].split("|"))
          attr_re = re.compile(r'([\\w-]+)="([^"]*)"')
          rows = []
          groups = []
          for i, line in enumerate(lines):
              if not line.startswith("#EXTINF"):
                  continue
              a = dict(attr_re.findall(line))
              group = a.get("group-title","").strip()
              groups.append(group)
              if group in locked:
                  url = next((x.strip() for x in lines[i+1:] if x.strip().startswith(("http://","https://"))), "")
                  rows.append((group, a.get("tvg-id",""), a.get("channel-id",""), a.get("tvg-name",""), url))
          before = json.loads(Path("/tmp/locked-categories-before.json").read_text(encoding="utf-8"))
          if sorted(rows) != sorted(before):
              raise SystemExit("LOCKED CATEGORY VIOLATION: automatic update changed a locked category.")
          new_positions = [i for i,g in enumerate(groups) if g == "New Channels"]
          if new_positions and new_positions != list(range(new_positions[0], len(groups))):
              raise SystemExit("NEW CHANNELS PLACEMENT VIOLATION: New Channels must be the final category.")
          print("Locked categories unchanged:", len(rows))
          print("New Channels is final:", bool(new_positions))
          PY

      # Enforce category-level Backup exclusions after every source update.
      - name: Clean unnecessary and cross-country Backup entries
        env:
          LOCKED_BACKUP_CATEGORIES: "International|Documentary & Wildlife|Kids|Sports|Religious"
        run: |
          python - <<'PY'
          import os, re
          from collections import defaultdict
          from pathlib import Path

          playlist = Path("IPTV-Playlist.m3u")
          lines = playlist.read_text(encoding="utf-8-sig").replace("\r", "").splitlines()
          locked = set(os.environ["LOCKED_BACKUP_CATEGORIES"].split("|"))
          ATTR_RE = re.compile(r'([\w-]+)="([^"]*)"')

          def attrs(info):
              return dict(ATTR_RE.findall(info))

          def identity(info):
              a = attrs(info)
              return (a.get("tvg-id") or a.get("channel-id") or "").strip().lower()

          def base_id(cid):
              return cid.split("@", 1)[0]

          def identity_root(cid):
              return re.sub(r"\.[a-z]{2}$", "", base_id(cid))

          def country_code(cid):
              m = re.search(r"\.([a-z]{2})$", base_id(cid))
              return m.group(1).lower() if m else ""

          def display_name(info):
              a = attrs(info)
              return a.get("tvg-name") or (info.split(",", 1)[1].strip() if "," in info else "")

          blocks = []
          header = []
          i = 0
          while i < len(lines) and not lines[i].startswith("#EXTINF"):
              header.append(lines[i])
              i += 1

          while i < len(lines):
              if not lines[i].startswith("#EXTINF"):
                  header.append(lines[i])
                  i += 1
                  continue
              block = [lines[i]]
              i += 1
              while i < len(lines) and not lines[i].startswith("#EXTINF"):
                  block.append(lines[i])
                  if lines[i].strip().startswith(("http://", "https://")):
                      i += 1
                      break
                  i += 1
              blocks.append(block)

          locked_ids = set()
          primary_countries = defaultdict(set)
          primary_names = defaultdict(set)

          def base_name(name):
              name = re.sub(r"\s*\[[^]]+\]\s*$", "", name).strip()
              return name.lower()

          for block in blocks:
              info = block[0]
              a = attrs(info)
              cid = identity(info)
              group = a.get("group-title", "").strip()
              if group in locked and cid:
                  locked_ids.add(cid)
              if group != "Backup" and cid:
                  country = country_code(cid)
                  if country:
                      primary_countries[identity_root(cid)].add(country)
                  name = a.get("tvg-name", "") or (info.split(",", 1)[1].strip() if "," in info else "")
                  if name:
                      primary_names[base_name(name)].add(country)

          kept = []
          locked_removed = []
          cross_country_removed = []

          for block in blocks:
              info = block[0]
              a = attrs(info)
              cid = identity(info)
              group = a.get("group-title", "").strip()
              if group != "Backup":
                  kept.append(block)
                  continue

              name = display_name(info)
              if cid in locked_ids:
                  locked_removed.append(name)
                  continue

              backup_country = country_code(cid)
              if backup_country:
                  countries = primary_countries.get(identity_root(cid), set())
                  name_countries = primary_names.get(base_name(name), set())
                  if countries and backup_country not in countries:
                      cross_country_removed.append(f"{name} [{cid}]")
                      continue
                  if not countries and name_countries and backup_country not in name_countries:
                      cross_country_removed.append(f"{name} [{cid}]")
                      continue

              kept.append(block)

          out = header[:]
          for block in kept:
              out.extend(block)
          playlist.write_text("\n".join(out).rstrip() + "\n", encoding="utf-8", newline="\n")

          print(f"Removed {len(locked_removed)} locked-category Backup entries.")
          for name in locked_removed:
              print(f"  - {name}")
          print(f"Removed {len(cross_country_removed)} cross-country Backup collisions.")
          for item in cross_country_removed:
              print(f"  - {item}")
          PY

      # Backup streams must never carry primary channel numbers.
      # Keep this normalization inside the update workflow so the audit
      # cannot fail merely because a newly imported backup inherited tvg-chno.
      - name: Remove channel numbers from Backup entries
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          playlist = Path("IPTV-Playlist.m3u")
          lines = playlist.read_text(encoding="utf-8-sig").replace("\r", "").splitlines()
          attr_re = re.compile(r'\s+tvg-chno="[^"]*"')
          changed = 0

          for i, line in enumerate(lines):
              if line.startswith("#EXTINF") and 'group-title="Backup"' in line:
                  new_line = attr_re.sub("", line, count=1)
                  if new_line != line:
                      lines[i] = new_line
                      changed += 1

          playlist.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8", newline="\n")
          print(f"Removed tvg-chno from {changed} Backup entries.")
          PY

      - name: Snapshot protected primary entries
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          playlist = Path("IPTV-Playlist.m3u")
          attr_re = re.compile(r'([\w-]+)="([^"]*)"')
          excluded = {"Backup", "Not Playing"}

          def attrs(line):
              return dict(attr_re.findall(line))

          def parse(text):
              lines = text.replace("\r", "").splitlines()
              out = []
              for i, line in enumerate(lines):
                  if not line.startswith("#EXTINF"):
                      continue
                  a = attrs(line)
                  group = a.get("group-title", "").strip()
                  if group in excluded:
                      continue
                  url = ""
                  for candidate in lines[i + 1:]:
                      if not candidate.strip():
                          continue
                      if candidate.startswith(("http://", "https://")):
                          url = candidate.strip()
                          break
                      if candidate.startswith("#EXTINF"):
                          break
                  if url:
                      out.append((
                          (a.get("tvg-id") or a.get("channel-id") or "").strip().lower(),
                          group,
                          (a.get("tvg-name") or line.rsplit(",", 1)[-1]).strip(),
                          url,
                      ))
              return sorted(out)

          Path("/tmp/primary-before.json").write_text(json.dumps(parse(playlist.read_text(encoding="utf-8-sig")), ensure_ascii=False), encoding="utf-8")
          print("Protected primary entries:", len(json.loads(Path("/tmp/primary-before.json").read_text(encoding="utf-8"))))
          PY

      - name: Resolve missing logos and convert to local PNG
        run: python scripts/migrate_external_logos_fixed.py

      # Keep one canonical logo per channel ID; Backup/Not Playing entries inherit it.
      - name: Normalize channel logos
        run: |
          python - <<'PY'
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          playlist = Path("IPTV-Playlist.m3u")
          lines = playlist.read_text(encoding="utf-8-sig").replace("\r", "").splitlines()
          ATTR_RE = re.compile(r'([\w-]+)="([^"]*)"')

          def attrs(info):
              return dict(ATTR_RE.findall(info))

          def set_attr(info, key, value):
              return re.sub(rf'({re.escape(key)}=")[^"]*(")', lambda m: m.group(1) + value + m.group(2), info, count=1)

          blocks = []
          i = 0
          while i < len(lines):
              if not lines[i].startswith("#EXTINF"):
                  i += 1
                  continue
              info_index = i
              i += 1
              while i < len(lines) and not lines[i].startswith("#EXTINF"):
                  i += 1
              blocks.append(info_index)

          by_id = defaultdict(list)
          for idx in blocks:
              a = attrs(lines[idx])
              cid = (a.get("tvg-id") or a.get("channel-id") or "").strip()
              if cid:
                  by_id[cid].append(idx)

          changed = 0
          changed_ids = set()
          for cid, indexes in by_id.items():
              canonical = ""
              # Prefer the first logo on a primary entry.
              for idx in indexes:
                  a = attrs(lines[idx])
                  group = a.get("group-title", "").strip()
                  logo = a.get("tvg-logo", "").strip()
                  if group not in {"Backup", "Not Playing"} and logo:
                      canonical = logo
                      break

              # If no primary logo exists, use the most frequent existing logo.
              if not canonical:
                  counts = Counter()
                  first_seen = {}
                  for idx in indexes:
                      logo = attrs(lines[idx]).get("tvg-logo", "").strip()
                      if logo:
                          counts[logo] += 1
                          first_seen.setdefault(logo, idx)
                  if counts:
                      canonical = max(counts, key=lambda logo: (counts[logo], -first_seen[logo]))

              if not canonical:
                  continue

              for idx in indexes:
                  a = attrs(lines[idx])
                  if a.get("tvg-logo", "").strip() != canonical:
                      lines[idx] = set_attr(lines[idx], "tvg-logo", canonical)
                      changed += 1
                      changed_ids.add(cid)

          playlist.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8", newline="\n")
          print(f"Normalized {changed} logo references across {len(changed_ids)} channel IDs.")
          if not any(line.startswith("#EXTINF") for line in lines):
              raise SystemExit("Playlist normalization produced no #EXTINF entries; aborting.")
          PY

      - name: Validate maintenance scripts
        run: |
          python -m py_compile scripts/update_playlist.py scripts/strict_update.py scripts/migrate_external_logos_fixed.py scripts/generate_detailed_report_fixed.py scripts/audit_playlist.py

      - name: Generate detailed update and logo report
        run: python scripts/generate_detailed_report_fixed.py

      - name: Verify protected primary entries before audit
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          playlist = Path("IPTV-Playlist.m3u")
          attr_re = re.compile(r'([\w-]+)="([^"]*)"')
          excluded = {"Backup", "Not Playing"}

          def attrs(line):
              return dict(attr_re.findall(line))

          def parse(text):
              lines = text.replace("\r", "").splitlines()
              out = []
              for i, line in enumerate(lines):
                  if not line.startswith("#EXTINF"):
                      continue
                  a = attrs(line)
                  if a.get("group-title", "").strip() in excluded:
                      continue
                  url = ""
                  for candidate in lines[i + 1:]:
                      if not candidate.strip():
                          continue
                      if candidate.startswith(("http://", "https://")):
                          url = candidate.strip()
                          break
                      if candidate.startswith("#EXTINF"):
                          break
                  if url:
                      out.append(((a.get("tvg-id") or a.get("channel-id") or "").strip().lower(), a.get("group-title", "").strip(), (a.get("tvg-name") or line.rsplit(",", 1)[-1]).strip(), url))
              return sorted(out)

          before = json.loads(Path("/tmp/primary-before.json").read_text(encoding="utf-8"))
          after = parse(playlist.read_text(encoding="utf-8-sig"))
          before_set = set(map(tuple, before))
          after_set = set(after)
          missing = sorted(before_set - after_set)
          added = sorted(after_set - before_set)

          if missing or added:
              print(f"Protected primary entries changed: before={len(before_set)} after={len(after_set)} missing={len(missing)} added={len(added)}")
              for item in missing[:20]: print("  MISSING:", item[0], item[2], item[3])
              for item in added[:20]: print("  ADDED/CHANGED:", item[0], item[2], item[3])
              raise SystemExit(1)

          print(f"Protected primary entries unchanged: {len(after_set)} (order changes ignored)")
          PY

      - name: Audit playlist integrity and protected entries
        run: python scripts/audit_playlist.py

      - name: Commit playlist, local logos, and reports
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "IPTV-Playlist.m3u"
            "reports/auto-update.md"
            "reports/playlist-audit.md"
            "logos/"
          )

          if git diff --quiet -- "${files[@]}"; then
            echo "No playlist, logo, or report changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Update backup streams and local logos"

          for attempt in 1 2 3; do
            git fetch origin main

            # Another scheduled/push run may have updated main while this run
            # was generating the playlist. Rebase onto the latest main and
            # resolve report-only conflicts automatically. Playlist/logo
            # conflicts are never auto-resolved.
            if ! git rebase origin/main; then
              conflicted=$(git diff --name-only --diff-filter=U)
              allowed_conflicts=$(printf '%s\\n' \
                "reports/auto-update.md" \
                "reports/playlist-audit.md")

              unexpected_conflicts=$(printf '%s\\n' "$conflicted" | \
                grep -Fxv -f <(printf '%s\\n' "$allowed_conflicts") || true)

              if [ -n "$conflicted" ] && [ -z "$unexpected_conflicts" ]; then
                echo "Report-only rebase conflict detected; resolving reports and continuing."
                git checkout --theirs -- reports/auto-update.md reports/playlist-audit.md
                git add reports/auto-update.md reports/playlist-audit.md
                GIT_EDITOR=true git rebase --continue
              else
                echo "Rebase conflict involves playlist/logo or another unexpected file:"
                printf '%s\\n' "$conflicted"
                git rebase --abort
                exit 1
              fi
            fi

            # Rebuild reports after rebasing so they describe the final
            # playlist state that will actually be pushed.
            python scripts/generate_detailed_report_fixed.py
            python scripts/audit_playlist.py
            git add reports/auto-update.md reports/playlist-audit.md
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi

            if git push origin HEAD:main; then
              echo "Backup-only playlist and logo changes pushed successfully on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep 3
          done

          echo "Unable to push after 3 attempts."
          exit 1
