name: Playlist Update

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Dhaka'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/update_playlist.py'
      - 'scripts/strict_update.py'
      - 'scripts/migrate_external_logos_fixed.py'
      - 'scripts/generate_detailed_report_fixed.py'
      - '.github/workflows/update-playlist.yml'

permissions:
  contents: write

concurrency:
  group: iptv-repository-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install logo conversion dependencies
        run: python -m pip install --disable-pip-version-check pillow cairosvg

      - name: Update playlist — backup only
        env:
          IPTV_UPDATE_MODE: backup_only
        run: python scripts/update_playlist.py

      # Enforce category-level Backup exclusions after every source update.
      - name: Remove backups for locked categories
        env:
          LOCKED_BACKUP_CATEGORIES: "International|Documentary & Wildlife|Kids|Sports|Religious"
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          playlist = Path("IPTV Playlist.m3u")
          lines = playlist.read_text(encoding="utf-8-sig").replace("\r", "").splitlines()
          locked = set(os.environ["LOCKED_BACKUP_CATEGORIES"].split("|"))

          def attrs(info):
              return dict(re.findall(r'([\w-]+)="([^"]*)"', info))

          def base_name(name):
              name = re.sub(r"\s*\[[^]]+\]\s*$", "", name).strip()
              return name.lower()

          locked_ids = set()
          locked_names = set()
          for line in lines:
              if not line.startswith("#EXTINF"):
                  continue
              a = attrs(line)
              if a.get("group-title", "").strip() in locked:
                  if a.get("tvg-id"):
                      locked_ids.add(a["tvg-id"].strip().lower())
                  if a.get("channel-id"):
                      locked_ids.add(a["channel-id"].strip().lower())
                  name = line.split(",", 1)[1].strip() if "," in line else ""
                  if name:
                      locked_names.add(base_name(name))

          out = []
          removed = []
          i = 0
          while i < len(lines):
              if not lines[i].startswith("#EXTINF"):
                  out.append(lines[i])
                  i += 1
                  continue
              info = lines[i]
              url = lines[i + 1] if i + 1 < len(lines) else ""
              a = attrs(info)
              name = info.split(",", 1)[1].strip() if "," in info else ""
              cid = a.get("tvg-id", "").strip().lower()
              channel_id = a.get("channel-id", "").strip().lower()
              is_backup = a.get("group-title", "").strip() == "Backup"
              is_locked_match = (
                  cid in locked_ids or channel_id in locked_ids or base_name(name) in locked_names
              )
              if is_backup and is_locked_match:
                  removed.append(name)
              else:
                  out.extend([info, url])
              i += 2

          playlist.write_text("\n".join(out).rstrip() + "\n", encoding="utf-8", newline="\n")
          print(f"Removed {len(removed)} locked-category backup entries.")
          for name in removed:
              print(f"  - {name}")
          PY

      - name: Remove cross-country backup collisions
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          playlist = Path("IPTV Playlist.m3u")
          lines = playlist.read_text(encoding="utf-8-sig").replace("\r", "").splitlines()

          def attrs(info):
              return dict(re.findall(r'([\\w-]+)="([^"]*)"', info))

          def split_id(value):
              base = (value or "").split("@", 1)[0]
              match = re.match(r"^(.*)\\.([a-z]{2})$", base, re.I)
              return (match.group(1).lower(), match.group(2).lower()) if match else (base.lower(), "")

          primary_countries = {}
          for line in lines:
              if not line.startswith("#EXTINF"):
                  continue
              a = attrs(line)
              if a.get("group-title", "").strip() in {"Backup", "Not Playing"}:
                  continue
              base, country = split_id(a.get("tvg-id") or a.get("channel-id"))
              if country:
                  primary_countries.setdefault(base, set()).add(country)

          out, removed = [], []
          i = 0
          while i < len(lines):
              if not lines[i].startswith("#EXTINF"):
                  out.append(lines[i])
                  i += 1
                  continue
              info = lines[i]
              url = lines[i + 1] if i + 1 < len(lines) else ""
              a = attrs(info)
              base, country = split_id(a.get("tvg-id") or a.get("channel-id"))
              collision = (
                  a.get("group-title", "").strip() == "Backup"
                  and country
                  and base in primary_countries
                  and country not in primary_countries[base]
              )
              if collision:
                  removed.append(info.split(",", 1)[-1].strip())
              else:
                  out.extend([info, url])
              i += 2

          playlist.write_text("\n".join(out).rstrip() + "\n", encoding="utf-8", newline="\n")
          print(f"Removed {len(removed)} cross-country backup collisions.")
          for name in removed:
              print(f"  - {name}")
          PY

      - name: Resolve missing logos and convert to local PNG
        run: python scripts/migrate_external_logos_fixed.py

      - name: Generate detailed update and logo report
        run: python scripts/generate_detailed_report_fixed.py

      - name: Commit playlist, local logos, and report
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "IPTV Playlist.m3u"
            "reports/auto-update.md"
            "logos/"
          )

          if git diff --quiet -- "${files[@]}"; then
            echo "No playlist, logo, or report changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Update backup streams and local logos"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Backup-only playlist and logo changes pushed successfully on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep 3
          done

          echo "Unable to push after 3 attempts."
          exit 1
