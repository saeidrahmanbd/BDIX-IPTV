<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="330" viewBox="0 0 1500 330" role="img" aria-labelledby="t"><title id="t">Use BDIX-IPTV in three simple steps</title><rect width="1500" height="330" rx="28" fill="#f5f9ff"/><text x="55" y="62" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#102b50">Start watching in three simple steps</text><g font-family="Arial,sans-serif"><g transform="translate(45 105)"><rect width="430" height="180" rx="22" fill="#fff" stroke="#c9dcf7" stroke-width="2"/><circle cx="55" cy="55" r="30" fill="#1769d2"/><text x="55" y="65" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">1</text><path d="M105 91l29-29a18 18 0 0 1 26 26l-13 13M146 81l-29 29a18 18 0 0 1-26-26l13-13" fill="none" stroke="#1769d2" stroke-width="7" stroke-linecap="round"/><text x="190" y="61" font-size="25" font-weight="700" fill="#102b50">Copy a playlist URL</text><text x="190" y="99" font-size="19" fill="#526780">Choose the Main or International</text><text x="190" y="126" font-size="19" fill="#526780">playlist from the links below.</text></g><path d="M490 195h45m-13-13l13 13-13 13" fill="none" stroke="#7892b3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(555 105)"><rect width="430" height="180" rx="22" fill="#fff" stroke="#c9dcf7" stroke-width="2"/><circle cx="55" cy="55" r="30" fill="#7044cf"/><text x="55" y="65" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">2</text><rect x="99" y="64" width="67" height="51" rx="8" fill="none" stroke="#7044cf" stroke-width="5"/><path d="M89 125h87M132 115v10M123 77l22 13-22 13z" fill="none" stroke="#7044cf" stroke-width="4" stroke-linejoin="round"/><text x="190" y="61" font-size="25" font-weight="700" fill="#102b50">Add it to your player</text><text x="190" y="99" font-size="19" fill="#526780">Open a compatible IPTV app</text><text x="190" y="126" font-size="19" fill="#526780">and add the playlist by URL.</text></g><path d="M1000 195h45m-13-13l13 13-13 13" fill="none" stroke="#7892b3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(1065 105)"><rect width="390" height="180" rx="22" fill="#fff" stroke="#c9dcf7" stroke-width="2"/><circle cx="55" cy="55" r="30" fill="#168b69"/><text x="55" y="65" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">3</text><rect x="99" y="61" width="68" height="58" rx="8" fill="none" stroke="#168b69" stroke-width="5"/><path d="M99 78h68M115 51v20M151 51v20M116 94h12m9 0h12" stroke="#168b69" stroke-width="4" stroke-linecap="round"/><text x="190" y="61" font-size="25" font-weight="700" fill="#102b50">Load the TV guide</text><text x="190" y="99" font-size="19" fill="#526780">Add the shared XMLTV EPG,</text><text x="190" y="126" font-size="19" fill="#526780">save and refresh your guide.</text></g></g></svg>