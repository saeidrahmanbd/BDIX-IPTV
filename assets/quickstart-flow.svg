<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="330" viewBox="0 0 1500 330" role="img" aria-labelledby="t d"><title id="t">Use BDIX-IPTV in three simple steps</title><desc id="d">Three roomy cards explain how to choose a playlist, add it to an IPTV player and configure the XMLTV TV guide.</desc><rect width="1500" height="330" rx="28" fill="#f5f9ff"/><text x="55" y="62" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#102b50">Start watching in three simple steps</text><g font-family="Arial,sans-serif"><g transform="translate(45 105)"><rect width="430" height="190" rx="22" fill="#fff" stroke="#c9dcf7" stroke-width="2"/><circle cx="48" cy="48" r="27" fill="#1769d2"/><text x="48" y="58" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">1</text><path d="M95 57l24-24a16 16 0 0 1 23 23l-10 10M132 49l-24 24a16 16 0 0 1-23-23l10-10" fill="none" stroke="#1769d2" stroke-width="6" stroke-linecap="round"/><text x="165" y="57" font-size="23" font-weight="700" fill="#102b50">Choose a playlist</text><text x="35" y="119" font-size="18" fill="#526780">Select the Main or International playlist</text><text x="35" y="148" font-size="18" fill="#526780">from the available playlist links below.</text></g><path d="M490 200h45m-13-13l13 13-13 13" fill="none" stroke="#7892b3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(555 105)"><rect width="430" height="190" rx="22" fill="#fff" stroke="#c9dcf7" stroke-width="2"/><circle cx="48" cy="48" r="27" fill="#7044cf"/><text x="48" y="58" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">2</text><rect x="88" y="28" width="54" height="43" rx="7" fill="none" stroke="#7044cf" stroke-width="4"/><path d="M80 80h70M115 71v9M106 39l18 11-18 11z" fill="none" stroke="#7044cf" stroke-width="3.5" stroke-linejoin="round"/><text x="165" y="57" font-size="23" font-weight="700" fill="#102b50">Add it to your player</text><text x="35" y="119" font-size="18" fill="#526780">Open a compatible IPTV application</text><text x="35" y="148" font-size="18" fill="#526780">and add the playlist using its URL.</text></g><path d="M1000 200h45m-13-13l13 13-13 13" fill="none" stroke="#7892b3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(1065 105)"><rect width="390" height="190" rx="22" fill="#fff" stroke="#c9dcf7" stroke-width="2"/><circle cx="48" cy="48" r="27" fill="#168b69"/><text x="48" y="58" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">3</text><rect x="88" y="28" width="54" height="45" rx="7" fill="none" stroke="#168b69" stroke-width="4"/><path d="M88 43h54M101 20v16M129 20v16M101 58h10m8 0h10" stroke="#168b69" stroke-width="3.5" stroke-linecap="round"/><text x="165" y="57" font-size="22" font-weight="700" fill="#102b50">Load the TV guide</text><text x="30" y="119" font-size="18" fill="#526780">Add the shared XMLTV EPG URL</text><text x="30" y="148" font-size="18" fill="#526780">in your player's guide settings.</text></g></g></svg>