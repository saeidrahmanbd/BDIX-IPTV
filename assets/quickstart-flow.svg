<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="245" viewBox="0 0 1200 245" role="img" aria-labelledby="t"><title id="t">Quick start in three steps</title><rect width="1200" height="245" rx="24" fill="#f5f9ff"/><text x="38" y="48" font-family="Arial" font-size="29" font-weight="700" fill="#102b50">Start watching in three simple steps</text><g font-family="Arial"><g transform="translate(35 78)"><rect width="340" height="132" rx="18" fill="#fff" stroke="#c9dcf7" stroke-width="2"/><circle cx="43" cy="43" r="25" fill="#1769d2"/><text x="43" y="51" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">1</text><path d="M86 62l20-20a14 14 0 0 1 20 20l-9 9M118 56L98 76a14 14 0 0 1-20-20l9-9" fill="none" stroke="#1769d2" stroke-width="5" stroke-linecap="round"/><text x="151" y="45" font-size="22" font-weight="700" fill="#122b4a">Copy a playlist URL</text><text x="151" y="74" font-size="16" fill="#526780">Choose Main or International</text><text x="151" y="97" font-size="16" fill="#526780">from the playlist section below.</text></g><path d="M389 144h34m-10-10l10 10-10 10" fill="none" stroke="#7a91b0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(430 78)"><rect width="340" height="132" rx="18" fill="#fff" stroke="#c9dcf7" stroke-width="2"/><circle cx="43" cy="43" r="25" fill="#7044cf"/><text x="43" y="51" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">2</text><rect x="79" y="37" width="57" height="43" rx="7" fill="none" stroke="#7044cf" stroke-width="4"/><path d="M72 88h72M107 80v8" stroke="#7044cf" stroke-width="4" stroke-linecap="round"/><path d="M101 48l15 10-15 10z" fill="#7044cf"/><text x="158" y="45" font-size="22" font-weight="700" fill="#122b4a">Add it to your player</text><text x="158" y="74" font-size="16" fill="#526780">Open your IPTV app and add</text><text x="158" y="97" font-size="16" fill="#526780">the playlist using its URL option.</text></g><path d="M784 144h34m-10-10l10 10-10 10" fill="none" stroke="#7a91b0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(825 78)"><rect width="340" height="132" rx="18" fill="#fff" stroke="#c9dcf7" stroke-width="2"/><circle cx="43" cy="43" r="25" fill="#168b69"/><text x="43" y="51" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">3</text><rect x="79" y="39" width="55" height="48" rx="7" fill="none" stroke="#168b69" stroke-width="4"/><path d="M79 52h55M91 32v14M122 32v14M92 65h9m8 0h9m-26 12h9m8 0h9" stroke="#168b69" stroke-width="3" stroke-linecap="round"/><text x="155" y="45" font-size="22" font-weight="700" fill="#122b4a">Load the TV guide</text><text x="155" y="74" font-size="16" fill="#526780">Add the XMLTV EPG URL,</text><text x="155" y="97" font-size="16" fill="#526780">save and refresh the guide.</text></g></g></svg>