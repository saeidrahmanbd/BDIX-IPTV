<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" role="img" aria-label="Quick start in three steps: copy a playlist URL, add it to your player, then add the XMLTV guide">
  <defs>
    <linearGradient id="qs1" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#8957e5"/></linearGradient>
    <linearGradient id="qs2" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#8957e5"/><stop offset="1" stop-color="#2ea44f"/></linearGradient>
    <linearGradient id="qs3" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ea44f"/><stop offset="1" stop-color="#0969da"/></linearGradient>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="20" y="20" width="280" height="160" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>
    <rect x="20" y="20" width="280" height="10" rx="5" fill="url(#qs1)"/>
    <circle cx="70" cy="95" r="28" fill="url(#qs1)"/>
    <text x="70" y="104" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">1</text>
    <text x="115" y="88" font-size="20" font-weight="700" fill="#1f2328">Copy a playlist URL</text>
    <text x="115" y="115" font-size="15" fill="#57606a">From the Choose a Playlist</text>
    <text x="115" y="135" font-size="15" fill="#57606a">section below</text>

    <rect x="360" y="20" width="280" height="160" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>
    <rect x="360" y="20" width="280" height="10" rx="5" fill="url(#qs2)"/>
    <circle cx="410" cy="95" r="28" fill="url(#qs2)"/>
    <text x="410" y="104" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">2</text>
    <text x="455" y="88" font-size="20" font-weight="700" fill="#1f2328">Add it to your player</text>
    <text x="455" y="115" font-size="15" fill="#57606a">Choose Add Playlist by URL</text>
    <text x="455" y="135" font-size="15" fill="#57606a">and paste the link</text>

    <rect x="700" y="20" width="280" height="160" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>
    <rect x="700" y="20" width="280" height="10" rx="5" fill="url(#qs3)"/>
    <circle cx="750" cy="95" r="28" fill="url(#qs3)"/>
    <text x="750" y="104" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">3</text>
    <text x="795" y="88" font-size="20" font-weight="700" fill="#1f2328">Load the TV guide</text>
    <text x="795" y="115" font-size="15" fill="#57606a">Paste the XMLTV EPG URL</text>
    <text x="795" y="135" font-size="15" fill="#57606a">then refresh</text>

    <path d="M305 100 L345 100" stroke="#8c959f" stroke-width="4" stroke-linecap="round"/>
    <polygon points="345,90 360,100 345,110" fill="#8c959f"/>
    <path d="M645 100 L685 100" stroke="#8c959f" stroke-width="4" stroke-linecap="round"/>
    <polygon points="685,90 700,100 685,110" fill="#8c959f"/>
  </g>
</svg>
