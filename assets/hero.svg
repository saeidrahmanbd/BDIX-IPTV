<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc"><title id="title">BDIX-IPTV — Bangladesh-first IPTV playlist platform</title><desc id="desc">Bangladesh-focused IPTV banner with the correct Bangladesh flag and supporting South Asian and international channel collections.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06182d"/><stop offset=".55" stop-color="#073b4c"/><stop offset="1" stop-color="#101d48"/></linearGradient><linearGradient id="accent"><stop stop-color="#00d6a3"/><stop offset="1" stop-color="#21a6ff"/></linearGradient><linearGradient id="screen"><stop stop-color="#0d3151"/><stop offset="1" stop-color="#102d63"/></linearGradient><filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter></defs><rect width="1600" height="500" rx="30" fill="url(#bg)"/><circle cx="1300" cy="130" r="250" fill="#00a884" opacity=".13" filter="url(#shadow)"/><circle cx="1470" cy="440" r="260" fill="#3478ff" opacity=".15" filter="url(#shadow)"/><path d="M0 430C260 330 430 480 700 400S1120 330 1600 430" fill="none" stroke="url(#accent)" stroke-width="3" opacity=".5"/><g transform="translate(85 58)"><rect x="0" y="0" width="88" height="88" rx="22" fill="#ffffff" opacity=".1" stroke="#7debd2" stroke-width="2"/><path d="M35 23L68 44L35 65Z" fill="#25d9ae"/><text x="0" y="150" fill="#fff" font-family="Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="-2">BDIX-IPTV</text><rect x="0" y="170" width="570" height="6" rx="3" fill="url(#accent)"/><text x="0" y="222" fill="#e7fff8" font-family="Arial,sans-serif" font-size="34" font-weight="700">Bangladesh's IPTV Playlist Platform</text><text x="0" y="268" fill="#c1dce9" font-family="Arial,sans-serif" font-size="25">M3U / M3U8 Playlists · Shared XMLTV EPG</text><g font-family="Arial,sans-serif" font-size="20" fill="#e5f4ff"><circle cx="12" cy="318" r="7" fill="#23d5a4"/><text x="34" y="325">Bangladeshi channels at the heart of the project</text><circle cx="12" cy="360" r="7" fill="#23d5a4"/><text x="34" y="367">Indian · Pakistani · International collections</text><circle cx="12" cy="402" r="7" fill="#23d5a4"/><text x="34" y="409">One shared programme guide for both playlists</text></g></g><g transform="translate(850 45)"><rect x="0" y="0" width="660" height="385" rx="30" fill="#020b18" stroke="#2c7890" stroke-width="5"/><rect x="18" y="18" width="624" height="345" rx="20" fill="url(#screen)"/><text x="48" y="62" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#d9f7ff">BANGLADESH • LIVE CHANNELS</text><g transform="translate(48 91)"><rect width="260" height="158" rx="18" fill="#006a4e"/><circle cx="118" cy="79" r="48" fill="#f42a41"/><rect x="282" width="260" height="158" rx="18" fill="#ffffff"/><rect x="282" y="0" width="260" height="52" rx="16" fill="#ff9933"/><rect x="282" y="106" width="260" height="52" rx="16" fill="#138808"/><circle cx="412" cy="79" r="27" fill="none" stroke="#2456a6" stroke-width="4"/><path d="M412 52v54M385 79h54" stroke="#2456a6" stroke-width="2"/><rect y="178" width="260" height="112" rx="16" fill="#f4f7fa"/><rect x="282" y="178" width="260" height="112" rx="16" fill="#0a477b"/><g font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle"><text x="130" y="221" fill="#006a4e">BANGLADESH</text><text x="130" y="249" fill="#526780" font-size="15">LOCAL CHANNELS</text><text x="412" y="221" fill="#fff">SOUTH ASIA</text><text x="412" y="249" fill="#c7e4ff" font-size="15">REGIONAL PICKS</text></g></g><rect x="250" y="389" width="160" height="16" rx="8" fill="#173b58"/><path d="M330 405v24m-85 0h170" stroke="#173b58" stroke-width="10" stroke-linecap="round"/></g></svg>