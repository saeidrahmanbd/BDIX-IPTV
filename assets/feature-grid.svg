<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t"><title id="t">Why choose BDIX-IPTV</title><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eaf2ff"/></linearGradient></defs><rect width="1200" height="390" rx="24" fill="#f7faff"/><text x="40" y="54" font-family="Arial" font-size="30" font-weight="700" fill="#102b50">Why BDIX-IPTV?</text><text x="40" y="84" font-family="Arial" font-size="17" fill="#526780">A reliable, organized and community-driven IPTV playlist project.</text><g font-family="Arial"><g transform="translate(35 112)"><rect width="355" height="112" rx="18" fill="url(#b)" stroke="#d5e3f5"/><circle cx="57" cy="56" r="31" fill="#087f5b"/><circle cx="57" cy="56" r="13" fill="#f43f5e"/><text x="108" y="48" font-size="21" font-weight="700" fill="#122b4a">Bangladesh-first</text><text x="108" y="76" font-size="15" fill="#526780">Bangladeshi channels at the core,</text><text x="108" y="96" font-size="15" fill="#526780">with Indian and Pakistani options.</text></g><g transform="translate(422 112)"><rect width="355" height="112" rx="18" fill="url(#b)" stroke="#d5e3f5"/><circle cx="57" cy="56" r="31" fill="#1769d2"/><path d="M40 39h34M40 56h34M40 73h34" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="108" y="48" font-size="21" font-weight="700" fill="#122b4a">Organized playlists</text><text x="108" y="76" font-size="15" fill="#526780">Country-based and genre-based</text><text x="108" y="96" font-size="15" fill="#526780">channel groups for easy browsing.</text></g><g transform="translate(809 112)"><rect width="355" height="112" rx="18" fill="url(#b)" stroke="#d5e3f5"/><circle cx="57" cy="56" r="31" fill="#7044cf"/><text x="57" y="63" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">EPG</text><text x="108" y="48" font-size="21" font-weight="700" fill="#122b4a">Shared programme guide</text><text x="108" y="76" font-size="15" fill="#526780">One XMLTV guide for both</text><text x="108" y="96" font-size="15" fill="#526780">playlists, where schedules exist.</text></g><g transform="translate(35 246)"><rect width="355" height="112" rx="18" fill="#fffaf0" stroke="#f4dfb2"/><circle cx="57" cy="56" r="31" fill="#d99a18"/><rect x="39" y="42" width="36" height="28" rx="4" fill="none" stroke="#fff" stroke-width="4"/><circle cx="49" cy="51" r="4" fill="#fff"/><path d="M42 65l10-10 8 7 6-5 8 8" fill="none" stroke="#fff" stroke-width="3"/><text x="108" y="48" font-size="21" font-weight="700" fill="#122b4a">Local channel logos</text><text x="108" y="76" font-size="15" fill="#526780">Repository-hosted logo assets</text><text x="108" y="96" font-size="15" fill="#526780">where available.</text></g><g transform="translate(422 246)"><rect width="355" height="112" rx="18" fill="#fff5f7" stroke="#f2d4df"/><circle cx="57" cy="56" r="31" fill="#c43d70"/><path d="M39 52a19 19 0 0 1 32-12l5 6M76 46l-1-10-10 2M75 60a19 19 0 0 1-32 12l-5-6M38 66l1 10 10-2" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="108" y="48" font-size="21" font-weight="700" fill="#122b4a">Alternate streams</text><text x="108" y="76" font-size="15" fill="#526780">Backup entries maintained</text><text x="108" y="96" font-size="15" fill="#526780">where suitable alternatives exist.</text></g><g transform="translate(809 246)"><rect width="355" height="112" rx="18" fill="#f0fbf8" stroke="#ccebe2"/><circle cx="57" cy="56" r="31" fill="#168b69"/><path d="M39 72V57h9v15M53 72V43h9v29M67 72V32h9v40" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><text x="108" y="48" font-size="21" font-weight="700" fill="#122b4a">Transparent &amp; automated</text><text x="108" y="76" font-size="15" fill="#526780">GitHub Actions, validation</text><text x="108" y="96" font-size="15" fill="#526780">and public diagnostic reports.</text></g></g></svg>