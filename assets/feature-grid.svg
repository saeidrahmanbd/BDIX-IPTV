<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="t d"><title id="t">Why BDIX-IPTV — Bangladesh-first features</title><desc id="d">Six clearly spaced feature cards highlighting Bangladesh focus, multi-country playlists, shared XMLTV guide, local logos, alternate streams and transparent maintenance.</desc><rect width="1500" height="470" rx="28" fill="#f5f9ff"/><text x="55" y="65" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#102b50">Why BDIX-IPTV?</text><text x="55" y="103" font-family="Arial,sans-serif" font-size="21" fill="#526780">A Bangladesh-first IPTV playlist project, with regional collections and a shared programme guide.</text><g font-family="Arial,sans-serif"><g transform="translate(45 140)"><rect width="450" height="132" rx="20" fill="#eaf7f1" stroke="#c6e8d9" stroke-width="2"/><rect width="10" height="132" rx="5" fill="#087f5b"/><circle cx="72" cy="66" r="39" fill="#006a4e"/><circle cx="72" cy="66" r="19" fill="#f42a41"/><text x="135" y="54" font-size="25" font-weight="700" fill="#102b50">Bangladesh-first</text><text x="135" y="84" font-size="18" fill="#526780">Bangladeshi television is the</text><text x="135" y="109" font-size="18" fill="#526780">central focus of the project.</text></g><g transform="translate(525 140)"><rect width="450" height="132" rx="20" fill="#edf4ff" stroke="#cbdcf6" stroke-width="2"/><rect width="10" height="132" rx="5" fill="#1769d2"/><circle cx="72" cy="66" r="39" fill="#1769d2"/><path d="M52 47h40M52 66h40M52 85h40" stroke="#fff" stroke-width="7" stroke-linecap="round"/><text x="135" y="54" font-size="25" font-weight="700" fill="#102b50">Regional playlists</text><text x="135" y="84" font-size="18" fill="#526780">Indian, Pakistani and eligible</text><text x="135" y="109" font-size="18" fill="#526780">international channel selections.</text></g><g transform="translate(1005 140)"><rect width="450" height="132" rx="20" fill="#f2efff" stroke="#ddd5ff" stroke-width="2"/><rect width="10" height="132" rx="5" fill="#7044cf"/><circle cx="72" cy="66" r="39" fill="#7044cf"/><text x="72" y="74" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">EPG</text><text x="135" y="54" font-size="25" font-weight="700" fill="#102b50">Shared XMLTV guide</text><text x="135" y="84" font-size="18" fill="#526780">One programme guide for both</text><text x="135" y="109" font-size="18" fill="#526780">playlists, where schedules exist.</text></g><g transform="translate(45 300)"><rect width="450" height="132" rx="20" fill="#fff8e9" stroke="#f2e1b8" stroke-width="2"/><rect width="10" height="132" rx="5" fill="#d99a18"/><circle cx="72" cy="66" r="39" fill="#d99a18"/><rect x="49" y="49" width="46" height="34" rx="5" fill="none" stroke="#fff" stroke-width="4"/><circle cx="62" cy="60" r="5" fill="#fff"/><path d="M52 77l13-13 10 9 7-6 10 10" fill="none" stroke="#fff" stroke-width="3"/><text x="135" y="54" font-size="25" font-weight="700" fill="#102b50">Local channel logos</text><text x="135" y="84" font-size="18" fill="#526780">Repository-hosted logo assets</text><text x="135" y="109" font-size="18" fill="#526780">where available.</text></g><g transform="translate(525 300)"><rect width="450" height="132" rx="20" fill="#fff1f5" stroke="#f2d4df" stroke-width="2"/><rect width="10" height="132" rx="5" fill="#c43d70"/><circle cx="72" cy="66" r="39" fill="#c43d70"/><path d="M52 61a23 23 0 0 1 38-14l5 6M95 53l-1-12-12 3M92 72a23 23 0 0 1-38 14l-5-6M49 80l1 12 12-3" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="135" y="54" font-size="25" font-weight="700" fill="#102b50">Alternate streams</text><text x="135" y="84" font-size="18" fill="#526780">Backup entries maintained where</text><text x="135" y="109" font-size="18" fill="#526780">suitable alternatives exist.</text></g><g transform="translate(1005 300)"><rect width="450" height="132" rx="20" fill="#edf9f7" stroke="#cdece5" stroke-width="2"/><rect width="10" height="132" rx="5" fill="#168b69"/><circle cx="72" cy="66" r="39" fill="#168b69"/><path d="M52 87V65h12v22M70 87V48h12v39M88 87V37h12v50" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><text x="135" y="54" font-size="25" font-weight="700" fill="#102b50">Transparent upkeep</text><text x="135" y="84" font-size="18" fill="#526780">Automated checks, diagnostics</text><text x="135" y="109" font-size="18" fill="#526780">and public maintenance reports.</text></g></g></svg>