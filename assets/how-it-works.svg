<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Workflow: channel discovery, stream checks, playlist maintenance, EPG mapping and validation, published playlists and EPG, your IPTV player" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" text-anchor="middle">
    <!-- 1 -->
    <rect x="20" y="50" width="160" height="90" rx="14" fill="#0969da"/>
    <text x="100" y="42" font-size="15" font-weight="700" fill="#8b949e">STEP 1</text>
    <text x="100" y="88" font-size="20" font-weight="700" fill="#ffffff">Channel</text>
    <text x="100" y="114" font-size="20" font-weight="700" fill="#ffffff">Discovery</text>
    <!-- 2 -->
    <rect x="220" y="50" width="160" height="90" rx="14" fill="#8957e5"/>
    <text x="300" y="42" font-size="15" font-weight="700" fill="#8b949e">STEP 2</text>
    <text x="300" y="88" font-size="20" font-weight="700" fill="#ffffff">Stream</text>
    <text x="300" y="114" font-size="20" font-weight="700" fill="#ffffff">Checks</text>
    <!-- 3 -->
    <rect x="420" y="50" width="160" height="90" rx="14" fill="#ff6b35"/>
    <text x="500" y="42" font-size="15" font-weight="700" fill="#8b949e">STEP 3</text>
    <text x="500" y="88" font-size="20" font-weight="700" fill="#ffffff">Playlist</text>
    <text x="500" y="114" font-size="20" font-weight="700" fill="#ffffff">Maintenance</text>
    <!-- 4 -->
    <rect x="620" y="50" width="160" height="90" rx="14" fill="#2ea44f"/>
    <text x="700" y="42" font-size="15" font-weight="700" fill="#8b949e">STEP 4</text>
    <text x="700" y="88" font-size="20" font-weight="700" fill="#ffffff">EPG Mapping</text>
    <text x="700" y="114" font-size="20" font-weight="700" fill="#ffffff">&amp; Validation</text>
    <!-- 5 -->
    <rect x="820" y="50" width="160" height="90" rx="14" fill="#f5c542"/>
    <text x="900" y="42" font-size="15" font-weight="700" fill="#8b949e">STEP 5</text>
    <text x="900" y="88" font-size="20" font-weight="700" fill="#24292f">Published</text>
    <text x="900" y="114" font-size="20" font-weight="700" fill="#24292f">Playlists + EPG</text>
    <!-- 6 -->
    <rect x="1020" y="50" width="160" height="90" rx="14" fill="#e5534b"/>
    <text x="1100" y="42" font-size="15" font-weight="700" fill="#8b949e">STEP 6</text>
    <text x="1100" y="88" font-size="20" font-weight="700" fill="#ffffff">Your IPTV</text>
    <text x="1100" y="114" font-size="20" font-weight="700" fill="#ffffff">Player</text>
  </g>
  <!-- arrows -->
  <g stroke="#8b949e" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)">
    <line x1="184" y1="95" x2="216" y2="95" marker-end="url(#arrow)"/>
    <line x1="384" y1="95" x2="416" y2="95" marker-end="url(#arrow)"/>
    <line x1="584" y1="95" x2="616" y2="95" marker-end="url(#arrow)"/>
    <line x1="784" y1="95" x2="816" y2="95" marker-end="url(#arrow)"/>
    <line x1="984" y1="95" x2="1016" y2="95" marker-end="url(#arrow)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
