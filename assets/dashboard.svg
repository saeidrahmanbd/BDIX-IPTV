<text x="38" y="73" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#e5e7eb">Playlist inventory snapshot · 2026-10-27</text>
<g font-family="Arial,Helvetica,sans-serif" fill="#111827">
  <rect x="32" y="126" width="216" height="105" rx="16" fill="#ffffff" stroke="#d1d5db"/>
  <text x="52" y="159" font-size="14" fill="#4b5563">Main IPTV playlist</text>
  <text x="52" y="203" font-size="31" font-weight="700">1,169</text>
  <rect x="264" y="126" width="216" height="105" rx="16" fill="#ffffff" stroke="#d1d5db"/>
  <text x="284" y="159" font-size="14" fill="#4b5563">BDIX playlist</text>
  <text x="284" y="203" font-size="31" font-weight="700">139</text>
  <rect x="496" y="126" width="216" height="105" rx="16" fill="#ffffff" stroke="#d1d5db"/>
  <text x="516" y="159" font-size="14" fill="#4b5563">International playlist</text>
  <text x="516" y="203" font-size="31" font-weight="700">3,067</text>
  <rect x="728" y="126" width="220" height="105" rx="16" fill="#fff7ed" stroke="#fdba74"/>
