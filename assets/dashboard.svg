<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="title desc">
<title id="title">BDIX-IPTV Project Dashboard</title>
<desc id="desc">Current playlist inventory and EPG publication status. EPG refresh is enabled; first validated guide publication is pending.</desc>
