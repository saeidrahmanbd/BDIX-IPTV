  <rect x="32" y="254" width="916" height="142" rx="16" fill="#ffffff" stroke="#d1d5db"/>
  <text x="54" y="287" font-size="18" font-weight="700">Programme-guide publication status</text>
  <text x="54" y="319" font-size="15">The guide file is awaiting a successful fresh generation and validation.</text>
  <text x="54" y="344" font-size="15">The public XMLTV file was removed and playlist headers no longer reference it.</text>
  <text x="54" y="369" font-size="15">Current coverage is withheld until the generated XMLTV guide passes freshness and quality checks.</text>
