<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="Example TV guide timeline showing programmes across several channels, with a Now marker">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="400" rx="18" fill="url(#card)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Header -->
    <text x="28" y="44" font-size="20" font-weight="700" fill="#f0f6fc">TV Guide</text>
    <rect x="150" y="26" width="170" height="26" rx="13" fill="#2ea44f"/>
    <text x="235" y="44" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">XMLTV · Now / Next</text>

    <!-- Time labels -->
    <g font-size="14" fill="#8b949e">
      <text x="250" y="88">18:00</text>
      <text x="410" y="88">19:00</text>
      <text x="570" y="88">20:00</text>
      <text x="730" y="88">21:00</text>
      <text x="890" y="88">22:00</text>
    </g>
    <path d="M250 96 H970" stroke="#30363d" stroke-width="1"/>

    <!-- Now marker -->
    <rect x="440" y="100" width="3" height="270" fill="#f5c542"/>
    <rect x="418" y="374" width="46" height="20" rx="10" fill="#f5c542"/>
    <text x="441" y="388" text-anchor="middle" font-size="12" font-weight="800" fill="#0d1117">NOW</text>

    <!-- Row 1 -->
    <circle cx="60" cy="130" r="22" fill="#0969da"/>
    <text x="60" y="136" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">CH1</text>
    <rect x="250" y="108" width="150" height="44" rx="8" fill="#0969da"/>
    <text x="262" y="134" font-size="14" font-weight="700" fill="#fff">Morning News</text>
    <rect x="404" y="108" width="300" height="44" rx="8" fill="#1f6feb"/>
    <text x="418" y="134" font-size="14" font-weight="700" fill="#fff">Drama Series</text>
    <rect x="708" y="108" width="262" height="44" rx="8" fill="#0969da"/>
    <text x="722" y="134" font-size="14" font-weight="700" fill="#fff">Evening Show</text>

    <!-- Row 2 -->
    <circle cx="60" cy="200" r="22" fill="#8957e5"/>
    <text x="60" y="206" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">CH2</text>
    <rect x="250" y="178" width="300" height="44" rx="8" fill="#8957e5"/>
    <text x="262" y="204" font-size="14" font-weight="700" fill="#fff">Cricket Highlights</text>
    <rect x="554" y="178" width="416" height="44" rx="8" fill="#8957e5" fill-opacity="0.8"/>
    <text x="568" y="204" font-size="14" font-weight="700" fill="#fff">Feature Film</text>

    <!-- Row 3 -->
    <circle cx="60" cy="270" r="22" fill="#2ea44f"/>
    <text x="60" y="276" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">CH3</text>
    <rect x="250" y="248" width="180" height="44" rx="8" fill="#2ea44f"/>
    <text x="262" y="274" font-size="14" font-weight="700" fill="#fff">Cooking Hour</text>
    <rect x="434" y="248" width="536" height="44" rx="8" fill="#2ea44f" fill-opacity="0.8"/>
    <text x="448" y="274" font-size="14" font-weight="700" fill="#fff">Documentary: Rivers of the Delta</text>

    <!-- Row 4 -->
    <circle cx="60" cy="340" r="22" fill="#f5c542"/>
    <text x="60" y="346" text-anchor="middle" font-size="14" font-weight="800" fill="#0d1117">CH4</text>
    <rect x="250" y="318" width="420" height="44" rx="8" fill="#f5c542" fill-opacity="0.85"/>
    <text x="262" y="344" font-size="14" font-weight="700" fill="#0d1117">Music Countdown</text>
    <rect x="674" y="318" width="296" height="44" rx="8" fill="#f5c542" fill-opacity="0.6"/>
    <text x="688" y="344" font-size="14" font-weight="700" fill="#0d1117">Late Talk</text>
  </g>
</svg>
