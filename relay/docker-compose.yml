services:
  ffmpeg-relay:
    image: linuxserver/ffmpeg:latest
    container_name: bdix-ts-hls
    restart: unless-stopped
    volumes:
      - ./config:/config:ro
      - ./hls:/hls
    env_file:
      - ./config/sources.env
    entrypoint: ["/bin/sh","/config/run-relay.sh"]
    environment:
      - TZ=Asia/Dhaka
  nginx:
    image: nginx:alpine
    container_name: bdix-hls-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./hls:/usr/share/nginx/html/hls:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ffmpeg-relay
